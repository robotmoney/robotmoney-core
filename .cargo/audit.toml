# cargo-audit configuration
# Canonical: docs/technical/security-model.md §8
#
# cargo audit exits non-zero on any vulnerability advisory by default, which is
# exactly the gate §8 requires: dependency CVEs must block merges. CI invokes it
# as plain `cargo audit -f <lock>` (see suite-04-rust-quality.yml), WITHOUT
# `--deny warnings`: informational advisories (unmaintained, unsound, yanked)
# are reported but do not fail the gate. Only vulnerability advisories block.
#
# To accept a known low-risk advisory temporarily:
# 1. Add its RUSTSEC id to the `ignore` list below.
# 2. Add a comment with a one-line reason and an expiry date.
# 3. File a follow-up issue to resolve the underlying vulnerability.
# 4. Remove the ignore entry on or before the expiry date.
#
# Never suppress an advisory without a dated justification.
#
# Schema: https://github.com/rustsec/rustsec/blob/main/cargo-audit/audit.toml.example

[advisories]
# RustSec ids to ignore. Each entry MUST carry a dated justification comment.
# The §8 gate blocks merges on HIGH/CRITICAL (CVSS >= 7.0) advisories. The
# entries below are pre-existing transitive advisories scored BELOW high; they
# are ignored so the gate has a green baseline. Re-evaluate at each expiry.
ignore = [
    # rsa Marvin timing side-channel. CVSS 5.9 (medium); pulled in transitively
    # via sqlx-mysql, not used for attacker-controlled RSA ops. expires: 2026-12-01
    "RUSTSEC-2023-0071",
    # tokio-tar PAX header file-smuggling. No CVSS assigned; transitive, no
    # untrusted-archive extraction in our binaries. expires: 2026-12-01
    "RUSTSEC-2025-0111",
    # crypto-bigint 0.5.5 constant-time timing issues (advisory dated 2026-10-23).
    # Transitive via k256 0.13 / elliptic-curve 0.13 (alloy-eips, rmpc and the fork
    # e2e crate). The fix needs crypto-bigint >=0.7.6, a major jump that
    # elliptic-curve 0.13 cannot take, so no lockfile bump clears it. No secret-key
    # operation in our binaries runs on attacker-timed input. expires: 2026-12-01
    "RUSTSEC-2026-0387",
]

# Treat "unmaintained" crates as warnings rather than hard errors: an
# unmaintained transitive dep is not itself a vulnerability and should not
# permanently break CI. Genuine "vulnerability" advisories always fail.
informational_warnings = ["unmaintained", "notice"]
