[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
]

# EIP-170 (issue #865): under the default optimizer pipeline RwaVault (24834) and
# AgentTokenVault (25241) exceed the 24576-byte runtime-code limit and revert on
# real-chain deploy. The IR pipeline packs them to ~21.6KB. Scope via_ir to ONLY
# these two contracts so every other contract stays on the default pipeline with
# byte-identical output — notably the on-Base RobotMoneyVault (separate hierarchy)
# and the deploy scripts (which hit a Yul "stack too deep" under via_ir).
additional_compiler_profiles = [{ name = "viair", via_ir = true }]
compilation_restrictions = [
    { paths = "contracts/vaults/RwaVault.sol", via_ir = true },
    { paths = "contracts/vaults/AgentTokenVault.sol", via_ir = true },
]

# Allow Deploy.s.sol to write the deployment JSON. Scoped read-write so
# downstream tools (rmpc config loader, e2e harness) can read it back.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "/tmp" },
    { access = "read-write", path = "/repo/deployments" },
    # Read-only access to docs/ so foundry regression tests can grep for
    # canonical production-readiness warnings (issue #427).
    { access = "read", path = "./docs" },
    # Read-only access to config/ so DeployAgentTokenVault.s.sol can read the
    # canonical MVP shortlist (config/agent-token-shortlist.json, ADR-0001).
    { access = "read", path = "./config" },
]

[fmt]
line_length = 100
tab_width = 4

# Generated Solidity reference docs live alongside the contracts
# (contracts/doc), not in the top-level docs/ tree, which is reserved for
# hand-authored product and engineering docs.
[doc]
out = "contracts/doc"
