[profile.default]
src = "contracts"
test = "contracts/test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 100
evm_version = "cancun"
# Issue 1926: no auto-detected remappings. Forge auto-detects the nested submodules' remappings and records their context as an ABSOLUTE path in
# the solc metadata, so the metadata hash in every contract's bytecode (and every CREATE2 library address) depended on where the repo was checked
# out. Every remapping the build needs is listed here as a relative path instead, so two checkouts of one commit build byte-identical code
# (publish-contracts/src/ci/check-build-reproducible.ts, job contract-build-reproducibility).
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "ds-test/=lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/",
    "openzeppelin-contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
]

# Allow the core stage scripts to write the deployment JSON. Scoped read-write so
# downstream tools (rmpc config loader, e2e harness) can read it back.
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "/tmp" },
    { access = "read-write", path = "/repo/deployments" },
    # Read-only access to docs/ so foundry regression tests can grep for
    # canonical production-readiness warnings (issue #427) and the PRD
    # 'Security invariants' section (issue #929).
    { access = "read", path = "./docs" },
    # Read-only access to contracts/ so the custody-invariant guard test
    # (CustodyInvariantGuard.t.sol, issue #929) can scan production source for
    # forbidden arbitrary-recipient asset movers (INV-1).
    { access = "read", path = "./contracts" },
    # Read-only access to config/ so DeployAgentTokenVault.s.sol can read the
    # canonical MVP shortlist (config/agent-token-shortlist.json, ADR-0001).
    { access = "read", path = "./config" },
    # Read-only access to tests/fixtures so ConsensusRecommendationReceipt.t.sol can
    # DERIVE the anchoring digest by hashing the committed golden canonical
    # bytes rather than transcribing a constant (issue #1247 AC11, #1280).
    { access = "read", path = "./tests" },
    # Read-only access to the stage table so ThreeVaultInitialState.t.sol compares each vault's
    # deposit state after its deploy script with the table's deployPaused (issue 1705).
    { access = "read", path = "./scripts/deploy" },
    # The Solidity core timelock predictions UpgradeAuthorityPrediction.t.sol writes for the
    # TypeScript parity check (scripts/ci/check-timelock-prediction-parity.ts, issue 1853).
    { access = "write", path = "./out/timelock-prediction-vectors.json" },
]

# Custody-invariant suite (CustodyInvariant.t.sol, issue #929). Bounded runs/depth
# keep the stateful fuzzing deterministic and within CI time budget while still
# exercising thousands of deposit/withdraw/donate/sweep sequences per invariant.
[invariant]
runs = 64
depth = 128
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
# Vendored upstream Safe sources stay byte-identical (see VENDORED.md)
ignore = ["contracts/test/vendor/**"]

# Generated Solidity reference docs live alongside the contracts
# (contracts/doc), not in the top-level docs/ tree, which is reserved for
# hand-authored product and engineering docs.
[doc]
out = "contracts/doc"
