      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "guard", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--owner", "{sheet:ADMIN_ADDRESS}", "--claim", "{state:upg-claim-d}", "--kind", "deposit", "--margin", "300"]
      - ["bash", "-c", "cast call {m:queue.queue} \"claimableDepositRequest(uint256,address)(uint256)\" \"{state:upg-request-d}\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-claim-d-usdc && bun scripts/runbook/qa-assert.ts ge \"$(cat {runDir}/state/upg-claim-d-usdc)\" 1 && cast call {m:fund.fund} \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-shares-before-d"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "deposit(uint256,address)", "{state:upg-claim-d-usdc}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts sub \"$(cast call {m:fund.fund} \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" {state:upg-shares-before-d} > {runDir}/state/upg-shares-d && bun scripts/runbook/qa-assert.ts ge \"$(cat {runDir}/state/upg-shares-d)\" 1 && test \"$(cast call {m:queue.queue} \"claimableDepositRequest(uint256,address)(uint256)\" \"{state:upg-request-d}\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" = 0"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "same", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--snapshot", "{runDir}/claims-before.json"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
