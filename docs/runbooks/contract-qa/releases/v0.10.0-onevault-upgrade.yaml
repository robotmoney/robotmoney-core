  - id: "P6.89-upg-replace-deposit"
    standing: ["4.4"]
    description: "Only when P6.88 found the request Expired: the deployer withdraws it (withdrawExpired pays the USDC back at once) and requests 1 USDC again. The new request id and epoch replace the old ones for the settle and claim rows"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "withdrawExpired(uint256)", "{state:upg-request-d}", "{cast}"]
