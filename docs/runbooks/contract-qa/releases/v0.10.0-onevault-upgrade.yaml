    maxMinutes: 40
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.93-upg-done-markers"
    standing: ["4.15"]
    description: "Writes a done-* marker for each proxy that the chain and this run's own upgrade record ({runDir}/v0100 build) both show upgraded, so a rerun skips that upgrade. It only reads and runs on every invocation"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "e={evidenceDir}/publish-run.json; rm -f {runDir}/state/done-rebalancer-upgrade {runDir}/state/done-fund-upgrade {runDir}/state/done-queue-upgrade {runDir}/state/done-governance-upgrade {runDir}/state/done-receipt-upgrade; done_upgrade() { want=$(jq -r --arg p \"$1\" --arg b \"{runDir}/v0100\" \"[.proxy_upgrades[]? | select(.proxy_name == \\$p and .build == \\$b and .execute_tx != null)] | last | .to_implementation // empty\" \"$e\" | tr A-F a-f); have=$(cast implementation \"$2\" | tr A-F a-f); test -n \"$want\" && test \"$have\" = \"$want\"; }; if done_upgrade rebalancer {m:rebalancer.rebalancer}; then echo \"rebalancer already upgraded\"; touch {runDir}/state/done-rebalancer-upgrade; fi; if done_upgrade fund {m:fund.fund}; then echo \"fund already upgraded\"; touch {runDir}/state/done-fund-upgrade; fi; if done_upgrade queue {m:queue.queue}; then echo \"queue already upgraded\"; touch {runDir}/state/done-queue-upgrade; fi; if done_upgrade governance {m:fund-governance.governance}; then echo \"governance already upgraded\"; touch {runDir}/state/done-governance-upgrade; fi; if done_upgrade consensus_receipt {m:fund-receipt.consensus_receipt}; then echo \"receipt already upgraded\"; touch {runDir}/state/done-receipt-upgrade; fi; true"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    refresh: true
    writes: ["done-rebalancer-upgrade", "done-fund-upgrade", "done-queue-upgrade", "done-governance-upgrade", "done-receipt-upgrade"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.94-upg-pre-state"
    standing: ["4.15"]
    description: "Reads the live state before any send: the five proxies on their manifest implementations, the timelock delay and Safe-only roles, the 21 flowParams words of the live v0.9.0 queue, every queue claim, the fund counters, and the emergency key refused shutdown (simulated). It warns, without failing, for each basket pool below the migration's minPoolDepthUsdc (fund-state.ts pool-depth)"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/fund-state.ts", "proxies", "--timelock", "{m:fund-timelock.timelock}", "--proxy", "{m:fund.fund}:{m:fund.fund_implementation}", "--proxy", "{m:queue.queue}:{m:queue.queue_implementation}", "--proxy", "{m:rebalancer.rebalancer}:{m:rebalancer.rebalancer_implementation}", "--proxy", "{m:fund-governance.governance}:{m:fund-governance.governance_implementation}", "--proxy", "{m:fund-receipt.consensus_receipt}:{m:fund-receipt.consensus_receipt_implementation}"]
      - ["bun", "scripts/runbook/fund-state.ts", "timelock", "--timelock", "{m:fund-timelock.timelock}", "--safe", "{m:safe.safe}", "--delay", "{sheet:TIMELOCK_MIN_DELAY}"]
      - ["bash", "-c", "out=$(cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:fund-timelock.timelock} \"execute(address,uint256,bytes,bytes32,bytes32)\" 0x0000000000000000000000000000000000000001 0 0x $(cast hash-zero) $(cast hash-zero) 2>&1); echo \"$out\" | head -n 1; echo \"$out\" | grep -Eq \"TimelockUnexpectedOperationState|0x5ead8eb5|AccessControlUnauthorizedAccount|0xe2517d3f\""]
      - ["bun", "scripts/runbook/flow-params.ts", "snapshot", "--queue", "{m:queue.queue}", "--min-hold", "{sheet:FLOW_MIN_HOLD}", "--words", "21", "--out", "{runDir}/state/upg-flow-params-before"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "snapshot", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--out", "{runDir}/claims-before.json"]
      - ["bun", "scripts/runbook/fund-state.ts", "counters", "--fund", "{m:fund.fund}", "--queue", "{m:queue.queue}", "--out", "{runDir}/state/upg-fund-before"]
      - ["bash", "-c", "out=$(cast call --from \"{sheet:EMERGENCY_ADDRESS}\" {m:fund.fund} \"shutdown()\" 2>&1); echo \"emergency shutdown: $(echo \"$out\" | head -n 1)\"; echo \"$out\" | grep -Eq \"AccessControlUnauthorizedAccount|0xe2517d3f\" && echo \"before the upgrade the emergency key is refused shutdown (simulated, nothing sent)\""]
      - ["bun", "scripts/runbook/fund-state.ts", "pool-depth", "--fund", "{m:fund.fund}", "--queue", "{m:queue.queue}", "--lib", "{m:fund-libs.fund_valuation_lib}", "--usdc", "{usdc}", "--min", "{sheet:FUND_MIN_POOL_DEPTH_USDC}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-flow-params-before", "upg-fund-before"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.95-upg-keeper-gas"
    standing: ["4.2", "4.10"]
    description: "The keeper holds gas before its first send (the settles of P6.93 and P6.98): at least 0.0005 ETH, about fifty keeper sends on Base. A hard check: below it the step fails (the deployer funds the keeper by hand, journaled, and the step runs again). It sends nothing"
    host: "control"
