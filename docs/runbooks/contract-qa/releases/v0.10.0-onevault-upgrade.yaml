  - id: "P10.83-upg-checkouts-remove"
    standing: ["4.3"]
    description: "After the sign-off (the report and the verify read them): the build checkouts of P0.91 and P0.92 are removed with git worktree remove. The Twin fork is stopped by the operator, outside the runbook, as it was started"
    host: "control"
    phase: 10
