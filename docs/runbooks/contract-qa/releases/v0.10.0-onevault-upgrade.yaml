      - ["bash", "-c", "! cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:queue.queue} \"requestDeposit(uint256,address)\" 1000000 \"{sheet:ADMIN_ADDRESS}\" > /dev/null 2>&1"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P9.81-upg-unpause-schedule"
    standing: ["4.5"]
    description: "The Safe restores both through the fund timelock: ONE batch, fund.unpauseDeposits() and queue.unpauseQueue(), scheduled through the Safe tool with two owner signatures"
    signersOnCall: "The two Safe owners on call for this run (ownerSigner and ownerSigner2 of the run sheet, threshold 2), the deployer as gas payer"
    executionWindow: "Opens when the fund timelock delay (TIMELOCK_MIN_DELAY) has passed since this schedule; the Safe owners execute it in this run sitting, at the paired execute step"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "-c", "cast keccak \"robotmoney.deploy4-upgrade.unpause.{runDir}\" > {runDir}/state/salt-upg-unpause && echo \"{m:fund.fund},{m:queue.queue}\" > {runDir}/state/target-upg-unpause && echo \"$(cast calldata \"unpauseDeposits()\"),$(cast calldata \"unpauseQueue()\")\" > {runDir}/state/data-upg-unpause"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "scheduleBatch", "--targets", "{state:target-upg-unpause}", "--datas", "{state:data-upg-unpause}", "--values", "0,0", "--salt", "{state:salt-upg-unpause}", "--out", "{runDir}/bundles/unpause-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-schedule.json", "--signer", "{signer}", "{safefee}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "unpause-schedule.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["salt-upg-unpause", "target-upg-unpause", "data-upg-unpause"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P9.82-upg-unpause-execute"
    standing: ["4.5", "4.10"]
    description: "After the timelock delay the operation is ready, and the timelock refuses it to anyone but the Safe: the deployer's executeBatch of this very operation is refused for its role (AccessControlUnauthorizedAccount, simulated). Then the Safe executes it (two owner signatures): the operation reads done, depositsPaused and queuePaused read false"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "-c", "id=$(cast call {m:fund-timelock.timelock} \"hashOperationBatch(address[],uint256[],bytes[],bytes32,bytes32)(bytes32)\" \"[{state:target-upg-unpause}]\" \"[0,0]\" \"[{state:data-upg-unpause}]\" $(cast hash-zero) \"{state:salt-upg-unpause}\") && test \"$(cast call {m:fund-timelock.timelock} \"isOperationReady(bytes32)(bool)\" \"$id\")\" = true && out=$(cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:fund-timelock.timelock} \"executeBatch(address[],uint256[],bytes[],bytes32,bytes32)\" \"[{state:target-upg-unpause}]\" \"[0,0]\" \"[{state:data-upg-unpause}]\" $(cast hash-zero) \"{state:salt-upg-unpause}\" 2>&1); echo \"deployer executeBatch of the ready operation: $(echo \"$out\" | head -n 1)\"; echo \"$out\" | grep -Eq \"AccessControlUnauthorizedAccount|0xe2517d3f\""]
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "executeBatch", "--targets", "{state:target-upg-unpause}", "--datas", "{state:data-upg-unpause}", "--values", "0,0", "--salt", "{state:salt-upg-unpause}", "--out", "{runDir}/bundles/unpause-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{signer}", "{safefee}"]
      - ["bash", "-c", "id=$(cast call {m:fund-timelock.timelock} \"hashOperationBatch(address[],uint256[],bytes[],bytes32,bytes32)(bytes32)\" \"[{state:target-upg-unpause}]\" \"[0,0]\" \"[{state:data-upg-unpause}]\" $(cast hash-zero) \"{state:salt-upg-unpause}\") && test \"$(cast call {m:fund-timelock.timelock} \"isOperationDone(bytes32)(bool)\" \"$id\")\" = true"]
      - ["bash", "-c", "test \"$(cast call {m:fund.fund} \"depositsPaused()(bool)\")\" = false && test \"$(cast call {m:queue.queue} \"queuePaused()(bool)\")\" = false"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "unpause-execute.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P9.81-upg-unpause-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.10.0-onevault-upgrade"
  - id: "P9.83-upg-verify-final"
    standing: ["4.5", "4.12"]
    description: "The fund verifier passes again after the flow test and the drill (the three upgraded proxies against the v0.10.0 build, the migrated values against the sheet, the deployer holding no fund share and no role). The claims of claims-before.json read as P6.87 left them, and the live Deploy 4 record is byte for byte what P0.85 copied"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{d4live}", "--system", "fund", "{gate}"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "same", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--snapshot", "{runDir}/claims-before.json"]
      - ["bash", "-c", "(cd {liveManifestDir} && sha256sum -c --quiet {runDir}/live-manifests.sha256) && (cd {liveEvidenceDir} && sha256sum -c --quiet {runDir}/live-evidence.sha256) && echo 'the live record is unchanged'"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 60
    added: "v0.10.0-onevault-upgrade"
  - id: "P9.84-upg-twin-held-claims"
    standing: ["9", "4.4"]
    description: "On the Twin only, last: every Deploy 4 deposit claim of claims-before.json not yet delivered becomes claimable once the clock passes its unlockAt, and the deployer's claim of them succeeds in simulation. When P6.87 already claimed them all, it says so and passes"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "-c", "f={runDir}/claims-before.json; if [ -z \"$(jq -r '.[] | select(.kind == 0 and .claimed != .shares) | .requestId' $f)\" ]; then echo \"every Deploy 4 deposit claim was claimed at P6.87\"; exit 0; fi; u=$(jq \"[.[] | select(.kind == 0 and .claimed != .shares) | .unlockAt] | max\" $f); now=$(cast block latest -f timestamp); if [ \"$now\" -le \"$u\" ]; then bun publish-contracts/src/rehearsal/cli.ts warp --rpc \"{rpcUrl}\" --seconds $((u - now + 1)); fi; test \"$(cast block latest -f timestamp)\" -gt \"$u\""]
      - ["bash", "-c", "f={runDir}/claims-before.json; ids=$(jq -r '.[] | select(.kind == 0 and .claimed != .shares) | .requestId' $f); if [ -z \"$ids\" ]; then exit 0; fi; sum=0; for r in $ids; do c=$(cast call {m:queue.queue} \"claimableDepositRequest(uint256,address)(uint256)\" \"$r\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1); echo \"request $r claimable $c\"; bun scripts/runbook/qa-assert.ts ge \"$c\" 1 || exit 1; sum=$((sum + c)); done; cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:queue.queue} \"deposit(uint256,address)(uint256)\" \"$sum\" \"{sheet:ADMIN_ADDRESS}\""]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: "twin"
    added: "v0.10.0-onevault-upgrade"
  # ── Phase 10, evidence and teardown. ──
  - id: "P10.01-evidence-check"
    standing: ["4.7"]
    description: "The evidence file is checked against the frozen counts and the chain: nonce, every receipt status, the unpause operations and their delay, the registry, the secret scan"
