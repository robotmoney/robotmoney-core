      - ["bash", "-c", "cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-usdc-before-request"]
      - ["bash", "scripts/runbook/cast-send.sh", "{usdc}", "approve(address,uint256)", "{m:queue.queue}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bun", "scripts/runbook/queue-flow.ts", "request", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--abi", "{runDir}/v0100/out/FlowQueue.sol/FlowQueue.json", "--kind", "deposit", "--owner", "{sheet:ADMIN_ADDRESS}", "--out-id", "{runDir}/state/upg-request-d", "--out-epoch", "{runDir}/state/upg-request-d-epoch"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts eq \"$(bun scripts/runbook/qa-assert.ts sub {state:upg-usdc-before-request} \"$(cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\")\" 1000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-usdc-before-request", "upg-request-d", "upg-request-d-epoch"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P6.88-upg-deposit-still-admitted"
    standing: ["4.4"]
    description: "Writes the marker upg-deposit-admitted unless the open deposit request has Expired (maxRoll epochs unfilled), so P6.89 skips. A v0.9.0 request has no price limit, so a Pending request is never skipped for price"
    host: "control"
    phase: 6
    cmds:
      - ["bun", "scripts/runbook/queue-flow.ts", "deposit-state", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--abi", "{runDir}/v0100/out/FlowQueue.sol/FlowQueue.json", "--request", "{state:upg-request-d}", "--marker", "{runDir}/state/upg-deposit-admitted"]
