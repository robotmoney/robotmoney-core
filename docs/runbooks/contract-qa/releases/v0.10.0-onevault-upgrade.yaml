  - id: "P6.95-upg-twin-feeds-after-hold"
    standing: ["9", "4.4"]
    description: "On the Twin only: after the hold the feeds are restated again, for P6.96's quoteRedeem. The Twin feed step (twin-feeds.ts refresh, decision D4-9): each basket and peg feed gets one new round on its real aggregator restating its answer at the pin block, stamped at the fork clock, journaled in feed-refresh.jsonl; no pool, token, fund or queue slot is written and no code is etched"
