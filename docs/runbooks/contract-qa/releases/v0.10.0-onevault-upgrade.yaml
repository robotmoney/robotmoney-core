  - id: "P6.98-upg-settle-redeem"
    standing: ["4.4"]
    description: "The keeper settles the redemption: the step waits on chain time until settleableAt(its epoch), reads checkSettle() Ok for the keeper, the keeper sends settle; the request reads Closed, its burned shares are claimable at once (a redemption has no hold), and its one claim is found"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "at=$(cast call {m:queue.queue} \"settleableAt(uint64)(uint64)\" \"{state:upg-request-r-epoch}\" | cut -d\" \" -f1); echo \"settleable at $at\"; until [ \"$(cast block latest -f timestamp)\" -ge \"$at\" ]; do sleep 60; done"]
      - ["bash", "-c", "c=$(cast call --from \"{sheet:KEEPER_ADDRESS}\" {m:queue.queue} \"checkSettle()(uint8,uint256)\"); echo \"$c\"; test \"$(echo \"$c\" | head -n 1 | cut -d\" \" -f1)\" = 0"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "settle(uint256,uint256)", "50", "{sheet:FUND_PER_DEPOSIT_CAP}", "{keepercast}"]
