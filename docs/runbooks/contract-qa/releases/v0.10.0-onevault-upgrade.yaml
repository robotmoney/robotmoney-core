      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "redeem(uint256,address,address)", "{state:upg-claim-r-shares}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge \"$(bun scripts/runbook/qa-assert.ts sub \"$(cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" {state:upg-usdc-before-claim-r})\" 1 && test \"$(cast call {m:queue.queue} \"claimableRedeemRequest(uint256,address)(uint256)\" \"{state:upg-request-r}\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" = 0"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "same", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--snapshot", "{runDir}/claims-before.json"]
