    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 60
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.98-upg-adapter-record"
    standing: ["4.3", "4.15"]
    description: "The live swap adapter proxy of the 0.9.0 upgrade is copied into the run state, never edited in place: fund.json still names the retired non-proxy adapter, and the 0.9.0 run wrote the proxy and its implementation only to its state ({liveManifestDir}/../state/upg-adapter-proxy and upg-adapter-impl). It proves on chain that the proxy's ERC-1967 slot holds the recorded implementation and that a basket asset of the fund swaps through it. It only reads. A separate step from P0.85, whose gate skips it on a resumed run"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "for k in upg-adapter-proxy upg-adapter-impl; do test -s {liveManifestDir}/../state/$k && cp {liveManifestDir}/../state/$k {runDir}/state/$k; done"]
      - ["bash", "-c", "bun scripts/runbook/adapter-swap.ts live --fund {m:fund.fund} --proxy $(cat {runDir}/state/upg-adapter-proxy) --impl $(cat {runDir}/state/upg-adapter-impl)"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-adapter-proxy", "upg-adapter-impl"]
    added: "v0.10.0-onevault-upgrade"
