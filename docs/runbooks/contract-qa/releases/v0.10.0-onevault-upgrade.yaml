  - id: "P0.96-upg-funding"
    standing: ["4.2"]
    description: "The deployer holds the 1 USDC the flow test requests (with 1 USDC of margin) and the ETH the run's sends need: eth-need.ts counts the implementation deploys and Safe executes this release runs on the target and prices them at the run's max fee ({safefee}, the fee flags of {cast}). A hard check: below it the step fails and the deployer is funded by hand, journaled. The emergency key's ETH line (two pauses) is advisory"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/eth-need.ts", "--release", "v0.10.0-onevault-upgrade", "--target", "{target}", "--out", "{runDir}/state/upg-deployer-eth-need", "{safefee}"]
      - ["bash", "-c", "cast balance \"{sheet:ADMIN_ADDRESS}\" > {runDir}/state/upg-deployer-eth"]
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:upg-deployer-eth}", "{state:upg-deployer-eth-need}"]
      - ["bash", "-c", "b=$(cast balance \"{sheet:EMERGENCY_ADDRESS}\"); echo \"{sheet:EMERGENCY_ADDRESS} $b\"; bun scripts/runbook/qa-assert.ts ge \"$b\" 300000000000000 || echo \"advisory: the emergency key holds less than 0.0003 ETH\" >&2"]
      - ["bash", "-c", "cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-deployer-usdc"]
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:upg-deployer-usdc}", "2000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-deployer-usdc", "upg-deployer-eth-need", "upg-deployer-eth"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.97-upg-pre-verify"
    standing: ["4.3", "4.12"]
    description: "The fund verifier on the live v0.9.0 system before any send. deploy-implementation --system fund (P1.81 to P1.88) refuses unless the run manifest records a passed fund verify, and the copied 0.9.0 record (P0.85) carries the verify stage as started: the 0.9.0 verify failed on the public RPC role-log scan (accepted under D4-21). This read-only run records the pass. On the Twin the role scan checks holders now plus grants after the fork pin. On 8453 the role scan needs the issue 2047 resolution (a vetted logs RPC) before this step can pass; no RPC is named here"
