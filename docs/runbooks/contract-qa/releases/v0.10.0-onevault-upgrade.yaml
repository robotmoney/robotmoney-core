    added: "v0.10.0-onevault-upgrade"
  - id: "P6.96-upg-request-redeem"
    standing: ["4.4"]
    description: "The deployer approves the queue for its whole fund balance (P6.94's shares plus the Deploy 4 shares P6.87 claimed) and requests its redemption (v0.9.0 requestRedeem(shares, owner): no price limit). The newest request is the deployer's, a redemption, Pending, and the deployer holds no fund shares"
