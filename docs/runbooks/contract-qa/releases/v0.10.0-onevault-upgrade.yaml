# docs/runbooks/contract-qa/releases/v0.10.0-onevault-upgrade.yaml: the in-place upgrade of the LIVE Deploy 4 fund system on Base 8453 from the v0.9.0-onevault
# build (contracts-0.9.0, 86747f245; deployed from 26b2dddb5) to contracts 0.10.0 (the 0.9.0 safety review remediation and the rmFUND decimals fix). Same proxy addresses.
# A full copy of template.yaml's steps, unchanged and in order, plus the steps this release adds, each `added: v0.10.0-onevault-upgrade` and `flow: fund-upgrade`.
# The release runs only the fund-upgrade flow on the twin and rehearsal targets (every step is onlyFor twin or rehearsal, so a production run is refused). scripts/runbook/validate-contract-qa.ts checks it; scripts/runbook/run.ts runs it.
# The rc tag of the code is release/v0.10.0-rc.N-rehearsal (RC_TAG_PATTERN in publish-contracts/src/release-gate.ts, decision D4-13).
release: v0.10.0-onevault-upgrade
template: contract-qa
productionReady: false
vaults: ["fund"]
flows:
  twin: ["fund-upgrade"]
  rehearsal: ["fund-upgrade"]
  production: ["fund-upgrade"]
notes: |
  What it does. Upgrades every proxy of the live Deploy 4 fund system in place (decision D10-1): Rebalancer, fund, queue, RebalanceGovernance,
  consensus receipt. The live record is the v0.9.0 run ({liveManifestDir}, {liveEvidenceDir}, {liveSheet}); P0.85 copies it, P9.83 proves it unchanged.

  Migrations (issue 2062, ADR-0020 6). Rebalancer, queue, governance, receipt and the swap adapter proxy each upgrade with
  migrateV0100() (calldata 0x42829c5e, reinitializer 3, upgrade timelock only). It checks the 0.9.0 state the new code relies on and
  moves no funds; the queue's also gives each live deposit bucket its hold mark (maxDepositMinHold, the value 0.10.0 falls back to).
  The fund has no migrateV0100: it has 17 B left under EIP-170, less than any gated entry point, so its upgrade data stays empty.
  delistWideScale and LendingClaimEpoch.wide false keep open books on their legacy scale. The migrateV090 functions still in the
  code are spent (reinitializer 2) and must never be the upgrade data.

  Storage. scripts/ci/check-core-storage-layout.sh --baseline contracts-0.9.0 passes for all five proxies (append-only).
  Size. RobotMoneyFund 24,559 B, 17 B under EIP-170.

  Order. One timelock window, chained by predecessor: Rebalancer, fund, queue, governance, receipt, then the swap adapter proxy (scheduled at P2.93,
  executed at P2.94, both through the adapter-swap.ts upgrade verb). Every execute goes through the Safe.

  Behaviour changes to watch. rmFUND decimals() reads 24 after the fund upgrade (6 before). emergencyUnwind takes (index, minUsdcOut).
  The live timelock keeps its old code: it is not upgradeable, so the executor floor (AGY-02) is not live.

  Twin. Fork on {stageHost}, tunnelled to {tunnelPort}. It proves only what the upgrade changes. No step scans Base history before the pin.

  Builds. P0.91 rebuilds v070 (7c23569f), v080 (fa7c4718) and v090 (26b2dddb) and relocates the copied record's build paths. The
  relocation of the five-entry 0.9.0 history uses relocate-record.ts (D10-3). {runDir}/v0100 is the new build.
decisions:
  - id: "D10-1"
    question: "Which one-vault contracts does 0.10.0 upgrade, and with which one-time migrations?"
    status: decided
    answer: "Owner, 2026-11-24: every one-vault contract upgrades, and each runs its one-time migration when in doubt; do not skip an upgrade or a migration because it looks unnecessary. Applied: all five proxies and the swap adapter proxy upgrade. Follow-up owner answer 2026-11-24: add migrateV0100 where it fits (issue 2062); the fund gets one only if it fits its EIP-170 headroom. Applied (2062): migrateV0100() is the upgrade data of the Rebalancer, queue, governance, receipt and swap adapter proxy; the fund's stays empty, since a migration does not fit its 17 B of EIP-170 headroom (notes)."
    decidedOn: "2026-11-24"
    ref: "Owner instruction relayed in the release-0.10.0 runbook session, 2026-11-24"
  - id: "D4-10"
    question: "Who may execute a ready operation on the fund system's timelock"
    status: decided
    answer: "Owner, 2026-11-13: the Safe only. Live since v0.8.0-onevault-upgrade. This file applies nothing new."
    decidedOn: "2026-11-13"
    ref: "releases/v0.8.0-onevault.yaml D4-10"
  - id: "D4-11"
    question: "How long are deposit shares held after their settlement (FlowQueue minHold)"
    status: decided
    answer: "Owner, 2026-11-13: 1 hour. The upgrade does not change it."
    decidedOn: "2026-11-13"
    ref: "releases/v0.8.0-onevault.yaml D4-11"
  - id: "D4-13"
    question: "Which branch and tag satisfy the rc build gate of deploy-implementation for this upgrade build?"
    status: decided
    answer: "Branch releases-0.10.x and an annotated tag release/v0.10.0-rc.N-rehearsal on it, as assertUpgradeBuildGate requires."
    decidedOn: "2026-11-24"
    ref: "publish-contracts/src/release-gate.ts assertUpgradeBuildGate"
  - id: "D4-18"
    question: "Who claims the deployer's deposit claims whose hold has ended before the flow test's claim?"
    status: decided
    answer: "This run claims them first (P6.87); with none left it sends nothing."
    decidedOn: "2026-11-20"
    ref: "releases/v0.9.0-onevault-upgrade.yaml D4-18"
  - id: "D10-2"
    question: "Go to broadcast the in-place upgrade of Deploy 4 on Base 8453 to 0.10.0: run this file on the rehearsal target from release/v0.10.0-rc.N-rehearsal"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: "D10-3"
    question: "Two scripts are missing: adapter-swap.ts upgrade (allow the new adapter implementation hash, then upgrade the adapter proxy, P2.93) and the relocation of the 0.9.0 record's five build paths (P0.91; relocate-deploy4-v080.ts accepts only two). Write both before the Twin run?"
    status: decided
    answer: "Yes: ticket and build both scripts before the Twin run (issue 2063)."
    decidedOn: "2026-11-24"
    ref: "Owner answer in the release-0.10.0 session; tracking issue 2061"
  - id: "D10-4"
    question: "Must a full Twin pass at the rc commit precede the 8453 run (v0.9.0 waived it, D4-20)?"
    status: decided
    answer: "Yes: a full Twin pass at the rc commit precedes the 8453 run. No waiver as in D4-20."
    decidedOn: "2026-11-24"
    ref: "Owner answer in the release-0.10.0 session; tracking issue 2061"
  - id: "D10-5"
    question: "The live fund timelock runs pre-AGY-02 code with no executor floor and cannot be upgraded. Leave it (the govern tool guards it) or replace it in a later release?"
    status: open
    answer: null
    decidedOn: null
    ref: null
recovery: |
  Before P1.80 nothing is sent. Before P2.87 only implementations are deployed; reruns reuse them. After that P0.93 marks each proxy
  already upgraded so its schedule and execute skip. A scheduled chain is cancelled from its tail by the Safe (safe/cli.ts propose
  --action cancel). A bad upgrade is reversed by a governed upgrade back to the from_implementation in proxy_upgrades. The emergency
  key still pauses deposits and the queue (P9.80). The fund holds at most FUND_TVL_CAP (1,000 USDC).
scope:
  - {pr: 2053, what: "0.9.0 safety review remediation: settle gas bound, enrollment cursor, per-book delist and lending scales, executor and target-setter floors, canonical pool check, emergencyUnwind floor, reabsorbRemovedAsset", check: "P3.83-upg-verify"}
  - {pr: 2056, what: "rmFUND decimals() reports 24 via the OpenZeppelin default", check: "P2.84-upg-after-upgrade"}
  - {pr: 2041, what: "multi-vault TestMachine fixes; already in the contracts-0.9.0 tree and touches no one-vault contract", none: "out of scope: no one-vault bytecode change"}
steps:
  - id: "P0.01-runbook-valid"
    standing: ["4.1"]
    description: "The release runbook is the template plus additions, the sheet and target make sense, and a production run has no open owner decision"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.02-run-dirs"
    standing: ["4.3"]
    description: "The run directory layout every later receipt and state file lives in; the run directory is outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.04-checkout"
    standing: ["4.1"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.05-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.06-forge-build"
    standing: ["4.1"]
    description: "forge build succeeds at the DEPLOY_SHA"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
    maxMinutes: 30
  - id: "P0.08-dependency-manifest"
    standing: ["4.2"]
    description: "The third-party dependency manifest for this release is recorded at the deploy block; run from the dev checkout, because it writes a file under deployments/ that would dirty the DEPLOY_SHA checkout"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "{countsCheckout}/scripts/release/preflight-guards.sh", "--dependency-manifest", "8453:{release}"]
    env:
      DEPENDENCY_MANIFEST_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{countsCheckout}/deployments/dependency-manifests/8453", "pattern": "{release}.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
    onlyFor: ["rehearsal", "production"]
  - id: "P0.12-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453), a pinned lazy fork of Base, runs on the stage host (never on this machine): the host checkout is brought to the run's sha, port 8545 is checked free, the fork starts and is ready, an ssh tunnel brings it to {tunnelPort} here (reopened on every invocation), and its anvil.json is copied back"
    host: "control"
    phase: 0
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
  - id: "P0.13-twin-keys"
    standing: ["4.3"]
    description: "Throwaway keystores for the deployer, pauser, emergency key and three Safe owners; the passphrase stays in a 0600 file; the public addresses become the sheet fragment"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n' > {runDir}/passphrase"]
      - ["bash", "-c", "bun publish-contracts/src/rehearsal/cli.ts keys --dir {runDir}/keys --password-file {runDir}/passphrase --chain-id 918453 > {runDir}/fragment.env"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "fragment.env", "required": true}
    irreversible: false
    onlyFor: "twin"
    gateAbsent: "{runDir}/fragment.env"
  - id: "P0.15-sheet-merge"
    standing: ["4.3"]
    description: "The run sheet is the environment's committed sheet with the fragment's lines, through the real sheet parser"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/ci/merge-sheet.ts", "--template", "{sheetTemplate}", "--fragment", "{runDir}/fragment.env", "--out", "{sheet}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "sheet.env", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P0.17-check-sheet"
    standing: ["4.2", "4.10"]
    description: "The sheet agrees with the environment: chain id, deployment kind, timelock delay band, 1 USDC seed, caps, and as many owner signer specs as Safe owners"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.07-preflight-guards"
    standing: ["4.2"]
    description: "EIP-170 size gate and the zero timelock delay guard pass on the exact build artifacts"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "scripts/release/preflight-guards.sh"]
    env:
      TIMELOCK_MIN_DELAY: "{sheet:TIMELOCK_MIN_DELAY}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.18-twin-fund"
    standing: ["9"]
    description: "Gas for every throwaway key and the real FiatToken balance of the deployer, on the Twin fork only"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-gas", "--rpc", "{rpcUrl}", "--sheet", "{sheet}"]
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-usdc", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--usdc-units", "2000000000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P0.19-funding"
    standing: ["4.2"]
    description: "The deployer holds 7 USDC. The most a run needs at once is 5.32 (the contract ceilings: rmRWA maxSlippageBps at most 500 on the buy and on the sale, its exit fee at most 100 bps, so a round trip through rmRWA loses at most 11 percent; rmUSDC and rmRWA redeem to USDC, rmPROTO redeemInKind pays in tokens). It is the 1 USDC seed, plus what the round before the rebalance does not return as USDC (1.1 in rmPROTO tokens: 1 redeemed in kind, and the router's rmPROTO leg of 2 USDC at the 500 bps of the vector in effect, on a new deployment the sheet's default; at most 0.11 lost on the 1 USDC rmRWA round trip; that vector sends nothing to rmRWA), plus either the 3 vault deposits held at once after it (5.21) or, once they are redeemed (another 1 in rmPROTO tokens, at most 0.11 on rmRWA), the 2 USDC router deposit (5.32). The receipt's vector only splits that last router deposit, so it does not move the floor. The 1.68 spare is margin. A run without the pre-rebalance round (production) needs 4.11. The ETH balance is advisory: below 0.005 ETH the step prints a warning and the run goes on (the gas the run burns is about 0.003 ETH; every send goes through cast at the network fee). The upgrade flow checks its own funding at P8.25"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'cast balance "{sheet:ADMIN_ADDRESS}" > {runDir}/state/deployer-eth']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge {state:deployer-eth} 5000000000000000 || echo 'advisory: the deployer holds less than 0.005 ETH, the gas a full run burns at a high network fee; the run goes on' >&2"]
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:deployer-usdc}", "7000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "new"
    onlyFor: ["rehearsal", "production"]
    writes: ["deployer-eth", "deployer-usdc"]
  - id: "P0.20-plan"
    standing: ["3", "4.3"]
    description: "The plan job: sheet, floors, chain id, release tag of the sheet's kind, committed frozen counts, green CI and core's config-check, with no signer"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "--stage", "plan", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{evidenceDir}", "{gate}"]
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P0.21-dry-run"
    standing: ["4.3"]
    description: "Every deployer stage simulates in order on a blank local anvil and sends nothing"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "--dry-run", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--signer", "address:{sheet:ADMIN_ADDRESS}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{runDir}/evidence-dry", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{runDir}/manifests-dry"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    maxMinutes: 60
  # ── v0.10.0-onevault-upgrade, flow fund-upgrade, phase 0 ──
  - id: "P0.80-upg-runbook-valid"
    standing: ["4.1", "4.15"]
    description: "The release runbook is the template plus additions, it runs the fund-upgrade flow on this target, and a production run of it is refused (no fund-upgrade step runs in production, productionReady false)"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.81-upg-run-dirs"
    standing: ["4.3"]
    description: "The run directory of the upgrade run, outside the core checkout (which must stay clean): state, journal, go records, evidence (the run's copy of the Deploy 4 run manifest), manifests (the run's copy of the Deploy 4 manifests), counts, and the Safe bundles of the fund-system timelock calls"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{evidenceDir}", "{manifestDir}", "{runDir}/counts", "{runDir}/bundles"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "bundles", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.82-upg-checkout"
    standing: ["4.1"]
    description: "The tool checkout is clean and its HEAD is the run's sha: on 8453 the rc tag release/v0.10.0-rc.N-rehearsal, on the Twin the QA commit. The CLIs run from it; the live build is the separate checkout of P0.91, the new build the one of P0.92"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = \"{coreSha}\""]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.83-upg-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.84-upg-twin-fork-check"
    standing: ["9"]
    description: "On the Twin only: forge, cast and anvil here are Foundry 1.8.5, the fork (chain 918453) runs on the stage host {stageHost} at the run's sha, and an ssh tunnel brings it to {tunnelPort}. The RPC then answers 918453 and the live fund proxy has code; a rerun finds the fork running and reopens a dead tunnel"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "for t in forge cast anvil; do v=$($t --version | head -n 1); echo \"$v\"; echo \"$v\" | grep -q \" 1.8.5\" || { echo \"$t is not Foundry 1.8.5 on this machine (foundryup -u v1.8.5)\" >&2; exit 1; }; done"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
      - ["bash", "-c", "test \"$(cast chain-id)\" = 918453 && cast rpc anvil_nodeInfo > /dev/null && f=$(jq -r .fund {liveManifestDir}/fund.json) && test \"$(cast code \"$f\" | wc -c)\" -gt 100 && echo \"fork head $(cast block-number), fund $f has code\""]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    refresh: true
    flow: "fund-upgrade"
    onlyFor: "twin"
    added: "v0.10.0-onevault-upgrade"
  - id: "P0.85-upg-copy-record"
    standing: ["4.3", "4.15"]
    description: "The live Deploy 4 record is COPIED into the run, never edited in place: its manifests to {manifestDir} and its run manifest to {evidenceDir}; the sha256 of every live file is written so P9.83 proves the live record is unchanged at the end. On a rerun the run's own copy (which the upgrade steps re-record) is kept"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -s {liveManifestDir}/fund-timelock.json && test -s {liveEvidenceDir}/publish-run.json && jq -e '.system == \"fund\" and .coreSha == \"7c23569f85e96232fc75bbba32ebbd469da31966\"' {liveEvidenceDir}/publish-run.json > /dev/null && (cd {liveManifestDir} && sha256sum *.json) > {runDir}/live-manifests.sha256 && (cd {liveEvidenceDir} && sha256sum publish-run.json) > {runDir}/live-evidence.sha256 && cp {liveManifestDir}/*.json {manifestDir}/ && cp {liveEvidenceDir}/publish-run.json {evidenceDir}/publish-run.json"]
    expectExit: 0
