  - id: "P10.79-upg-go-sheet"
    standing: ["4.10"]
    description: "The sheet the go was recorded with, for the sign-off's basis: P0.87 finishes the run sheet before the go and no step edits it after, so {runDir}/sheet-at-go.env is a copy of it. Its sha256 must equal the go record's sheetSha256"
    host: "control"
    phase: 10
    cmds:
      - ["bash", "-c", "g={runDir}/sheet-at-go.env; test -f \"$g\" || cp {sheet} \"$g\"; want=$(jq -r .sheetSha256 {runDir}/go/publish.json); got=$(sha256sum \"$g\" | cut -d\" \" -f1); echo \"go sheet $got, go record $want\"; test \"$got\" = \"$want\""]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P10.82-upg-signoff"
    standing: ["4.4"]
    description: "The sign-off is written by the run, and only when the report lists no issue and matches the go"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "signoff", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{gateSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{runDir}/sheet-at-go.env", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.82-upg-signoff"]
