  - id: "P6.97-upg-twin-clock-settle-redeem"
    standing: ["9", "4.4"]
    description: "On the Twin only: before P6.98 the Twin clock moves forward to settleableAt of the redemption's epoch, then The Twin feed step (twin-feeds.ts refresh, decision D4-9): each basket and peg feed gets one new round on its real aggregator restating its answer at the pin block, stamped at the fork clock, journaled in feed-refresh.jsonl; no pool, token, fund or queue slot is written and no code is etched"
    host: "control"
