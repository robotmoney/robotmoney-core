      - ["bash", "scripts/runbook/cast-send.sh", "{usdc}", "approve(address,uint256)", "{m:queue.queue}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bun", "scripts/runbook/queue-flow.ts", "request", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--abi", "{runDir}/v0100/out/FlowQueue.sol/FlowQueue.json", "--kind", "deposit", "--owner", "{sheet:ADMIN_ADDRESS}", "--out-id", "{runDir}/state/upg-request-d", "--out-epoch", "{runDir}/state/upg-request-d-epoch"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: true
    notBefore: {"afterStep": "P6.88-upg-deposit-still-admitted", "hours": 0}
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    gateAbsent: "{runDir}/state/upg-deposit-admitted"
    writes: ["upg-request-d", "upg-request-d-epoch"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P6.92-upg-twin-clock-settle-deposit"
    standing: ["9", "4.4"]
    description: "On the Twin only: before P6.93 the Twin clock moves forward to settleableAt of the request's epoch (its end plus FLOW_SETTLE_WINDOW; anvil_setNextBlockTimestamp, never back), then The Twin feed step (twin-feeds.ts refresh, decision D4-9): each basket and peg feed gets one new round on its real aggregator restating its answer at the pin block, stamped at the fork clock, journaled in feed-refresh.jsonl; no pool, token, fund or queue slot is written and no code is etched"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "mkdir -p {runDir}/twin && at=$(cast call {m:queue.queue} \"settleableAt(uint64)(uint64)\" \"{state:upg-request-d-epoch}\" | cut -d\" \" -f1) && echo \"settleable at $at\" && bun publish-contracts/src/ci/twin-feeds.ts refresh --rpc \"{rpcUrl}\" --advance-to \"$at\" --journal {runDir}/twin/feed-refresh.jsonl --out {runDir}/twin/feed-refresh-P6.92.json"]
    env:
