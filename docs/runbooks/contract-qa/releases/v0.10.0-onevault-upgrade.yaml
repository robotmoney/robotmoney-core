  - id: "P0.92-upg-new-build"
    standing: ["4.15"]
    description: "The new build: a separate clean checkout of the run's sha at {runDir}/v0100, built there, the --upgrade-build of the three implementation deploys and their records (on 8453 the CLI gates it as an rc build). Skipped once all three proxies read upgraded (P0.93's markers)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -d {runDir}/v0100 || git worktree add --detach {runDir}/v0100 {coreSha}"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v0100"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v0100 rev-parse HEAD)\" = {coreSha} && test -z \"$(git -C {runDir}/v0100 status --porcelain)\""]
