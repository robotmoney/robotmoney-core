    onlyFor: "twin"
    added: "v0.10.0-onevault-upgrade"
  - id: "P6.93-upg-settle-deposit"
    standing: ["4.4"]
    description: "The keeper settles the deposit once chain time reaches settleableAt (the epoch's end plus the settle window, 1 h 12 min at most on the live params) and checkSettle() reads Ok. The request reads Closed, its one claim is held exactly FLOW_MIN_HOLD from its settlement (queue-flow.ts find-claim against the v0.9.0 Settlement), and the claims of claims-before.json read the same"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "at=$(cast call {m:queue.queue} \"settleableAt(uint64)(uint64)\" \"{state:upg-request-d-epoch}\" | cut -d\" \" -f1); echo \"settleable at $at\"; until [ \"$(cast block latest -f timestamp)\" -ge \"$at\" ]; do sleep 60; done"]
      - ["bash", "-c", "c=$(cast call --from \"{sheet:KEEPER_ADDRESS}\" {m:queue.queue} \"checkSettle()(uint8,uint256)\"); echo \"$c\"; test \"$(echo \"$c\" | head -n 1 | cut -d\" \" -f1)\" = 0"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "settle(uint256,uint256)", "50", "{sheet:FUND_PER_DEPOSIT_CAP}", "{keepercast}"]
      - ["bash", "-c", "test \"$(cast call {m:queue.queue} \"requestStatus(uint256)(uint8)\" \"{state:upg-request-d}\")\" = 3 && test \"$(cast call {m:queue.queue} \"pendingDepositRequest(uint256,address)(uint256)\" \"{state:upg-request-d}\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" = 0"]
      - ["bash", "-c", "bun scripts/runbook/queue-flow.ts find-claim --rpc {rpcUrl} --queue {m:queue.queue} --abi {runDir}/v0100/out/FlowQueue.sol/FlowQueue.json --request \"{state:upg-request-d}\" --hold \"{sheet:FLOW_MIN_HOLD}\" > {runDir}/state/upg-claim-d && cat {runDir}/state/upg-claim-d"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "same", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--snapshot", "{runDir}/claims-before.json"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 480
    writes: ["upg-claim-d"]
    added: "v0.10.0-onevault-upgrade"
  - id: "P6.94-upg-claim-deposit"
    standing: ["4.4"]
    description: "After FLOW_MIN_HOLD (the Twin warps it) the deployer claims the flow test's deposit shares, and only those: the guard first proves no other open deposit claim of the deployer is out of its hold within 300 s (P6.87 took the Deploy 4 ones). The deployer's shares rose, the claim is fully delivered, and claims-before.json reads the same"
