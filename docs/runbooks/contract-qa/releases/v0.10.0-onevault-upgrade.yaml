  - id: "P0.91-upg-live-build"
    standing: ["4.15"]
    description: "Rebuild the original deployment (v070), the v0.8 build (v080) and the live v0.9.0 build (v090, 26b2dddb), check the prior upgrade operations on chain, and relocate the copied record's five build paths with relocate-record.ts: each pinned entry (proxy, implementation, build SHA) to the clean checkout of its SHA, the first path kept as original_build"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -d {runDir}/v070 || git worktree add --detach {runDir}/v070 7c23569f85e96232fc75bbba32ebbd469da31966"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v070"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v070 rev-parse HEAD)\" = 7c23569f85e96232fc75bbba32ebbd469da31966 && test -z \"$(git -C {runDir}/v070 status --porcelain)\""]
      - ["forge", "build", "--root", "{runDir}/v070", "--out", "{runDir}/v070/out"]
      - ["bash", "-c", "test -d {runDir}/v080 || git worktree add --detach {runDir}/v080 fa7c471821ffdc76e9518b10dda5f420c135ae18"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v080"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v080 rev-parse HEAD)\" = fa7c471821ffdc76e9518b10dda5f420c135ae18 && test -z \"$(git -C {runDir}/v080 status --porcelain)\""]
      - ["forge", "build", "--root", "{runDir}/v080", "--out", "{runDir}/v080/out"]
      - ["bun", "publish-contracts/src/evidence-check.ts", "--governed-upgrades", "{evidenceDir}/publish-run.json", "--timelock", "{m:fund-timelock.timelock}", "--deployment-kind", "{deploymentKind}", "--delay-floor", "{sheet:TIMELOCK_MIN_DELAY}", "--rpc", "{rpcUrl}"]
      - ["bash", "-c", "test -d {runDir}/v090 || git worktree add --detach {runDir}/v090 26b2dddb556a7f1a54673c3f83b30ec9fc6c8872"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v090"]
      - ["forge", "build", "--root", "{runDir}/v090", "--out", "{runDir}/v090/out"]
      - ["bun", "scripts/runbook/relocate-record.ts", "{evidenceDir}/publish-run.json", "--core-sha", "7c23569f85e96232fc75bbba32ebbd469da31966", "--entry", "fund@0x1E69CC84b698b84129e3adB43bA6F59a242d040c=fa7c471821ffdc76e9518b10dda5f420c135ae18", "--entry", "queue@0x5e627b6e4402f753Fb7Ffa54A72897eD06A5018d=fa7c471821ffdc76e9518b10dda5f420c135ae18", "--entry", "rebalancer@0xD0344162527b7e8B0A07Cb20551203138DbEf2Cc=26b2dddb556a7f1a54673c3f83b30ec9fc6c8872", "--entry", "fund@0xb309256290fe5dC64b2e3069123c60cfad22e6C1=26b2dddb556a7f1a54673c3f83b30ec9fc6c8872", "--entry", "queue@0x94051e739E7725bd193CB1ed743A035dE60F4Fa0=26b2dddb556a7f1a54673c3f83b30ec9fc6c8872", "--checkout", "fa7c471821ffdc76e9518b10dda5f420c135ae18={runDir}/v080", "--checkout", "26b2dddb556a7f1a54673c3f83b30ec9fc6c8872={runDir}/v090"]
    expectExit: 0
    receipts: []
