      - ["bash", "-c", 'cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-RWA']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:shares-RWA}", "{state:preview-RWA}"]
      - ["bash", "-c", 'b=$(cast call "{m:rwa-basket-vault.vault}" "maxSlippageBps()(uint256)" | cut -d" " -f1) && echo $(( 100000000 * 10000 / ((10000 - b) * (10000 - b)) - 10000 + 1 )) > {runDir}/state/share-bound-RWA']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-RWA}", "{state:preview-RWA}", "{state:share-bound-RWA}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["preview-RWA", "shares-RWA", "share-bound-RWA"]
    exercises: "vault-deposit"
  - id: "P6.20-redeem-rmusdc"
    standing: ["4.4"]
    description: "Full redeem of rmUSDC to USDC; the deployer's share balance is zero afterwards"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.vault}", "redeem(uint256,address,address)", "{state:shares-USDC}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "3000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"
  - id: "P6.21-redeem-in-kind-rmproto"
    standing: ["4.4"]
    description: "Full redeemInKind of rmPROTO, which reads no oracle and always pays in the underlying assets"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:protocol-asset-vault.vault}", "redeemInKind(uint256,address,address)", "{state:shares-PROTO}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"
  - id: "P6.23-redeem-rmrwa"
    standing: ["4.4"]
    description: "Full redeem of rmRWA to USDC"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:rwa-basket-vault.vault}", "redeem(uint256,address,address)", "{state:shares-RWA}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"
  - id: "P6.24-redeem-retired-vault"
    standing: ["4.4", "4.14"]
    description: "Every vault the run retired (the run manifest publish-run.json, vault_retirements, ADR-0017; the step fails when the manifest is missing) is withdraw-only: retired() is true, maxDeposit is 0, and the admin's shares in it, if any, redeem to USDC. A run that retired no vault passes with nothing to check"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'test -f "{evidenceDir}/publish-run.json" && for v in $(jq -r ".vault_retirements // [] | .[].vault" "{evidenceDir}/publish-run.json"); do test "$(cast call "$v" "retired()(bool)")" = true && test "$(cast call "$v" "maxDeposit(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; b=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "redeem(uint256,address,address)" "$b" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 "$@" || exit 1; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; fi; done', "_", "{cast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.30-router-deposit"
    standing: ["4.4"]
    description: "2 USDC straight into the router at 8,400,000 gas (the floor is 400,000 plus 2,550,000 per leg): one RouterDeposit event per leg with a non-zero effective weight and none for a zero-weight leg, and the deployer holds shares in every non-zero leg afterwards"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" | tail -n 1 | grep -oE "[0-9]+" | grep -vxc 0 > {runDir}/state/router-legs || true']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:router.router}", "2000000", "{cast}"]
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{m:router.router}" "deposit(uint256,uint256[])" 2000000 "[]" --gas-limit 8400000 {castFlagsInline} | tee {runDir}/state/router-deposit.json; test ${PIPESTATUS[0]} = 0']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/router-deposit.json']
      - ["bash", "-c", 'w=$(cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])"); vs=$(echo "$w" | sed -n 1p | grep -oE "0x[0-9a-fA-F]{40}"); bs=$(echo "$w" | sed -n 2p | grep -oE "[0-9]+"); i=1; for v in $vs; do b=$(echo "$bs" | sed -n "$i"p); i=$((i+1)); s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ] && [ "$s" = 0 ]; then echo "no shares in $v (weight $b)" >&2; exit 1; fi; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["router-legs", "router-deposit.json"]
    exercises: "router-deposit"
  - id: "P6.32-router-split-changed"
    standing: ["4.4", "4.9"]
    description: "The rebalance changed the router split: the post-rebalance router deposit's RouterDeposit legs are exactly the non-zero effective weights now (the applied receipt's vector, P5.04), each minting shares, and they differ in vault or weight from the legs of the pre-rebalance router deposit (P5.30, the vector in effect before it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" > {runDir}/state/post-router-weights']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts router-legs {runDir}/state/router-deposit.json {runDir}/state/post-router-weights "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts legs-differ {runDir}/state/pre-router-deposit.json {runDir}/state/router-deposit.json "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["post-router-weights"]
  - id: "P6.31-sweep-positions"
    standing: ["4.4"]
    description: "The router deposit is redeemed in full: rmUSDC by redeem, rmPROTO by redeemInKind, rmRWA by redeem, so the deployer holds no shares anywhere (every later verify requires it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeem"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "$fn(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"

  # ── Phase 8, the v0.6.0 governed upgrade of the live v0.5.0 deployment (runbook 4.15), rehearsed from REAL v0.5.0 state (issue 1927). Twin only.
  # release/v0.5.0-rehearsal is published on a second Twin fork with that tag's own CLI and committed Twin sheet, then the 4.15 commands run from this checkout with
  # --core-dir and --core-sha of the v0.5.0 checkout ({v050common}) and --upgrade-build of a separate checkout of this commit ({runDir}/v060, issue 1929: a plain forge build in the main checkout would replace the library-linked out/ that P9.05 verifies). The fork is pinned at Base block 52881000: the RM V4 pool the v0.5.0
  # rmAGENT holds was drained at block 52881518, so its agent stage refuses the unlowered 1e15 floor at any later block. The CI twin of these steps is core-stages-twin-upgrade-from-v050. ──
  - id: "P8.00-v050-foundry-version"
    standing: ["4.2"]
    description: "forge, cast and anvil are the Foundry version CI pins (v1.8.5), on the operator machine and on the stage host where P8.02 starts the fork. Foundry 1.8.1 anvil refuses an eth_call from an address with no balance, which breaks the v0.5.0 verify's Safe probes"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'for t in forge cast anvil; do "$t" --version | head -n 1 | grep -Eq "Version: 1\\.8\\.5([^0-9]|$)" || { echo "$t is not Foundry 1.8.5" >&2; exit 1; }; done']
      - ["ssh", "rm-core-stage-1", 'for t in forge cast anvil; do "$HOME/.foundry/bin/$t" --version | head -n 1 | grep -Eq "Version: 1\\.8\\.5([^0-9]|$)" || { echo "$t is not Foundry 1.8.5 on the stage host" >&2; exit 1; }; done']
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: "twin"
    added: "v0.6.0"
  - id: "P8.01-v050-checkout"
    standing: ["4.15"]
    description: "A clean checkout of release/v0.5.0-rehearsal outside the core checkout, HEAD 57fbe61833e9d7f94557d69102138f7c410c1346, with its own publish-contracts dependencies: the build that is live"
    host: "control"
    phase: 8
    cmds:
      - ["git", "worktree", "add", "--detach", "{runDir}/v050", "release/v0.5.0-rehearsal"]
      - ["git", "-C", "{runDir}/v050", "submodule", "update", "--init", "--recursive"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v050 rev-parse HEAD)\" = 57fbe61833e9d7f94557d69102138f7c410c1346 && test -z \"$(git -C {runDir}/v050 status --porcelain)\" && cd {runDir}/v050/publish-contracts && bun install --frozen-lockfile"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: "twin"
    gateAbsent: "{runDir}/v050"
    maxMinutes: 15
    added: "v0.6.0"
  - id: "P8.02-v050-twin-fork"
    standing: ["9"]
    description: "A second Twin chain (918453) for the v0.5.0 deployment, on the stage host, pinned at Base block 52881000 where the live RM V4 pool still holds the liquidity the v0.5.0 agent stage checks; port 8547 is checked free, an ssh tunnel brings it to {tunnelPort2} here (reopened on every invocation), and its anvil.json is copied back"
    host: "control"
    phase: 8
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin-v050/anvil.json && (echo >/dev/tcp/127.0.0.1/8547) 2>/dev/null; then echo \"the fork on 8547 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8547) 2>/dev/null; then echo \"port 8547 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8547 --pin-block 52881000 --state-dir $HOME/{stageDir}/twin-v050; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8547 --state-dir $HOME/{stageDir}/twin-v050"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8547.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8547.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8547.sock -L {tunnelPort2}:127.0.0.1:8547 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin-v050 && scp -q {stageHost}:{stageDir}/twin-v050/anvil.json {runDir}/twin-v050/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin-v050", "pattern": "anvil.json", "required": true}
    irreversible: false
    flow: "upgrade"
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
    added: "v0.6.0"
  - id: "P8.03-v050-publish"
    standing: ["4.15"]
    description: "release/v0.5.0-rehearsal publishes with that tag's own publish-contracts CLI and committed Twin sheet (rehearsal kind, upgradeable overlay, verify, govern and an applied receipt): four vaults, rmAGENT router-eligible, the receipt in ic-policy.json; the sheet's VAULT_AGENT_MIN_POOL_LIQUIDITY must read 1000000000000000"
    host: "control"
    phase: 8
    cmds:
      - ["bun", "{runDir}/v050/publish-contracts/src/ci/twin-publish.ts"]
      - ["bash", "-c", "ln -sfn \"$(sed -n 's/^TWIN_RUN_DIR=//p' {runDir}/v050-github-env)\" {runDir}/v050-run && grep -qE '^VAULT_AGENT_MIN_POOL_LIQUIDITY=1000000000000000([[:space:]]|$)' {runDir}/v050-run/sheet.env"]
    env:
      GITHUB_WORKSPACE: "{runDir}/v050"
      GITHUB_ENV: "{runDir}/v050-github-env"
      RPC_URL: "{v050RpcUrl}"
      VERIFY_IN: "true"
      GOVERN_IN: "true"
      REHEARSAL_IN: "true"
      PREDEPLOY_LIBS_IN: "true"
      SHEET_OVERLAY_IN: "deployments/twin-918453/upgrade-rehearsal.env"
      PIN_BLOCK_IN: "52881000"
    expectExit: 0
    receipts:
      - {"dir": "{v050EvidenceDir}", "pattern": "publish-run.json", "required": true}
    irreversible: false
    flow: "upgrade"
    onlyFor: "twin"
    gateAbsent: "{runDir}/v050-run"
    maxMinutes: 90
    added: "v0.6.0"
  - id: "P8.04-v050-addresses"
    standing: ["4.15"]
    description: "The addresses of the live deployment the 4.15 commands name, read from its manifests, sheet and run manifest (runbook 4.15 step 2; on the Twin the v0.5.0 tag run of P8.03, on 8453 the Deploy 3 record); P8.08 makes the separate checkout of this commit that --upgrade-build reads"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", "m={v050ManifestDir} && jq -r .vault $m/agent-token-vault.json > {runDir}/state/v050-rmagent && jq -r .timelock $m/timelock.json > {runDir}/state/v050-timelock && jq -r .governance $m/governance.json > {runDir}/state/v050-governance && jq -r .registry $m/registry.json > {runDir}/state/v050-registry && jq -r .router $m/router.json > {runDir}/state/v050-router"]
      - ["bash", "-c", "m={v050ManifestDir} && jq -r .vault $m/vault.json > {runDir}/state/v050-rmusdc && jq -r .usdc $m/vault.json > {runDir}/state/v050-usdc && jq -r .vault $m/protocol-asset-vault.json > {runDir}/state/v050-rmproto && jq -r .vault $m/rwa-basket-vault.json > {runDir}/state/v050-rmrwa && jq -r .gateway $m/gateway.json > {runDir}/state/v050-gateway && jq -r .consensus_receipt $m/ic-policy.json > {runDir}/state/v050-receipt"]
      - ["bash", "-c", "sed -n 's/^ADMIN_ADDRESS=//p' {v050Sheet} | sed 's/#.*//' | tr -d ' \\\"' > {runDir}/state/v050-admin && sed -n 's/^EMERGENCY_ADDRESS=//p' {v050Sheet} | sed 's/#.*//' | tr -d ' \\\"' > {runDir}/state/v050-emergency && jq -er '[.recorded_receipts[]?.submitter] | last' {v050EvidenceDir}/publish-run.json > {runDir}/state/v050-submitter && test -s {runDir}/state/v050-admin"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["v050-rmagent", "v050-timelock", "v050-governance", "v050-registry", "v050-router", "v050-rmusdc", "v050-usdc", "v050-rmproto", "v050-rmrwa", "v050-gateway", "v050-receipt", "v050-admin", "v050-emergency", "v050-submitter"]
    maxMinutes: 30
    added: "v0.6.0"
  - id: "P8.05-v050-twin-dirty-pre-state"
    standing: ["4.15"]
    description: "The Twin's v0.5.0 deployer is left the way Deploy 3's was before its upgrade: holding rmUSDC shares from a 1 USDC deposit and registered as a gateway agent (commit, reveal). P8.06 must find and clear both, so the cleanup it runs on 8453 is a path QA ran"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-usdc}", "approve(address,uint256)", "{state:v050-rmusdc}", "1000000", "{v050cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-rmusdc}", "deposit(uint256,address)", "1000000", "{state:v050-admin}", "--gas-limit", "2500000", "{v050cast}"]
      - ["bash", "-c", 'echo $(( $(cast block latest --field timestamp) + 86400 )) > {runDir}/state/v050-dirty-valid-until && cast keccak "qa-dirty-$(date +%s%N)" > {runDir}/state/v050-dirty-salt && cast keccak "$(cast abi-encode "f(address,address,bytes32)" "{state:v050-admin}" "{state:v050-admin}" "$(cat {runDir}/state/v050-dirty-salt)")" > {runDir}/state/v050-dirty-commit && echo "(true,$(cat {runDir}/state/v050-dirty-valid-until),1000000,3000000,{state:v050-admin},[{state:v050-router}],{state:v050-admin},0,0,[])" > {runDir}/state/v050-dirty-policy']
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-gateway}", "commitAuthorization(bytes32)", "{state:v050-dirty-commit}", "{v050cast}"]
      - ["sleep", "5"]
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-gateway}", "revealAuthorization(address,bytes32,(bool,uint64,uint256,uint256,address,address[],address,uint256,uint256,address[]))", "{state:v050-admin}", "{state:v050-dirty-salt}", "{state:v050-dirty-policy}", "--gas-limit", "1000000", "{v050cast}"]
      - ["bash", "-c", 'test "$(cast call "{state:v050-rmusdc}" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1)" != 0 && test "$(cast call "{state:v050-gateway}" "agentOwner(address)(address)" "{state:v050-admin}" | tr A-F a-f)" = "$(echo "{state:v050-admin}" | tr A-F a-f)"']
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: "twin"
    writes: ["v050-dirty-valid-until", "v050-dirty-salt", "v050-dirty-commit", "v050-dirty-policy"]
    added: "v0.6.0"
  - id: "P8.06-v050-pre-state"
    standing: ["4.15"]
    description: "Runbook 4.15 step 2 on the live deployment, before any send: the delay, the Safe owners and threshold, the timelock roles, the receipt version and admins, the frozen flags, rmAGENT's supply, the eligible count and both weight vectors are read from the chain into the journal; the deployer's and the emergency key's nonces are marked for the report; the deployer is left holding no vault shares (redeemed) and no agent registration (revoked), which every verify requires; it runs once (the cleanup must never run again mid-flow); P8.07 writes the done-* markers"
    host: "control"
    phase: 8
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "nonce", "--run-dir", "{runDir}", "--mark", "v050-deployer", "--sender", "{state:v050-admin}", "--rpc", "{v050RpcUrl}", "--evidence-dir", "{v050EvidenceDir}"]
      - ["bun", "scripts/runbook/run-record.ts", "nonce", "--run-dir", "{runDir}", "--mark", "v050-emergency", "--sender", "{state:v050-emergency}", "--rpc", "{v050RpcUrl}", "--evidence-dir", "{v050EvidenceDir}"]
      - ["bash", "-c", 'T={state:v050-timelock}; S=$(jq -r .safe {v050ManifestDir}/safe.json); echo "safe $S"; echo "delay $(cast call $T "getMinDelay()(uint256)")"; echo "owners $(cast call $S "getOwners()(address[])")"; echo "threshold $(cast call $S "getThreshold()(uint256)")"; P=$(cast call $T "PROPOSER_ROLE()(bytes32)"); E=$(cast call $T "EXECUTOR_ROLE()(bytes32)"); echo "safe-proposer $(cast call $T "hasRole(bytes32,address)(bool)" $P $S)"; echo "open-executor $(cast call $T "hasRole(bytes32,address)(bool)" $E 0x0000000000000000000000000000000000000000)"; echo "governance-codehash $(cast codehash {state:v050-governance})"; V=$(cast keccak "openzeppelin.storage.Initializable"); V=$(python3 -c "import sys; print(hex(int(sys.argv[1], 16) - 1))" "$V"); V=$(cast keccak "$(cast abi-encode "f(uint256)" "$V")"); V=$(python3 -c "import sys; print(hex(int(sys.argv[1], 16) & ~0xff))" "$V"); echo "receipt-version $(cast storage {state:v050-receipt} "$V")"; A=$(cast call {state:v050-receipt} "ADMIN_ROLE()(bytes32)"); echo "receipt-admin-timelock $(cast call {state:v050-receipt} "hasRole(bytes32,address)(bool)" $A $T)"; echo "receipt-admin-governance $(cast call {state:v050-receipt} "hasRole(bytes32,address)(bool)" $A {state:v050-governance})"; echo "gateway-frozen $(cast call {state:v050-gateway} "upgradesFrozen()(bool)")"; echo "receipt-frozen $(cast call {state:v050-receipt} "upgradesFrozen()(bool)")"; echo "rmagent-assets $(cast call {state:v050-rmagent} "totalAssets()(uint256)")"; echo "rmagent-supply $(cast call {state:v050-rmagent} "totalSupply()(uint256)")"; echo "eligible $(cast call {state:v050-registry} "routerEligibleCount()(uint256)")"; echo "default $(cast call {state:v050-router} "getDefaultWeights()(address[],uint256[])" | tr "\n" " ")"; echo "effective $(cast call {state:v050-router} "getEffectiveWeights()(address[],uint256[])" | tr "\n" " ")"; test "$(cast call $S "getThreshold()(uint256)")" = 2 && test "$(cast call $T "hasRole(bytes32,address)(bool)" $P $S)" = true && test "$(cast call $T "hasRole(bytes32,address)(bool)" $E 0x0000000000000000000000000000000000000000)" = true']
      - ["bash", "-c", 'for pair in "{state:v050-rmusdc}:redeem" "{state:v050-rmproto}:redeemInKind" "{state:v050-rmagent}:redeemInKind" "{state:v050-rmrwa}:redeem"; do v=${pair%%:*}; fn=${pair##*:}; b=$(cast call "$v" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1); if [ "$b" != 0 ]; then echo "deployer holds $b shares of $v: redeeming"; bash scripts/runbook/cast-send.sh "$v" "$fn(uint256,address,address)" "$b" "{state:v050-admin}" "{state:v050-admin}" --gas-limit 5000000 {v050CastFlagsInline} || exit 1; fi; test "$(cast call "$v" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1)" = 0 || exit 1; done']
      - ["bash", "-c", 'if [ "$(cast call "{state:v050-gateway}" "agentOwner(address)(address)" "{state:v050-admin}")" != 0x0000000000000000000000000000000000000000 ]; then echo "deployer is a registered gateway agent: revoking"; bash scripts/runbook/cast-send.sh "{state:v050-gateway}" "revokeAgent(address)" "{state:v050-admin}" {v050CastFlagsInline} || exit 1; fi; test "$(cast call "{state:v050-gateway}" "hasRole(bytes32,address)(bool)" "$(cast keccak AGENT_ROLE)" "{state:v050-admin}")" = false']
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "nonce-v050-deployer.json", "required": true}
    irreversible: false
    flow: "upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.6.0"
  - id: "P8.07-v050-done-markers"
    standing: ["4.15"]
    description: "A done-* marker for each governed operation the chain AND the run manifest already show executed (the gateway upgrade, the receipt upgrade, rmAGENT retired), so a rerun on an upgraded deployment skips that operation by its own gate and still runs every later step; the markers of an earlier invocation are removed first, and the step runs on every invocation (it only reads, so a rerun mid-flow is safe)"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'e={v050EvidenceDir}/publish-run.json; rm -f {runDir}/state/done-gateway-upgrade {runDir}/state/done-receipt-upgrade {runDir}/state/done-retire-vault; done_upgrade() { want=$(jq -r --arg p "$1" "[.proxy_upgrades[]? | select(.proxy_name == \$p and .execute_tx != null)] | last | .to_implementation // empty" "$e" | tr A-F a-f); have=$(cast implementation "$2" | tr A-F a-f); test -n "$want" && test "$have" = "$want"; }; if done_upgrade gateway {state:v050-gateway}; then echo "gateway already upgraded"; touch {runDir}/state/done-gateway-upgrade; fi; if done_upgrade receipt {state:v050-receipt}; then echo "receipt already upgraded"; touch {runDir}/state/done-receipt-upgrade; fi; if [ "$(cast call {state:v050-rmagent} "retired()(bool)")" = true ] && [ "$(jq -r "[.vault_retirements[]? | select(.execute_tx != null)] | length" "$e")" != 0 ]; then echo "rmAGENT already retired"; touch {runDir}/state/done-retire-vault; fi; true']
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    refresh: true
    onlyFor: ["twin", "rehearsal"]
    writes: ["done-gateway-upgrade", "done-receipt-upgrade", "done-retire-vault"]
    added: "v0.6.0"
  - id: "P8.08-v060-upgrade-build"
    standing: ["4.15"]
    description: "A separate clean checkout of this commit at {runDir}/v060, built there for --upgrade-build (issue 1929: a plain forge build in the main checkout would replace the library-linked out/ that P9.05 verifies). Its submodules are cloned from the main checkout's own submodule repositories, so no library already present is fetched from the network. It is skipped when the done-* markers of every step that reads {runDir}/v060 exist (P8.10 to P8.13, issue 1996): on an upgraded deployment nothing reads the build"
    host: "control"
