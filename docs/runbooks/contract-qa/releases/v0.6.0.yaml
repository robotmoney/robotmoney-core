    cmds:
      - ["bash", "-c", "test -d {runDir}/v060 || git worktree add --detach {runDir}/v060 {coreSha}"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v060"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v060 rev-parse HEAD)\" = {coreSha} && test -z \"$(git -C {runDir}/v060 status --porcelain)\""]
