  - id: "P8.25-v050-funding"
    standing: ["4.2"]
    description: "Before the first send of the deposit rounds, the live deployment's deployer holds 5 USDC (the owner's budget for this flow, issue 1975). A router deposit keeps its rmPROTO leg as tokens (redeemInKind) and rmRWA loses at most 11 percent of what it routes there (the contract ceilings: maxSlippageBps at most 500 on the buy and on the sale, the exit fee at most 100 bps); rmUSDC and rmRWA redeem to USDC. So the round before the rebalance does not return 0.555 USDC plus at most the share of the 2 USDC router deposit that the vector in effect then (P8.40) puts outside rmUSDC; the round after it then holds 3.5 at once (3 vault deposits of 0.5, 2 through the router), and after P8.50 (another 0.555 plus the receipt's share outside rmUSDC of 2 USDC) the 1.5 of the three gateway deposits are held. 5 USDC covers the worst case while the vector in effect before the rebalance puts at most 4000 bps outside rmUSDC (4.855) and the two vectors together at most 10000 bps (4.61). The Twin's 500 bps then 2000 bps need 4.155 at most. A vector outside that can run the deployer short: then a send fails before it is mined, nothing is lost, and the step reruns after a top-up (deposits measure their own balance delta, redeems take the whole balance). The rmAGENT probe of P8.33 reverts and spends no USDC. The ETH balance is advisory: below 0.005 ETH the step prints a warning and the run goes on"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'cast balance "{state:v050-admin}" > {runDir}/state/v050-deployer-eth']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge {state:v050-deployer-eth} 5000000000000000 || echo 'advisory: the deployer holds less than 0.005 ETH, the gas a full run burns at a high network fee; the run goes on' >&2"]
      - ["bash", "-c", 'cast call "{state:v050-usdc}" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1 > {runDir}/state/v050-deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:v050-deployer-usdc}", "5000000"]
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["v050-deployer-eth", "v050-deployer-usdc"]
    added: "v0.6.0"
  # ── Issue 1984: the round BEFORE the router rebalance (P8.23 applies the receipt, which is the rebalance; ADR-0003 routes only NEW deposits by the new vector). After the
  # upgrades, the retire and their verify (P8.16, P8.17), and before the receipt is recorded, so a receipt that would not change the split stops the run before anything
  # irreversible. Deposits are measured as balance deltas and redeems take the whole balance, so a step rerun after a failure mid-step still checks what it sent. ──
  - id: "P8.40-v050-receipt-changes-split"
    standing: ["4.4", "4.9"]
    description: "Before the rebalance (P8.23) the live router's effective weights, whatever votedWeightsActive reads (the vector in effect; the runbook never clears a vector, issue 1980), are saved as the pre-rebalance vector; the receipt about to be recorded (P8.22) weights the vaults differently from that vector, so applying it changes the split the router deposits follow"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'cast call "{state:v050-router}" "getEffectiveWeights()(address[],uint256[])" > {runDir}/state/v050-pre-router-weights && cat {runDir}/state/v050-pre-router-weights']
      - ["bun", "scripts/runbook/qa-assert.ts", "receipt-changes-split", "{receiptFile}", "{runDir}/state/v050-pre-router-weights"]
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["v050-pre-router-weights"]
    added: "v0.6.0"
  - id: "P8.41-v050-pre-deposit-rmusdc"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 0.5 USDC into the live rmUSDC at the 2,500,000 gas limit; the shares it minted (the balance after less the balance before) equal previewDeposit within 0.5 percent"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'cast call "{state:v050-rmusdc}" "previewDeposit(uint256)(uint256)" 500000 | cut -d" " -f1 > {runDir}/state/v050-pre-preview-USDC']
      - ["bash", "-c", 'cast call "{state:v050-rmusdc}" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1 > {runDir}/state/v050-pre-balance0-USDC']
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-usdc}", "approve(address,uint256)", "{state:v050-rmusdc}", "500000", "{v050cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-rmusdc}", "deposit(uint256,address)", "500000", "{state:v050-admin}", "--gas-limit", "2500000", "{v050cast}"]
      - ["bash", "-c", 'cast call "{state:v050-rmusdc}" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1 > {runDir}/state/v050-pre-balance1-USDC']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts sub {state:v050-pre-balance1-USDC} {state:v050-pre-balance0-USDC} > {runDir}/state/v050-pre-shares-USDC"]
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:v050-pre-shares-USDC}", "{state:v050-pre-preview-USDC}", "50"]
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["v050-pre-preview-USDC", "v050-pre-balance0-USDC", "v050-pre-balance1-USDC", "v050-pre-shares-USDC"]
    exercises: "vault-deposit"
    added: "v0.6.0"
  - id: "P8.42-v050-pre-deposit-rmproto"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 0.5 USDC into the live rmPROTO; the shares it minted are at least previewDeposit and above it by no more than the maxSlippageBps haircut plus the same slippage in the depositor's favour, because a swap can beat the oracle price (issue 1990); the vault really traded, so it holds more of its assets than before"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'cast call "{state:v050-rmproto}" "previewDeposit(uint256)(uint256)" 500000 | cut -d" " -f1 > {runDir}/state/v050-pre-preview-PROTO']
      - ["bash", "-c", 'cast call "{state:v050-rmproto}" "totalAssets()(uint256)" | cut -d" " -f1 > {runDir}/state/v050-pre-assets-PROTO-before']
      - ["bash", "-c", 'cast call "{state:v050-rmproto}" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1 > {runDir}/state/v050-pre-balance0-PROTO']
