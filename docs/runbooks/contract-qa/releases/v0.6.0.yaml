      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-usdc}", "approve(address,uint256)", "{state:v050-router}", "2000000", "{v050cast}"]
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{state:v050-router}" "deposit(uint256,uint256[])" 2000000 "[]" --gas-limit 8400000 {v050CastFlagsInline} | tee {runDir}/state/v050-router-deposit.json; test ${PIPESTATUS[0]} = 0']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/v050-router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/v050-router-deposit.json']
      - ["bash", "-c", 'jq -e --arg a "$(echo {state:v050-rmagent} | tr A-F a-f)" ''[.logs[] | select((.topics[2] // "") | ascii_downcase | endswith($a[2:]))] | length == 0'' {runDir}/state/v050-router-deposit.json']
      - ["bash", "-c", 'w=$(cast call "{state:v050-router}" "getEffectiveWeights()(address[],uint256[])"); vs=$(echo "$w" | sed -n 1p | grep -oE "0x[0-9a-fA-F]{40}"); bs=$(echo "$w" | sed -n 2p | grep -oE "[0-9]+"); i=1; for v in $vs; do b=$(echo "$bs" | sed -n "$i"p); i=$((i+1)); s=$(cast call "$v" "balanceOf(address)(uint256)" "{state:v050-admin}" | cut -d" " -f1); if [ "$b" != 0 ] && [ "$s" = 0 ]; then echo "no shares in $v (weight $b)" >&2; exit 1; fi; done']
    env:
      ETH_RPC_URL: "{v050RpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["v050-router-legs", "v050-router-deposit.json"]
