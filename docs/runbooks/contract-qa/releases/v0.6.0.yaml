# docs/runbooks/contract-qa/releases/v0.6.0.yaml: the contract QA runbook of the v0.6.0 line (issue 1912, ADR-0017). Two flows (README "Flows"):
# the NEW deployment of three vaults (rmUSDC, rmPROTO, rmRWA; the template steps), and the governed UPGRADE of the live v0.5.0 deployment
# (runbook 4.15; the phase 8 steps): the gateway and receipt upgrades, the rmAGENT retire, then the receipt, deposit, pause and unpause rounds
# on the upgraded deployment, with a deposit and redeem round before the receipt is applied and one after (issue 1984, README "Before and after the rebalance"). The Twin runs both flows in one run; the 8453 rehearsal runs the upgrade flow against Deploy 3; a production
# run of this line is a new deployment. A full copy of template.yaml's steps, unchanged and in order, plus the steps this release adds. It
# keeps the set-unwind-guard rounds for rmPROTO and rmRWA (P3.51, P3.52, P4.50). scripts/runbook/validate-contract-qa.ts checks it;
# scripts/runbook/run.ts runs it. releases/v0.4.0.yaml and v0.5.0.yaml stay as records.
release: v0.6.0
template: contract-qa
productionReady: false
vaults: ["vault", "protocol-asset-vault", "rwa-basket-vault"]
flows:
  twin: ["new", "upgrade"]
  rehearsal: ["upgrade"]
  production: ["new"]
notes: |
  Identity. v0.6.0 deploys three vaults. The vaults release has no recorder stage and no agent stage (ADR-0017). The router default
  vector is rmUSDC 9500, rmPROTO 500, rmRWA 0 bps. The VAULT_AGENT_MIN_POOL_LIQUIDITY floor is not lowered.

  Retired vault. The live v0.5.0 rmAGENT leaves the router through one governed timelock batch (govern --row retire-vault, runbook
  4.14). It is owner-gated and never run by an agent. After it executes, rmAGENT is withdraw-only: deposit reverts, the router never
  routes into it, redeem and redeemInKind pay existing holders (ADR-0009, no assisted migration). P6.24-redeem-retired-vault checks
  every vault the run retired. A run that retired none passes with nothing to check.

  pause-all covers the live v0.5.0 rmAGENT only with --core-dir of the v0.5.0 checkout (runbook 4.15 COMMON): it pauses it, or counts it covered once retired() reads true.
  With this line's checkout as --core-dir it pauses the three vaults only: pause rmAGENT by hand with EMERGENCY_ROLE, or run the retire first.

  Upgrade flow on 8453. Every phase 8 step that is not Twin-only runs against the live Deploy 3 record ({v050common}, {v050ManifestDir},
  {v050EvidenceDir}: the record's sheet, manifests and evidence; {v050CoreDir}: the checkout whose build is live, issue 1926). P8.06 reads the
  live pre-state and writes a done-* marker for each governed operation the chain and the run manifest already show executed, so a rerun on a
  deployment that is already upgraded skips those steps by their own gate (the report lists the skips) and still runs every later step. The
  deployer is left holding no shares and no agent registration before the upgrades (P8.06 redeems and revokes), as every verify requires.

  Open owner decisions are the decisions: list below. A production run refuses while any is open, and so does productionReady: true.
decisions:
  - id: rmagent-retired
    question: "Retire rmAGENT and deploy three vaults from v0.6.0"
    status: decided
    answer: "Yes. rmAGENT is retired withdraw-only through one governed batch; the router uses three vaults."
    decidedOn: "2026-10-22"
    ref: "docs/adr/ADR-0017-rmagent-retired-router-uses-three-vaults.md"
recovery: |
  Contracts are immutable; there is no in-place rollback (runbook 4.6). Before P1.02-publish nothing was sent: fix on dev and restart at
  P0.01. A failed P1.02-publish reruns the same command with --resume. After the handover the EMERGENCY key pauses deposits
  (pause-all, P9.01) and withdrawals stay open. A failed verify (P2.01, P4.01) pauses all three vaults and exits 13: fix on dev and plan a
  new deployment. A retire batch that must not run is cancelled through the Safe on the timelock before it is ready.
scope:
  - {pr: 1913, what: "retire rmAGENT per ADR-0009 so the router uses three vaults (retire-vault govern row, three-vault stage table, dapp withdraw-only presentation)", check: "P6.24-redeem-retired-vault"}
steps:
  - id: "P0.01-runbook-valid"
    standing: ["4.1"]
    description: "The release runbook is the template plus additions, the sheet and target make sense, and a production run has no open owner decision"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.02-run-dirs"
    standing: ["4.3"]
    description: "The run directory layout every later receipt and state file lives in; the run directory is outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.04-checkout"
    standing: ["4.1"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.05-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.06-forge-build"
    standing: ["4.1"]
    description: "forge build succeeds at the DEPLOY_SHA"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
    maxMinutes: 30
  - id: "P0.08-dependency-manifest"
    standing: ["4.2"]
    description: "The third-party dependency manifest for this release is recorded at the deploy block; run from the dev checkout, because it writes a file under deployments/ that would dirty the DEPLOY_SHA checkout"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "{countsCheckout}/scripts/release/preflight-guards.sh", "--dependency-manifest", "8453:{release}"]
    env:
      DEPENDENCY_MANIFEST_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{countsCheckout}/deployments/dependency-manifests/8453", "pattern": "{release}.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
    onlyFor: ["rehearsal", "production"]
  - id: "P0.12-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453), a pinned lazy fork of Base, runs on the stage host (never on this machine): the host checkout is brought to the run's sha, port 8545 is checked free, the fork starts and is ready, an ssh tunnel brings it to {tunnelPort} here (reopened on every invocation), and its anvil.json is copied back"
    host: "control"
    phase: 0
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
  - id: "P0.13-twin-keys"
    standing: ["4.3"]
    description: "Throwaway keystores for the deployer, pauser, emergency key and three Safe owners; the passphrase stays in a 0600 file; the public addresses become the sheet fragment"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n' > {runDir}/passphrase"]
      - ["bash", "-c", "bun publish-contracts/src/rehearsal/cli.ts keys --dir {runDir}/keys --password-file {runDir}/passphrase --chain-id 918453 > {runDir}/fragment.env"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "fragment.env", "required": true}
    irreversible: false
    onlyFor: "twin"
    gateAbsent: "{runDir}/fragment.env"
  - id: "P0.15-sheet-merge"
    standing: ["4.3"]
    description: "The run sheet is the environment's committed sheet with the fragment's lines, through the real sheet parser"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/ci/merge-sheet.ts", "--template", "{sheetTemplate}", "--fragment", "{runDir}/fragment.env", "--out", "{sheet}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "sheet.env", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P0.17-check-sheet"
    standing: ["4.2", "4.10"]
    description: "The sheet agrees with the environment: chain id, deployment kind, timelock delay band, 1 USDC seed, caps, and as many owner signer specs as Safe owners"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.07-preflight-guards"
    standing: ["4.2"]
    description: "EIP-170 size gate and the zero timelock delay guard pass on the exact build artifacts"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "scripts/release/preflight-guards.sh"]
    env:
      TIMELOCK_MIN_DELAY: "{sheet:TIMELOCK_MIN_DELAY}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.18-twin-fund"
    standing: ["9"]
    description: "Gas for every throwaway key and the real FiatToken balance of the deployer, on the Twin fork only"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-gas", "--rpc", "{rpcUrl}", "--sheet", "{sheet}"]
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-usdc", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--usdc-units", "2000000000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P0.19-funding"
    standing: ["4.2"]
    description: "The deployer holds 7 USDC. The most a run needs at once is 5.32 (the contract ceilings: rmRWA maxSlippageBps at most 500 on the buy and on the sale, its exit fee at most 100 bps, so a round trip through rmRWA loses at most 11 percent; rmUSDC and rmRWA redeem to USDC, rmPROTO redeemInKind pays in tokens). It is the 1 USDC seed, plus what the round before the rebalance does not return as USDC (1.1 in rmPROTO tokens: 1 redeemed in kind, and the router's rmPROTO leg of 2 USDC at the 500 bps of the vector in effect, on a new deployment the sheet's default; at most 0.11 lost on the 1 USDC rmRWA round trip; that vector sends nothing to rmRWA), plus either the 3 vault deposits held at once after it (5.21) or, once they are redeemed (another 1 in rmPROTO tokens, at most 0.11 on rmRWA), the 2 USDC router deposit (5.32). The receipt's vector only splits that last router deposit, so it does not move the floor. The 1.68 spare is margin. A run without the pre-rebalance round (production) needs 4.11. The ETH balance is advisory: below 0.005 ETH the step prints a warning and the run goes on (the gas the run burns is about 0.003 ETH; every send goes through cast at the network fee). The upgrade flow checks its own funding at P8.25"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'cast balance "{sheet:ADMIN_ADDRESS}" > {runDir}/state/deployer-eth']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge {state:deployer-eth} 5000000000000000 || echo 'advisory: the deployer holds less than 0.005 ETH, the gas a full run burns at a high network fee; the run goes on' >&2"]
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:deployer-usdc}", "7000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "new"
    onlyFor: ["rehearsal", "production"]
    writes: ["deployer-eth", "deployer-usdc"]
  - id: "P0.20-plan"
    standing: ["3", "4.3"]
    description: "The plan job: sheet, floors, chain id, release tag of the sheet's kind, committed frozen counts, green CI and core's config-check, with no signer"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "--stage", "plan", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{evidenceDir}", "{gate}"]
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P0.21-dry-run"
    standing: ["4.3"]
    description: "Every deployer stage simulates in order on a blank local anvil and sends nothing"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "--dry-run", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--signer", "address:{sheet:ADMIN_ADDRESS}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{runDir}/evidence-dry", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{runDir}/manifests-dry"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    maxMinutes: 60

  # ── Phase 1, publish: stages 0 to 11. The first send of the run. ──
  - id: "P1.50-record-go"
    standing: ["4.3"]
    description: "The publish go is written by the run: the sha, the environment and the hash of the merged sheet it proceeds with, and the nonce of the deployer and the emergency key, so the report can prove every transaction they send from here on is one a step journaled. Starting the run is the go"
    host: "control"
    phase: 1
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "go", "--kind", "publish", "--run-dir", "{runDir}", "--sha", "{coreSha}", "--target", "{target}", "--sheet", "{sheet}", "--rpc", "{rpcUrl}", "--sender", "{sheet:ADMIN_ADDRESS},{sheet:EMERGENCY_ADDRESS}", "--evidence-dir", "{evidenceDir}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "publish.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P1.02-publish"
    standing: ["4.3"]
    description: "Safe, libs, vault, registry, router, ic-policy, governance, proto, rwa, prove-control signed by every owner, then the timelock handover; each stage matches its frozen count"
    host: "control"
    phase: 1
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "{common}", "{owners}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
      - {"dir": "{manifestDir}", "pattern": "timelock.json", "required": true}
    irreversible: true
    notBefore: {"afterStep": "P1.50-record-go", "hours": 0}
    maxMinutes: 180
  - id: "P1.04-twin-counts"
    standing: ["3"]
    description: "The Twin run measured and wrote the per-stage counts for the sha"
    host: "control"
    phase: 1
    cmds:
      - ["test", "-s", "{countsDir}/{coreSha}.json"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"

  # ── Phase 2, verify: the pre-govern state. All three vaults deploy paused. ──
  - id: "P2.01-verify-pre-govern"
    standing: ["4.3"]
    description: "Stage 12 reads the chain, not the manifests: roles, Safe, timelock, per-vault rules, the deployer nonce. A failure pauses all three vaults and exits 13"
    host: "control"
    phase: 2
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "isomorphism-{chainId}.json", "required": true}
    irreversible: false
    maxMinutes: 60
  - id: "P3.01-govern-schedule"
    standing: ["4.3"]
    description: "Stage 13 schedules the three vault unpauses through the real Safe, one timelock operation each, in one sitting; on 8453 it exits 15 with the resume command"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
    irreversible: false
    maxMinutes: 60
  - id: "P3.51-unwind-guard-schedule"
    standing: ["4.9"]
    description: "In the same sitting as the unpauses, one set-unwind-guard round per open basket (rmPROTO, rmRWA): the Safe sets a non-zero emergency unwind floor on every active asset, sized from the vault's holding (the Twin proves the row with 1000000 and 500)"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=PROTO", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=RWA", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    maxMinutes: 60
    added: "v0.6.0"
  - id: "P3.02-govern-execute"
    standing: ["4.3"]
    description: "After the timelock delay the same command executes the three unpauses and reads depositsPaused back; every printed row has a transaction hash and status 1"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
    irreversible: false
    notBefore: {"afterStep": "P3.01-govern-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
  - id: "P3.52-unwind-guard-execute"
    standing: ["4.9"]
    description: "After the delay the two guard rounds execute and the guard reads back non-zero"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=PROTO", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=RWA", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    notBefore: {"afterStep": "P3.51-unwind-guard-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.6.0"
  - id: "P3.03-submitter-safe"
    standing: ["4.10"]
    description: "The consensus receipt submitter is a second SafeL2 1.4.1 multisig, with the governing Safe's owners and a different salt, never a key"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "create", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--owners", "{sheet:SAFE_OWNERS}", "--threshold", "2", "--signer", "{signer}", "--salt-nonce", "{submitterSaltNonce}", "--yes", "--out", "{runDir}/submitter-safe.json"]
      - ["bash", "-c", "jq -r .safe {runDir}/submitter-safe.json > {runDir}/state/submitter-safe"]
    env:
      ADMIN_ADDRESS: "{sheet:ADMIN_ADDRESS}"
      PAUSER_ADDRESS: "{sheet:PAUSER_ADDRESS}"
      EMERGENCY_ADDRESS: "{sheet:EMERGENCY_ADDRESS}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "submitter-safe.json", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    gateAbsent: "{runDir}/state/submitter-safe"
    writes: ["submitter-safe"]
  - id: "P3.04-register-submitter-schedule"
    standing: ["4.10"]
    description: "The governing Safe schedules ONE delayed timelock call, receipt.grantRole(RECEIPT_SUBMITTER_ROLE, the submitter Safe), after the submitter is checked as a canonical SafeL2 1.4.1 multisig"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "register-submitter", "--submitter", "{state:submitter-safe}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 60
  - id: "P3.05-register-submitter-execute"
    standing: ["4.10"]
    description: "After the delay the call executes and RECEIPT_SUBMITTER_ROLE reads back for the submitter Safe"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "register-submitter", "--submitter", "{state:submitter-safe}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P3.04-register-submitter-schedule", "hours": "timelockDelay"}
    maxMinutes: 60

  # ── Phase 4, verify again: the post-govern state. ──
