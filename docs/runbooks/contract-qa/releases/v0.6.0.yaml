  - id: "P8.19-v050-receipt-payload"
    standing: ["4.10"]
    description: "The Twin's receipt payload for the upgraded deployment: the real production envelope with the three-vault vector USDC 8000, PROTO 1000, RWA 1000 (agent_tokens 0; it weights every vault, so P8.29 routes into all three, and it differs from the vector in effect before the rebalance, which P8.40 checks, so applying it changes the split P8.49 checks) and another session id, because the v0.5.0 tag's own Twin publish already recorded the envelope's receipt and a receipt id is recorded once. On 8453 the operator passes the receipt the canonical route serves as {receiptFile}; one that weights agent_tokens is refused by apply-receipt and the run stops"
    host: "control"
    phase: 8
    cmds:
      - ["bun", "scripts/runbook/receipt-payload.ts", "--out", "{receiptFile}", "--weights", "USDC:8000,PROTO:1000,RWA:1000", "--session-id", "00000000-0000-4000-8000-000000000c01"]
