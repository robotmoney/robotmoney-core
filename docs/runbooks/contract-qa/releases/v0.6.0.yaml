  - id: "P8.30-v050-gateway-agent"
    standing: ["4.4", "4.15"]
    description: "On the upgraded gateway the deployer consents to itself as an agent (commit, then the reveal at least a block later, the three vaults as its only destinations (the router is never a destination, architecture 5.2) and the retired withdraw members zero (the v0.6.0 gateway reverts RetiredPolicyFieldNonZero otherwise)) and the gateway records it as the agent's owner"
    host: "control"
    phase: 8
    cmds:
      - ["bash", "-c", 'echo $(( $(cast block latest --field timestamp) + 86400 )) > {runDir}/state/v050-agent-valid-until && cast keccak "qa-self-$(date +%s%N)" > {runDir}/state/v050-agent-salt && cast keccak "$(cast abi-encode "f(address,address,bytes32)" "{state:v050-admin}" "{state:v050-admin}" "$(cat {runDir}/state/v050-agent-salt)")" > {runDir}/state/v050-agent-commit && echo "(true,$(cat {runDir}/state/v050-agent-valid-until),1000000,3000000,{state:v050-admin},[{state:v050-rmusdc},{state:v050-rmproto},{state:v050-rmrwa}],0x0000000000000000000000000000000000000000,0,0,[])" > {runDir}/state/v050-agent-policy']
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-gateway}", "commitAuthorization(bytes32)", "{state:v050-agent-commit}", "{v050cast}"]
      - ["sleep", "5"]
      - ["bash", "scripts/runbook/cast-send.sh", "{state:v050-gateway}", "revealAuthorization(address,bytes32,(bool,uint64,uint256,uint256,address,address[],address,uint256,uint256,address[]))", "{state:v050-admin}", "{state:v050-agent-salt}", "{state:v050-agent-policy}", "--gas-limit", "1000000", "{v050cast}"]
