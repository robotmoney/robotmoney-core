      - ["bash", "-c", 'for v in {state:v050-rmusdc} {state:v050-rmproto} {state:v050-rmrwa}; do b=$(cast call $v "balanceOf(address)(uint256)" {state:v050-admin} | cut -d" " -f1); o=$(cast keccak "qa-vault-$v-$(date +%s%N)"); bash scripts/runbook/cast-send.sh {state:v050-usdc} "approve(address,uint256)" {state:v050-gateway} 500000 {v050CastFlagsInline} || exit 1; out=$(bash scripts/runbook/cast-send.sh {state:v050-gateway} "depositTo(bytes32,uint256,uint64,bytes32,address,uint256[])" $o 500000 "$(( $(cast block latest --field timestamp) + 300 ))" "$(cast keccak "key-$o")" $v "[]" --gas-limit 6000000 {v050CastFlagsInline}) || exit 1; echo "$out"; echo "$out" | jq -e --arg t "$(cast sig-event "AgentDeposit(bytes32,bytes32,address,address,uint256,uint256,uint64)")" --arg g "$(echo {state:v050-gateway} | tr A-F a-f)" ''.status == "0x1" and ([.logs[] | select((.address | ascii_downcase) == $g and .topics[0] == $t)] | length) == 1'' > /dev/null || exit 1; s=$(cast call $v "balanceOf(address)(uint256)" {state:v050-admin} | cut -d" " -f1); { [ "${#s}" -gt "${#b}" ] || { [ "${#s}" -eq "${#b}" ] && [[ "$s" > "$b" ]]; }; } || { echo "no new shares in $v: before $b, after $s" >&2; exit 1; }; done']
