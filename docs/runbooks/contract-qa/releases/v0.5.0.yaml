  - id: "P6.22-redeem-in-kind-rmagent"
    standing: ["4.4"]
    description: "Full redeemInKind of rmAGENT, which stays open while the recorder is stale"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:agent-token-vault.vault}", "redeemInKind(uint256,address,address)", "{state:shares-AGENT}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:agent-token-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.23-redeem-rmrwa"
    standing: ["4.4"]
    description: "Full redeem of rmRWA to USDC"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:rwa-basket-vault.vault}", "redeem(uint256,address,address)", "{state:shares-RWA}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.50-agent-policy"
    standing: ["4.4"]
    description: "The commit hashes, salts and the signalling-free deposit policy the consent steps use; validUntil is chain time plus a day, because the Twin clock is warped"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'echo $(( $(cast block latest --field timestamp) + 86400 )) > {runDir}/state/agent-valid-until']
      - ["bash", "-c", 'cast keccak "qa-self-$(date +%s%N)" > {runDir}/state/agent-salt-self']
      - ["bash", "-c", 'cast keccak "qa-stranger-$(date +%s%N)" > {runDir}/state/agent-salt-stranger']
      - ["bash", "-c", 'cast keccak "$(cast abi-encode "f(address,address,bytes32)" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" "$(cat {runDir}/state/agent-salt-self)")" > {runDir}/state/agent-commit-self']
      - ["bash", "-c", 'cast keccak "$(cast abi-encode "f(address,address,bytes32)" "0x000000000000000000000000000000000000bEEF" "{sheet:ADMIN_ADDRESS}" "$(cat {runDir}/state/agent-salt-stranger)")" > {runDir}/state/agent-commit-stranger']
      - ["bash", "-c", 'echo "(true,$(cat {runDir}/state/agent-valid-until),1000000,3000000,{sheet:ADMIN_ADDRESS},[{m:router.router}],{sheet:ADMIN_ADDRESS},0,0,[])" > {runDir}/state/agent-policy']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["agent-valid-until", "agent-salt-self", "agent-salt-stranger", "agent-commit-self", "agent-commit-stranger", "agent-policy"]
    added: "v0.5.0"
  - id: "P6.51-agent-consent-stranger-commit"
    standing: ["4.4"]
    description: "The deployer commits an authorization naming an address that has not consented; a commit alone changes nothing"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:gateway.gateway}", "commitAuthorization(bytes32)", "{state:agent-commit-stranger}", "{cast}"]
      - ["sleep", "5"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.52-agent-consent-stranger-reveal-refused"
    standing: ["4.4"]
    description: "The reveal for an address that never committed its own consent reverts (OwnerConsentMissing, issue 1791); the simulation fails before anything is sent"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:gateway.gateway}", "revealAuthorization(address,bytes32,(bool,uint64,uint256,uint256,address,address[],address,uint256,uint256,address[]))", "0x000000000000000000000000000000000000bEEF", "{state:agent-salt-stranger}", "{state:agent-policy}", "{cast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 1
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.53-agent-self-commit"
    standing: ["4.4"]
    description: "The depositor commits its own authorization (agent and committer are the same key, so it consents by calling)"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:gateway.gateway}", "commitAuthorization(bytes32)", "{state:agent-commit-self}", "{cast}"]
      - ["sleep", "5"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.54-agent-self-reveal"
    standing: ["4.4"]
    description: "At least a block later the reveal authorizes the agent, with the router as its only destination; the gateway records the depositor as its owner"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:gateway.gateway}", "revealAuthorization(address,bytes32,(bool,uint64,uint256,uint256,address,address[],address,uint256,uint256,address[]))", "{sheet:ADMIN_ADDRESS}", "{state:agent-salt-self}", "{state:agent-policy}", "--gas-limit", "1000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "agentOwner(address)(address)" "{sheet:ADMIN_ADDRESS}" | tr A-F a-f)" = "$(echo "{sheet:ADMIN_ADDRESS}" | tr A-F a-f)"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.55-gateway-deposit-vault"
    standing: ["4.4"]
    description: "rmpc deposits 1 USDC through the gateway into the single vault (3,000,000 gas by default, above the 2,000,000 gateway floor)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast keccak "qa-vault-$(date +%s%N)" > {runDir}/state/order-vault']
      - ["target/debug/rmpc", "deposit", "-c", "{rmpcConfig}", "--amount", "1000000", "--order-id", "{state:order-vault}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["order-vault"]
    added: "v0.5.0"
  - id: "P6.56-gateway-deposit-router"
    standing: ["4.4"]
    description: "rmpc deposits 1 USDC through the gateway into the router; the gas limit follows the router's effective legs (400,000 + 2,550,000 per leg + 150,000) and rmpc refuses one below the floor before signing"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast keccak "qa-router-$(date +%s%N)" > {runDir}/state/order-router']
      - ["target/debug/rmpc", "deposit", "-c", "{rmpcConfig}", "--amount", "1000000", "--order-id", "{state:order-router}", "--destination", "{m:router.router}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["order-router"]
    added: "v0.5.0"
  - id: "P6.57-router-deposit"
    standing: ["4.4"]
    description: "1 USDC straight into the router at 10,800,000 gas (the 4-leg floor is 9,600,000): one RouterDeposit event per leg with a non-zero amount, and none for a zero-weight leg, which the router skips"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast send "{usdc}" "approve(address,uint256)" "{m:router.router}" 1000000 {castFlagsInline}']
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" | tail -n 1 | grep -oE "[0-9]+" | grep -vxc 0 > {runDir}/state/router-legs || true']
      - ["bash", "-c", 'cast send "{m:router.router}" "deposit(uint256,uint256[])" 1000000 "[]" --gas-limit 10800000 --json {castFlagsInline} > {runDir}/state/router-deposit.json']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/router-deposit.json']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["router-legs", "router-deposit.json"]
    added: "v0.5.0"
  - id: "P6.58-router-below-floor-reverts"
    standing: ["4.4"]
    description: "Twin only: a router deposit at 9,000,000 gas, below the 9,600,000 floor, reverts InsufficientGas with the floor in the error instead of failing silently"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:router.router}", "deposit(uint256,uint256[])", "1000000", "[]", "--gas-limit", "9000000", "{cast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 1
    receipts: []
    irreversible: false
    onlyFor: "twin"
    added: "v0.5.0"
  - id: "P6.59-sweep-positions"
    standing: ["4.4"]
    description: "The gateway and router deposits are redeemed in full: rmUSDC by redeem, each basket by redeemInKind, so no test position is left behind"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:agent-token-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeemInKind"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then cast send "$v" "$fn(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P7.50-deploy-implementation"
    standing: ["4.12"]
    description: "The deployer deploys a second gateway implementation from the build, linked to the live libraries, and the verb records it; nothing governs it yet"
    host: "control"
    phase: 7
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "deploy-implementation", "--proxy", "gateway", "{common}", "{gate}"]
      - ["bash", "-c", "grep deploy_implementation {journal:P7.50-deploy-implementation} | head -n 1 | jq -r .implementation > {runDir}/state/new-implementation"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
