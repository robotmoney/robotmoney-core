  # ── Phase 6, deposits: the standing rule is 1 USDC per deposit, from the deployer, after the handover. ──
  - id: "P6.01-one-usdc-rule"
    standing: ["4.3"]
    description: "Every test deposit is 1 USDC (1000000 units) and below every cap; the amount is a literal in the commands below"
    host: "control"
    phase: 6
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.10-deposit-rmusdc"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmUSDC at the 2,500,000 gas limit; the shares equal previewDeposit within 0.5 percent"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/preview-USDC']
      - ["cast", "send", "{m:vault.usdc}", "approve(address,uint256)", "{m:vault.vault}", "1000000", "{cast}"]
      - ["cast", "send", "{m:vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "2500000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-USDC']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-USDC}", "{state:preview-USDC}", "50"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["preview-USDC", "shares-USDC"]
  - id: "P6.11-deposit-rmproto"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmPROTO; the shares equal previewDeposit within 0.5 percent"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/preview-PROTO']
      - ["cast", "send", "{m:vault.usdc}", "approve(address,uint256)", "{m:protocol-asset-vault.vault}", "1000000", "{cast}"]
      - ["cast", "send", "{m:protocol-asset-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-PROTO']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-PROTO}", "{state:preview-PROTO}", "50"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["preview-PROTO", "shares-PROTO"]
  - id: "P6.12-deposit-rmagent"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmAGENT right after record() makes the price recorder fresh (else StaleRecorder); the shares equal previewDeposit within 0.5 percent"
    host: "control"
    phase: 6
    cmds:
      - ["cast", "send", "{m:recorder.recorder}", "record()", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:recorder.recorder}" "isFresh()(bool)")" = true']
      - ["bash", "-c", 'cast call "{m:agent-token-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/preview-AGENT']
      - ["cast", "send", "{m:vault.usdc}", "approve(address,uint256)", "{m:agent-token-vault.vault}", "1000000", "{cast}"]
      - ["cast", "send", "{m:agent-token-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:agent-token-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-AGENT']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-AGENT}", "{state:preview-AGENT}", "50"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    triage: true
    writes: ["preview-AGENT", "shares-AGENT"]
  - id: "P6.13-deposit-rmrwa"
