  - id: "P10.03-rollout-report"
    standing: ["4.7"]
    description: "The rollout report exists: sha, network, preflight and postflight results, issues, the tag, operator sign-off"
    host: "control"
    phase: 10
    cmds:
      - ["test", "-s", "{runDir}/rollout-report.md"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "rollout-report.md", "required": true}
    irreversible: false
  - id: "P10.04-signoff"
    standing: ["4.4"]
    description: "The operator's recorded sign-off on the postflight"
    host: "control"
    phase: 10
    cmds:
      - ["test", "-s", "{runDir}/go/signoff.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "signoff.json", "required": true}
    irreversible: false
  - id: "P10.05-version-tag"
    standing: ["3"]
    description: "Only after a clean postflight: the version tag is cut at the exact commit that was deployed and verified, and pushed"
    host: "control"
    phase: 10
    cmds:
      - ["git", "tag", "-a", "{versionTag}", "-m", "contracts {versionTag} deployed and verified at {coreSha}", "{coreSha}"]
      - ["git", "push", "origin", "{versionTag}"]
    expectExit: 0
    receipts: []
    irreversible: true
    onlyFor: "production"
    notBefore: {"afterStep": "P10.04-signoff", "hours": 0}
  - id: "P10.06-dapp-down"
    standing: ["4.10"]
    description: "The read-only mainnet dapp stack is removed"
    host: "stage"
    phase: 10
    cmds:
      - ["bun", "scripts/stage/core-stack.ts", "dapp", "down", "--chain", "8453"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P10.07-twin-teardown"
    standing: ["9"]
    description: "The Twin fork stops and the throwaway keystores and the passphrase file are destroyed"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/devnet/twin-fork.ts", "stop", "--port", "8545", "--state-dir", "{runDir}/twin"]
      - ["shred", "-u", "{runDir}/passphrase"]
      - ["rm", "-rf", "{runDir}/keys"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
