# docs/runbooks/contract-qa/releases/v0.5.0.yaml: the contract QA runbook of Deploy 3, released as v0.5.0 (owner
# decision 2026-10-16, version-line). A NEW deployment of governed UUPS proxies at new addresses on Base mainnet.
# A full copy of template.yaml's steps, unchanged and in order, plus the steps this release adds since Deploy 2
# (each carries `added: v0.5.0`). scripts/runbook/validate-contract-qa.ts checks it. It supersedes
# releases/v0.4.0.yaml for Deploy 3; that file stays as the record of the v0.4.0 line. The policy is
# docs/runbooks/contract-qa/README.md and docs/operations/contract-release-runbooks.md.
release: v0.5.0
template: contract-qa
productionReady: false
notes: |
  Identity. Deploy 3 is v0.5.0 (a bump from the v0.4.0 line, owner decision 2026-10-16). The v0.4.0 tags: release/v0.4.0-base (Deploy 1, 9a768bb9) and
  release/v0.4.0-base.3-rehearsal (Deploy 2, 78c50cbd, a rehearsal-kind deployment). This file QA-checks the
  next deployment of the line, Deploy 3: a NEW deployment of governed UUPS proxies at new addresses. Deploy 2
  predates the proxies and cannot be upgraded in place (ADR-0009: no assisted migration; the legacy vaults stay
  redeemable). The release tag of a production Deploy 3 is release/v0.5.0 with no "rehearsal" in it. Its version tag
  (P10.05, {versionTag}) is v0.5.0 with no network suffix (owner, 2026-10-16). Pushing it also builds and
  publishes the dApp image v0.5.0 (release-dapp.yml): no dApp release may have used v0.5.0 first.

  What this release adds to the Deploy 2 flow (everything marked added: v0.5.0): governed proxies and the
  freeze (P2.50 to P2.52, P7.50 to P7.62), the ProposerFloorTimelock check (P2.51), set-unwind-guard and its
  verifier label (P3.51, P3.52, P4.50), the one-call apply-receipt and its ordering rule (P5.51 to P5.58), agent
  consent by commit then reveal (P6.50 to P6.54), the router leg skipping and the new deposit gas limits
  (P6.55 to P6.58), the release gate re-read at later stages (P3.50), proxy-aware observability (P8.50, P8.51),
  the Safe self-administration pair on the Twin chain (P4.51, P4.52) and the failure and exclusion drills
  (P9.50 to P9.55).

  Environments. The same file runs on the Twin chain (--target twin), as the Base mainnet rehearsal with a 900 s
  timelock (--target rehearsal, runbook 4.10) and as Deploy 3 (--target production). Steps for one environment say
  so with onlyFor. The lifecycle steps (P7) run only when the run sheet says UPGRADE_MODE=upgradeable. The freeze
  steps (P7.56 to P7.61) run only when the owner has recorded {runDir}/go/freeze.json: the freeze is OFF by
  default on 8453.

  Not exercised here, and why. (1) The Twin-only rows update-delay, batch and cancel: the default Twin govern
  run (P3.01) already runs them, the rehearsal rows are optional demonstrations of the Safe tool. (2) Twin-only
  safe-add-owner and timelock-grant-role and revoke rows: the CI Twin job covers safe-change-threshold, this file
  runs the threshold pair (P4.51, P4.52) and leaves the others to publish-contracts/tests/govern.test.ts.
  (3) A committee signal (rmpc committee vote-submit): the registered submitter is a Safe, which rmpc cannot
  sign for, so P5.50 proves the role with the read-only check-agent. (4) The emergency unwind itself: the baskets
  hold nothing at the guard rounds, the verifier label (P4.50) proves the guard is set. (5) The single-vault
  redeploy (runbook 4.11) has its own procedure.

  Exceptions to the README. None recorded.

  Reviews. The 2026-10-15 internal review (docs/code-review/20261015-review-security-claude.md) is neither the
  external review nor a gate for Deploy 3 (owner, 2026-10-16). The external review of the proxy form must be a
  report recorded in docs/audits.md (decision external-review).

  Open owner decisions are the decisions: list below. A production run (validate with --target production
  --runnable) refuses while any is open, and so does productionReady: true.
decisions:
  - id: adr-0014-accepted
    question: "Accept ADR-0014 (governed UUPS proxies with a one-way, target-bound freeze), which is Proposed"
    status: decided
    answer: "Yes. Follows from freeze-policy: an upgradeable proving period needs ADR-0014 accepted. The ADR file itself still says Proposed and must be updated to Accepted."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: freeze-policy
    question: "Is Deploy 3 frozen at launch (UPGRADE_MODE=frozen), or an upgradeable proving period with UPGRADE_FREEZE_DEADLINE and a named release owner, signers and backups (4.12)"
    status: decided
    answer: "No. Deploy 3 does not launch frozen: it is an upgradeable proving period (UPGRADE_MODE=upgradeable). It needs UPGRADE_FREEZE_DEADLINE and a named release owner, signers and backups (4.12), still to be set."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: emergency-levers
    question: "Confirm or narrow the two hot-key levers the security fixes added to EMERGENCY_ROLE (emergencyExcludeAdapter, recoverRemovedAdapter), issue 1705"
    status: decided
    answer: "Keep both. EMERGENCY_ROLE keeps emergencyExcludeAdapter and recoverRemovedAdapter on the hot key (issue 1705)."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook-2, 2026-10-16"
  - id: queued-operations
    question: "What a timelock operation queued before an upgrade does after it (bound to the implementation version, or invalidated), docs/development/open-questions.md, issue 1810"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: external-review
    question: "The external security review of the proxy form and the four new libraries at the release sha is complete and recorded in docs/audits.md (runbook 4.1 item 3, required for a final mainnet release)"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: production-receipt-surface
    question: "How a production deployment registers a receipt submitter and records receipts: register-committee and record-receipt are refused on 8453 in production, so P3.03 to P3.05 and P5.01 to P5.58 are skipped until this is decided"
    status: decided
    answer: "Yes. Rebalancing works on 8453 from launch. The CLI must stop refusing register-committee and record-receipt in production; the change is not yet made."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: version-line
    question: "The version line and tag of Deploy 3: release/v0.4.0-base.N or a bump to v0.5.0"
    status: decided
    answer: "Deploy 3 is released as v0.5.0, from this file (releases/v0.5.0.yaml)."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
recovery: |
  Contracts are immutable; there is no in-place rollback (runbook 4.6). What to do depends on how far the run got.
  - Before P1.02-publish (phase 0 and the go): nothing was sent. Fix on dev, take the new tip, tag it again,
    commit its frozen counts and restart at P0.01.
  - A failed P1.02-publish: rerun the same command with --resume (never mark a stage done by hand). A stage that
    died part-way stays started. Before the timelock handover the deployer still holds the roles: pause-all or
    abandon the deployment and redeploy at new addresses.
  - After the handover (P1.02 done): the EMERGENCY key pauses deposits (pause-all, P9.01); withdrawals stay open.
    A failed verify (P2.01, P4.01) pauses all four vaults by itself and exits 13: read rollout-report-<chain>.json,
    fix on dev, and plan a NEW deployment, because a live vault's state cannot be moved onto fixed code. A vault
    pause-all paused comes back only through a new unpause round of the Safe (P9.03); cancel any pending unpause
    through the Safe first.
  - A queued upgrade or freeze that must not run is cancelled through the Safe on the timelock (cancel). Rolling
    back an upgrade is another governed upgrade, with the same layout review; never assume it is safe after a
    migrating upgrade.
  - After P7.57-freeze-execute: upgrades are gone for good. Only a new deployment and a voluntary cutover (ADR-0009)
    change logic. The legacy vaults stay redeemable.
  - After P5.54-apply-receipt-execute: the receipt is burned; govern --row clear-voted-weights returns routing to
    the default vector (never on the live Deploy 2 router).
  - The version tag (P10.05) is cut only after a clean postflight and is never moved or withheld by a later failure.
