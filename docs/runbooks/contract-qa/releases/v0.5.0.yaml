steps:
  - id: "P0.01-runbook-valid"
    standing: ["4.1"]
    description: "The release runbook is the template plus additions, the sheet and target make sense, and a production run has no open owner decision"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.02-run-dirs"
    standing: ["4.3"]
    description: "The run directory layout every later receipt and state file lives in; the run directory is outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
  - id: "P0.53-foundry-version"
    standing: ["4.2"]
    description: "forge, cast and anvil are the Foundry version CI pins (v1.8.5, .github/actions/twin-fork/action.yml). Foundry 1.8.1 anvil refuses an eth_call from an address with no balance, which breaks the Safe probes"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'for t in forge cast anvil; do "$t" --version | head -n 1 | grep -Eq "Version: 1\\.8\\.5([^0-9]|$)" || { echo "$t is not Foundry 1.8.5" >&2; exit 1; }; done']
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P0.04-checkout"
    standing: ["4.1"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.05-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.06-forge-build"
    standing: ["4.1"]
    description: "forge build succeeds at the DEPLOY_SHA"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build"]
    expectExit: 0
    receipts: []
    irreversible: false
    maxMinutes: 30
  - id: "P0.56-counts-build"
    standing: ["4.2"]
    description: "The counts checkout is built before P0.08: its preflight guards read the contract artifacts under {countsCheckout}/out, which P0.06 builds only in the core checkout (Deploy 3 rc.7 stopped at P0.08 on a missing RouterGovernance artifact)"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build", "--root", "{countsCheckout}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    maxMinutes: 30
    added: "v0.5.0"
  - id: "P0.08-dependency-manifest"
    standing: ["4.2"]
    description: "The third-party dependency manifest for this release is recorded at the deploy block; run from the dev checkout, because it writes a file under deployments/ that would dirty the DEPLOY_SHA checkout"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "{countsCheckout}/scripts/release/preflight-guards.sh", "--dependency-manifest", "8453:{release}"]
    env:
      DEPENDENCY_MANIFEST_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{countsCheckout}/deployments/dependency-manifests/8453", "pattern": "{release}.json", "required": true}
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P0.12-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453), a pinned lazy fork of Base, answers on the RPC the run uses"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/devnet/twin-fork.ts", "start", "--port", "8545", "--state-dir", "{runDir}/twin"]
      - ["bun", "scripts/devnet/twin-fork.ts", "wait-ready", "--port", "8545", "--state-dir", "{runDir}/twin"]
    env:
      BASE_UPSTREAM_RPC: "{env:BASE_UPSTREAM_RPC}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    onlyFor: "twin"
    maxMinutes: 15
  - id: "P0.13-twin-keys"
    standing: ["4.3"]
    description: "Throwaway keystores for the deployer, pauser, emergency key and three Safe owners; the passphrase stays in a 0600 file; the public addresses become the sheet fragment"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n' > {runDir}/passphrase"]
      - ["bash", "-c", "bun publish-contracts/src/rehearsal/cli.ts keys --dir {runDir}/keys --password-file {runDir}/passphrase --chain-id 918453 > {runDir}/fragment.env"]
    expectExit: 0
    receipts:
