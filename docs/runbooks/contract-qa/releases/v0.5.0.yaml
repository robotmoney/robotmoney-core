    description: "The gateway manifest carries both runtime hash pins the signing clients check fail-closed, and its implementation is the live one; the dapp build and the rmpc config take these pins from the manifest"
    host: "control"
    phase: 8
    cmds:
      - ["jq", "-e", "(.gateway_runtime_hash | length) > 2 and (.gateway_implementation_runtime_hash | length) > 2 and (.gateway_implementation | length) > 2", "{manifestDir}/gateway.json"]
      - ["bash", "-c", 'test "$(cast implementation "{m:gateway.gateway}" | tr A-F a-f)" = "$(jq -r .gateway_implementation {manifestDir}/gateway.json | tr A-F a-f)"']
    env:
