      - ["bash", "-c", 'cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-USDC']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-USDC}", "{state:preview-USDC}", "50"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["preview-USDC", "shares-USDC"]
  - id: "P6.11-deposit-rmproto"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmPROTO; the shares are at least previewDeposit (a basket's preview is the floor after maxSlippageBps) and above it by no more than that haircut"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/preview-PROTO']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:protocol-asset-vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:protocol-asset-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-PROTO']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:shares-PROTO}", "{state:preview-PROTO}"]
      - ["bash", "-c", 'b=$(cast call "{m:protocol-asset-vault.vault}" "maxSlippageBps()(uint256)" | cut -d" " -f1) && echo $(( b * 10000 / (10000 - b) + 1 )) > {runDir}/state/share-bound-PROTO']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-PROTO}", "{state:preview-PROTO}", "{state:share-bound-PROTO}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["preview-PROTO", "shares-PROTO", "share-bound-PROTO"]
  - id: "P6.12-deposit-rmagent"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmAGENT right after record() makes the price recorder fresh (else StaleRecorder); the shares are at least previewDeposit (a basket's preview is the floor after maxSlippageBps) and above it by no more than that haircut"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:recorder.recorder}", "record()", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:recorder.recorder}" "isFresh()(bool)")" = true']
      - ["bash", "-c", 'cast call "{m:agent-token-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/preview-AGENT']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:agent-token-vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:agent-token-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:agent-token-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-AGENT']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:shares-AGENT}", "{state:preview-AGENT}"]
      - ["bash", "-c", 'b=$(cast call "{m:agent-token-vault.vault}" "maxSlippageBps()(uint256)" | cut -d" " -f1) && echo $(( b * 10000 / (10000 - b) + 1 )) > {runDir}/state/share-bound-AGENT']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-AGENT}", "{state:preview-AGENT}", "{state:share-bound-AGENT}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    triage: true
    writes: ["preview-AGENT", "shares-AGENT", "share-bound-AGENT"]
  - id: "P6.13-deposit-rmrwa"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmRWA; the shares are at least previewDeposit (a basket's preview is the floor after maxSlippageBps) and above it by no more than that haircut"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:rwa-basket-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/preview-RWA']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:rwa-basket-vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:rwa-basket-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/shares-RWA']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:shares-RWA}", "{state:preview-RWA}"]
      - ["bash", "-c", 'b=$(cast call "{m:rwa-basket-vault.vault}" "maxSlippageBps()(uint256)" | cut -d" " -f1) && echo $(( b * 10000 / (10000 - b) + 1 )) > {runDir}/state/share-bound-RWA']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:shares-RWA}", "{state:preview-RWA}", "{state:share-bound-RWA}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["preview-RWA", "shares-RWA", "share-bound-RWA"]
  - id: "P6.20-redeem-rmusdc"
    standing: ["4.4"]
    description: "Full redeem of rmUSDC to USDC; the deployer's share balance is zero afterwards"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.vault}", "redeem(uint256,address,address)", "{state:shares-USDC}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "3000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.21-redeem-in-kind-rmproto"
    standing: ["4.4"]
    description: "Full redeemInKind of rmPROTO, which reads no oracle and always pays in the underlying assets"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:protocol-asset-vault.vault}", "redeemInKind(uint256,address,address)", "{state:shares-PROTO}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.22-redeem-in-kind-rmagent"
    standing: ["4.4"]
    description: "Full redeemInKind of rmAGENT, which stays open while the recorder is stale"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:agent-token-vault.vault}", "redeemInKind(uint256,address,address)", "{state:shares-AGENT}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:agent-token-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.23-redeem-rmrwa"
    standing: ["4.4"]
    description: "Full redeem of rmRWA to USDC"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:rwa-basket-vault.vault}", "redeem(uint256,address,address)", "{state:shares-RWA}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.50-agent-policy"
    standing: ["4.4"]
    description: "The commit hashes, salts and the signalling-free deposit policy the consent steps use; validUntil is chain time plus a day, because the Twin clock is warped"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'echo $(( $(cast block latest --field timestamp) + 86400 )) > {runDir}/state/agent-valid-until']
      - ["bash", "-c", 'cast keccak "qa-self-$(date +%s%N)" > {runDir}/state/agent-salt-self']
      - ["bash", "-c", 'cast keccak "qa-stranger-$(date +%s%N)" > {runDir}/state/agent-salt-stranger']
      - ["bash", "-c", 'cast keccak "$(cast abi-encode "f(address,address,bytes32)" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" "$(cat {runDir}/state/agent-salt-self)")" > {runDir}/state/agent-commit-self']
      - ["bash", "-c", 'cast keccak "$(cast abi-encode "f(address,address,bytes32)" "0x000000000000000000000000000000000000bEEF" "{sheet:ADMIN_ADDRESS}" "$(cat {runDir}/state/agent-salt-stranger)")" > {runDir}/state/agent-commit-stranger']
      - ["bash", "-c", 'echo "(true,$(cat {runDir}/state/agent-valid-until),1000000,3000000,{sheet:ADMIN_ADDRESS},[{m:router.router}],{sheet:ADMIN_ADDRESS},0,0,[])" > {runDir}/state/agent-policy']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["agent-valid-until", "agent-salt-self", "agent-salt-stranger", "agent-commit-self", "agent-commit-stranger", "agent-policy"]
    added: "v0.5.0"
  - id: "P6.53-agent-self-commit"
    standing: ["4.4"]
    description: "The depositor commits its own authorization (agent and committer are the same key, so it consents by calling)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:gateway.gateway}", "commitAuthorization(bytes32)", "{state:agent-commit-self}", "{cast}"]
      - ["sleep", "5"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.54-agent-self-reveal"
    standing: ["4.4"]
    description: "At least a block later the reveal authorizes the agent, with the router as its only destination; the gateway records the depositor as its owner"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:gateway.gateway}", "revealAuthorization(address,bytes32,(bool,uint64,uint256,uint256,address,address[],address,uint256,uint256,address[]))", "{sheet:ADMIN_ADDRESS}", "{state:agent-salt-self}", "{state:agent-policy}", "--gas-limit", "1000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "agentOwner(address)(address)" "{sheet:ADMIN_ADDRESS}" | tr A-F a-f)" = "$(echo "{sheet:ADMIN_ADDRESS}" | tr A-F a-f)"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.55-gateway-deposit-vault"
    standing: ["4.4"]
    description: "The agent approves the gateway for 1 USDC, then deposits 1 USDC through the gateway into its single vault at 3,000,000 gas (the gateway floor is 2,000,000); the receipt is status 1"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast keccak "qa-vault-$(date +%s%N)" > {runDir}/state/order-vault']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:gateway.gateway}", "1000000", "{cast}"]
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{m:gateway.gateway}" "deposit(bytes32,uint256,uint64,bytes32)" "{state:order-vault}" 1000000 "$(( $(date +%s) + 300 ))" "$(cast keccak "key-{state:order-vault}")" --gas-limit 3000000 {castFlagsInline}']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["order-vault"]
    added: "v0.5.0"
  - id: "P6.56-gateway-deposit-router"
    standing: ["4.4"]
    description: "The agent approves the gateway for 1 USDC, then deposits 1 USDC through the gateway's depositTo into the router at 11,200,000 gas (the gateway floor is 400,000 + 2,550,000 per leg, 10,600,000 for four legs, checked after about 270,000 of entry gas): one RouterDeposit event per non-zero leg"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast keccak "qa-router-$(date +%s%N)" > {runDir}/state/order-router']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:gateway.gateway}", "1000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" | tail -n 1 | grep -oE "[0-9]+" | grep -vxc 0 > {runDir}/state/gateway-router-legs || true']
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{m:gateway.gateway}" "depositTo(bytes32,uint256,uint64,bytes32,address,uint256[])" "{state:order-router}" 1000000 "$(( $(date +%s) + 300 ))" "$(cast keccak "key-{state:order-router}")" "{m:router.router}" "[]" --gas-limit 11200000 {castFlagsInline} > {runDir}/state/gateway-router-deposit.json']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/gateway-router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/gateway-router-deposit.json']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["order-router"]
    added: "v0.5.0"
  - id: "P6.57-router-deposit"
    standing: ["4.4"]
    description: "1 USDC straight into the router at 10,800,000 gas (the 4-leg floor is 9,600,000): one RouterDeposit event per leg with a non-zero amount, and none for a zero-weight leg, which the router skips"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast send "{usdc}" "approve(address,uint256)" "{m:router.router}" 1000000 {castFlagsInline}']
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" | tail -n 1 | grep -oE "[0-9]+" | grep -vxc 0 > {runDir}/state/router-legs || true']
      - ["bash", "-c", 'cast send "{m:router.router}" "deposit(uint256,uint256[])" 1000000 "[]" --gas-limit 10800000 --json {castFlagsInline} > {runDir}/state/router-deposit.json']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/router-deposit.json']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["router-legs", "router-deposit.json"]
    added: "v0.5.0"
  - id: "P6.59-sweep-positions"
    standing: ["4.4"]
    description: "The gateway and router deposits are redeemed in full: rmUSDC by redeem, each basket by redeemInKind, so no test position is left behind"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:agent-token-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeemInKind"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then cast send "$v" "$fn(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P6.60-agent-revoke"
    standing: ["4.4"]
    description: "The deployer, the agent owner since P6.54, revokes itself as a gateway agent and AGENT_ROLE is read back gone; else every later verify fails 'deployer: holds no role on any contract' and pauses all four vaults"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:gateway.gateway}", "revokeAgent(address)", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "hasRole(bytes32,address)(bool)" "$(cast keccak AGENT_ROLE)" "{sheet:ADMIN_ADDRESS}")" = false']
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "agentOwner(address)(address)" "{sheet:ADMIN_ADDRESS}")" = 0x0000000000000000000000000000000000000000']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P7.50-deploy-implementation"
    standing: ["4.12"]
    description: "The deployer deploys a second gateway implementation from the build, linked to the live libraries, and the verb records it; nothing governs it yet"
    host: "control"
    phase: 7
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "deploy-implementation", "--proxy", "gateway", "{common}", "{gate}"]
      - ["bash", "-c", "jq -er '[.implementation_deploys[] | select(.proxy_name == \"gateway\")][-1].implementation' {evidenceDir}/publish-run.json > {runDir}/state/new-implementation"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
    irreversible: false
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    writes: ["new-implementation"]
    added: "v0.5.0"
  - id: "P7.51-upgrade-schedule"
    standing: ["4.12"]
    description: "The Safe schedules ONE timelock call, upgradeToAndCall(new, empty), after the layout and library checks; the preview shows the old and new implementation and code hashes"
    host: "control"
    phase: 7
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "upgrade-proxy", "--proxy", "gateway", "--implementation", "{state:new-implementation}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    maxMinutes: 60
    added: "v0.5.0"
  - id: "P7.52-upgrade-execute"
    standing: ["4.12"]
    description: "After the delay the same command executes the upgrade, reads the implementation slot back and re-records the stage manifest and the gateway runtime pins; an upgrade can still be rolled back by another governed upgrade until the freeze"
    host: "control"
    phase: 7
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "upgrade-proxy", "--proxy", "gateway", "--implementation", "{state:new-implementation}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    notBefore: {"afterStep": "P7.51-upgrade-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.5.0"
  - id: "P7.54-verify-after-upgrade"
    standing: ["4.12"]
    description: "Verify passes against the upgraded gateway: its code is compared with the build the upgrade came from, every other contract with the DEPLOY_SHA build"
    host: "control"
    phase: 7
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    maxMinutes: 60
    added: "v0.5.0"
  - id: "P9.01-pause-all"
    standing: ["4.5", "4.6"]
    description: "pause-all pauses deposits on all four vaults with the emergency key, reads each back and writes the rollout report; withdrawals stay open"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "pause-all", "{common}", "{emergency}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
