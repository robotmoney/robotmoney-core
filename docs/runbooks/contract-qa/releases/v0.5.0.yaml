    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P4.50-unwind-guard-labels"
    standing: ["4.9"]
    description: "The post-govern verify requires the emergency unwind guard on every active asset of every open basket"
    host: "control"
    phase: 4
    cmds:
      - ["grep", "-qxF", "vault[rmPROTO]: emergencyUnwindGuard minUsdcOut above zero on every active asset of an open vault", "{journal:P4.01-verify-post-govern}"]
      - ["grep", "-qxF", "vault[rmAGENT]: emergencyUnwindGuard minUsdcOut above zero on every active asset of an open vault", "{journal:P4.01-verify-post-govern}"]
      - ["grep", "-qxF", "vault[rmRWA]: emergencyUnwindGuard minUsdcOut above zero on every active asset of an open vault", "{journal:P4.01-verify-post-govern}"]
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P4.51-safe-threshold-raise"
    standing: ["9"]
    description: "Twin only: a Safe self-administration row on the real SafeL2 raises the threshold to the owner count; it is one Safe transaction, no timelock round"
    host: "control"
    phase: 4
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "safe-change-threshold", "--admin-arg", "threshold={sheetOwnerCount}", "{common}", "{owners}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
    added: "v0.5.0"
  - id: "P4.52-safe-threshold-restore"
    standing: ["9"]
    description: "Twin only: the threshold goes back to the sheet's value, signed by every owner while the sheet is stale; every later row and the verifier compare the live roster with the sheet"
    host: "control"
    phase: 4
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "safe-change-threshold", "--admin-arg", "threshold={sheet:SAFE_THRESHOLD}", "{common}", "{owners}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
    added: "v0.5.0"

  # ── Phase 5, receipt: a REAL consensus receipt anchored through the gateway by the registered submitter Safe. ──
  - id: "P5.01-receipt-offline"
    standing: ["4.10"]
    description: "rmpc verifies every analyst signature of the receipt offline; the receipt id and the payload digest come from the one shared definition, never a plain keccak256 of the file"
    host: "control"
    phase: 5
    cmds:
      - ["target/debug/rmpc", "receipt", "-c", "{rmpcConfig}", "verify", "--receipt-file", "{receiptFile}"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-id {receiptFile} > {runDir}/state/receipt-id"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-digest {receiptFile} > {runDir}/state/receipt-digest"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["receipt-id", "receipt-digest"]
  - id: "P5.02-record-receipt"
    standing: ["4.10"]
    description: "The submitter Safe records the receipt through the gateway: threshold owners sign, the deployer pays; the stored submitter reads back as the Safe. A receipt id is unique, so a wrong digest cannot be corrected"
    host: "control"
    phase: 5
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "record-receipt", "{common}", "{owners}", "{gate}", "--receipt-id", "{state:receipt-id}", "--payload-digest", "{state:receipt-digest}", "--payload", "{receiptFile}", "--payload-uri", "{receiptUri}", "--submitter", "{state:submitter-safe}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: true
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P4.01-verify-post-govern", "hours": 0}
  - id: "P5.03-receipt-recorded"
    standing: ["4.10"]
    description: "The run manifest holds the recorded receipt with the submitter address and a transaction, and no key"
    host: "control"
    phase: 5
    cmds:
      - ["jq", "-e", '(.recorded_receipts | length) >= 1 and (.recorded_receipts[0] | has("tx") or has("transaction") or has("tx_hash"))', "{evidenceDir}/publish-run.json"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P5.50-committee-agent-role"
    standing: ["4.10"]
    description: "The registered submitter Safe holds COMMITTEE_AGENT_ROLE on the IC policy (a read-only rmpc preflight; a committee signal binds the caller to the signing agent, so the Safe cannot post one through rmpc)"
    host: "control"
    phase: 5
    cmds:
      - ["target/debug/rmpc", "committee", "-c", "{rmpcConfig}", "check-agent", "--agent", "{state:submitter-safe}"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    added: "v0.5.0"
  - id: "P5.51-receipt-b-prepare"
    standing: ["4.9"]
    description: "A second receipt, the same weights under a new session id, recorded after the first; it is the newer one, so the ordering rule can be shown on the older"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", "sed -e 's/5015526d-27f6-478a-86e9-ac768e310af1/00000000-0000-4000-8000-000000000b01/' {receiptFile} > {runDir}/receipt-b.json"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-id {runDir}/receipt-b.json > {runDir}/state/receipt-b-id"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-digest {runDir}/receipt-b.json > {runDir}/state/receipt-b-digest"]
    expectExit: 0
    receipts:
