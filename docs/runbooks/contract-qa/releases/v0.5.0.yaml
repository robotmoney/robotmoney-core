      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
    writes: ["restore-calldata"]
