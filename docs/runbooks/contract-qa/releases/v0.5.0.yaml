    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P5.52-record-receipt-b", "hours": 0}
    maxMinutes: 60
    added: "v0.5.0"
  - id: "P5.54-apply-receipt-execute"
    standing: ["4.9"]
    description: "After the delay the same command executes the application; isReleased, getWeights, getEffectiveWeights and votedWeightsActive read back"
    host: "control"
    phase: 5
    cmds:
