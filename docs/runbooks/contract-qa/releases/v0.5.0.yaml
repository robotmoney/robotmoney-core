  # ── Phase 1, publish: stages 0 to 11. The first send of the run. ──
  - id: "P1.01-go"
    standing: ["4.3"]
    description: "The operator's recorded go for this run: the sha, the environment and the sheet hash they approved"
    host: "control"
    phase: 1
    cmds:
      - ["test", "-s", "{runDir}/go/publish.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "publish.json", "required": true}
    irreversible: false
  - id: "P1.02-publish"
    standing: ["4.3"]
    description: "Safe, libs, recorder, vault, registry, router, gateway, ic-policy, governance, proto, agent, rwa, prove-control signed by every owner, then the timelock handover; each stage matches its frozen count"
    host: "control"
    phase: 1
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "{common}", "{owners}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
      - {"dir": "{manifestDir}", "pattern": "timelock.json", "required": true}
    irreversible: true
    notBefore: {"afterStep": "P1.01-go", "hours": 0}
    maxMinutes: 180
  - id: "P1.03-stages-done"
    standing: ["4.3"]
    description: "The run manifest shows every stage done, prove-control included, and the handover block recorded"
    host: "control"
    phase: 1
    cmds:
      - ["jq", "-e", '([.stages | to_entries[] | select(.value.status != "done")] | length == 0) and (.stages | has("prove-control")) and (.stages | has("timelock")) and (.stages | has("safe"))', "{evidenceDir}/publish-run.json"]
      - ["bash", "-c", 'test "$(ls {manifestDir}/*.json | wc -l)" -ge 13']
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P1.04-twin-counts"
    standing: ["3"]
    description: "The Twin run measured and wrote the per-stage counts for the sha"
    host: "control"
    phase: 1
    cmds:
      - ["test", "-s", "{countsDir}/{coreSha}.json"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"

  # ── Phase 2, verify: the pre-govern state. All four vaults deploy paused. ──
  - id: "P2.01-verify-pre-govern"
    standing: ["4.3"]
    description: "Stage 12 reads the chain, not the manifests: roles, Safe, timelock, per-vault rules, recorder ring, the deployer nonce. A failure pauses all four vaults and exits 13"
    host: "control"
    phase: 2
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "isomorphism-{chainId}.json", "required": true}
    irreversible: false
    maxMinutes: 60
  - id: "P2.02-vaults-paused"
    standing: ["4.3"]
    description: "All four vaults read depositsPaused true before govern"
    host: "control"
    phase: 2
    cmds:
      - ["bash", "-c", 'for v in "{m:vault.vault}" "{m:protocol-asset-vault.vault}" "{m:agent-token-vault.vault}" "{m:rwa-basket-vault.vault}"; do test "$(cast call "$v" "depositsPaused()(bool)")" = true || exit 1; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P2.03-label-parity"
    standing: ["4.3"]
    description: "The verifier labels of this run equal the committed mainnet label set: nothing was added or dropped silently"
    host: "control"
    phase: 2
    cmds:
      - ["bun", "scripts/stage/core-stack.ts", "parity", "labels", "--mainnet", "publish-contracts/tests/fixtures/verifier-labels.txt", "--stage-labels", "{journal:P2.01-verify-pre-govern}"]
    expectExit: 0
    receipts: []
    irreversible: false
    triage: true
  - id: "P2.50-proxy-labels"
    standing: ["4.12"]
    description: "Every governed contract is the build's ERC-1967 proxy with no admin and no beacon, names the manifest's implementation, links the build's libraries, names the deployed timelock as its only upgrade authority, is initialized once, and agrees with the release mode"
    host: "control"
    phase: 2
    cmds:
      - ["bash", "-c", 'for n in "vault[rmUSDC]" registry router gateway icpolicy receipt governance "vault[rmPROTO]" "vault[rmAGENT]" "vault[rmRWA]"; do for l in "is the build''s proxy with no admin and no beacon" "implementation slot equals the manifest" "implementation links the build''s libraries" "upgradeTimelock() is the deployed timelock" "initialized once and not initializing" "upgradesFrozen() agrees with the release mode" "manifest upgrade_mode equals the release sheet" "storage layout identifier recorded"; do grep -qxF "$n: $l" {journal:P2.01-verify-pre-govern} || { echo "missing label: $n: $l"; exit 1; }; done; done']
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P2.51-timelock-build"
    standing: ["4.12", "9"]
    description: "The timelock is the build's ProposerFloorTimelock: its code equals the artifact and it counts exactly one proposer, the Safe, so the last proposer can never be revoked"
    host: "control"
    phase: 2
    cmds:
      - ["grep", "-qxF", "timelock: runtime code equals build artifact (masked)", "{journal:P2.01-verify-pre-govern}"]
      - ["bash", "-c", 'test "$(cast call "{m:timelock.timelock}" "proposerCount()(uint256)")" = 1']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    added: "v0.5.0"
  - id: "P2.52-upgradeability-record"
    standing: ["4.12"]
    description: "Verify wrote upgradeability.json: ten proxies, the release mode equals the sheet, and the immutability claim is made only for a frozen release"
    host: "control"
    phase: 2
    cmds:
      - ["jq", "-e", "--arg", "mode", "{sheet:UPGRADE_MODE}", '(.proxies | length) == 10 and .mode == $mode and (.core_immutable == ($mode == "frozen"))', "{manifestDir}/upgradeability.json"]
    expectExit: 0
    receipts:
      - {"dir": "{manifestDir}", "pattern": "upgradeability.json", "required": true}
    irreversible: false
    added: "v0.5.0"

  # ── Phase 3, govern: stage 13. The Safe, through the timelock, is the only way anything changes after the handover. ──
  - id: "P3.01-govern-schedule"
    standing: ["4.3"]
    description: "Stage 13 schedules the four vault unpauses through the real Safe, one timelock operation each, in one sitting; on 8453 it exits 15 with the resume command"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
    irreversible: false
    maxMinutes: 60
  - id: "P3.50-gate-recheck"
    standing: ["3"]
    description: "The release gate holds again at the later stage: green CI at the sha is re-read before the delayed stage executes; every broadcasting 8453 run repeats the whole gate, so a GitHub outage holds the stage"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "scripts/ci/check-sha-green.ts", "{coreSha}", "--repo", "robotmoney/robotmoney-core"]
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    added: "v0.5.0"
  - id: "P3.51-unwind-guard-schedule"
    standing: ["4.9"]
    description: "In the same sitting as the unpauses, one set-unwind-guard round per basket: the Safe sets a non-zero emergency unwind floor on every active asset, sized from the vault's holding (the Twin proves the row with 1000000 and 500)"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=PROTO", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=AGENT", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=RWA", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    maxMinutes: 60
    added: "v0.5.0"

  - id: "P3.02-govern-execute"
    standing: ["4.3"]
    description: "After the timelock delay the same command executes the four unpauses and reads depositsPaused back; every printed row has a transaction hash and status 1"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
    irreversible: false
    notBefore: {"afterStep": "P3.01-govern-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
  - id: "P3.52-unwind-guard-execute"
    standing: ["4.9"]
    description: "After the delay the three guard rounds execute and the guard reads back non-zero"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=PROTO", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=AGENT", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "set-unwind-guard", "--admin-arg", "vault=RWA", "--admin-arg", "token=all", "--admin-arg", "min-usdc-out={unwindMinUsdcOut}", "--admin-arg", "max-loss-bps={unwindMaxLossBps}", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    notBefore: {"afterStep": "P3.51-unwind-guard-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.5.0"

  - id: "P3.03-submitter-safe"
    standing: ["4.10"]
    description: "The consensus receipt submitter is a second SafeL2 1.4.1 multisig, with the governing Safe's owners and a different salt, never a key"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "create", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--owners", "{sheet:SAFE_OWNERS}", "--threshold", "2", "--signer", "{signer}", "--salt-nonce", "{submitterSaltNonce}", "--yes", "--out", "{runDir}/submitter-safe.json"]
      - ["bash", "-c", "jq -r .safe {runDir}/submitter-safe.json > {runDir}/state/submitter-safe"]
    env:
      ADMIN_ADDRESS: "{sheet:ADMIN_ADDRESS}"
      PAUSER_ADDRESS: "{sheet:PAUSER_ADDRESS}"
      EMERGENCY_ADDRESS: "{sheet:EMERGENCY_ADDRESS}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "submitter-safe.json", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    gateAbsent: "{runDir}/state/submitter-safe"
    writes: ["submitter-safe"]
  - id: "P3.04-register-committee-schedule"
    standing: ["4.10"]
    description: "The submitter Safe authorizes itself privately (commit, a block later reveal, hand the agent to the timelock), then the governing Safe schedules one batch: setPolicy and committeeRegister"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "register-committee", "--submitter", "{state:submitter-safe}", "--agent-label", "qa-submitter", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 60
  - id: "P3.05-register-committee-execute"
    standing: ["4.10"]
    description: "After the delay the batch executes and AGENT_ROLE, COMMITTEE_AGENT_ROLE, the label, the agent owner and the share receiver read back"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "register-committee", "--submitter", "{state:submitter-safe}", "--agent-label", "qa-submitter", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P3.04-register-committee-schedule", "hours": "timelockDelay"}
    maxMinutes: 60

  # ── Phase 4, verify again: the post-govern state. ──
  - id: "P4.01-verify-post-govern"
    standing: ["4.3"]
    description: "Stage 12 again: all four unpause rows executed, all four vaults read depositsPaused false; a manifest that disagrees with the chain fails closed"
    host: "control"
    phase: 4
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    maxMinutes: 60
  - id: "P4.02-vaults-open"
    standing: ["4.3"]
    description: "All four vaults read depositsPaused false on the chain"
    host: "control"
    phase: 4
    cmds:
      - ["bash", "-c", 'for v in "{m:vault.vault}" "{m:protocol-asset-vault.vault}" "{m:agent-token-vault.vault}" "{m:rwa-basket-vault.vault}"; do test "$(cast call "$v" "depositsPaused()(bool)")" = false || exit 1; done']
