# docs/runbooks/contract-qa/releases/v0.5.0.yaml: the contract QA runbook of Deploy 3, released as v0.5.0 (owner
# decision 2026-10-16, version-line). A NEW deployment of governed UUPS proxies at new addresses on Base mainnet.
# A full copy of template.yaml's steps, unchanged and in order, plus the steps this release adds since Deploy 2
# (each carries `added: v0.5.0`). scripts/runbook/validate-contract-qa.ts checks it. It supersedes
# releases/v0.4.0.yaml for Deploy 3; that file stays as the record of the v0.4.0 line. The policy is
# docs/runbooks/contract-qa/README.md and docs/operations/contract-release-runbooks.md.
release: v0.5.0
template: contract-qa
templateSha: e362df0c0ad270cfc859dbc1df22140be5419278
productionReady: false
notes: |
  Identity. Deploy 3 is v0.5.0 (a bump from the v0.4.0 line, owner decision 2026-10-16). The v0.4.0 tags: release/v0.4.0-base (Deploy 1, 9a768bb9) and
  release/v0.4.0-base.3-rehearsal (Deploy 2, 78c50cbd, a rehearsal-kind deployment). This file QA-checks the
  next deployment of the line, Deploy 3: a NEW deployment of governed UUPS proxies at new addresses. Deploy 2
  predates the proxies and cannot be upgraded in place (ADR-0009: no assisted migration; the legacy vaults stay
  redeemable). Deploy 3 is a REHEARSAL-kind deployment on 8453 (DEPLOYMENT_KIND=rehearsal), as Deploy 2 was
  (owner, 2026-10-16). Its record tag is release/v0.5.0-rehearsal (runbook 4.10), at 57fbe618 (rc.9), the sha its run
  manifest names; it is never moved. On 8453 every publish CLI command of the run also gets --logs-rpc
  https://base.gateway.tenderly.co --logs-window 1000 (docs/development/stage-deployment.md): mainnet.base.org refused the
  verify stage's role scan with HTTP 429 at P2.01 for an hour, and the logs endpoint allows 1000 blocks per eth_getLogs.
  Explorer source verification is not a gate (owner decision 2026-10-19): P2.01 had waited its hour on Blockscout and
  Sourcify, which depend on third-party vendors. The verifier's code labels prove the build from the chain. From that
  commit on, a rehearsal at a tool-only commit is gated at the sha the deployment started at (owner decision
  2026-10-19): Deploy 3 continued at 91d4604a from P2.01, and {gateSha} is 57fbe618 (rc.9), whose tag, green CI and
  frozen counts gate P0.20 and P10.01. Each earlier run was gated on its rc tag ({releaseTag} = release/v0.5.0-rc.N-rehearsal at
  {gateSha}). The run continued at rc.10 (004b8c97, tools only) after the fee guard stop. A rehearsal run cuts no
  version tag.

  Release line (owner decision 2026-10-22). v0.5.0 is the first release of the line v0.5, whose branch is releases-0.5.x
  (policy docs/operations/contract-release-runbooks.md section 2). rc.1 to rc.13 and the record tag above predate the
  QA branch model and stay as Deploy 3's history. The next rc of v0.5.0 is rc.14, cut at the squash of a QA branch
  qa/0.5.x-<YYYY-MM-DD> onto releases-0.5.x. A run on 8453 runs only from an rc tag, with the owner's recorded go.

  Scope (owner review, 2026-10-19). This is the rehearsal deploy runbook: it deploys the contracts on a network,
  governs them and proves they work. The Twin chain and Base mainnet run the same steps. The review kept only the
  critical steps. It removed steps that re-check what an earlier step already proves, client checks (rmpc, the
  dapp, the indexer), production-only steps and Twin-only drills that CI covers. Every send goes through cast.

  What this release adds to the Deploy 2 flow (everything marked added: v0.5.0): governed proxies and a governed
  upgrade (P2.50, P7.50 to P7.54), the ProposerFloorTimelock check (P2.51), set-unwind-guard (P3.51, P3.52), the
  one-call apply-receipt (P5.53 to P5.55), agent consent by commit then reveal (P6.50 to P6.54), and deposits
  through the gateway and the router at the new gas limits (P6.55 to P6.57).

  Environments. The same file runs on the Twin chain (--target twin) and on Base mainnet as a rehearsal with a
  900 s timelock (--target rehearsal, runbook 4.10). Deploy 3 is the --target rehearsal run. --target production
  is a later production-kind deployment (48 hour timelock), not Deploy 3; the open decisions below gate only it. Steps for one environment say
  so with onlyFor. The upgrade steps (P7) run only when the run sheet says UPGRADE_MODE=upgradeable. The runbook
  never freezes: Deploy 3 does not freeze, and a freeze is the owner's separate decision. No step waits on a hand-made file:
  the fragment (P0.52), the publish go (P1.50), the report (P10.51) and the sign-off (P10.52) are written by the run.

  Not exercised here, and why. (1) The Twin-only rows update-delay, batch and cancel: the default Twin govern
  run (P3.01) already runs them. (2) Safe and timelock self-administration rows: publish-contracts/tests/govern.test.ts
  and the CI Twin job cover them. (3) A committee signal: the registered submitter is a Safe, and P3.05 reads its
  roles back. (4) The emergency unwind itself: the baskets hold nothing at the guard rounds, and the post-govern
  verify (P4.01) proves the guard is set. (5) The freeze, the verify-failure drill and the adapter exclusion drill:
  Twin-only, covered by CI. (6) The single-vault redeploy (runbook 4.11) has its own procedure.

  Exceptions to the README. None recorded.

  Reviews. The 2026-10-15 internal review (docs/code-review/20261015-review-security-claude.md) is neither the
  external review nor a gate for Deploy 3 (owner, 2026-10-16). The external review of the proxy form must be a
  report recorded in docs/audits.md (decision external-review).

  Open owner decisions are the decisions: list below. A production run (validate with --target production
  --runnable) refuses while any is open, and so does productionReady: true.
decisions:
  - id: adr-0014-accepted
    question: "Accept ADR-0014 (governed UUPS proxies with a one-way, target-bound freeze), which is Proposed"
    status: decided
    answer: "Yes. Follows from freeze-policy: an upgradeable proving period needs ADR-0014 accepted. The ADR file itself still says Proposed and must be updated to Accepted."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: freeze-policy
    question: "Is Deploy 3 frozen at launch (UPGRADE_MODE=frozen), or an upgradeable proving period with UPGRADE_FREEZE_DEADLINE and a named release owner, signers and backups (4.12)"
    status: decided
    answer: "No. Deploy 3 does not launch frozen: it is an upgradeable proving period (UPGRADE_MODE=upgradeable). For a rehearsal-kind run UPGRADE_FREEZE_DEADLINE is optional (4.12 table). The release owner, signers and backups (4.12) are still to be named."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: emergency-levers
    question: "Confirm or narrow the two hot-key levers the security fixes added to EMERGENCY_ROLE (emergencyExcludeAdapter, recoverRemovedAdapter), issue 1705"
    status: decided
    answer: "Keep both. EMERGENCY_ROLE keeps emergencyExcludeAdapter and recoverRemovedAdapter on the hot key (issue 1705)."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook-2, 2026-10-16"
  - id: queued-operations
    question: "What a timelock operation queued before an upgrade does after it (bound to the implementation version, or invalidated), docs/development/open-questions.md, issue 1810"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: external-review
    question: "The external security review of the proxy form and the four new libraries at the release sha is complete and recorded in docs/audits.md (runbook 4.1 item 3, required for a final mainnet release)"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: production-receipt-surface
    question: "How a production deployment registers a receipt submitter and records receipts: register-committee and record-receipt are refused on 8453 in production, so P3.03 to P3.05 and P5.01 to P5.58 are skipped until this is decided"
    status: decided
    answer: "Not needed for Deploy 3. Rebalancing works on 8453 from launch because Deploy 3 is rehearsal kind, where register-committee and record-receipt run, as in Deploy 2 (P3.03 to P3.05, P5). No tool change. How a later production-kind deployment records receipts stays a question for that release."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: version-line
    question: "The version line and tag of Deploy 3: release/v0.4.0-base.N or a bump to v0.5.0"
    status: decided
    answer: "Deploy 3 is released as v0.5.0, from this file (releases/v0.5.0.yaml)."
    decidedOn: 2026-10-16
    ref: "owner decision session deploy3-runbook, 2026-10-16"
  - id: rc-tag-and-branch-counts
    question: "Must Deploy 3 wait for a merge to dev: the frozen counts on a reviewed commit merged to dev (runbook 3, step 5) and the runbook branch merged first"
    status: decided
    answer: "No. Deploy 3 runs from the branch qa/contract-qa-runbook. The deploy checkout is the release candidate tag release/v0.5.0-rc.N-rehearsal. The frozen counts for that sha are committed on the same branch in a later commit, and the counts checkout is that later commit. The {gate} list placeholder expands to nothing for this run: --counts-require-origin-dev would refuse a counts commit that is not on origin/dev. The gate still proves the counts file is committed and clean in the counts checkout. The branch merges to dev only after Deploy 3 succeeds. This is a deviation from runbook 3 step 5 for this rehearsal only, never for a production run. CI at a branch deploy sha (check-sha-green, P0.10): the PR of this branch has later commits, so a CI-only PR whose head is the deploy sha runs the pull_request jobs (it must be ready for review: the suites defer their heavy jobs on a draft). The push-only jobs need a push of the sha to a dev-phase-* branch. A skipped run of a required job next to its success still fails the gate, so the skipped runs of a draft PR at that sha are deleted. Deploy 3: rc.3 (61d65524) was green with CI-only PR 1878 and dev-phase-deploy3-rc3, on 2026-10-17."
    decidedOn: 2026-10-17
    ref: "owner instruction in the Deploy 3 session, 2026-10-17"
recovery: |
  Contracts are immutable; there is no in-place rollback (runbook 4.6). What to do depends on how far the run got.
  - Before P1.02-publish (phase 0 and the go): nothing was sent. Fix on dev, take the new tip, tag it again,
    commit its frozen counts and restart at P0.01.
  - A failed P1.02-publish: rerun the same command with --resume (never mark a stage done by hand). A stage that
    died part-way stays started. Before the timelock handover the deployer still holds the roles: pause-all or
    abandon the deployment and redeploy at new addresses.
  - A tool fix found during a rehearsal (Deploy 3, 2026-10-18): commit it, cut the next rc, run the Twin pair, commit
    its frozen counts and get CI green, then rerun phase 0 at the new sha and the failed step with --resume. The
    dry run (P0.21) is skipped on that rerun, with the reason in its .result: it simulates a FRESH deployment from
    the Safe stage and refuses once the deployment's Safe exists ("Safe already deployed"), and the resumed publish
    simulates every remaining stage before it broadcasts, sending nothing when one fails. The record tag is not
    moved (runbook 4.10). The run continues the deployment's run manifest only when the new sha descends from the deployed one
    and contracts/, lib/, config/, the build settings and the stage table are byte-identical (publish-contracts
    src/tooling-sha.ts); any other change is refused before a signer exists.
  - After the handover (P1.02 done): the EMERGENCY key pauses deposits (pause-all, P9.01); withdrawals stay open.
    A failed verify (P2.01, P4.01) pauses all four vaults by itself and exits 13: read rollout-report-<chain>.json,
    fix on dev, and plan a NEW deployment, because a live vault's state cannot be moved onto fixed code. A vault
    pause-all paused comes back only through a new unpause round of the Safe (P9.03); cancel any pending unpause
    through the Safe first.
  - A queued upgrade or freeze that must not run is cancelled through the Safe on the timelock (cancel). Rolling
    back an upgrade is another governed upgrade, with the same layout review; never assume it is safe after a
    migrating upgrade.
  - After P5.54-apply-receipt-execute: the receipt is burned; govern --row clear-voted-weights returns routing to
    the default vector (never on the live Deploy 2 router).
