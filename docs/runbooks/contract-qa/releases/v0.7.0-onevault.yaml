    exercises: "vault-deposit"
  - id: "P6.13-deposit-rmrwa"
    standing: ["4.3", "4.4"]
    description: "1 USDC into rmRWA; the shares are at least previewDeposit (a basket's preview is the floor after maxSlippageBps) and above it by no more than that haircut plus the same slippage in the depositor's favour, because a swap can beat the oracle price (issue 1990)"
