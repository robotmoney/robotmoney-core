      - ["bash", "scripts/runbook/cast-send.sh", "{m:fund.fund}", "redeemInKind(uint256,address,address)", "{state:fund-shares-c}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
