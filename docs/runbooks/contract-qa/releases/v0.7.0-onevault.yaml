  # ── Deploy 4, the fund flow, phase 3: the receipt submitter of the fund system's register. The fund system has no govern verb: every governed call is a Safe
  # transaction to the fund-system timelock made with publish-contracts/src/safe/cli.ts (propose, two owner signatures, the deployer executes as the gas payer). ──
  - id: "P3.60-fund-submitter-safe"
    standing: ["4.10"]
    description: "The fund register's receipt submitter is a SafeL2 1.4.1 multisig with the governing Safe's owners and a salt no other Safe used, never a key (runbook 4.10)"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "create", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--owners", "{sheet:SAFE_OWNERS}", "--threshold", "2", "--signer", "{signer}", "--salt-nonce", "{submitterSaltNonce}", "--yes", "--out", "{runDir}/submitter-safe.json"]
      - ["bash", "-c", "jq -r .safe {runDir}/submitter-safe.json > {runDir}/state/fund-submitter-safe"]
    env:
      ADMIN_ADDRESS: "{sheet:ADMIN_ADDRESS}"
      PAUSER_ADDRESS: "{sheet:PAUSER_ADDRESS}"
      EMERGENCY_ADDRESS: "{sheet:EMERGENCY_ADDRESS}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "submitter-safe.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    gateAbsent: "{runDir}/state/fund-submitter-safe"
    writes: ["fund-submitter-safe"]
    added: "v0.7.0-onevault"
  - id: "P3.61-fund-register-submitter-schedule"
    standing: ["4.10"]
    description: "The governing Safe schedules ONE delayed call on the fund-system timelock, receipt.grantRole(RECEIPT_SUBMITTER_ROLE, the submitter Safe), after reading that the timelock holds the register's ADMIN_ROLE and the submitter does not hold the role yet: the Safe tool proposes, two owners sign, the deployer executes. The salt is derived from the run directory, so a rerun proposes the same operation"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "-c", 'test "$(cast call "{m:fund-receipt.consensus_receipt}" "hasRole(bytes32,address)(bool)" "$(cast keccak ADMIN_ROLE)" "{m:fund-timelock.timelock}")" = true && test "$(cast call "{m:fund-receipt.consensus_receipt}" "hasRole(bytes32,address)(bool)" "$(cast keccak RECEIPT_SUBMITTER_ROLE)" "{state:fund-submitter-safe}")" = false']
      - ["bash", "-c", 'cast keccak "robotmoney.deploy4.register-submitter.{runDir}" > {runDir}/state/salt-register-submitter && echo "{m:fund-receipt.consensus_receipt}" > {runDir}/state/target-register-submitter && cast calldata "grantRole(bytes32,address)" "$(cast keccak RECEIPT_SUBMITTER_ROLE)" "{state:fund-submitter-safe}" > {runDir}/state/data-register-submitter']
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "schedule", "--target", "{state:target-register-submitter}", "--data", "{state:data-register-submitter}", "--salt", "{state:salt-register-submitter}", "--out", "{runDir}/bundles/register-submitter-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/register-submitter-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/register-submitter-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/register-submitter-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "register-submitter-schedule.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    writes: ["salt-register-submitter", "target-register-submitter", "data-register-submitter"]
    added: "v0.7.0-onevault"
  - id: "P3.62-fund-register-submitter-execute"
    standing: ["4.10"]
    description: "After the timelock delay the Safe executes the same operation through the timelock, the timelock reads it done, and RECEIPT_SUBMITTER_ROLE reads back for the submitter Safe"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "execute", "--target", "{state:target-register-submitter}", "--data", "{state:data-register-submitter}", "--salt", "{state:salt-register-submitter}", "--out", "{runDir}/bundles/register-submitter-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/register-submitter-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/register-submitter-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/register-submitter-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", 'id=$(cast call "{m:fund-timelock.timelock}" "hashOperation(address,uint256,bytes,bytes32,bytes32)(bytes32)" "{state:target-register-submitter}" 0 "{state:data-register-submitter}" "$(cast hash-zero)" "{state:salt-register-submitter}") && test "$(cast call "{m:fund-timelock.timelock}" "isOperationDone(bytes32)(bool)" "$id")" = true']
      - ["bash", "-c", 'test "$(cast call "{m:fund-receipt.consensus_receipt}" "hasRole(bytes32,address)(bool)" "$(cast keccak RECEIPT_SUBMITTER_ROLE)" "{state:fund-submitter-safe}")" = true']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "register-submitter-execute.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P3.61-fund-register-submitter-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.7.0-onevault"

  # ── Phase 4, verify again: the post-govern state. ──
  - id: "P4.01-verify-post-govern"
    standing: ["4.3"]
    description: "Stage 12 again: all four unpause rows executed, all four vaults read depositsPaused false; a manifest that disagrees with the chain fails closed"
    host: "control"
    phase: 4
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    maxMinutes: 60
  # ── Phase 5, the consensus receipt: recorded by the submitter Safe, then APPLIED by the governing Safe through the timelock (runbook 4.9). ──
  - id: "P5.00-receipt-payload"
    standing: ["4.10"]
    description: "The Twin's receipt payload: the real production envelope with the three-vault vector USDC 8000, PROTO 1000, RWA 1000 (agent_tokens 0, ADR-0017), written by the run. It weights every vault, so the post-rebalance router deposit routes into all three (three legs, within its 8,400,000 gas: 400,000 plus 2,550,000 per leg), and it differs from the sheet's default vector (9500, 500, 0), so applying it changes the router split the run checks (P5.05, P6.32). On 8453 the operator passes the receipt the canonical route serves as {receiptFile}; a receipt that weights agent_tokens is refused by apply-receipt and the run stops"
    host: "control"
    phase: 5
    cmds:
      - ["bun", "scripts/runbook/receipt-payload.ts", "--out", "{receiptFile}", "--weights", "USDC:8000,PROTO:1000,RWA:1000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P5.01-receipt-offline"
    standing: ["4.10"]
    description: "The receipt id and the payload digest come from the one shared definition, never a plain keccak256 of the file"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-id {receiptFile} > {runDir}/state/receipt-id"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-digest {receiptFile} > {runDir}/state/receipt-digest"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["receipt-id", "receipt-digest"]
  # ── Issue 1984: the round BEFORE the router rebalance. P5.03 applies the receipt, which is the rebalance (publish-contracts/src/govern.ts); ADR-0003 routes only NEW
  # deposits by the new vector, so a run deposits, routes and redeems on the vector in effect first, then again on the receipt's vector in phase 6. These steps run where
  # P5.03 runs, and before the receipt is recorded, so a receipt that would not change the split stops the run before anything irreversible. They write pre-* state only. ──
  - id: "P5.05-receipt-changes-split"
    standing: ["4.4", "4.9"]
    description: "Before the rebalance the router's effective weights, whatever votedWeightsActive reads (on a new deployment the sheet's default vector; the runbook never clears a vector, issue 1980), are saved as the pre-rebalance vector; the receipt about to be recorded weights the vaults differently from that vector, so applying it changes the split the router deposits follow"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" > {runDir}/state/pre-router-weights && cat {runDir}/state/pre-router-weights']
      - ["bun", "scripts/runbook/qa-assert.ts", "receipt-changes-split", "{receiptFile}", "{runDir}/state/pre-router-weights"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["pre-router-weights"]
  - id: "P5.10-pre-deposit-rmusdc"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 1 USDC into rmUSDC at the 2,500,000 gas limit; the shares it minted (the balance after less the balance before) equal previewDeposit within 0.5 percent"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'cast call "{m:vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/pre-preview-USDC']
      - ["bash", "-c", 'cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance0-USDC']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "2500000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance1-USDC']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts sub {state:pre-balance1-USDC} {state:pre-balance0-USDC} > {runDir}/state/pre-shares-USDC"]
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:pre-shares-USDC}", "{state:pre-preview-USDC}", "50"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["pre-preview-USDC", "pre-balance0-USDC", "pre-balance1-USDC", "pre-shares-USDC"]
    exercises: "vault-deposit"
  - id: "P5.11-pre-deposit-rmproto"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 1 USDC into rmPROTO; the shares it minted are at least previewDeposit and above it by no more than the maxSlippageBps haircut plus the same slippage in the depositor's favour, because a swap can beat the oracle price (issue 1990)"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/pre-preview-PROTO']
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance0-PROTO']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:protocol-asset-vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:protocol-asset-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance1-PROTO']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts sub {state:pre-balance1-PROTO} {state:pre-balance0-PROTO} > {runDir}/state/pre-shares-PROTO"]
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:pre-shares-PROTO}", "{state:pre-preview-PROTO}"]
      - ["bash", "-c", 'b=$(cast call "{m:protocol-asset-vault.vault}" "maxSlippageBps()(uint256)" | cut -d" " -f1) && echo $(( 100000000 * 10000 / ((10000 - b) * (10000 - b)) - 10000 + 1 )) > {runDir}/state/pre-share-bound-PROTO']
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:pre-shares-PROTO}", "{state:pre-preview-PROTO}", "{state:pre-share-bound-PROTO}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["pre-preview-PROTO", "pre-balance0-PROTO", "pre-balance1-PROTO", "pre-shares-PROTO", "pre-share-bound-PROTO"]
    exercises: "vault-deposit"
  - id: "P5.13-pre-deposit-rmrwa"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 1 USDC into rmRWA; the shares it minted are at least previewDeposit and above it by no more than the maxSlippageBps haircut plus the same slippage in the depositor's favour, because a swap can beat the oracle price (issue 1990)"
