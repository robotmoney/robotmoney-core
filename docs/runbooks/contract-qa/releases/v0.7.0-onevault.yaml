  - id: "P5.30-pre-router-deposit"
    standing: ["4.4"]
    description: "Before the rebalance, 2 USDC straight into the router at 8,400,000 gas: the effective weights still equal the pre-rebalance vector P5.05 saved, and the RouterDeposit legs are exactly that vector's non-zero weights, each leg naming its vault and weight and minting shares; the deployer holds shares in every non-zero leg afterwards"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'test "$(cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])")" = "$(cat {runDir}/state/pre-router-weights)"']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:router.router}", "2000000", "{cast}"]
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{m:router.router}" "deposit(uint256,uint256[])" 2000000 "[]" --gas-limit 8400000 {castFlagsInline} | tee {runDir}/state/pre-router-deposit.json; test ${PIPESTATUS[0]} = 0']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts router-legs {runDir}/state/pre-router-deposit.json {runDir}/state/pre-router-weights "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
      - ["bash", "-c", 'w=$(cat {runDir}/state/pre-router-weights); vs=$(echo "$w" | sed -n 1p | grep -oE "0x[0-9a-fA-F]{40}"); bs=$(echo "$w" | sed -n 2p | grep -oE "[0-9]+"); i=1; for v in $vs; do b=$(echo "$bs" | sed -n "$i"p); i=$((i+1)); s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ] && [ "$s" = 0 ]; then echo "no shares in $v (weight $b)" >&2; exit 1; fi; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["pre-router-deposit.json"]
    exercises: "router-deposit"
  - id: "P5.31-pre-sweep-positions"
    standing: ["4.4"]
    description: "Before the rebalance, the router deposit is redeemed in full: rmUSDC by redeem, rmPROTO by redeemInKind, rmRWA by redeem, so the deployer holds no shares anywhere when the receipt is recorded and applied"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeem"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "$fn(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    exercises: "redeem"
  - id: "P5.02-record-receipt"
    standing: ["4.10"]
    description: "The submitter Safe records the receipt directly on the receipt contract: threshold owners sign, the deployer pays; the digest and id are recomputed from the served bytes before any signer exists; the stored submitter reads back as the Safe. A receipt id is unique, so a wrong digest cannot be corrected"
    host: "control"
    phase: 5
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "record-receipt", "{common}", "{owners}", "{gate}", "--receipt-id", "{state:receipt-id}", "--payload-digest", "{state:receipt-digest}", "--payload", "{receiptFile}", "--payload-uri", "{receiptUri}", "--submitter", "{state:submitter-safe}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: true
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P4.01-verify-post-govern", "hours": 0}
  - id: "P5.03-apply-receipt"
    standing: ["4.9", "4.10"]
    description: "The governing Safe applies the recorded receipt as ONE timelock call, RouterGovernance.applyReceipt (schedule, the delay, execute, in one command); the row reads isReleased and the router weights back"
