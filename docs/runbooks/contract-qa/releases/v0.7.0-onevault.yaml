# docs/runbooks/contract-qa/releases/v0.7.0-onevault.yaml: the contract QA runbook of Deploy 4, a REHEARSAL-kind deployment on Base 8453 of the one-vault
# prototype (contracts/test/prototype/src: RobotMoneyFund, Rebalancer, RebalanceGovernance, FlowQueue, its own ConsensusRecommendationReceipt, Safe and
# ProposerFloorTimelock), deployed by the real deploy tool as the third system, `fund` (publish-contracts --system fund, scripts/deploy/stage-table.json).
# Owner exception 2026-11-12 (decision D4-1): from the unmerged branch docs/single-vault-rebalancer-proposal, before an external audit.
# A full copy of template.yaml's steps, unchanged and in order (the vaults system's flows new and upgrade), plus the steps this release adds, each `added:
# v0.7.0-onevault` and `flow: fund`. The release runs only the fund flow (flows: below), so no template step runs. scripts/runbook/validate-contract-qa.ts
# checks it; scripts/runbook/run.ts runs it. The rc tags would be release/v0.7.0-onevault-rc.N-rehearsal.
release: v0.7.0-onevault
template: contract-qa
productionReady: false
vaults: ["fund"]
flows:
  twin: ["fund"]
  rehearsal: ["fund"]
  production: ["fund"]
notes: |
  Identity. Deploy 4 deploys the one-vault prototype (the experiment of decision D4-1) as a NEW, independent system on Base 8453 with a 900 s timelock
  (DEPLOYMENT_KIND=rehearsal, runbook 4.10): RobotMoneyFund and its rebalancer, governance, flow queue, receipt register, Safe and timelock. It reads
  nothing of the vaults or gateway systems and governs neither. It is not a release of the vaults line: the version name says so (v0.7.0-onevault), and
  productionReady stays false. Nothing here is a production deployment.

  How the file is built. The validator requires every template step, unchanged and in order (checkAddOnly). The template steps are the vaults system's
  (flows new and upgrade): they publish and govern the vaults system, which Deploy 4 must not touch. So this release adds a third flow name, fund, and
  runs only it on every target (flows: twin, rehearsal and production all [fund]). A step runs on a target only when its flow is one the release runs
  there, so the template steps stay in the file and never apply. production is named only so it does not default to the new flow: every fund step is
  onlyFor twin or rehearsal, so a production run has no step and is refused (runnableProblems), besides the open decisions and productionReady false.

  The sheet. deployments/base-8453-rehearsal/deploy-4.env is the whole fund sheet (publish-contracts/src/sheet.ts FUND_SHEET_NAMES), not a fragment:
  P0.67 copies it to {sheet}; on the Twin P0.68 overlays the throwaway keys, a Twin keeper and the Twin chain ids. KEEPER_ADDRESS is blank in the
  committed file: the owner fills it and commits it before the rc tag (decision D4-3), and P0.69 refuses a blank or placeholder keeper.

  Governance. The fund CLI runs publish and verify only (--system fund). Every governed call (register the receipt submitter, apply a receipt, restore the
  pause, the upgrade) is a Safe transaction to the fund-system timelock made with publish-contracts/src/safe/cli.ts: propose --action schedule (or
  scheduleBatch), two owner signatures ({ownerSigner}, {ownerSigner2}; the Safe threshold is 2), the deployer executes as the gas payer ({signer}); after
  the timelock delay the same with --action execute (executeBatch), and the step reads isOperationDone of the operation id. A schedule step derives its
  salt from the run directory, so the execute step proposes the same operation.

  Timing. A request settles from its epoch's end plus FLOW_SETTLE_WINDOW (at most 7 h at the sheet's 6 h epoch and 1 h window), and the settle steps
  wait on chain time; deposit shares are held FLOW_MIN_HOLD (24 h, P6.62 notBefore 24 h). A plan concludes at its end (PLAN_DURATION, 7 days) or expires
  after its end plus REBALANCER_MAX_OVERRUN (7 days), so P6.76 runs 7 to 14 days (decision D4-4). The Twin runs the same steps with the same waits:
  QA runs everything the 8453 run sends (policy 4.14).

  Placeholders this release adds (README "Placeholders"): {ownerSigner2} (the second owner's signer spec), {keepercast} and {emergencycast} (the keeper's
  and the emergency key's keystores for cast-send.sh, {keeperKeystore} and {emergencyKeystore}; on the Twin the config adds the run's passphrase file, the
  keeper's keystore is {runDir}/keeper-keys/DEPLOYER), {fundTargetAssets} and {fundTargetBps} (the fund vector the Safe applies, cast array syntax). The
  report reads the fund's depositsPaused() from the release's vaults: fund (fund.json, field fund). run.ts checks on every rehearsal run that {manifestDir}
  equals {v050ManifestDir} and {evidenceDir} equals {v050EvidenceDir} (a rule of the v0.6.0 upgrade flow): the fund run's config sets them equal. The
  run is complete when P10.62-fund-signoff wrote go/signoff.json (the runner's closing line names the template's P10.52).

  Tools (2026-11-13). The receipt is built as a schema 1.1 per-asset payload by scripts/runbook/fund-receipt-payload.ts and checked by
  scripts/prototype/check-receipt-assets.ts (P6.70, P6.71); publish-contracts record-receipt --system fund records it on the fund register through the
  submitter Safe (P6.72, decision D4-5); the applied vector is the receipt's own (P6.73). The upgrade lifecycle deploys RebalancerV2
  (contracts/test/helpers/FundUpgradeV2.sol: the Rebalancer plus upgradeMarker(), no new state, never a stage) with deploy-implementation --system fund,
  upgrades the rebalancer to it through the fund Safe and timelock, reads the new code back, and upgrades back to the release build so the final verify
  compares the release (P9.69 to P9.72). The fund stages' frozen counts at the rc sha are committed on this branch in a later commit (decision D4-6).

  What is still open. The Twin cannot refresh price feeds: a pinned fork serves no new feed round while its clock moves on, so ETH / USD is stale there 300 to
  1,500 s of chain time after the pin. P0.71 requires 600 s of freshness before the publish; P6.59 records the fund's refusal (FeedUnhealthy,
  SettleBlocked Feed) once past it; P6.60 and every settle then refuse on the Twin, so the Twin run stops at P6.60 and the queue's timed rows are proven on
  8453 only, which reads live feeds (README, The fund flow). That breaks the rule that QA sends everything 8453 sends: an owner decision, not a tool fix.
  No feed storage is ever written.

  The pinned records v0.4.0, v0.5.0 and v0.6.0 are not changed. Open owner decisions are the decisions: list below. A production run refuses while any is
  open, and so does productionReady: false.

  Scope. No pull request carries the one-vault branch or the Deploy 4 tooling yet; the validator takes only real pull request numbers, so scope lists the
  merged one the fund verify proves (2000: the reproducible build and library code gates the fund verifier's code checks rest on). The branch's pull request
  joins scope when it is opened, before the rc tag (decision D4-2).
decisions:
  - id: "D4-1"
    question: "Deploy the one-vault prototype to Base 8453 as a rehearsal-kind deployment from the unmerged branch docs/single-vault-rebalancer-proposal, before an external audit"
    status: decided
    answer: "Yes, as an owner exception: Deploy 4 deploys the unmerged one-vault work from the branch docs/single-vault-rebalancer-proposal, before an external audit, as a rehearsal-kind deployment (DEPLOYMENT_KIND=rehearsal, 900 s timelock, every cap at most 1,000 USDC) on Base 8453, through the real deploy tool as the fund system. It is a rehearsal to stress-test the deploy tooling, not a production release."
    decidedOn: "2026-11-12"
    ref: "owner instruction in the Deploy 4 planning session, 2026-11-12"
  - id: "D4-2"
    question: "Go to broadcast Deploy 4 on Base 8453: push the branch docs/single-vault-rebalancer-proposal (with the Deploy 4 tooling) and its pull request, cut and push the rc tag release/v0.7.0-onevault-rc.N-rehearsal at the commit the Twin run passed, and record the publish go (P1.60) on the rehearsal target"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: "D4-3"
    question: "The keeper key: which public address is KEEPER_ADDRESS (KEEPER_ROLE on the queue and the rebalancer: settle and step first, anyone after the grace), who holds the key, and where its keystore lives. The owner creates it and fills the line in deploy-4.env before the rc tag"
    status: open
    answer: null
    decidedOn: null
    ref: null
  - id: "D4-4"
    question: "The rehearsal sizing of the plan: keep PLAN_DURATION at 7 days (604800) and REBALANCER_MIN_STEP_USDC at 100 USDC (100000000), or shorten and lower them. With NAV at most 1,000 USDC (FUND_TVL_CAP) most steps skip as BelowMinStep, so the plan would show no trade, and P6.76 runs 7 to 14 days until the plan converges or expires"
    status: decided
    answer: "Shorten and lower them, as rehearsal sizing for a NAV of at most 1,000 USDC: PLAN_DURATION=86400 (1 day, the contract minimum) so the keeper-step rows finish inside the QA window, and REBALANCER_MIN_STEP_USDC=1000000 (1 USDC) so steps trade at this NAV. deploy-4.env carries both. A production sizing is a separate decision."
    decidedOn: 2026-11-13
    ref: "owner (coordinator) decision in the Deploy 4 tooling session, 2026-11-13"
  - id: "D4-6"
    question: "Must Deploy 4 wait for a merge to dev: the frozen counts on a reviewed commit merged to dev (runbook 3, step 5) and the one-vault branch merged first"
    status: decided
    answer: "No. Deploy 4 runs from the branch deploy4/tooling (on docs/single-vault-rebalancer-proposal). The deploy checkout is the release candidate tag release/v0.7.0-onevault-rc.N-rehearsal. The frozen counts for that sha are committed on the same branch in a later commit, and the counts checkout is that later commit. The {gate} list placeholder expands to nothing for this run: --counts-require-origin-dev would refuse a counts commit that is not on origin/dev. The gate still proves the counts file is committed and clean in the counts checkout. The branch merges to dev only after Deploy 4 succeeds. This is a deviation from runbook 3 step 5 for this rehearsal only, never for a production run. It follows the Deploy 3 precedent (releases/v0.5.0.yaml, rc-tag-and-branch-counts)."
    decidedOn: 2026-11-13
    ref: "owner (coordinator) decision in the Deploy 4 tooling session, 2026-11-13"
  - id: "D4-7"
    question: "Does the fund deploy paused, with a Safe unpause round before the first request, as the vaults do (deployPaused, stage 13)"
    status: decided
    answer: "No. The fund deploys open: RobotMoneyFund.initialize leaves depositsPaused false and DeployFund.s.sol does not pause it, so no row schedules or executes an unpause round for the fund before the QA rounds. The only unpause in this runbook is the pause drill's own restore (P9.61, P9.62), which undoes the drill's pause through the Safe and the timelock. Flows are bounded by FUND_TVL_CAP (1,000 USDC) and run through the queue only."
    decidedOn: 2026-11-13
    ref: "owner (coordinator) decision in the Deploy 4 tooling session, 2026-11-13"
  - id: "D4-8"
    question: "The keeper key of the fund system (KEEPER_ROLE on the queue and the rebalancer)"
    status: decided
    answer: "0x75E3f84949d5e0aB621EEb06537A1a944274768B, the owner's new keeper key (public address only; its keystore stays beside the others under the same passphrase scheme). deploy-4.env carries it."
    decidedOn: 2026-11-13
    ref: "owner (coordinator) decision in the Deploy 4 tooling session, 2026-11-13"
  - id: "D4-5"
    question: "The fund register's receipt submitter: a Safe, as runbook 4.10 requires (then a tool must send the Safe's recordReceipt transaction), or a key for this rehearsal only"
    status: decided
    answer: "A Safe, as runbook 4.10 requires. publish-contracts record-receipt --system fund records the receipt directly on the fund register (fund-receipt.json) through the submitter Safe: threshold owners sign, the deployer only pays gas, every check of the vaults path runs first (P6.72). The payload is schema 1.1, per-asset weights, built and checked by scripts/runbook/fund-receipt-payload.ts and scripts/prototype/check-receipt-assets.ts (P6.70, P6.71)."
    decidedOn: 2026-11-13
    ref: "owner (coordinator) instruction in the Deploy 4 tooling session, 2026-11-13: close every runbook tool gap"
recovery: |
  Contracts are immutable; there is no in-place rollback (runbook 4.6). Before P1.61-fund-publish nothing was sent: fix on the branch and restart at
  P0.60. A failed P1.61 reruns the same command, and the runner adds --resume. After the handover the emergency key pauses deposits on the fund and pauses
  the queue (P9.60); redeem in kind, cancel, the in-kind exit and withdrawals stay open, so every holder can leave. A failed fund verify fails the run and
  pauses nothing by itself: pause by hand with the emergency key. A scheduled timelock operation that must not run is cancelled by the Safe before it is
  ready (safe/cli.ts propose --action cancel --id). A schedule step that failed after its Safe transaction landed reruns into "operation already exists":
  read the operation on the timelock and continue at the execute step. The fund holds at most FUND_TVL_CAP (1,000 USDC).
scope:
  - {pr: 2000, what: "reproducible contract build across checkout paths, pinned forge and library code gates: the fund verifier compares every fund-system proxy's runtime code with this build", check: "P2.60-fund-verify"}
steps:
  - id: "P0.01-runbook-valid"
    standing: ["4.1"]
    description: "The release runbook is the template plus additions, the sheet and target make sense, and a production run has no open owner decision"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.02-run-dirs"
    standing: ["4.3"]
    description: "The run directory layout every later receipt and state file lives in; the run directory is outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.04-checkout"
    standing: ["4.1"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.05-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.06-forge-build"
    standing: ["4.1"]
    description: "forge build succeeds at the DEPLOY_SHA"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
    maxMinutes: 30
  - id: "P0.08-dependency-manifest"
    standing: ["4.2"]
    description: "The third-party dependency manifest for this release is recorded at the deploy block; run from the dev checkout, because it writes a file under deployments/ that would dirty the DEPLOY_SHA checkout"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "{countsCheckout}/scripts/release/preflight-guards.sh", "--dependency-manifest", "8453:{release}"]
    env:
      DEPENDENCY_MANIFEST_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{countsCheckout}/deployments/dependency-manifests/8453", "pattern": "{release}.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
    onlyFor: ["rehearsal", "production"]
  - id: "P0.12-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453), a pinned lazy fork of Base, runs on the stage host (never on this machine): the host checkout is brought to the run's sha, port 8545 is checked free, the fork starts and is ready, an ssh tunnel brings it to {tunnelPort} here (reopened on every invocation), and its anvil.json is copied back"
    host: "control"
    phase: 0
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
  - id: "P0.13-twin-keys"
    standing: ["4.3"]
    description: "Throwaway keystores for the deployer, pauser, emergency key and three Safe owners; the passphrase stays in a 0600 file; the public addresses become the sheet fragment"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n' > {runDir}/passphrase"]
      - ["bash", "-c", "bun publish-contracts/src/rehearsal/cli.ts keys --dir {runDir}/keys --password-file {runDir}/passphrase --chain-id 918453 > {runDir}/fragment.env"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "fragment.env", "required": true}
    irreversible: false
    onlyFor: "twin"
    gateAbsent: "{runDir}/fragment.env"
  - id: "P0.15-sheet-merge"
    standing: ["4.3"]
    description: "The run sheet is the environment's committed sheet with the fragment's lines, through the real sheet parser"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/ci/merge-sheet.ts", "--template", "{sheetTemplate}", "--fragment", "{runDir}/fragment.env", "--out", "{sheet}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "sheet.env", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P0.17-check-sheet"
    standing: ["4.2", "4.10"]
    description: "The sheet agrees with the environment: chain id, deployment kind, timelock delay band, 1 USDC seed, caps, and as many owner signer specs as Safe owners"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.07-preflight-guards"
    standing: ["4.2"]
    description: "EIP-170 size gate and the zero timelock delay guard pass on the exact build artifacts"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "scripts/release/preflight-guards.sh"]
    env:
      TIMELOCK_MIN_DELAY: "{sheet:TIMELOCK_MIN_DELAY}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.18-twin-fund"
    standing: ["9"]
    description: "Gas for every throwaway key and the real FiatToken balance of the deployer, on the Twin fork only"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-gas", "--rpc", "{rpcUrl}", "--sheet", "{sheet}"]
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-usdc", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--usdc-units", "2000000000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P0.19-funding"
    standing: ["4.2"]
    description: "The deployer holds 7 USDC. The most a run needs at once is 5.32 (the contract ceilings: rmRWA maxSlippageBps at most 500 on the buy and on the sale, its exit fee at most 100 bps, so a round trip through rmRWA loses at most 11 percent; rmUSDC and rmRWA redeem to USDC, rmPROTO redeemInKind pays in tokens). It is the 1 USDC seed, plus what the round before the rebalance does not return as USDC (1.1 in rmPROTO tokens: 1 redeemed in kind, and the router's rmPROTO leg of 2 USDC at the 500 bps of the vector in effect, on a new deployment the sheet's default; at most 0.11 lost on the 1 USDC rmRWA round trip; that vector sends nothing to rmRWA), plus either the 3 vault deposits held at once after it (5.21) or, once they are redeemed (another 1 in rmPROTO tokens, at most 0.11 on rmRWA), the 2 USDC router deposit (5.32). The receipt's vector only splits that last router deposit, so it does not move the floor. The 1.68 spare is margin. A run without the pre-rebalance round (production) needs 4.11. The ETH balance is advisory: below 0.005 ETH the step prints a warning and the run goes on (the gas the run burns is about 0.003 ETH; every send goes through cast at the network fee). The upgrade flow checks its own funding at P8.25"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'cast balance "{sheet:ADMIN_ADDRESS}" > {runDir}/state/deployer-eth']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge {state:deployer-eth} 5000000000000000 || echo 'advisory: the deployer holds less than 0.005 ETH, the gas a full run burns at a high network fee; the run goes on' >&2"]
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:deployer-usdc}", "7000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "new"
    onlyFor: ["rehearsal", "production"]
    writes: ["deployer-eth", "deployer-usdc"]
  - id: "P0.20-plan"
    standing: ["3", "4.3"]
    description: "The plan job: sheet, floors, chain id, release tag of the sheet's kind, committed frozen counts, green CI and core's config-check, with no signer"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "--stage", "plan", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{evidenceDir}", "{gate}"]
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P0.21-dry-run"
    standing: ["4.3"]
    description: "Every deployer stage simulates in order on a blank local anvil and sends nothing"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "--dry-run", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--signer", "address:{sheet:ADMIN_ADDRESS}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{runDir}/evidence-dry", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{runDir}/manifests-dry"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    maxMinutes: 60

  # ── Deploy 4, the fund flow (added: v0.7.0-onevault), phase 0: the gate of the fund system run. The template steps above are the vaults system's (flows new and
  # upgrade); this release runs none of them. Every step below is `flow: fund` and runs on the Twin and on the 8453 rehearsal only. ──
  - id: "P0.60-fund-runbook-valid"
    standing: ["4.1", "4.10"]
    description: "The release runbook is the template plus additions, it runs the fund flow on this target, and a production run of it is refused (no fund step runs in production, decisions open, productionReady false)"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P0.61-fund-run-dirs"
    standing: ["4.3"]
