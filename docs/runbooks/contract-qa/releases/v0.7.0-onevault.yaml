  - id: "P0.65-fund-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453) of the fund run, started as P0.12 starts it for the vaults flows: a pinned lazy fork of Base on the stage host (never on this machine), the host checkout at the run's sha, port 8545 checked free, an ssh tunnel to {tunnelPort} reopened on every invocation, anvil.json copied back. It starts after the sheet and build checks, right before P0.71, because the fund's feeds are fresh on it only for a while: a pinned fork serves each Chainlink feed's round at the pin forever, while its clock moves on (anvil stamps a new block with the pin's time plus the wall time since it started, and a warp adds to it), so ETH / USD (maxFeedAge 1,500 s) goes stale 300 to 1,500 s of chain time after the pin and cbBTC / USD and USDC / USD (86,700 s) within a day (README, The fund flow). To restart it at a fresh pin, stop it on the host (twin-fork.ts stop, as P10.63 does) and invoke the run again: this step starts a new fork and P0.71 funds it again"
    host: "control"
    phase: 0
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
    added: "v0.7.0-onevault"
  - id: "P0.71-fund-twin-fund"
    standing: ["9"]
    description: "On the Twin fork only: gas for every throwaway key and the keeper, and the real FiatToken balance of the deployer. Then the fund's real feeds are read on the fork (publish-contracts/src/ci/twin-feeds.ts check, read only): each must stay fresh for 600 s more, the time the publish needs to reach its fund stage, whose addAsset refuses a stale feed. A pinned fork serves no newer round, so a feed too close to its maximum age fails this step: stop the fork on the host and invoke the run again (P0.65 starts a new fork at a fresh pin, this step funds it again). No feed is written and no mock is etched"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-gas", "--rpc", "{rpcUrl}", "--sheet", "{sheet}"]
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-usdc", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--usdc-units", "2000000000"]
      - ["bash", "-c", 'cast rpc anvil_setBalance "{sheet:KEEPER_ADDRESS}" 0x8ac7230489e80000 > /dev/null && bun scripts/runbook/qa-assert.ts ge "$(cast balance "{sheet:KEEPER_ADDRESS}")" 1000000000000000000']
      - ["bun", "publish-contracts/src/ci/twin-feeds.ts", "check", "--rpc", "{rpcUrl}", "--min-margin", "600", "--out", "{runDir}/twin/feeds-before-publish.json"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "feeds-before-publish.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: "twin"
    added: "v0.7.0-onevault"
  - id: "P0.72-fund-funding"
    standing: ["4.2", "4.10"]
    description: "The deployer holds 6 USDC. The most the fund run holds at once is 5: the 1 USDC seed the publish mints to the fund, the three 1 USDC deposit requests of P6.60 and the 1 USDC request P6.66 cancels and withdraws again; the redeem of P6.65 returns USDC, the in-kind exits pay in tokens. 1 USDC is margin. The ETH balances of the deployer, the keeper (settle twice, a step every effective step interval of a plan of up to PLAN_DURATION plus REBALANCER_MAX_OVERRUN) and the emergency key (two pauses) are advisory: below 0.005 ETH the step prints a warning and the run goes on"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'for a in "{sheet:ADMIN_ADDRESS}" "{sheet:KEEPER_ADDRESS}" "{sheet:EMERGENCY_ADDRESS}"; do b=$(cast balance "$a"); echo "$a $b"; bun scripts/runbook/qa-assert.ts ge "$b" 5000000000000000 || echo "advisory: $a holds less than 0.005 ETH; the run goes on" >&2; done']
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/fund-deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:fund-deployer-usdc}", "6000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: "rehearsal"
    writes: ["fund-deployer-usdc"]
    added: "v0.7.0-onevault"
