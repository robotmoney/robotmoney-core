      - ["bash", "-c", 'cast call "{m:queue.queue}" "quoteRedeem(uint256)((uint256,uint256,uint256,uint64,uint64))" "{state:fund-shares-b}" | tr -d "()" | cut -d, -f1 | cut -d" " -f1 > {runDir}/state/fund-exit-bound']
