  - id: "P5.04-receipt-read-back"
    standing: ["4.9"]
    description: "The chain shows the applied vector: votedWeightsActive is true and the effective weights equal the payload's buckets (agent_tokens dropped, registry order), and the run manifest's receipt_applications are backed by their timelock batches on chain"
    host: "control"
