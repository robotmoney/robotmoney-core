  - id: "P5.21-pre-redeem-in-kind-rmproto"
    standing: ["4.4"]
    description: "Before the rebalance, the deployer's whole rmPROTO balance leaves by redeemInKind (no oracle, paid in the underlying assets); its share balance is zero afterwards"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 's=$(cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "{m:protocol-asset-vault.vault}" "redeemInKind(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    exercises: "redeem"
  - id: "P5.23-pre-redeem-rmrwa"
    standing: ["4.4"]
    description: "Before the rebalance, the deployer's whole rmRWA balance redeems to USDC; its share balance is zero afterwards"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 's=$(cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "{m:rwa-basket-vault.vault}" "redeem(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
