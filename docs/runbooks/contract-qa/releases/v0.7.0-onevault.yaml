    exercises: "redeem"
  - id: "P6.24-redeem-retired-vault"
    standing: ["4.4", "4.14"]
    description: "Every vault the run retired (the run manifest publish-run.json, vault_retirements, ADR-0017; the step fails when the manifest is missing) is withdraw-only: retired() is true, maxDeposit is 0, and the admin's shares in it, if any, redeem to USDC. A run that retired no vault passes with nothing to check"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'test -f "{evidenceDir}/publish-run.json" && for v in $(jq -r ".vault_retirements // [] | .[].vault" "{evidenceDir}/publish-run.json"); do test "$(cast call "$v" "retired()(bool)")" = true && test "$(cast call "$v" "maxDeposit(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; b=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "redeem(uint256,address,address)" "$b" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 "$@" || exit 1; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; fi; done', "_", "{cast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.30-router-deposit"
    standing: ["4.4"]
    description: "2 USDC straight into the router at 8,400,000 gas (the floor is 400,000 plus 2,550,000 per leg): one RouterDeposit event per leg with a non-zero effective weight and none for a zero-weight leg, and the deployer holds shares in every non-zero leg afterwards"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" | tail -n 1 | grep -oE "[0-9]+" | grep -vxc 0 > {runDir}/state/router-legs || true']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:router.router}", "2000000", "{cast}"]
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{m:router.router}" "deposit(uint256,uint256[])" 2000000 "[]" --gas-limit 8400000 {castFlagsInline} | tee {runDir}/state/router-deposit.json; test ${PIPESTATUS[0]} = 0']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/router-deposit.json']
      - ["bash", "-c", 'w=$(cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])"); vs=$(echo "$w" | sed -n 1p | grep -oE "0x[0-9a-fA-F]{40}"); bs=$(echo "$w" | sed -n 2p | grep -oE "[0-9]+"); i=1; for v in $vs; do b=$(echo "$bs" | sed -n "$i"p); i=$((i+1)); s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ] && [ "$s" = 0 ]; then echo "no shares in $v (weight $b)" >&2; exit 1; fi; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["router-legs", "router-deposit.json"]
    exercises: "router-deposit"
  - id: "P6.32-router-split-changed"
    standing: ["4.4", "4.9"]
    description: "The rebalance changed the router split: the post-rebalance router deposit's RouterDeposit legs are exactly the non-zero effective weights now (the applied receipt's vector, P5.04), each minting shares, and they differ in vault or weight from the legs of the pre-rebalance router deposit (P5.30, the vector in effect before it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" > {runDir}/state/post-router-weights']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts router-legs {runDir}/state/router-deposit.json {runDir}/state/post-router-weights "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts legs-differ {runDir}/state/pre-router-deposit.json {runDir}/state/router-deposit.json "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["post-router-weights"]
  - id: "P6.31-sweep-positions"
    standing: ["4.4"]
    description: "The router deposit is redeemed in full: rmUSDC by redeem, rmPROTO by redeemInKind, rmRWA by redeem, so the deployer holds no shares anywhere (every later verify requires it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeem"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "$fn(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"

  # ── Deploy 4, the fund flow, phase 6: the timed flows of the queue, the receipt applied as a plan, and the keeper's step rounds. Requests escrow in the queue;
  # the keeper settles an epoch from its end plus FLOW_SETTLE_WINDOW (at most 7 h after a request at the sheet's 6 h epoch and 1 h window); deposit shares are
  # held FLOW_MIN_HOLD (24 h) before the claim delivers them. A redemption request below FLOW_MIN_REQUEST_USDC reverts unless it is the owner's whole balance,
  # so every exit here takes one whole claim's shares: P6.60 requests three deposits (A for P6.62 and P6.63, B for P6.67, C for P6.68). ──
  - id: "P6.59-fund-twin-feeds-stale"
    standing: ["9", "4.4"]
    description: "On the Twin only: the fund's own refusal on the fork's frozen feeds, recorded. By here the Twin clock is past the ETH / USD round's stale point (the publish plus the 900 s timelock waits; else the step moves the clock forward to one second past it, never back). publish-contracts/src/ci/twin-feeds.ts probe reads, at an explicit block, totalAssets() of the fund (FeedUnhealthy(2, Stale), WETH is asset 2) and quoteDeposit of the queue (SettleBlocked(Feed, 2, Stale)) and fails on any other answer; it writes no feed and etches no mock. The queue's rows after it need fresh feeds: P6.60's quote and every settle (at least an hour after its request, past the 1,500 s ETH age on any pinned fork) refuse with this same check on the Twin, so the Twin run stops at P6.60 and those rows are proven only on the 8453 rehearsal, which reads live feeds (README, The fund flow)"
    host: "control"
    phase: 6
    cmds:
      - ["bun", "publish-contracts/src/ci/twin-feeds.ts", "probe", "--rpc", "{rpcUrl}", "--fund", "{m:fund.fund}", "--queue", "{m:queue.queue}", "--usdc", "{sheet:FLOW_MIN_REQUEST_USDC}", "--out", "{runDir}/twin/feed-probe.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "feed-probe.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: "twin"
    added: "v0.7.0-onevault"
  - id: "P6.60-fund-request-deposits"
    standing: ["4.4"]
    description: "The deployer approves the queue for 3 USDC and requests three deposits of 1 USDC (FLOW_MIN_REQUEST_USDC), each bounded by quoteDeposit's boundPrice, in one step: each request is the newest id, owned by the deployer, pending; the deployer's USDC fell by exactly 3 USDC (the queue escrows it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:queue.queue}" "quoteDeposit(uint256)((uint256,uint256,uint256,uint64,uint64))" 1000000 | tr -d "()" | cut -d, -f1 | cut -d" " -f1 > {runDir}/state/fund-deposit-bound && cat {runDir}/state/fund-deposit-bound']
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/fund-usdc-before-requests']
      - ["bash", "scripts/runbook/cast-send.sh", "{usdc}", "approve(address,uint256)", "{m:queue.queue}", "3000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,uint256,address)", "1000000", "{state:fund-deposit-bound}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", 'cast call "{m:queue.queue}" "requestCount()(uint256)" | cut -d" " -f1 > {runDir}/state/fund-request-a']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,uint256,address)", "1000000", "{state:fund-deposit-bound}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", 'cast call "{m:queue.queue}" "requestCount()(uint256)" | cut -d" " -f1 > {runDir}/state/fund-request-b']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,uint256,address)", "1000000", "{state:fund-deposit-bound}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", 'cast call "{m:queue.queue}" "requestCount()(uint256)" | cut -d" " -f1 > {runDir}/state/fund-request-c']
      - ["bash", "-c", 'for id in {state:fund-request-a} {state:fund-request-b} {state:fund-request-c}; do r=$(cast call "{m:queue.queue}" "getRequest(uint256)((address,uint8,uint64,uint256,uint256,uint256,bool))" "$id"); bun scripts/runbook/qa-assert.ts eq "$(echo "$r" | tr -d "()" | cut -d, -f1)" "{sheet:ADMIN_ADDRESS}" || exit 1; test "$(cast call "{m:queue.queue}" "requestStatus(uint256)(uint8)" "$id")" = 1 || exit 1; done']
      - ["bash", "-c", 'cast call "{m:queue.queue}" "getRequest(uint256)((address,uint8,uint64,uint256,uint256,uint256,bool))" "{state:fund-request-c}" | tr -d "()" | cut -d, -f3 | tr -d " " | sed "s/[[].*//" > {runDir}/state/fund-request-epoch']
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/fund-usdc-after-requests && bun scripts/runbook/qa-assert.ts eq "$(bun scripts/runbook/qa-assert.ts sub {state:fund-usdc-before-requests} {state:fund-usdc-after-requests})" 3000000']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    writes: ["fund-deposit-bound", "fund-usdc-before-requests", "fund-request-a", "fund-request-b", "fund-request-c", "fund-request-epoch", "fund-usdc-after-requests"]
    added: "v0.7.0-onevault"
  - id: "P6.61-fund-settle-deposits"
    standing: ["4.4"]
    description: "The keeper settles the deposits: the step waits on chain time until settleableAt(the requests' epoch), the epoch end plus FLOW_SETTLE_WINDOW (at most 7 h), reads checkSettle() Ok for the keeper (else it prints the failing check and stops), and the keeper sends settle; requests A, B and C read Closed with nothing pending"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'at=$(cast call "{m:queue.queue}" "settleableAt(uint64)(uint64)" "{state:fund-request-epoch}" | cut -d" " -f1); echo "settleable at $at"; until [ "$(cast block latest -f timestamp)" -ge "$at" ]; do sleep 60; done']
      - ["bash", "-c", 'c=$(cast call --from "{sheet:KEEPER_ADDRESS}" "{m:queue.queue}" "checkSettle()(uint8,uint256)"); echo "$c"; test "$(echo "$c" | head -n 1 | cut -d" " -f1)" = 0']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "settle(uint256,uint256)", "50", "{sheet:FUND_PER_DEPOSIT_CAP}", "{keepercast}"]
      - ["bash", "-c", 'for id in {state:fund-request-a} {state:fund-request-b} {state:fund-request-c}; do test "$(cast call "{m:queue.queue}" "requestStatus(uint256)(uint8)" "$id")" = 3 && test "$(cast call "{m:queue.queue}" "pendingDepositRequest(uint256,address)(uint256)" "$id" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || { echo "request $id is not settled" >&2; exit 1; }; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 480
