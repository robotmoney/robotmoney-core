      - ["bash", "-c", 'k=$(sed -n "s/^ADMIN_ADDRESS=//p" {runDir}/keeper-fragment.env) && test -n "$k" && { cat {runDir}/fragment.env; echo "EXPECTED_CHAIN_ID=918453"; echo "KEEPER_ADDRESS=$k"; } > {runDir}/fragment-fund.env']
