  - id: "P6.69-fund-in-kind-claims"
    standing: ["4.4"]
    description: "What the two in-kind exits left owed is pulled: for every asset of the fund, a deferred amount (a leg that could not pay) is claimed with claimDeferred and a lending position claim with claimPosition, each to the deployer, and each reads zero afterwards. An exit that paid everything leaves nothing, and the step passes with nothing to claim"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'n=$(cast call "{m:fund.fund}" "assetCount()(uint256)" | cut -d" " -f1); for i in $(seq 0 $((n - 1))); do d=$(cast call "{m:fund.fund}" "deferredOf(uint256,address)(uint256)" "$i" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$d" != 0 ]; then bash scripts/runbook/cast-send.sh "{m:fund.fund}" "claimDeferred(uint256,address)" "$i" "{sheet:ADMIN_ADDRESS}" "$@" || exit 1; test "$(cast call "{m:fund.fund}" "deferredOf(uint256,address)(uint256)" "$i" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; fi; u=$(cast call "{m:fund.fund}" "positionClaimOf(uint256,address)(uint256,uint256)" "$i" "{sheet:ADMIN_ADDRESS}" | head -n 1 | cut -d" " -f1); if [ "$u" != 0 ]; then bash scripts/runbook/cast-send.sh "{m:fund.fund}" "claimPosition(uint256,address)" "$i" "{sheet:ADMIN_ADDRESS}" "$@" || exit 1; test "$(cast call "{m:fund.fund}" "positionClaimOf(uint256,address)(uint256,uint256)" "$i" "{sheet:ADMIN_ADDRESS}" | head -n 1 | cut -d" " -f1)" = 0 || exit 1; fi; done', "_", "{cast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P6.70-fund-receipt-payload"
    standing: ["4.10"]
    description: "The fund receipt payload, schema 1.1 (scripts/runbook/fund-receipt-payload.ts): the real production envelope with the per-asset assets list of the deployed fund, read on chain (assetConfigs() of the fund in fund.json, each asset matched to its canonical asset map row by token or by the manifest's adapter), weighted by {fundTargetBps} (fund index order, summing to 10000), and the bucket weights the sums of those assets. The tool checks the payload with check-receipt-assets and the shared digest rule before it writes {receiptFile}, and writes this deployment's asset map to {runDir}/fund-asset-map.json. It runs on the rehearsal too: no canonical route serves a schema 1.1 fund receipt, so the run builds it, and the operator serves these exact bytes at {receiptUri} before P6.72"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "bun scripts/runbook/fund-receipt-payload.ts --rpc {rpcUrl} --fund-manifest {manifestDir}/fund.json --chain {chainId} --bps \"{fundTargetBps}\" --out {receiptFile} --map-out {runDir}/fund-asset-map.json > {runDir}/fund-receipt-payload.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "fund-asset-map.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P6.71-fund-receipt-offline"
    standing: ["4.10"]
    description: "The payload passes scripts/prototype/check-receipt-assets.ts against this deployment's asset map (every schema 1.1 rule: field order, the bucket audit, every active asset listed in canonical order, the lending caps), and the per-asset vector it derives is the one the Safe applies: one on-chain id per fund asset (none unresolved, as many as the fund has) and the bps of {fundTargetBps}. The receipt id and the payload digest come from the one shared definition, never a plain keccak256 of the file"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "bun scripts/prototype/check-receipt-assets.ts {receiptFile} --map {runDir}/fund-asset-map.json --chain {chainId} > {runDir}/fund-receipt-vector.json"]
      - ["bash", "-c", 'n=$(cast call "{m:fund.fund}" "assetCount()(uint256)" | cut -d" " -f1); test "$(jq -r ".asset_ids | length" {runDir}/fund-receipt-vector.json)" = "$n" && jq -e "all(.asset_ids[]; . != null)" {runDir}/fund-receipt-vector.json > /dev/null && bun scripts/runbook/qa-assert.ts eq "$(jq -r ".bps | join(\",\")" {runDir}/fund-receipt-vector.json)" "$(echo "{fundTargetBps}" | tr -d "[] ")"']
      - ["bash", "-c", 'echo "[$(jq -r ".asset_ids | join(\",\")" {runDir}/fund-receipt-vector.json)]" > {runDir}/state/fund-target-assets && echo "[$(jq -r ".bps | join(\",\")" {runDir}/fund-receipt-vector.json)]" > {runDir}/state/fund-target-bps']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-id {receiptFile} > {runDir}/state/fund-receipt-id"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-digest {receiptFile} > {runDir}/state/fund-receipt-digest"]
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts eq "$(jq -r .receipt_id {runDir}/fund-receipt-payload.json)" "{state:fund-receipt-id}" && bun scripts/runbook/qa-assert.ts eq "$(jq -r .payload_digest {runDir}/fund-receipt-payload.json)" "{state:fund-receipt-digest}"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    writes: ["fund-target-assets", "fund-target-bps", "fund-receipt-id", "fund-receipt-digest"]
    added: "v0.7.0-onevault"
  - id: "P6.72-fund-record-receipt"
    standing: ["4.10"]
    description: "The submitter Safe records the receipt directly on the fund register with publish-contracts record-receipt --system fund (recordReceipt(receiptId, payloadDigest, payloadUri) on fund-receipt.json's consensus_receipt, never the vaults register): the payload bytes, the digest and the id are checked against each other (schema 1.1) and the submitter Safe and its live RECEIPT_SUBMITTER_ROLE on the fund register are read before any signer exists; the two owners sign ({ownerSigner}, {ownerSigner2}; threshold 2), the deployer pays. Then the register reads it recorded, unreleased, with the run's digest and the submitter Safe as its submitter. A receipt id is recorded once, so a wrong digest cannot be corrected; a rerun of the same receipt sends nothing"
    host: "control"
    phase: 6
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "record-receipt", "{common}", "--system", "fund", "--owner-signer", "{ownerSigner}", "--owner-signer", "{ownerSigner2}", "{gate}", "--receipt-id", "{state:fund-receipt-id}", "--payload-digest", "{state:fund-receipt-digest}", "--payload", "{receiptFile}", "--payload-uri", "{receiptUri}", "--submitter", "{state:fund-submitter-safe}"]
      - ["bash", "-c", 'test "$(cast call "{m:fund-receipt.consensus_receipt}" "isRecorded(bytes32)(bool)" "{state:fund-receipt-id}")" = true']
      - ["bash", "-c", 'r=$(cast call "{m:fund-receipt.consensus_receipt}" "getReceiptById(bytes32)((bytes32,bytes32,string,address,uint64,uint64,bool))" "{state:fund-receipt-id}" | tr -d "()"); bun scripts/runbook/qa-assert.ts eq "$(echo "$r" | cut -d, -f2 | tr -d " ")" "{state:fund-receipt-digest}" && bun scripts/runbook/qa-assert.ts eq "$(echo "$r" | rev | cut -d, -f4 | rev | tr -d " ")" "{state:fund-submitter-safe}" && test "$(echo "$r" | rev | cut -d, -f1 | rev | tr -d " ")" = false']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: true
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P3.62-fund-register-submitter-execute", "hours": 0}
    added: "v0.7.0-onevault"
  - id: "P6.73-fund-apply-receipt-schedule"
    standing: ["4.9", "4.10"]
    description: "The governing Safe schedules ONE call on the fund-system timelock, RebalanceGovernance.applyReceipt(receiptId, payloadDigest, assets, bps) (TARGET_SETTER_ROLE is the timelock's): the receipt reads recorded and unreleased, the vector names as many assets as the fund has and its bps sum to 10000. The vector is the one check-receipt-assets derived from the recorded payload in P6.71 (fund-target-assets, fund-target-bps), so the applied vector is the receipt's"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'test "$(cast call "{m:fund-receipt.consensus_receipt}" "isRecorded(bytes32)(bool)" "{state:fund-receipt-id}")" = true && test "$(cast call "{m:fund-receipt.consensus_receipt}" "isReleased(bytes32)(bool)" "{state:fund-receipt-id}")" = false']
      - ["bash", "-c", 'n=$(cast call "{m:fund.fund}" "assetCount()(uint256)" | cut -d" " -f1); test "$(echo "{state:fund-target-assets}" | grep -oE "0x[0-9a-fA-F]{40}" | wc -l)" = "$n" && test "$(echo "{state:fund-target-bps}" | tr -d "[] " | tr , "\n" | grep -c .)" = "$n" && bun scripts/runbook/qa-assert.ts eq "$(echo "{state:fund-target-bps}" | tr -d "[] " | awk -F, ''{ s = 0; for (i = 1; i <= NF; i++) s += $i; print s }'')" 10000']
      - ["bash", "-c", 'cast keccak "robotmoney.deploy4.apply-receipt.{runDir}" > {runDir}/state/salt-apply-receipt && echo "{m:fund-governance.governance}" > {runDir}/state/target-apply-receipt && cast calldata "applyReceipt(bytes32,bytes32,address[],uint256[])" "{state:fund-receipt-id}" "{state:fund-receipt-digest}" "{state:fund-target-assets}" "{state:fund-target-bps}" > {runDir}/state/data-apply-receipt']
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "schedule", "--target", "{state:target-apply-receipt}", "--data", "{state:data-apply-receipt}", "--salt", "{state:salt-apply-receipt}", "--out", "{runDir}/bundles/apply-receipt-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/apply-receipt-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/apply-receipt-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/apply-receipt-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "apply-receipt-schedule.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    writes: ["salt-apply-receipt", "target-apply-receipt", "data-apply-receipt"]
    added: "v0.7.0-onevault"
  - id: "P6.74-fund-apply-receipt-execute"
    standing: ["4.9", "4.10"]
    description: "After the timelock delay the Safe executes the apply through the timelock: the operation reads done, the receipt reads released, the governance's lastAppliedRecordedAt is the receipt's recordedAt, and the fund's plan is Open and names the receipt. Applying releases the receipt for good"
    host: "control"
    phase: 6
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "execute", "--target", "{state:target-apply-receipt}", "--data", "{state:data-apply-receipt}", "--salt", "{state:salt-apply-receipt}", "--out", "{runDir}/bundles/apply-receipt-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/apply-receipt-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/apply-receipt-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/apply-receipt-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", 'id=$(cast call "{m:fund-timelock.timelock}" "hashOperation(address,uint256,bytes,bytes32,bytes32)(bytes32)" "{state:target-apply-receipt}" 0 "{state:data-apply-receipt}" "$(cast hash-zero)" "{state:salt-apply-receipt}") && test "$(cast call "{m:fund-timelock.timelock}" "isOperationDone(bytes32)(bool)" "$id")" = true']
      - ["bash", "-c", 'test "$(cast call "{m:fund-receipt.consensus_receipt}" "isReleased(bytes32)(bool)" "{state:fund-receipt-id}")" = true']
      - ["bash", "-c", 'r=$(cast call "{m:fund-receipt.consensus_receipt}" "getReceiptById(bytes32)((bytes32,bytes32,string,address,uint64,uint64,bool))" "{state:fund-receipt-id}" | tr -d "()"); bun scripts/runbook/qa-assert.ts eq "$(cast call "{m:fund-governance.governance}" "lastAppliedRecordedAt()(uint64)")" "$(echo "$r" | rev | cut -d, -f3 | rev | tr -d " " | sed "s/[[].*//")"']
      - ["bash", "-c", 'test "$(cast call "{m:fund.fund}" "planStatus()(uint8)")" = 1 && bun scripts/runbook/qa-assert.ts eq "$(cast call "{m:fund.fund}" "plan()((uint64,uint8,bytes32,uint64,uint64,uint16[],uint16[],uint16,uint256,uint256,uint256,uint256,uint32))" | tr -d "()" | cut -d, -f3 | tr -d " ")" "{state:fund-receipt-id}"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "apply-receipt-execute.json", "required": true}
    irreversible: true
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P6.73-fund-apply-receipt-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.7.0-onevault"
  - id: "P6.75-fund-step-round"
    standing: ["4.9"]
    description: "The keeper's first step() of the plan, right after the apply: it is mined, and the plan is still Open. At the rehearsal's size (NAV at most 1,000 USDC under a 100 USDC REBALANCER_MIN_STEP_USDC) it skips as BelowMinStep; the RebalanceStep or RebalanceStepSkipped event in the journaled receipt says which (decision D4-4)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:rebalancer.rebalancer}", "step()", "{keepercast}"]
      - ["bash", "-c", 'test "$(cast call "{m:fund.fund}" "planStatus()(uint8)")" = 1']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P6.76-fund-step-until-concluded"
    standing: ["4.9"]
    description: "The keeper sends step() once every effective step interval (60 s at least) until the plan concludes: planStatus reads Converged (2, at the plan's end within tolerance) or Expired (6, after its end plus REBALANCER_MAX_OVERRUN). Halted, Paused or Superseded stops the run. At the sheet's PLAN_DURATION (7 days) and REBALANCER_MAX_OVERRUN (7 days) this takes 7 to 14 days (decision D4-4); every step is a journaled send"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'while :; do st=$(cast call "{m:fund.fund}" "planStatus()(uint8)"); if [ "$st" = 2 ] || [ "$st" = 6 ]; then echo "planStatus $st"; break; fi; test "$st" = 1 || { echo "planStatus $st is neither Open nor concluded" >&2; exit 1; }; bash scripts/runbook/cast-send.sh "{m:rebalancer.rebalancer}" "step()" "$@" || exit 1; i=$(cast call "{m:rebalancer.rebalancer}" "effectiveStepInterval()(uint256)" | cut -d" " -f1); sleep $(( i < 60 ? 60 : i )); done', "_", "{keepercast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 21000
    added: "v0.7.0-onevault"

  # ── Phase 9, failure drills: the pause path and the recovery path run on real contracts. ──
  - id: "P9.01-pause-all"
    standing: ["4.5", "4.6"]
    description: "pause-all pauses deposits on all three vaults with the emergency key, reads each back and writes the rollout report; withdrawals stay open"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "pause-all", "{common}", "{emergency}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "rollout-report-{chainId}.json", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P9.03-resume-schedule"
    standing: ["4.5"]
    description: "Each paused vault comes back through a new numbered unpause round of the Safe; the four are scheduled together"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-USDC", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-PROTO", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-RWA", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-HARD", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P9.04-resume-execute"
    standing: ["4.5"]
    description: "After the delay the same four commands execute the unpauses"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-USDC", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-PROTO", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-RWA", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-HARD", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P9.03-resume-schedule", "hours": "timelockDelay"}
  - id: "P9.05-verify-after-resume"
    standing: ["4.5"]
    description: "Verify passes again with all three vaults open"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]

  # ── Deploy 4, the fund flow, phase 9: the pause drill on the fund and the queue, its restore through the Safe and the fund-system timelock, then the upgrade
  # lifecycle on one fund-system proxy and the final verify. ──
  - id: "P9.60-fund-pause"
    standing: ["4.5", "4.6"]
    description: "The emergency key pauses deposits on the fund (pauseDeposits) and pauses the queue (pause); both read back paused, and a deposit request the deployer would send now reverts in simulation (requests and settlement are paused; cancel, in-kind exit and withdrawals stay open)"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:fund.fund}", "pauseDeposits()", "{emergencycast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "pause()", "{emergencycast}"]
      - ["bash", "-c", 'test "$(cast call "{m:fund.fund}" "depositsPaused()(bool)")" = true && test "$(cast call "{m:queue.queue}" "paused()(bool)")" = true']
      - ["bash", "-c", '! cast call --from "{sheet:ADMIN_ADDRESS}" "{m:queue.queue}" "requestDeposit(uint256,uint256,address)" 1000000 1 "{sheet:ADMIN_ADDRESS}" > /dev/null 2>&1']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P9.61-fund-unpause-schedule"
    standing: ["4.5"]
    description: "The Safe restores both through the fund-system timelock (ADMIN_ROLE is the timelock's): ONE batch operation, fund.unpauseDeposits() and queue.unpause(), scheduled through the Safe tool"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "-c", 'cast keccak "robotmoney.deploy4.unpause.{runDir}" > {runDir}/state/salt-unpause && echo "{m:fund.fund},{m:queue.queue}" > {runDir}/state/target-unpause && echo "$(cast calldata "unpauseDeposits()"),$(cast calldata "unpause()")" > {runDir}/state/data-unpause']
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "scheduleBatch", "--targets", "{state:target-unpause}", "--datas", "{state:data-unpause}", "--values", "0,0", "--salt", "{state:salt-unpause}", "--out", "{runDir}/bundles/unpause-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "unpause-schedule.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    writes: ["salt-unpause", "target-unpause", "data-unpause"]
    added: "v0.7.0-onevault"
  - id: "P9.62-fund-unpause-execute"
    standing: ["4.5"]
    description: "After the timelock delay the Safe executes the batch: the operation reads done, the fund's depositsPaused and the queue's paused read false"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "executeBatch", "--targets", "{state:target-unpause}", "--datas", "{state:data-unpause}", "--values", "0,0", "--salt", "{state:salt-unpause}", "--out", "{runDir}/bundles/unpause-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", 'id=$(cast call "{m:fund-timelock.timelock}" "hashOperationBatch(address[],uint256[],bytes[],bytes32,bytes32)(bytes32)" "[{state:target-unpause}]" "[0,0]" "[{state:data-unpause}]" "$(cast hash-zero)" "{state:salt-unpause}") && test "$(cast call "{m:fund-timelock.timelock}" "isOperationDone(bytes32)(bool)" "$id")" = true']
      - ["bash", "-c", 'test "$(cast call "{m:fund.fund}" "depositsPaused()(bool)")" = false && test "$(cast call "{m:queue.queue}" "paused()(bool)")" = false']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "unpause-execute.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P9.61-fund-unpause-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.7.0-onevault"
  - id: "P9.69-fund-deploy-implementation"
    standing: ["4.12"]
    description: "The deployer deploys the rebalancer's second implementation, RebalancerV2 (contracts/test/helpers/FundUpgradeV2.sol: the Rebalancer plus upgradeMarker(), no new state), with deploy-implementation --system fund: forge pinned, the release gate on 8453, the proxy unfrozen, RebalancerV2's pinned layout extending the deployed Rebalancer's, the live implementation the build's, linked to the libraries it links; its code read back against the build. The new implementation answers upgradeMarker() 2 and is not the manifest's"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "deploy-implementation", "--system", "fund", "--proxy", "rebalancer", "--contract", "RebalancerV2", "{common}", "{gate}"]
      - ["bash", "-c", "grep '\"event\":\"deploy_implementation\"' {journal:P9.69-fund-deploy-implementation} | tail -n 1 | jq -r .implementation > {runDir}/state/rebalancer-v2-implementation"]
      - ["bash", "-c", '! bun scripts/runbook/qa-assert.ts eq "{state:rebalancer-v2-implementation}" "{m:rebalancer.rebalancer_implementation}" && test "$(cast call "{state:rebalancer-v2-implementation}" "upgradeMarker()(uint256)")" = 2']
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    writes: ["rebalancer-v2-implementation"]
    maxMinutes: 60
    added: "v0.7.0-onevault"
  - id: "P9.70-fund-upgrade-schedule"
    standing: ["4.12"]
    description: "The upgrade lifecycle on the rebalancer proxy: the ERC-1967 slot reads the manifest's implementation, upgradesFrozen is false, upgradeTimelock is the fund-system timelock and the proxy answers no upgradeMarker(); the rebalancer's fund and step parameters are recorded; the Safe schedules ONE call, upgradeToAndCall(RebalancerV2 of P9.69, empty)"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts eq "$(cast implementation "{m:rebalancer.rebalancer}")" "{m:rebalancer.rebalancer_implementation}" && test "$(cast call "{m:rebalancer.rebalancer}" "upgradesFrozen()(bool)")" = false && bun scripts/runbook/qa-assert.ts eq "$(cast call "{m:rebalancer.rebalancer}" "upgradeTimelock()(address)")" "{m:fund-timelock.timelock}" && ! cast call "{m:rebalancer.rebalancer}" "upgradeMarker()(uint256)" > /dev/null 2>&1']
      - ["bash", "-c", 'echo "$(cast call "{m:rebalancer.rebalancer}" "fund()(address)")-$(cast call "{m:rebalancer.rebalancer}" "stepParams()")" > {runDir}/state/rebalancer-state-before']
      - ["bash", "-c", 'cast keccak "robotmoney.deploy4.upgrade-rebalancer.{runDir}" > {runDir}/state/salt-upgrade-rebalancer && echo "{m:rebalancer.rebalancer}" > {runDir}/state/target-upgrade-rebalancer && cast calldata "upgradeToAndCall(address,bytes)" "{state:rebalancer-v2-implementation}" 0x > {runDir}/state/data-upgrade-rebalancer']
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "schedule", "--target", "{state:target-upgrade-rebalancer}", "--data", "{state:data-upgrade-rebalancer}", "--salt", "{state:salt-upgrade-rebalancer}", "--out", "{runDir}/bundles/upgrade-rebalancer-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/upgrade-rebalancer-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/upgrade-rebalancer-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/upgrade-rebalancer-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "upgrade-rebalancer-schedule.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    writes: ["rebalancer-state-before", "salt-upgrade-rebalancer", "target-upgrade-rebalancer", "data-upgrade-rebalancer"]
    added: "v0.7.0-onevault"
  - id: "P9.71-fund-upgrade-execute"
    standing: ["4.12"]
    description: "After the timelock delay the Safe executes the upgrade through the timelock: the operation reads done, the implementation slot reads RebalancerV2 (not the manifest's), the proxy answers upgradeMarker() 2 (the code changed) with its fund and step parameters unchanged, still unfrozen and still naming the fund-system timelock. Then the Safe schedules ONE call back, upgradeToAndCall(the manifest's implementation, empty), so the release build runs again before the final verify"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "execute", "--target", "{state:target-upgrade-rebalancer}", "--data", "{state:data-upgrade-rebalancer}", "--salt", "{state:salt-upgrade-rebalancer}", "--out", "{runDir}/bundles/upgrade-rebalancer-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/upgrade-rebalancer-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/upgrade-rebalancer-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/upgrade-rebalancer-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", 'id=$(cast call "{m:fund-timelock.timelock}" "hashOperation(address,uint256,bytes,bytes32,bytes32)(bytes32)" "{state:target-upgrade-rebalancer}" 0 "{state:data-upgrade-rebalancer}" "$(cast hash-zero)" "{state:salt-upgrade-rebalancer}") && test "$(cast call "{m:fund-timelock.timelock}" "isOperationDone(bytes32)(bool)" "$id")" = true']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts eq "$(cast implementation "{m:rebalancer.rebalancer}")" "{state:rebalancer-v2-implementation}" && ! bun scripts/runbook/qa-assert.ts eq "$(cast implementation "{m:rebalancer.rebalancer}")" "{m:rebalancer.rebalancer_implementation}" && test "$(cast call "{m:rebalancer.rebalancer}" "upgradeMarker()(uint256)")" = 2 && test "$(cast call "{m:rebalancer.rebalancer}" "fund()(address)")-$(cast call "{m:rebalancer.rebalancer}" "stepParams()")" = "{state:rebalancer-state-before}" && test "$(cast call "{m:rebalancer.rebalancer}" "upgradesFrozen()(bool)")" = false && bun scripts/runbook/qa-assert.ts eq "$(cast call "{m:rebalancer.rebalancer}" "upgradeTimelock()(address)")" "{m:fund-timelock.timelock}"']
      - ["bash", "-c", 'cast keccak "robotmoney.deploy4.restore-rebalancer.{runDir}" > {runDir}/state/salt-restore-rebalancer && cast calldata "upgradeToAndCall(address,bytes)" "{m:rebalancer.rebalancer_implementation}" 0x > {runDir}/state/data-restore-rebalancer']
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "schedule", "--target", "{state:target-upgrade-rebalancer}", "--data", "{state:data-restore-rebalancer}", "--salt", "{state:salt-restore-rebalancer}", "--out", "{runDir}/bundles/restore-rebalancer-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/restore-rebalancer-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/restore-rebalancer-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/restore-rebalancer-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "upgrade-rebalancer-execute.json", "required": true}
      - {"dir": "{runDir}/bundles", "pattern": "restore-rebalancer-schedule.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    sheetIs: {"UPGRADE_MODE": "upgradeable"}
    notBefore: {"afterStep": "P9.70-fund-upgrade-schedule", "hours": "timelockDelay"}
    writes: ["salt-restore-rebalancer", "data-restore-rebalancer"]
    maxMinutes: 60
    added: "v0.7.0-onevault"
  - id: "P9.72-fund-verify-final"
    standing: ["4.5", "4.12"]
    description: "After the timelock delay the Safe executes the upgrade back: the operation reads done, the implementation slot reads the manifest's implementation again, the proxy answers no upgradeMarker() and keeps its fund and step parameters. Then the fund verifier passes again after every flow, the drill and both upgrades: every proxy's code still the build's, the roles unchanged, the deployer holding no fund share and no role"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "execute", "--target", "{state:target-upgrade-rebalancer}", "--data", "{state:data-restore-rebalancer}", "--salt", "{state:salt-restore-rebalancer}", "--out", "{runDir}/bundles/restore-rebalancer-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/restore-rebalancer-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/restore-rebalancer-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/restore-rebalancer-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", 'id=$(cast call "{m:fund-timelock.timelock}" "hashOperation(address,uint256,bytes,bytes32,bytes32)(bytes32)" "{state:target-upgrade-rebalancer}" 0 "{state:data-restore-rebalancer}" "$(cast hash-zero)" "{state:salt-restore-rebalancer}") && test "$(cast call "{m:fund-timelock.timelock}" "isOperationDone(bytes32)(bool)" "$id")" = true']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts eq "$(cast implementation "{m:rebalancer.rebalancer}")" "{m:rebalancer.rebalancer_implementation}" && ! cast call "{m:rebalancer.rebalancer}" "upgradeMarker()(uint256)" > /dev/null 2>&1 && test "$(cast call "{m:rebalancer.rebalancer}" "fund()(address)")-$(cast call "{m:rebalancer.rebalancer}" "stepParams()")" = "{state:rebalancer-state-before}" && test "$(cast call "{m:rebalancer.rebalancer}" "upgradesFrozen()(bool)")" = false']
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "--system", "fund", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "restore-rebalancer-execute.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P9.71-fund-upgrade-execute", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.7.0-onevault"

  # ── Phase 10, evidence and teardown. ──
  - id: "P10.01-evidence-check"
    standing: ["4.7"]
    description: "The evidence file is checked against the frozen counts and the chain: nonce, every receipt status, the unpause operations and their delay, the registry, the secret scan"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "publish-contracts/src/evidence-check.ts", "--evidence", "{evidenceDir}/evidence.json", "--frozen", "{countsDir}/{gateSha}.json", "--deploy-sha", "{gateSha}", "--deployment-kind", "{deploymentKind}", "--rpc", "{rpcUrl}"]
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "evidence.json", "required": true}
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P10.02-secret-scan"
    standing: ["4.7"]
    description: "No key, passphrase or keystore path is in the run's evidence folder"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "publish-contracts/src/ci/scan-rehearsal-secrets.ts", "--evidence", "{evidenceDir}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P10.51-write-rollout-report"
    standing: ["4.7"]
    description: "The rollout report is written from the run: sha, network, sheet hash, tag, every step's journal, every evidence file's sha256; a failed step, a journaled step with no result and a vault still paused at report time are issues, a pause report from a drill is listed only"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "report", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{coreSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{sheet}", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.51-write-rollout-report"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "rollout-report.md", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P10.52-record-signoff"
    standing: ["4.4"]
    description: "The sign-off is written by the run, and only when the report lists no issue and matches the publish go"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "signoff", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{coreSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{sheet}", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.52-record-signoff"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "signoff.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P10.07-twin-teardown"
    standing: ["9"]
    description: "The tunnel closes, the Twin fork stops on the stage host, and the throwaway keystores and the passphrase file are destroyed"
    host: "control"
    phase: 10
    cmds:
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O exit {stageHost} 2>/dev/null; true"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts stop --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["shred", "-u", "{runDir}/passphrase"]
      - ["rm", "-rf", "{runDir}/keys"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  # ── Deploy 4, the fund flow, phase 10: the evidence, the rollout report and the sign-off, then the Twin teardown. ──
  - id: "P10.60-fund-secret-scan"
    standing: ["4.7"]
    description: "No key, passphrase or keystore path is in the fund run's evidence folder"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "publish-contracts/src/ci/scan-rehearsal-secrets.ts", "--evidence", "{evidenceDir}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P10.61-fund-rollout-report"
    standing: ["4.7"]
    description: "The rollout report is written from the run: sha, network, sheet hash, tag, every step's journal, every evidence file's sha256; a failed step, an applicable step with no result, the fund still paused at report time (the release's vaults: fund) and a transaction of the deployer, the emergency key or the keeper that no step journaled are issues"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "report", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{coreSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{sheet}", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.61-fund-rollout-report"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "rollout-report.md", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P10.62-fund-signoff"
    standing: ["4.4"]
    description: "The sign-off is written by the run, and only when the report lists no issue and matches the publish go"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "signoff", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{coreSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{sheet}", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.62-fund-signoff"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "signoff.json", "required": true}
    irreversible: false
    flow: "fund"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.7.0-onevault"
  - id: "P10.63-fund-twin-teardown"
    standing: ["9"]
    description: "After the sign-off (the report reads the fork): the tunnel closes, the Twin fork stops on the stage host, and the throwaway keystores, the keeper's included, and the passphrase file are destroyed"
    host: "control"
    phase: 10
    cmds:
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O exit {stageHost} 2>/dev/null; true"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts stop --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["shred", "-u", "{runDir}/passphrase"]
      - ["rm", "-rf", "{runDir}/keys", "{runDir}/keeper-keys"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund"
    onlyFor: "twin"
    added: "v0.7.0-onevault"
