      - ["bash", "-c", "out=$(cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:fund-timelock.timelock} \"execute(address,uint256,bytes,bytes32,bytes32)\" 0x0000000000000000000000000000000000000001 0 0x $(cast hash-zero) $(cast hash-zero) 2>&1); echo \"$out\" | head -n 1; echo \"$out\" | grep -Eq \"TimelockUnexpectedOperationState|0x5ead8eb5|AccessControlUnauthorizedAccount|0xe2517d3f\""]
      - ["bun", "scripts/runbook/flow-params.ts", "snapshot", "--queue", "{m:queue.queue}", "--min-hold", "{sheet:FLOW_MIN_HOLD}", "--out", "{runDir}/state/upg-flow-params-before"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "snapshot", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--out", "{runDir}/claims-before.json"]
      - ["bun", "scripts/runbook/fund-state.ts", "counters", "--fund", "{m:fund.fund}", "--queue", "{m:queue.queue}", "--out", "{runDir}/state/upg-fund-before"]
      - ["bash", "-c", "out=$(cast call --from \"{sheet:EMERGENCY_ADDRESS}\" {m:fund.fund} \"shutdown()\" 2>&1); echo \"emergency shutdown: $(echo \"$out\" | head -n 1)\"; echo \"$out\" | grep -Eq \"AccessControlUnauthorizedAccount|0xe2517d3f\" && echo \"before the upgrade the emergency key is refused shutdown (simulated, nothing sent)\""]
      - ["bun", "scripts/runbook/fund-state.ts", "pool-depth", "--fund", "{m:fund.fund}", "--queue", "{m:queue.queue}", "--lib", "{m:fund-libs.fund_valuation_lib}", "--usdc", "{usdc}", "--min", "{sheet:FUND_MIN_POOL_DEPTH_USDC}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-flow-params-before", "upg-fund-before"]
