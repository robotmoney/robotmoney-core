  - id: "P6.99-upg-claim-redeem"
    standing: ["4.4"]
    description: "The deployer claims the settled USDC of the redemption, and only it: the guard reads no other unpaid redemption claim of the deployer (the queue pays them oldest first); redeem(the claimable shares, the deployer, the deployer) on the queue pays USDC to the deployer, nothing of the request is left to claim, and the claims of claims-before.json read the same"
    host: "control"
