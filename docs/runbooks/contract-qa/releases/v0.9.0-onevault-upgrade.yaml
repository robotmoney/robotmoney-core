  # ── v0.9.0-onevault-upgrade, flow fund-upgrade, phase 6 ──
  - id: "P6.87-upg-claim-held"
    standing: ["4.12"]
    description: "Decision D4-18: the deployer claims its Deploy 4 deposit claims whose hold has ended, so the flow test's claim (P6.94) takes only its own. Their requests then read claimable 0 and only their entries of claims-before.json are refreshed from the chain (the original is kept as claims-before-upgrade.json); with none left it sends nothing"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "test -f {runDir}/claims-before-upgrade.json || cp {runDir}/claims-before.json {runDir}/claims-before-upgrade.json"]
      - ["bun", "scripts/runbook/queue-flow.ts", "held", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--abi", "{runDir}/v090/out/FlowQueue.sol/FlowQueue.json", "--snapshot", "{runDir}/claims-before.json", "--owner", "{sheet:ADMIN_ADDRESS}", "--out-sum", "{runDir}/state/upg-held-usdc", "--out-claims", "{runDir}/state/upg-held-claims"]
      - ["bash", "-c", "cast call {m:fund.fund} \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-shares-before-held"]
      - ["bash", "-c", "s=$(cat {runDir}/state/upg-held-usdc); if [ \"$s\" = 0 ]; then echo \"no Deploy 4 deposit claim to take\"; else bash scripts/runbook/cast-send.sh {m:queue.queue} \"deposit(uint256,address)\" \"$s\" \"{sheet:ADMIN_ADDRESS}\" \"$@\"; fi", "_", "{cast}"]
      - ["bash", "-c", "s=$(cat {runDir}/state/upg-held-usdc); if [ \"$s\" = 0 ]; then exit 0; fi; d=$(bun scripts/runbook/qa-assert.ts sub \"$(cast call {m:fund.fund} \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" \"$(cat {runDir}/state/upg-shares-before-held)\") && echo \"shares delivered $d\" && bun scripts/runbook/qa-assert.ts ge \"$d\" 1"]
      - ["bun", "scripts/runbook/queue-flow.ts", "refresh", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--abi", "{runDir}/v090/out/FlowQueue.sol/FlowQueue.json", "--snapshot", "{runDir}/claims-before.json", "--owner", "{sheet:ADMIN_ADDRESS}", "--claims-file", "{runDir}/state/upg-held-claims"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-held-usdc", "upg-held-claims", "upg-shares-before-held"]
    added: "v0.9.0-onevault-upgrade"
  - id: "P6.90-upg-twin-feeds"
