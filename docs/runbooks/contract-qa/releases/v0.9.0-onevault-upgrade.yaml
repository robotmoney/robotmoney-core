      - ["bash", "-c", "cast call {m:fund.fund} \"totalAssets()(uint256)\""]
      - ["bun", "scripts/runbook/queue-flow.ts", "quote", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--abi", "{runDir}/v090/out/FlowQueue.sol/FlowQueue.json", "--kind", "deposit", "--amount", "{sheet:FLOW_MIN_REQUEST_USDC}"]
