    description: "The owner key liveness record of the live Safe (row P2.61 of the v0.8.0-onevault runbook, on the live system): the Deploy 4 prove-control transaction carries a signature of every SAFE_OWNERS key, recovered over its Safe transaction hash on 8453, the chain it was signed for (read through the fork on the Twin); and every Safe bundle this run executed carries at least two signatures, each of a SAFE_OWNERS key, so owners A and B have signed again today. It only reads"
    host: "control"
