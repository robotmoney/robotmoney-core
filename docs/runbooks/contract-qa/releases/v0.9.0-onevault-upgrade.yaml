    phase: 6
    cmds:
      - ["bash", "-c", "at=$(cast call {m:queue.queue} \"settleableAt(uint64)(uint64)\" \"{state:upg-request-d-epoch}\" | cut -d\" \" -f1); echo \"settleable at $at\"; until [ \"$(cast block latest -f timestamp)\" -ge \"$at\" ]; do sleep 60; done"]
      - ["bash", "-c", "c=$(cast call --from \"{sheet:KEEPER_ADDRESS}\" {m:queue.queue} \"checkSettle()(uint8,uint256)\"); echo \"$c\"; test \"$(echo \"$c\" | head -n 1 | cut -d\" \" -f1)\" = 0"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "settle(uint256,uint256)", "50", "{sheet:FUND_PER_DEPOSIT_CAP}", "{keepercast}"]
      - ["bash", "-c", "test \"$(cast call {m:queue.queue} \"requestStatus(uint256)(uint8)\" \"{state:upg-request-d}\")\" = 3 && test \"$(cast call {m:queue.queue} \"pendingDepositRequest(uint256,address)(uint256)\" \"{state:upg-request-d}\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\" = 0"]
