  # ── v0.9.0-onevault-upgrade, flow fund-upgrade, phase 1 ──
  - id: "P1.80-upg-record-go"
    standing: ["4.3"]
    description: "Records the go: the sha, the target, the run sheet's hash and the nonces of the deployer, emergency key and keeper, so the report can prove every later send was journaled. On 8453 it runs only after the owner's go (decision D4-12)"
