# docs/runbooks/contract-qa/releases/v0.9.0-onevault-upgrade.yaml: the in-place upgrade of the LIVE Deploy 4 fund system on Base 8453 to the code of
# v0.9.0-onevault (owner, 2026-11-14: "stop waiting on 24 h holds; upgrade Deploy 4 in place to test upgradeability and the new features"). It runs against the
# existing deployment, as v0.6.0's upgrade flow ran against Deploy 3: the record of the live run (releases/v0.7.0-onevault.yaml, Deploy 4) is copied, never edited.
# A full copy of template.yaml's steps, unchanged and in order, plus the steps this release adds, each `added: v0.9.0-onevault-upgrade` and `flow: fund-upgrade`.
# The release runs only the fund-upgrade flow (flows: below), so no template step runs. scripts/runbook/validate-contract-qa.ts checks it; scripts/runbook/run.ts runs it.
# The rc tag of the code is release/v0.9.0-rc.N-rehearsal (RC_TAG_PATTERN in publish-contracts/src/release-gate.ts, decision D4-13).
release: v0.9.0-onevault-upgrade
template: contract-qa
productionReady: false
vaults: ["fund"]
flows:
  twin: ["fund-upgrade"]
  rehearsal: ["fund-upgrade"]
  production: ["fund-upgrade"]
notes: |
  What it does. This file upgrades the live Deploy 4 fund system on Base in place, from the contracts-0.8.0 build (fa7c47182) to the v0.9.0-onevault
  build. It runs only the fund-upgrade flow: every step is onlyFor twin or rehearsal, so a production run has no step and is refused. The live record
  ({liveManifestDir}, {liveEvidenceDir}, {liveSheet}) is read only: P0.85 copies it into the run and P9.83 proves it unchanged.

  What changes on chain (decision D4-19: one-time migrations, full scope).
  - The Rebalancer, fund and queue proxies get new implementations (P1.84, P1.81, P1.82: deploy-implementation from {runDir}/v090), each
    upgraded with its own migrateV090 as the upgradeToAndCall data (publish-contracts/src/fund-migrations.ts encodes it):
    the Rebalancer moves its step params to the 0.9.0 layout; the fund writes its five new params, replaces the exclusion ledger and records
    the Rebalancer; the queue backfills the legacy held shares, writes cancelBuffer 900, maxPause 259200 and matchBandBps 10 (decision D4-16)
    and rewrites its legacy requests and settlements. No governed setFlowParams runs.
  - A new swap adapter: an ERC1967Proxy over UniswapV3ExactOutSwapAdapterUpgradeable, upgradeable only by the fund timelock (P1.83, ADR-0019).
    Every basket asset moves from the legacy adapter to it, because the legacy adapter cannot answer isFixedFeePool (decision D4-17).
  No timelock role changes: the Safe is already the only executor (decision D4-10).

  Before any send. P0.94 warns for each basket pool below the migration's minPoolDepthUsdc (2,000,000 USDC). After the deploys, P1.85
  simulates the three upgrades with their migrations from the timelock (simulate-upgrades.ts, the fund leg with the Rebalancer's new
  implementation overridden in): a migration that would revert stops the run before anything is scheduled.

  The governed operations. Each is a Safe transaction to the fund timelock: two owner signatures, the deployer pays gas (publish-contracts/src/safe/cli.ts).
  All four are scheduled in one timelock window and chained by predecessor, so they can only execute in this order:
  1. P2.87 rebalancer.upgradeToAndCall(impl, migrateV090()), no predecessor. Executed by P2.88.
  2. P2.80 fund.upgradeToAndCall(impl, migrateV090(rebalancer)), after 1. Executed by P2.82.
  3. P2.81 queue.upgradeToAndCall(impl, migrateV090(900, 259200, 10)), after 2. Executed by P2.83.
  4. P2.85 the adapter batch, after 3: allow the implementation and proxy code hashes, mark the proxy hash, then setAssetAdapter for each
     basket asset on the legacy adapter. Executed by P3.72, which then simulates setFlowParams of the queue's own 21 fields from the timelock.
  Each execute waits the timelock delay from its schedule. P3.83 (the verifier) is the one check of the migrated values.

  What stays the same. Every queue claim keeps the unlockAt fixed at its settlement. P0.94 snapshots the claims (claims-before.json) and P2.84,
  P6.93, P6.94, P6.99 and P9.83 read them unchanged. The fund's supply, seed shares, plan id and request count read the same after the upgrade (P2.84).
  The run sheet copy is final before the go (P0.87: the migration keys and the chain's epoch lines); no step edits it after.

  The Deploy 4 deposit claims. Deploy 4 left three 1 USDC deposit claims of the deployer, held until 2026-11-15 01:00:15 UTC and never claimed.
  The queue delivers a receiver's deposit claims oldest first, so P6.87 claims every one whose hold has ended before the flow test claims its own
  (decision D4-18). That also proves old claims deliver after the upgrade. P6.87 keeps the original snapshot as claims-before-upgrade.json and
  refreshes only the claimed entries of claims-before.json. P9.84 (Twin) proves any claim still held becomes claimable.

  The flow test (P6.91 to P6.99) requests 1 USDC, settles, claims after the 1 h hold, redeems and claims.

  The Twin and 8453. The Twin proves only what this release changes. 8453 proves the whole live system.
  - Twin: chain 918453, an anvil fork of Base pinned at a current block, on the stage host {stageHost}. P0.84 starts it there and tunnels it to
    {tunnelPort}. P10.84 closes the tunnel and stops it. It signs with the live keystores and a passphrase file, which only 918453 accepts.
    It moves its clock instead of waiting (decision D4-9): P6.90, P6.92, P6.95 and P6.97 restate the feeds and warp the holds. P9.84 reads the old
    held claims claimable. No Twin step should depend on Base history before the fork pin: the fund verifier's role scan on 918453 checks the
    holders now plus the grants after the pin.
  - 8453: the same steps on the live chain, with the full history checks: every role grant since deployment, the earlier governed upgrades
    (evidence-check --governed-upgrades) and the owners' prove-control signatures (P3.84).

  Hosts. Commands run on the operator machine from this checkout. The Twin fork runs only on the stage host. Foundry is 1.8.5 on both hosts
  (P0.84 checks it here): the builds need the pinned forge, and an older cast cannot read the 1.8.5 fork.

  Builds. {runDir}/v070 (the live deployment sha 7c23569f, {d4live}) and {runDir}/v080 (the v0.8 fund and queue builds) are rebuilt by P0.91.
  {runDir}/v090 is the new build (P0.92), the --upgrade-build of the deploys. On 8453, run.ts requires {manifestDir} equal to {v050ManifestDir}
  and {evidenceDir} equal to {v050EvidenceDir}: point both pairs at the run's copies.

  Counts. The upgrade adds no deployer stage. Each implementation deploy is one CREATE recorded in the run manifest's implementation_deploys.
  P1.83 adds two CREATEs (the adapter implementation and proxy), recorded in the run state. The fund migration creates the new exclusion ledger
  from the fund proxy, inside the timelock's execute. The frozen counts stay the live sha's.
decisions:
  - id: "D4-10"
    question: "Who may execute a ready operation on the fund system's timelock: anyone (ADR-0004's open executor, which the vaults system keeps) or only the fund Safe"
    status: decided
    answer: "Owner, 2026-11-13: Safe-only executor for the fund timelock. Applied on the live Deploy 4 timelock by v0.8.0-onevault-upgrade (2026-11-14): the Safe is the only executor. This file applies nothing new: P0.94 reads the state before any send, and P3.83 verifies it after."
    decidedOn: "2026-11-13"
    ref: "releases/v0.8.0-onevault.yaml D4-10"
  - id: "D4-11"
    question: "How long are deposit shares held after their settlement (FlowQueue minHold)"
    status: decided
    answer: "Owner, 2026-11-13: minHold 1 hour (the sheet's FLOW_MIN_HOLD). Live since v0.8.0-onevault-upgrade (2026-11-14). The upgrade does not change it. Claims settled before keep the unlockAt fixed at their settlement."
    decidedOn: "2026-11-13"
    ref: "releases/v0.8.0-onevault.yaml D4-11"
  - id: "D4-12"
    question: "Go to broadcast the in-place upgrade of Deploy 4 on Base 8453 to v0.9.0-onevault: run this file on the rehearsal target from the rc tag release/v0.9.0-rc.N-rehearsal at the commit whose Twin run passed"
    status: "decided"
    answer: "Owner, 2026-11-17: execute the in-place Deploy 4 upgrade, subject to the runbook prerequisites."
    decidedOn: "2026-11-17"
    ref: "Owner instruction in deployment session, 2026-11-17"
  - id: "D4-13"
    question: "On 8453 deploy-implementation gates its --upgrade-build as an rc build (tag release/vA.B.C-rc.N[-rehearsal] on origin/releases-A.B.x). Which branch/tag satisfy the gate for this v0.9.0-onevault upgrade build?"
    status: "decided"
    answer: "Branch release-0.9.0 and an annotated tag release/v0.9.0-rc.N-rehearsal on the upgrade build, as assertUpgradeBuildGate requires."
    decidedOn: "2026-11-16"
    ref: "publish-contracts/src/release-gate.ts assertUpgradeBuildGate"
  - id: "D4-14"
    question: "Gate the 8453 upgrade on green CI at the upgrade build (check-sha-green), or waive for this rehearsal?"
    status: "decided"
    answer: "To be set at run time per owner direction; default assumption: CI gate enforced for 8453 unless owner explicitly waives with CI_GATE_WAIVER=D4-14."
    decidedOn: "2026-11-16"
    ref: "publish-contracts/src/release-gate.ts ciGateWaiver"
  - id: "D4-15"
    question: "Shorten the queue's epochs on the upgraded Deploy 4 for the flow test?"
    status: "decided"
    answer: "Owner, 2026-11-14 (carried from v0.8.0-upgrade): yes. Done on the live Deploy 4 by v0.8.0-onevault-upgrade (epochLength 3600, settleWindow 720). This file does not change them: P0.87 sets the run sheet copy's two lines to the chain's."
    decidedOn: "2026-11-14"
    ref: "releases/v0.8.0-onevault-upgrade.yaml D4-15"
  - id: "D4-16"
    question: "Which values do cancelBuffer, maxPause and matchBandBps take on the live queue? v0.9.0 appends these three fields to FlowParams, so the live queue holds 0 until P2.86 sets them"
    status: "decided"
    answer: "Owner, 2026-11-17: accept cancelBuffer 900 s, maxPause 259200 s, and matchBandBps 10. The queue migration writes them (P2.81, from the sheet keys FLOW_CANCEL_BUFFER, FLOW_MAX_PAUSE and FLOW_MATCH_BAND_BPS); no setFlowParams runs."
    decidedOn: "2026-11-17"
    ref: "Owner instruction in deployment session, 2026-11-17"
  - id: "D4-17"
    question: "Deploy 4's legacy Uniswap swap adapter has no isFixedFeePool, so the v0.9.0 queue's setFlowParams reverts FlowParamOutOfBounds(14) (E43). How does the upgrade leave it?"
    status: "decided"
    answer: "Owner, 2026-11-19: swap adapters become OpenZeppelin UUPS proxies (GovernedUUPS, the fund timelock their upgrade authority), vetted by proxy and implementation code hash on every use; a governed setAssetAdapter moves each basket asset to the new adapter proxy before P2.86 (ADR-0019, steps P1.83 to P3.72). No legacy-adapter special case, no delist."
    decidedOn: "2026-11-19"
    ref: "docs/adr/ADR-0019-fund-swap-adapters-governed-uups-proxies.md"
  - id: "D4-18"
    question: "Deploy 4's deposit claims of the deployer are out of their hold and unclaimed, and the queue delivers a receiver's deposit claims oldest first, so the flow test's claim (P6.94) would take them. Who claims them?"
    status: decided
    answer: "this run claims the Deploy 4 deposit claims whose hold has ended, before its own flow-test claim; they are the deployer's own deposits; it also proves old claims deliver after the upgrade"
    decidedOn: "2026-11-20"
    ref: "Owner-side decision in the deployment session, 2026-11-20 (step P6.87-upg-claim-held)"
  - id: "D4-19"
    question: "How does v0.9.0 install on the live Deploy 4, whose queue, fund and Rebalancer state v0.9.0 reads in a new layout?"
    status: decided
    answer: "Owner, 2026-11-20: v0.9.0 installs on Deploy 4 with one-time migrations on the queue, fund and Rebalancer, the Rebalancer upgraded in place and the exclusion ledger replaced; full scope."
    decidedOn: "2026-11-20"
    ref: "Owner instruction in the deployment session, 2026-11-20 (steps P1.84, P1.85, P2.87, P2.88; publish-contracts/src/fund-migrations.ts)"
recovery: |
  Before P1.80 nothing is sent: fix on the branch and run again. Before P2.87 only implementations are deployed: a P1.85 simulation that reverts
  is fixed on the branch, and the reruns reuse the deployed implementations that still match the build. After that every step reruns safely:
  P0.93 marks each proxy already upgraded so its schedule and execute skip. A scheduled chain is cancelled from its tail: the adapter batch first,
  then the queue, fund and Rebalancer upgrades, each by the Safe before it is ready (safe/cli.ts propose --action cancel --id); a later
  operation can never run once its predecessor is cancelled. Once the Rebalancer upgrade has executed, the fund upgrade must follow before any
  settle: the queue's first settle of a round needs the fund to know the 0.9.0 Rebalancer. A bad upgrade is reversed by a governed upgrade back
  to the from_implementation in the run manifest's proxy_upgrades (the proxies stay upgradeable), but a migration is not undone by it.
  The adapter proxy is upgraded back the same way (ADR-0019). The emergency key still pauses deposits and the queue at once (P9.80).
  Redeem in kind, cancel and withdrawals stay open. shutdown and emergencyUnwind need the Safe and the delay. The fund holds at most FUND_TVL_CAP (1,000 USDC).
scope:
  - {pr: 2035, what: "add v0.9.0-onevault-upgrade runbook for Deploy 4: template steps plus v0.9.0 fund-upgrade steps targeting existing Deploy 4 proxies in place with Deploy 4 keys, signers, timelock configuration, and v0.9.0 release artifacts", check: "P0.80-upg-runbook-valid"}
steps:
  - id: "P0.01-runbook-valid"
    standing: ["4.1"]
    description: "The release runbook is the template plus additions, the sheet and target make sense, and a production run has no open owner decision"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.02-run-dirs"
    standing: ["4.3"]
    description: "The run directory layout every later receipt and state file lives in; the run directory is outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.04-checkout"
    standing: ["4.1"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.05-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.06-forge-build"
    standing: ["4.1"]
    description: "forge build succeeds at the DEPLOY_SHA"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
    maxMinutes: 30
  - id: "P0.08-dependency-manifest"
    standing: ["4.2"]
    description: "The third-party dependency manifest for this release is recorded at the deploy block; run from the dev checkout, because it writes a file under deployments/ that would dirty the DEPLOY_SHA checkout"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "{countsCheckout}/scripts/release/preflight-guards.sh", "--dependency-manifest", "8453:{release}"]
    env:
      DEPENDENCY_MANIFEST_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{countsCheckout}/deployments/dependency-manifests/8453", "pattern": "{release}.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
    onlyFor: ["rehearsal", "production"]
  - id: "P0.12-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453), a pinned lazy fork of Base, runs on the stage host (never on this machine): the host checkout is brought to the run's sha, port 8545 is checked free, the fork starts and is ready, an ssh tunnel brings it to {tunnelPort} here (reopened on every invocation), and its anvil.json is copied back"
    host: "control"
    phase: 0
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
  - id: "P0.13-twin-keys"
    standing: ["4.3"]
    description: "Throwaway keystores for the deployer, pauser, emergency key and three Safe owners; the passphrase stays in a 0600 file; the public addresses become the sheet fragment"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n' > {runDir}/passphrase"]
      - ["bash", "-c", "bun publish-contracts/src/rehearsal/cli.ts keys --dir {runDir}/keys --password-file {runDir}/passphrase --chain-id 918453 > {runDir}/fragment.env"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "fragment.env", "required": true}
    irreversible: false
    onlyFor: "twin"
    gateAbsent: "{runDir}/fragment.env"
  - id: "P0.15-sheet-merge"
    standing: ["4.3"]
    description: "The run sheet is the environment's committed sheet with the fragment's lines, through the real sheet parser"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/ci/merge-sheet.ts", "--template", "{sheetTemplate}", "--fragment", "{runDir}/fragment.env", "--out", "{sheet}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "sheet.env", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P0.17-check-sheet"
    standing: ["4.2", "4.10"]
    description: "The sheet agrees with the environment: chain id, deployment kind, timelock delay band, 1 USDC seed, caps, and as many owner signer specs as Safe owners"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.07-preflight-guards"
    standing: ["4.2"]
    description: "EIP-170 size gate and the zero timelock delay guard pass on the exact build artifacts"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "scripts/release/preflight-guards.sh"]
    env:
      TIMELOCK_MIN_DELAY: "{sheet:TIMELOCK_MIN_DELAY}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.18-twin-fund"
    standing: ["9"]
    description: "Gas for every throwaway key and the real FiatToken balance of the deployer, on the Twin fork only"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-gas", "--rpc", "{rpcUrl}", "--sheet", "{sheet}"]
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-usdc", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--usdc-units", "2000000000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P0.19-funding"
    standing: ["4.2"]
    description: "The deployer holds 7 USDC. The most a run needs at once is 5.32 (the contract ceilings: rmRWA maxSlippageBps at most 500 on the buy and on the sale, its exit fee at most 100 bps, so a round trip through rmRWA loses at most 11 percent; rmUSDC and rmRWA redeem to USDC, rmPROTO redeemInKind pays in tokens). It is the 1 USDC seed, plus what the round before the rebalance does not return as USDC (1.1 in rmPROTO tokens: 1 redeemed in kind, and the router's rmPROTO leg of 2 USDC at the 500 bps of the vector in effect, on a new deployment the sheet's default; at most 0.11 lost on the 1 USDC rmRWA round trip; that vector sends nothing to rmRWA), plus either the 3 vault deposits held at once after it (5.21) or, once they are redeemed (another 1 in rmPROTO tokens, at most 0.11 on rmRWA), the 2 USDC router deposit (5.32). The receipt's vector only splits that last router deposit, so it does not move the floor. The 1.68 spare is margin. A run without the pre-rebalance round (production) needs 4.11. The ETH balance is advisory: below 0.005 ETH the step prints a warning and the run goes on (the gas the run burns is about 0.003 ETH; every send goes through cast at the network fee). The upgrade flow checks its own funding at P8.25"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'cast balance "{sheet:ADMIN_ADDRESS}" > {runDir}/state/deployer-eth']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge {state:deployer-eth} 5000000000000000 || echo 'advisory: the deployer holds less than 0.005 ETH, the gas a full run burns at a high network fee; the run goes on' >&2"]
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:deployer-usdc}", "7000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "new"
    onlyFor: ["rehearsal", "production"]
    writes: ["deployer-eth", "deployer-usdc"]
  - id: "P0.20-plan"
    standing: ["3", "4.3"]
    description: "The plan job: sheet, floors, chain id, release tag of the sheet's kind, committed frozen counts, green CI and core's config-check, with no signer"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "--stage", "plan", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{evidenceDir}", "{gate}"]
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P0.21-dry-run"
    standing: ["4.3"]
    description: "Every deployer stage simulates in order on a blank local anvil and sends nothing"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "--dry-run", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--signer", "address:{sheet:ADMIN_ADDRESS}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{runDir}/evidence-dry", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{runDir}/manifests-dry"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    maxMinutes: 60
  # ── v0.9.0-onevault-upgrade, flow fund-upgrade, phase 0 ──
  - id: "P0.80-upg-runbook-valid"
    standing: ["4.1", "4.15"]
