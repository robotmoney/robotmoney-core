    cmds:
      - ["bash", "-c", "e={evidenceDir}/publish-run.json; rm -f {runDir}/state/done-rebalancer-upgrade {runDir}/state/done-fund-upgrade {runDir}/state/done-queue-upgrade; done_upgrade() { want=$(jq -r --arg p \"$1\" --arg b \"{runDir}/v090\" \"[.proxy_upgrades[]? | select(.proxy_name == \\$p and .build == \\$b and .execute_tx != null)] | last | .to_implementation // empty\" \"$e\" | tr A-F a-f); have=$(cast implementation \"$2\" | tr A-F a-f); test -n \"$want\" && test \"$have\" = \"$want\"; }; if done_upgrade rebalancer {m:rebalancer.rebalancer}; then echo \"rebalancer already upgraded\"; touch {runDir}/state/done-rebalancer-upgrade; fi; if done_upgrade fund {m:fund.fund}; then echo \"fund already upgraded\"; touch {runDir}/state/done-fund-upgrade; fi; if done_upgrade queue {m:queue.queue}; then echo \"queue already upgraded\"; touch {runDir}/state/done-queue-upgrade; fi; true"]
