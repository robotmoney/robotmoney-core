  - id: "P6.93-upg-settle-deposit"
    standing: ["4.4"]
    description: "The keeper settles the deposit once chain time reaches settleableAt (the epoch's end plus the settle window, 1 h 12 min at most on the live params) and checkSettle() reads Ok. The request reads Closed, its one claim is held exactly FLOW_MIN_HOLD from its settlement (queue-flow.ts find-claim against the v0.9.0 Settlement), and the claims of claims-before.json read the same"
