  - id: "P6.89-upg-replace-deposit"
    standing: ["4.4"]
    description: "Only when P6.88 found the open request no longer admits the price: the deployer cancels it, withdraws the 1 USDC credit, and requests 1 USDC again with the quoted bound plus 0.5%; the new request id and epoch replace the old ones for the settle and claim rows"
