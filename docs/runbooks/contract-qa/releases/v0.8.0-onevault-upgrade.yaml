    added: "v0.8.0-onevault-upgrade"
  - id: "P6.88-upg-deposit-still-admitted"
    standing: ["4.4"]
    description: "Whether the open deposit request still admits the price: it is Pending and its limit is at least the bound quoteDeposit gives now. If so, the marker upg-deposit-admitted is written and P6.89 skips. On 8453 (2026-11-14) the first request, made with a zero margin, was skipped by the settlement (RequestSkipped) when the share price rose 0.001%"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'd=$(cat {runDir}/state/upg-request-d); st=$(cast call {m:queue.queue} "requestStatus(uint256)(uint8)" "$d"); lim=$(cast call {m:queue.queue} "getRequest(uint256)((address,uint8,uint64,uint256,uint256,uint256,bool))" "$d" | tr -d "()" | cut -d, -f6 | tr -d " " | sed "s/[[].*//"); b=$(cast call {m:queue.queue} "quoteDeposit(uint256)((uint256,uint256,uint256,uint64,uint64))" 1000000 | tr -d "()" | cut -d, -f1 | cut -d" " -f1); echo "request $d status $st limit $lim bound now $b"; rm -f {runDir}/state/upg-deposit-admitted; if [ "$st" = 1 ] && bun scripts/runbook/qa-assert.ts ge "$lim" "$b" >/dev/null 2>&1; then echo admitted > {runDir}/state/upg-deposit-admitted; echo "the request still admits the price"; else echo "the request no longer admits the price: P6.89 replaces it"; fi']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
