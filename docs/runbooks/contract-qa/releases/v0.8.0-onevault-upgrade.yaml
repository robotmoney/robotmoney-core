  - id: "P10.79-upg-go-sheet"
    standing: ["4.10"]
    description: "The sheet the go was recorded with ({runDir}/sheet-at-go.env), for the sign-off's basis: P3.86 (D4-15) rewrote FLOW_EPOCH_LENGTH and FLOW_SETTLE_WINDOW in the run sheet after the go. P3.86 keeps a copy before it edits; when it is missing (a run whose P3.86 passed before the copy existed), it is the run sheet with those two lines set back to the committed sheet's values. Either way its sha256 must equal the go record's sheetSha256, so any other difference stops here"
    host: "control"
    phase: 10
    cmds:
      - ["bash", "-c", 'g={runDir}/sheet-at-go.env; if [ ! -f "$g" ]; then e=$(sed -n "s/^FLOW_EPOCH_LENGTH=//p" deployments/base-8453-rehearsal/deploy-4.env); w=$(sed -n "s/^FLOW_SETTLE_WINDOW=//p" deployments/base-8453-rehearsal/deploy-4.env); sed -e "s/^FLOW_EPOCH_LENGTH=.*/FLOW_EPOCH_LENGTH=$e/" -e "s/^FLOW_SETTLE_WINDOW=.*/FLOW_SETTLE_WINDOW=$w/" {sheet} > "$g"; fi; want=$(jq -r .sheetSha256 {runDir}/go/publish.json); got=$(sha256sum "$g" | cut -d" " -f1); echo "go sheet $got, go record $want"; test "$got" = "$want"']
