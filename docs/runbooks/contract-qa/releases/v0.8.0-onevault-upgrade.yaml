    standing: ["4.12"]
    description: "The upgrade changed the code and nothing else, and the new rules hold. Unchanged: every queue claim (fund-claims same against claims-before.json: the deposits settled under the 24 h hold keep their unlockAt and stay claimable then), the queue's flowParams, the fund's supply, seed shares, plan id and request count. New (owner 2026-11-13): the emergency key is refused shutdown and emergencyUnwind (AccessControlUnauthorizedAccount, simulated, nothing sent), the timelock may call shutdown, the emergency key still pauses the fund and the queue (simulated), and the queue accepts minHold 3600 from the timelock (simulated: the new floor). The governed upgrades read back from the chain (evidence-check --governed-upgrades: one upgradeToAndCall each, the delay kept)"
