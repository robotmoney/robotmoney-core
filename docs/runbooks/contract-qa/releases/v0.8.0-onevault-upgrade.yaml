  - id: "P9.83-upg-verify-final"
    standing: ["4.5", "4.12"]
    description: "The fund verifier passes again after the flow test and the drill: the upgraded proxies against the v0.8.0 build, every other against the live build, the Safe-only executor, the roles unchanged, the deployer holding no fund share and no role. The claims of claims-before.json still read as before the upgrade, and the live Deploy 4 record ({liveManifestDir}, {liveEvidenceDir}) is byte for byte what P0.85 copied: the run never edited it"
