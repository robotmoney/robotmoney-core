    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.84-upg-twin-fork-check"
    standing: ["9"]
    description: "On the Twin only: the RPC is the Twin chain (918453), an anvil fork of Base at a block after the Deploy 4 deployment, so the live fund system is on it (the fund proxy of the live record has code). The fork is started by the operator before the run (on this machine for this rehearsal, owner instruction 2026-11-14; scripts/devnet/twin-fork.ts start), so no step here starts or stops it (README Hosts)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test \"$(cast chain-id)\" = 918453 && cast rpc anvil_nodeInfo > /dev/null && f=$(jq -r .fund {liveManifestDir}/fund.json) && test \"$(cast code \"$f\" | wc -c)\" -gt 100 && echo \"fork head $(cast block-number), fund $f has code\""]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: "twin"
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.85-upg-copy-record"
    standing: ["4.3", "4.15"]
    description: "The live Deploy 4 record is COPIED into the run, never edited in place: its manifests to {manifestDir} and its run manifest to {evidenceDir}; the sha256 of every live file is written so P9.83 proves the live record is unchanged at the end. On a rerun the run's own copy (which the upgrade steps re-record) is kept"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -s {liveManifestDir}/fund-timelock.json && test -s {liveEvidenceDir}/publish-run.json && jq -e '.system == \"fund\" and .coreSha == \"7c23569f85e96232fc75bbba32ebbd469da31966\"' {liveEvidenceDir}/publish-run.json > /dev/null && (cd {liveManifestDir} && sha256sum *.json) > {runDir}/live-manifests.sha256 && (cd {liveEvidenceDir} && sha256sum publish-run.json) > {runDir}/live-evidence.sha256 && cp {liveManifestDir}/*.json {manifestDir}/ && cp {liveEvidenceDir}/publish-run.json {evidenceDir}/publish-run.json"]
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "publish-run.json", "required": true}
      - {"dir": "{manifestDir}", "pattern": "fund-timelock.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    gateAbsent: "{evidenceDir}/publish-run.json"
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.86-upg-twin-chain-ids"
    standing: ["9"]
    description: "On the Twin only: the run's manifest copies and its run manifest copy name the Twin chain (918453) the fork answers with, as every fund tool checks (the contracts on the fork are the live ones; only the chain id differs). The live record is not touched"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "for f in {manifestDir}/*.json; do jq 'if has(\"chain_id\") then .chain_id = 918453 else . end' \"$f\" > \"$f.tmp\" && mv \"$f.tmp\" \"$f\"; done && jq '.chainId = 918453' {evidenceDir}/publish-run.json > {evidenceDir}/publish-run.json.tmp && mv {evidenceDir}/publish-run.json.tmp {evidenceDir}/publish-run.json && jq -e '.chain_id == 918453' {manifestDir}/fund.json > /dev/null && jq -e '.chainId == 918453' {evidenceDir}/publish-run.json > /dev/null"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: "twin"
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.87-upg-sheet"
    standing: ["4.3", "4.10"]
    description: "The run sheet is the committed v0.8.0-onevault fund sheet, whole: it is the live Deploy 4 sheet with the new 1 h hold (P0.89 proves it), so the verifier compares the upgraded queue's flowParams with FLOW_MIN_HOLD 3600"
    host: "control"
    phase: 0
    cmds:
      - ["cp", "deployments/base-8453-rehearsal/deploy-4.env", "{sheet}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "sheet.env", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.88-upg-twin-sheet"
    standing: ["4.3"]
    description: "On the Twin only: CHAIN_ID and EXPECTED_CHAIN_ID become 918453; every other line, the live keys and owners included, stays the committed one (the Twin signs with the live keystores and a passphrase file, allowed on 918453 only)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "sed -i -e \"s/^CHAIN_ID=.*/CHAIN_ID=918453/\" -e \"s/^EXPECTED_CHAIN_ID=.*/EXPECTED_CHAIN_ID=918453/\" {sheet} && grep -qx \"CHAIN_ID=918453\" {sheet} && grep -qx \"EXPECTED_CHAIN_ID=918453\" {sheet}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: "twin"
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.89-upg-sheet-is-live"
    standing: ["4.3", "4.15"]
    description: "The run sheet is the live Deploy 4 run sheet ({liveSheet}) and nothing else changes but the hold: every line equal, except FLOW_MIN_HOLD (86400 live, 3600 here, decision D4-11) and, on the Twin, the chain ids"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "n() { grep -E \"^[A-Z][A-Z0-9_]*=\" \"$1\" | grep -vE \"^(FLOW_MIN_HOLD|CHAIN_ID|EXPECTED_CHAIN_ID)=\" | sort; }; diff <(n {liveSheet}) <(n {sheet}) && grep -qx \"FLOW_MIN_HOLD=86400\" {liveSheet} && grep -qx \"FLOW_MIN_HOLD=3600\" {sheet} && grep -qx \"CHAIN_ID={chainId}\" {sheet}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.90-upg-check-sheet"
    standing: ["4.2", "4.10"]
    description: "The sheet agrees with the environment: chain id, kind, delay band, 1 USDC seed, the fund caps, the keeper, and as many owner signer specs as Safe owners"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.91-upg-live-build"
    standing: ["4.15"]
    description: "The live build: a separate clean checkout of 7c23569f8 (release/v0.7.0-onevault-rc.5-rehearsal, the sha Deploy 4 was deployed from) at {runDir}/v070, its submodules cloned from the main checkout's own, built there with --root and --out. Every CLI call of this flow names it with --core-dir ({d4common}): deploy-implementation reads the live implementation's library links and the deployed storage layout from it, and the verifier compares every proxy the upgrade does not move with it"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -d {runDir}/v070 || git worktree add --detach {runDir}/v070 7c23569f85e96232fc75bbba32ebbd469da31966"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v070"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v070 rev-parse HEAD)\" = 7c23569f85e96232fc75bbba32ebbd469da31966 && test -z \"$(git -C {runDir}/v070 status --porcelain)\""]
      - ["forge", "build", "--root", "{runDir}/v070", "--out", "{runDir}/v070/out"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 40
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.92-upg-new-build"
    standing: ["4.15"]
    description: "The new build: a separate clean checkout of the run's sha at {runDir}/v080, built there, the --upgrade-build of the two implementation deploys and of their records (on 8453 the CLI gates it as an rc build). Skipped once both proxies read upgraded (P0.93's markers): then nothing reads it but the verifier, through the run manifest's proxy_upgrades"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -d {runDir}/v080 || git worktree add --detach {runDir}/v080 {coreSha}"]
      - ["bash", "scripts/runbook/upgrade-submodules.sh", "{runDir}/v080"]
      - ["bash", "-c", "test \"$(git -C {runDir}/v080 rev-parse HEAD)\" = {coreSha} && test -z \"$(git -C {runDir}/v080 status --porcelain)\""]
      - ["forge", "build", "--root", "{runDir}/v080", "--out", "{runDir}/v080/out"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    gateAbsent: ["{runDir}/state/done-fund-upgrade", "{runDir}/state/done-queue-upgrade"]
    maxMinutes: 40
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.93-upg-done-markers"
    standing: ["4.15"]
    description: "A done-* marker for each proxy the chain AND the run's manifest copy already show upgraded (a proxy_upgrades entry with an execute transaction whose to_implementation the ERC-1967 slot reads), so a rerun skips that upgrade by its own gate; the markers of an earlier invocation are removed first, and the step runs on every invocation (it only reads)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "e={evidenceDir}/publish-run.json; rm -f {runDir}/state/done-fund-upgrade {runDir}/state/done-queue-upgrade; done_upgrade() { want=$(jq -r --arg p \"$1\" \"[.proxy_upgrades[]? | select(.proxy_name == \\$p and .execute_tx != null)] | last | .to_implementation // empty\" \"$e\" | tr A-F a-f); have=$(cast implementation \"$2\" | tr A-F a-f); test -n \"$want\" && test \"$have\" = \"$want\"; }; if done_upgrade fund {m:fund.fund}; then echo \"fund already upgraded\"; touch {runDir}/state/done-fund-upgrade; fi; if done_upgrade queue {m:queue.queue}; then echo \"queue already upgraded\"; touch {runDir}/state/done-queue-upgrade; fi; true"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    refresh: true
    writes: ["done-fund-upgrade", "done-queue-upgrade"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.94-upg-pre-state"
    standing: ["4.15"]
    description: "The live state before any send, read from the chain into the journal and the run: each of the five proxies runs its manifest implementation, unfrozen, upgradeable only by the fund timelock; the timelock's delay, the Safe as proposer and canceller and the OPEN executor (address(0) holds EXECUTOR_ROLE, so a non-Safe execute is refused only for the operation's state); the Safe's owners and threshold; the queue's flowParams (minHold 86400); every queue claim (claims-before.json: the deposits settled at the 24 h hold, unlockAt fixed at settlement); the fund's supply and plan; and the emergency key still able to call shutdown (a simulation, nothing sent). It runs once"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "for p in \"{m:fund.fund}:{m:fund.fund_implementation}\" \"{m:queue.queue}:{m:queue.queue_implementation}\" \"{m:rebalancer.rebalancer}:{m:rebalancer.rebalancer_implementation}\" \"{m:fund-governance.governance}:{m:fund-governance.governance_implementation}\" \"{m:fund-receipt.consensus_receipt}:{m:fund-receipt.consensus_receipt_implementation}\"; do x=${p%%:*}; i=${p##*:}; echo \"$x implementation $(cast implementation $x)\"; bun scripts/runbook/qa-assert.ts eq \"$(cast implementation $x)\" \"$i\" && test \"$(cast call $x \"upgradesFrozen()(bool)\")\" = false && bun scripts/runbook/qa-assert.ts eq \"$(cast call $x \"upgradeTimelock()(address)\")\" \"{m:fund-timelock.timelock}\" || exit 1; done"]
      - ["bash", "-c", "echo \"delay $(cast call {m:fund-timelock.timelock} \"getMinDelay()(uint256)\")\"; echo \"owners $(cast call {m:safe.safe} \"getOwners()(address[])\") threshold $(cast call {m:safe.safe} \"getThreshold()(uint256)\")\"; test \"$(cast call {m:fund-timelock.timelock} \"getMinDelay()(uint256)\")\" = \"{sheet:TIMELOCK_MIN_DELAY}\" && test \"$(cast call {m:fund-timelock.timelock} \"hasRole(bytes32,address)(bool)\" \"$(cast keccak PROPOSER_ROLE)\" {m:safe.safe})\" = true && test \"$(cast call {m:fund-timelock.timelock} \"hasRole(bytes32,address)(bool)\" \"$(cast keccak CANCELLER_ROLE)\" {m:safe.safe})\" = true && test \"$(cast call {m:fund-timelock.timelock} \"hasRole(bytes32,address)(bool)\" $(cast keccak EXECUTOR_ROLE) 0x0000000000000000000000000000000000000000)\" = true && echo \"executor: open (address(0) holds EXECUTOR_ROLE)\""]
      - ["bash", "-c", "out=$(cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:fund-timelock.timelock} \"execute(address,uint256,bytes,bytes32,bytes32)\" 0x0000000000000000000000000000000000000001 0 0x $(cast hash-zero) $(cast hash-zero) 2>&1); echo \"$out\" | head -n 1; echo \"$out\" | grep -Eq \"TimelockUnexpectedOperationState|0x5ead8eb5\""]
      - ["bash", "-c", "cast call {m:queue.queue} \"flowParams()\" > {runDir}/state/upg-flow-params-before && r=$(cat {runDir}/state/upg-flow-params-before) && echo \"flowParams $r\" && test \"$(cast to-dec 0x${r:130:64})\" = 86400"]
      - ["bun", "publish-contracts/src/ci/fund-claims.ts", "snapshot", "--rpc", "{rpcUrl}", "--queue", "{m:queue.queue}", "--out", "{runDir}/claims-before.json"]
      - ["bash", "-c", "echo \"$(cast call {m:fund.fund} \"totalSupply()(uint256)\" | cut -d\" \" -f1)-$(cast call {m:fund.fund} \"balanceOf(address)(uint256)\" {m:fund.fund} | cut -d\" \" -f1)-$(cast call {m:fund.fund} \"currentPlanId()(uint256)\")-$(cast call {m:queue.queue} \"requestCount()(uint256)\")\" > {runDir}/state/upg-fund-before && echo \"supply-seedshares-plan-requests $(cat {runDir}/state/upg-fund-before) planStatus $(cast call {m:fund.fund} \"planStatus()(uint8)\")\""]
      - ["bash", "-c", "cast call --from \"{sheet:EMERGENCY_ADDRESS}\" {m:fund.fund} \"shutdown()\" > /dev/null && echo \"before the upgrade the emergency key can still call shutdown (simulated, nothing sent)\""]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-flow-params-before", "upg-fund-before"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.95-upg-keeper-gas"
    standing: ["4.2", "4.10"]
    description: "The keeper holds gas before its first send (the settles of P6.93 and P6.98): at least 0.0005 ETH, about fifty keeper sends on Base. A hard check: below it the step fails (the deployer funds the keeper by hand, journaled, and the step runs again). It sends nothing"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "b=$(cast balance \"{sheet:KEEPER_ADDRESS}\"); echo \"keeper $b\"; bun scripts/runbook/qa-assert.ts ge \"$b\" 500000000000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.96-upg-funding"
    standing: ["4.2"]
    description: "The deployer holds the 1 USDC the flow test requests (with 1 USDC of margin) and gas for two implementation deploys and the Safe executions; the ETH lines of the deployer and the emergency key (two pauses) are advisory"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "for a in \"{sheet:ADMIN_ADDRESS}\" \"{sheet:EMERGENCY_ADDRESS}\"; do b=$(cast balance \"$a\"); echo \"$a $b\"; bun scripts/runbook/qa-assert.ts ge \"$b\" 300000000000000 || echo \"advisory: $a holds less than 0.0003 ETH\" >&2; done"]
      - ["bash", "-c", "cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-deployer-usdc"]
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:upg-deployer-usdc}", "2000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["upg-deployer-usdc"]
    added: "v0.8.0-onevault-upgrade"
