  - id: "P9.82-upg-unpause-execute"
    standing: ["4.5", "4.10"]
    description: "After the timelock delay the operation is ready, and the timelock refuses it to anyone but the Safe: the deployer's executeBatch of this very operation is refused for its role (AccessControlUnauthorizedAccount, simulated). Then the Safe executes it (two owner signatures): the operation reads done, depositsPaused and queuePaused read false"
    host: "control"
    phase: 9
    cmds:
      - ["bash", "-c", "id=$(cast call {m:fund-timelock.timelock} \"hashOperationBatch(address[],uint256[],bytes[],bytes32,bytes32)(bytes32)\" \"[{state:target-upg-unpause}]\" \"[0,0]\" \"[{state:data-upg-unpause}]\" $(cast hash-zero) \"{state:salt-upg-unpause}\") && test \"$(cast call {m:fund-timelock.timelock} \"isOperationReady(bytes32)(bool)\" \"$id\")\" = true && out=$(cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:fund-timelock.timelock} \"executeBatch(address[],uint256[],bytes[],bytes32,bytes32)\" \"[{state:target-upg-unpause}]\" \"[0,0]\" \"[{state:data-upg-unpause}]\" $(cast hash-zero) \"{state:salt-upg-unpause}\" 2>&1); echo \"deployer executeBatch of the ready operation: $(echo \"$out\" | head -n 1)\"; echo \"$out\" | grep -Eq \"AccessControlUnauthorizedAccount|0xe2517d3f\""]
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "executeBatch", "--targets", "{state:target-upg-unpause}", "--datas", "{state:data-upg-unpause}", "--values", "0,0", "--salt", "{state:salt-upg-unpause}", "--out", "{runDir}/bundles/unpause-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/unpause-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", "id=$(cast call {m:fund-timelock.timelock} \"hashOperationBatch(address[],uint256[],bytes[],bytes32,bytes32)(bytes32)\" \"[{state:target-upg-unpause}]\" \"[0,0]\" \"[{state:data-upg-unpause}]\" $(cast hash-zero) \"{state:salt-upg-unpause}\") && test \"$(cast call {m:fund-timelock.timelock} \"isOperationDone(bytes32)(bool)\" \"$id\")\" = true"]
      - ["bash", "-c", "test \"$(cast call {m:fund.fund} \"depositsPaused()(bool)\")\" = false && test \"$(cast call {m:queue.queue} \"queuePaused()(bool)\")\" = false"]
    env:
