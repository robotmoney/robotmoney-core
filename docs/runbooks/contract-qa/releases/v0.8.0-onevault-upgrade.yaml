      - ["bash", "-c", "cast call {m:fund.fund} \"totalAssets()(uint256)\" && cast call {m:queue.queue} \"quoteDeposit(uint256)((uint256,uint256,uint256,uint64,uint64))\" \"{sheet:FLOW_MIN_REQUEST_USDC}\""]
