      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/params-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/params-schedule.json", "--signer", "{signer}"]
      - ["bash", "-c", "cast call {m:fund-timelock.timelock} \"hashOperation(address,uint256,bytes,bytes32,bytes32)(bytes32)\" \"{state:target-upg-params}\" 0 \"{state:data-upg-params}\" $(cast hash-zero) \"{state:salt-upg-params}\" > {runDir}/state/upg-params-op && cast keccak \"robotmoney.deploy4-upgrade.executor.{runDir}\" > {runDir}/state/salt-upg-executor && echo \"{m:fund-timelock.timelock},{m:fund-timelock.timelock}\" > {runDir}/state/target-upg-executor && echo \"$(cast calldata \"grantRole(bytes32,address)\" $(cast keccak EXECUTOR_ROLE) {m:safe.safe}),$(cast calldata \"revokeRole(bytes32,address)\" $(cast keccak EXECUTOR_ROLE) 0x0000000000000000000000000000000000000000)\" > {runDir}/state/data-upg-executor"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "scheduleBatch", "--targets", "{state:target-upg-executor}", "--datas", "{state:data-upg-executor}", "--values", "0,0", "--salt", "{state:salt-upg-executor}", "--predecessor", "{state:upg-params-op}", "--out", "{runDir}/bundles/executor-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/executor-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/executor-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/executor-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "params-schedule.json", "required": true}
      - {"dir": "{runDir}/bundles", "pattern": "executor-schedule.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["salt-upg-params", "target-upg-params", "upg-params-op", "salt-upg-executor", "target-upg-executor", "data-upg-executor"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P3.81-upg-params-execute"
    standing: ["4.12", "4.10"]
    description: "After the timelock delay the Safe executes A: the operation reads done, and the queue's flowParams are the live ones with minHold {sheet:FLOW_MIN_HOLD} and nothing else changed (the raw words compared)"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "execute", "--target", "{state:target-upg-params}", "--data", "{state:data-upg-params}", "--salt", "{state:salt-upg-params}", "--out", "{runDir}/bundles/params-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/params-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/params-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/params-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", "test \"$(cast call {m:fund-timelock.timelock} \"isOperationDone(bytes32)(bool)\" \"{state:upg-params-op}\")\" = true"]
      - ["bash", "-c", "r={state:upg-flow-params-before}; n=$(cast call {m:queue.queue} \"flowParams()\"); echo \"flowParams $n\"; test \"${n:0:130}\" = \"${r:0:130}\" && test \"${n:194:2000}\" = \"${r:194:2000}\" && test \"$(cast to-dec 0x${n:130:64})\" = \"{sheet:FLOW_MIN_HOLD}\""]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "params-execute.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P3.80-upg-config-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.8.0-onevault-upgrade"
  - id: "P3.82-upg-executor-execute"
    standing: ["4.12", "4.10"]
    description: "Then the Safe executes B, the last governed change: the batch reads done, the Safe holds EXECUTOR_ROLE and address(0) no longer does, the Safe is still the only proposer and canceller, and the deployer holds no timelock role. fund-upgrade-record.ts executor re-records the run's fund-timelock.json executorPolicy safe-only with this operation. From here the timelock refuses any executor but the Safe: the deployer's and the keeper's execute are refused for their role (AccessControlUnauthorizedAccount, simulated), where P0.94 saw only the operation state refuse"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "executeBatch", "--targets", "{state:target-upg-executor}", "--datas", "{state:data-upg-executor}", "--values", "0,0", "--salt", "{state:salt-upg-executor}", "--predecessor", "{state:upg-params-op}", "--out", "{runDir}/bundles/executor-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/executor-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/executor-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/executor-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", "id=$(cast call {m:fund-timelock.timelock} \"hashOperationBatch(address[],uint256[],bytes[],bytes32,bytes32)(bytes32)\" \"[{state:target-upg-executor}]\" \"[0,0]\" \"[{state:data-upg-executor}]\" \"{state:upg-params-op}\" \"{state:salt-upg-executor}\") && test \"$(cast call {m:fund-timelock.timelock} \"isOperationDone(bytes32)(bool)\" \"$id\")\" = true"]
      - ["bash", "-c", "h() { cast call {m:fund-timelock.timelock} \"hasRole(bytes32,address)(bool)\" \"$1\" \"$2\"; }; test \"$(h $(cast keccak EXECUTOR_ROLE) {m:safe.safe})\" = true && test \"$(h $(cast keccak EXECUTOR_ROLE) 0x0000000000000000000000000000000000000000)\" = false && test \"$(h \"$(cast keccak PROPOSER_ROLE)\" {m:safe.safe})\" = true && test \"$(h \"$(cast keccak CANCELLER_ROLE)\" {m:safe.safe})\" = true && for r in $(cast keccak EXECUTOR_ROLE) \"$(cast keccak PROPOSER_ROLE)\" \"$(cast keccak CANCELLER_ROLE)\" $(cast hash-zero); do test \"$(h \"$r\" \"{sheet:ADMIN_ADDRESS}\")\" = false || exit 1; done && echo \"executor: the Safe only\""]
      - ["bun", "publish-contracts/src/fund-upgrade-record.ts", "executor", "--evidence", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--schedule-bundle", "{runDir}/bundles/executor-schedule.json", "--execute-bundle", "{runDir}/bundles/executor-execute.json"]
      - ["bash", "-c", "for a in \"{sheet:ADMIN_ADDRESS}\" \"{sheet:KEEPER_ADDRESS}\"; do out=$(cast call --from \"$a\" {m:fund-timelock.timelock} \"execute(address,uint256,bytes,bytes32,bytes32)\" 0x0000000000000000000000000000000000000001 0 0x $(cast hash-zero) $(cast hash-zero) 2>&1); echo \"$a execute: $(echo \"$out\" | head -n 1)\"; echo \"$out\" | grep -Eq \"AccessControlUnauthorizedAccount|0xe2517d3f\" || exit 1; done"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/bundles", "pattern": "executor-execute.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P3.80-upg-config-schedule", "hours": "timelockDelay"}
    maxMinutes: 60
    added: "v0.8.0-onevault-upgrade"
  - id: "P3.83-upg-verify"
    standing: ["4.3", "4.12"]
    description: "The fund verifier on the upgraded live system ({d4common}: the live sha's frozen counts and handover nonce): the fund and queue proxies against the v0.8.0 build their recorded upgrade names, every other proxy against the live build, the timelock's executor the Safe alone (decision D4-10, the re-recorded manifest and the chain), every role, the one-time bindings, the fund config and the queue's flowParams against the run sheet (minHold 3600)"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{d4common}", "--system", "fund", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    maxMinutes: 60
    added: "v0.8.0-onevault-upgrade"
  - id: "P3.84-upg-owner-liveness"
    standing: ["4.3", "4.10"]
    description: "The owner key liveness record of the live Safe (row P2.61 of v0.8.0-onevault, on the live system): the Deploy 4 prove-control transaction carries a signature of every SAFE_OWNERS key, recovered over its Safe transaction hash on 8453, the chain it was signed for (read through the fork on the Twin); and every Safe bundle this run executed carries at least two signatures, each of a SAFE_OWNERS key, so owners A and B have signed again today. It only reads"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/ci/owner-liveness.ts", "--run-manifest", "{evidenceDir}/publish-run.json", "--owners", "{sheet:SAFE_OWNERS}", "--rpc", "{rpcUrl}", "--chain-id", "8453", "--out", "{evidenceDir}/owner-liveness.json"]
      - ["bash", "-c", "owners=$(echo \"{sheet:SAFE_OWNERS}\" | tr A-F a-f); for b in {runDir}/bundles/*.json; do jq -e \".executed.tx_hash != null and (.signatures | length) >= 2\" \"$b\" > /dev/null || { echo \"$b: not executed with two signatures\" >&2; exit 1; }; for o in $(jq -r \".signatures[].owner\" \"$b\" | tr A-F a-f); do echo \"$owners\" | tr , \"\\n\" | grep -qx \"$o\" || { echo \"$b: $o is no Safe owner\" >&2; exit 1; }; done; echo \"$(basename $b): $(jq -r \"[.signatures[].owner] | join(\\\",\\\")\" \"$b\")\"; done"]
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "owner-liveness.json", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  # ── Phase 4, verify again: the post-govern state. ──
  - id: "P3.85-upg-epoch-schedule"
    standing: ["4.4"]
    description: "Owner, 2026-11-14 (D4-15): shorter epochs so the flow test does not wait hours. The Safe schedules queue.setFlowParams with epochLength 3600 (the contract floor, 1 h) and settleWindow 720 (12 slices of 60 s, the shortest window the live slice count allows), every other field as it reads now (minHold 3600 after P3.81). A new epochLength applies from the end of the epoch in progress (FlowQueue.setFlowParams), so no open request moves. The change is simulated from the timelock first"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "-c", 'n=$(cast call {m:queue.queue} "flowParams()"); echo "$(cast sig "setFlowParams((uint32,uint32,uint32,uint32,uint16,uint128,uint16,uint16,uint128,uint32,uint8,uint8,uint16,uint16,uint16,uint32,uint16,uint16))")$(cast to-uint256 3600 | cut -c3-)$(cast to-uint256 720 | cut -c3-)${n:130:2000}" > {runDir}/state/data-upg-epoch && cast call --from {m:fund-timelock.timelock} {m:queue.queue} "$(cat {runDir}/state/data-upg-epoch)" > /dev/null && cast keccak "robotmoney.deploy4-upgrade.epoch.{runDir}" > {runDir}/state/salt-upg-epoch && echo "{m:queue.queue}" > {runDir}/state/target-upg-epoch && echo "the queue accepts epochLength 3600 and settleWindow 720 from the timelock (simulated)"']
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "schedule", "--target", "{state:target-upg-epoch}", "--data", "{state:data-upg-epoch}", "--salt", "{state:salt-upg-epoch}", "--out", "{runDir}/bundles/epoch-schedule.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/epoch-schedule.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/epoch-schedule.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/epoch-schedule.json", "--signer", "{signer}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    writes: ["data-upg-epoch", "salt-upg-epoch", "target-upg-epoch"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P3.86-upg-epoch-execute"
    standing: ["4.4"]
    description: "After the timelock delay the Safe executes the epoch change (the executor is the Safe only since P3.82). The queue then reads epochLength 3600, settleWindow 720 and minHold unchanged, and the run's sheet copy takes the two new values so every later check compares the chain with what it holds; the live Deploy 4 record is not touched"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/safe/cli.ts", "propose", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--safe", "{m:safe.safe}", "--timelock", "{m:fund-timelock.timelock}", "--action", "execute", "--target", "{state:target-upg-epoch}", "--data", "{state:data-upg-epoch}", "--salt", "{state:salt-upg-epoch}", "--out", "{runDir}/bundles/epoch-execute.json"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/epoch-execute.json", "--signer", "{ownerSigner}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "sign", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/epoch-execute.json", "--signer", "{ownerSigner2}"]
      - ["bun", "publish-contracts/src/safe/cli.ts", "execute", "--rpc", "{rpcUrl}", "--chain-id", "{chainId}", "--bundle", "{runDir}/bundles/epoch-execute.json", "--signer", "{signer}"]
      - ["bash", "-c", 'n=$(cast call {m:queue.queue} "flowParams()"); echo "flowParams $n"; test "$(cast to-dec 0x${n:2:64})" = 3600 && test "$(cast to-dec 0x${n:66:64})" = 720 && test "$(cast to-dec 0x${n:130:64})" = "{sheet:FLOW_MIN_HOLD}" && { test -f {runDir}/sheet-at-go.env || cp {sheet} {runDir}/sheet-at-go.env; } && sed -i -e "s/^FLOW_EPOCH_LENGTH=.*/FLOW_EPOCH_LENGTH=3600/" -e "s/^FLOW_SETTLE_WINDOW=.*/FLOW_SETTLE_WINDOW=720/" {sheet} && grep -E "^FLOW_(EPOCH_LENGTH|SETTLE_WINDOW)=" {sheet}']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    notBefore: {"afterStep": "P3.85-upg-epoch-schedule", "hours": "timelockDelay"}
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P4.01-verify-post-govern"
    standing: ["4.3"]
    description: "Stage 12 again: all four unpause rows executed, all four vaults read depositsPaused false; a manifest that disagrees with the chain fails closed"
    host: "control"
    phase: 4
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    maxMinutes: 60
  # ── Phase 5, the consensus receipt: recorded by the submitter Safe, then APPLIED by the governing Safe through the timelock (runbook 4.9). ──
  - id: "P5.00-receipt-payload"
    standing: ["4.10"]
    description: "The Twin's receipt payload: the real production envelope with the three-vault vector USDC 8000, PROTO 1000, RWA 1000 (agent_tokens 0, ADR-0017), written by the run. It weights every vault, so the post-rebalance router deposit routes into all three (three legs, within its 8,400,000 gas: 400,000 plus 2,550,000 per leg), and it differs from the sheet's default vector (9500, 500, 0), so applying it changes the router split the run checks (P5.05, P6.32). On 8453 the operator passes the receipt the canonical route serves as {receiptFile}; a receipt that weights agent_tokens is refused by apply-receipt and the run stops"
    host: "control"
    phase: 5
    cmds:
      - ["bun", "scripts/runbook/receipt-payload.ts", "--out", "{receiptFile}", "--weights", "USDC:8000,PROTO:1000,RWA:1000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P5.01-receipt-offline"
    standing: ["4.10"]
    description: "The receipt id and the payload digest come from the one shared definition, never a plain keccak256 of the file"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-id {receiptFile} > {runDir}/state/receipt-id"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts receipt-digest {receiptFile} > {runDir}/state/receipt-digest"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["receipt-id", "receipt-digest"]
  # ── Issue 1984: the round BEFORE the router rebalance. P5.03 applies the receipt, which is the rebalance (publish-contracts/src/govern.ts); ADR-0003 routes only NEW
  # deposits by the new vector, so a run deposits, routes and redeems on the vector in effect first, then again on the receipt's vector in phase 6. These steps run where
  # P5.03 runs, and before the receipt is recorded, so a receipt that would not change the split stops the run before anything irreversible. They write pre-* state only. ──
  - id: "P5.05-receipt-changes-split"
    standing: ["4.4", "4.9"]
    description: "Before the rebalance the router's effective weights, whatever votedWeightsActive reads (on a new deployment the sheet's default vector; the runbook never clears a vector, issue 1980), are saved as the pre-rebalance vector; the receipt about to be recorded weights the vaults differently from that vector, so applying it changes the split the router deposits follow"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" > {runDir}/state/pre-router-weights && cat {runDir}/state/pre-router-weights']
      - ["bun", "scripts/runbook/qa-assert.ts", "receipt-changes-split", "{receiptFile}", "{runDir}/state/pre-router-weights"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["pre-router-weights"]
  - id: "P5.10-pre-deposit-rmusdc"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 1 USDC into rmUSDC at the 2,500,000 gas limit; the shares it minted (the balance after less the balance before) equal previewDeposit within 0.5 percent"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'cast call "{m:vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/pre-preview-USDC']
      - ["bash", "-c", 'cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance0-USDC']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "2500000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance1-USDC']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts sub {state:pre-balance1-USDC} {state:pre-balance0-USDC} > {runDir}/state/pre-shares-USDC"]
      - ["bun", "scripts/runbook/qa-assert.ts", "within-bps", "{state:pre-shares-USDC}", "{state:pre-preview-USDC}", "50"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["pre-preview-USDC", "pre-balance0-USDC", "pre-balance1-USDC", "pre-shares-USDC"]
    exercises: "vault-deposit"
  - id: "P5.11-pre-deposit-rmproto"
    standing: ["4.3", "4.4"]
    description: "Before the rebalance, 1 USDC into rmPROTO; the shares it minted are at least previewDeposit and above it by no more than the maxSlippageBps haircut plus the same slippage in the depositor's favour, because a swap can beat the oracle price (issue 1990)"
    host: "control"
    phase: 5
    cmds:
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "previewDeposit(uint256)(uint256)" 1000000 | cut -d" " -f1 > {runDir}/state/pre-preview-PROTO']
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance0-PROTO']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:protocol-asset-vault.vault}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:protocol-asset-vault.vault}", "deposit(uint256,address)", "1000000", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'cast call "{m:protocol-asset-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/pre-balance1-PROTO']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts sub {state:pre-balance1-PROTO} {state:pre-balance0-PROTO} > {runDir}/state/pre-shares-PROTO"]
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:pre-shares-PROTO}", "{state:pre-preview-PROTO}"]
      - ["bash", "-c", 'b=$(cast call "{m:protocol-asset-vault.vault}" "maxSlippageBps()(uint256)" | cut -d" " -f1) && echo $(( 100000000 * 10000 / ((10000 - b) * (10000 - b)) - 10000 + 1 )) > {runDir}/state/pre-share-bound-PROTO']
