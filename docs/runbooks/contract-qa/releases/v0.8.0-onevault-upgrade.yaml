  # ── v0.8.0-onevault-upgrade, flow fund-upgrade, phase 6 ──
  - id: "P6.90-upg-twin-feeds"
    standing: ["9", "4.4"]
    description: "On the Twin only: the fork serves each feed's pin round, so before the queue rows read the feeds they are restated. The Twin feed step (twin-feeds.ts refresh, decision D4-9): each basket and peg feed gets one new round on its real aggregator restating its answer at the pin block, stamped at the fork clock, journaled in feed-refresh.jsonl; no pool, token, fund or queue slot is written and no code is etched"
    host: "control"
