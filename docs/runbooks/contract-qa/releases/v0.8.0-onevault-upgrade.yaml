    phase: 6
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "cancel(uint256)", "{state:upg-request-d}", "{cast}"]
      - ["bash", "-c", 'test "$(cast call {m:queue.queue} "requestStatus(uint256)(uint8)" "{state:upg-request-d}")" = 3']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "withdrawCredit()", "{cast}"]
      - ["bash", "-c", 'cast call {m:queue.queue} "quoteDeposit(uint256)((uint256,uint256,uint256,uint64,uint64))" 1000000 | tr -d "()" | cut -d, -f1 | cut -d" " -f1 > {runDir}/state/upg-deposit-bound && echo "$(bun -e "console.log((BigInt(process.argv[1])*10050n/10000n).toString())" "$(cat {runDir}/state/upg-deposit-bound)")" > {runDir}/state/upg-deposit-limit && cat {runDir}/state/upg-deposit-bound {runDir}/state/upg-deposit-limit']
      - ["bash", "scripts/runbook/cast-send.sh", "{usdc}", "approve(address,uint256)", "{m:queue.queue}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,uint256,address)", "1000000", "{state:upg-deposit-limit}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", 'cast call {m:queue.queue} "requestCount()(uint256)" | cut -d" " -f1 > {runDir}/state/upg-request-d && r=$(cast call {m:queue.queue} "getRequest(uint256)((address,uint8,uint64,uint256,uint256,uint256,bool))" "$(cat {runDir}/state/upg-request-d)" | tr -d "()") && test "$(echo "$r" | cut -d, -f1 | tr -d " ")" = "{sheet:ADMIN_ADDRESS}" && echo "$r" | cut -d, -f3 | tr -d " " | sed "s/[[].*//" > {runDir}/state/upg-request-d-epoch && echo "new request $(cat {runDir}/state/upg-request-d) in epoch $(cat {runDir}/state/upg-request-d-epoch)"']
