  - id: "P6.91-upg-request-deposit"
    standing: ["4.4"]
    description: "The limit is the quoted bound plus 0.5% (a depositor's slippage margin: on 8453 the share price moved 0.001% between request and settle and the queue skipped a zero-margin request, RequestSkipped, 2026-11-14). The deployer approves the queue for 1 USDC and requests one deposit of 1 USDC (FLOW_MIN_REQUEST_USDC) bounded by quoteDeposit's boundPrice: the request is the newest id, owned by the deployer, pending, and the deployer's USDC fell by exactly 1 USDC"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", "cast call {m:queue.queue} \"quoteDeposit(uint256)((uint256,uint256,uint256,uint64,uint64))\" 1000000 | tr -d \"()\" | cut -d, -f1 | cut -d\" \" -f1 > {runDir}/state/upg-deposit-bound && echo \"$(bun -e \"console.log((BigInt(process.argv[1])*10050n/10000n).toString())\" \"$(cat {runDir}/state/upg-deposit-bound)\")\" > {runDir}/state/upg-deposit-limit && cat {runDir}/state/upg-deposit-bound {runDir}/state/upg-deposit-limit"]
      - ["bash", "-c", "cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1 > {runDir}/state/upg-usdc-before-request"]
      - ["bash", "scripts/runbook/cast-send.sh", "{usdc}", "approve(address,uint256)", "{m:queue.queue}", "1000000", "{cast}"]
      - ["bash", "scripts/runbook/cast-send.sh", "{m:queue.queue}", "requestDeposit(uint256,uint256,address)", "1000000", "{state:upg-deposit-limit}", "{sheet:ADMIN_ADDRESS}", "{cast}"]
      - ["bash", "-c", "cast call {m:queue.queue} \"requestCount()(uint256)\" | cut -d\" \" -f1 > {runDir}/state/upg-request-d && r=$(cast call {m:queue.queue} \"getRequest(uint256)((address,uint8,uint64,uint256,uint256,uint256,bool))\" \"$(cat {runDir}/state/upg-request-d)\") && bun scripts/runbook/qa-assert.ts eq \"$(echo \"$r\" | tr -d \"()\" | cut -d, -f1)\" \"{sheet:ADMIN_ADDRESS}\" && test \"$(cast call {m:queue.queue} \"requestStatus(uint256)(uint8)\" \"$(cat {runDir}/state/upg-request-d)\")\" = 1 && echo \"$r\" | tr -d \"()\" | cut -d, -f3 | tr -d \" \" | sed \"s/[[].*//\" > {runDir}/state/upg-request-d-epoch"]
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts eq \"$(bun scripts/runbook/qa-assert.ts sub {state:upg-usdc-before-request} \"$(cast call \"{usdc}\" \"balanceOf(address)(uint256)\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1)\")\" 1000000"]
