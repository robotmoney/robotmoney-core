  - id: "P9.84-upg-twin-held-claims"
    standing: ["9", "4.4"]
    description: "On the Twin only, last: the deposits Deploy 4 settled under the 24 h hold stay claimable after the upgrade. The Twin clock moves past the latest unlockAt of claims-before.json, and each of those claims reads claimable (claimableDepositRequest above zero), and the deployer's claim of all of them succeeds in simulation (nothing sent: on 8453 the v0.7.0-onevault run claims them itself)"
