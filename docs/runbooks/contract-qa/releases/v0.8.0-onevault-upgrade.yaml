      - ["bash", "-c", "sum=0; for r in $(jq -r \".[] | select(.kind == 0 and .claimed == \\\"0\\\") | .requestId\" {runDir}/claims-before.json); do c=$(cast call {m:queue.queue} \"claimableDepositRequest(uint256,address)(uint256)\" \"$r\" \"{sheet:ADMIN_ADDRESS}\" | cut -d\" \" -f1); echo \"request $r claimable $c\"; bun scripts/runbook/qa-assert.ts ge \"$c\" 1 || exit 1; sum=$((sum + c)); done; cast call --from \"{sheet:ADMIN_ADDRESS}\" {m:queue.queue} \"deposit(uint256,address)(uint256)\" \"$sum\" \"{sheet:ADMIN_ADDRESS}\""]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: "twin"
    added: "v0.8.0-onevault-upgrade"
