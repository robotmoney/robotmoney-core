      - ["bash", "-c", "! bun scripts/runbook/qa-assert.ts eq \"{state:upg-fund-impl}\" \"{m:fund.fund_implementation}\" && test \"$(cast code \"{state:upg-fund-impl}\" | wc -c)\" -gt 100"]
