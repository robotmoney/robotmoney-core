# docs/runbooks/contract-qa/releases/v0.8.0-onevault-upgrade.yaml: the in-place upgrade of the LIVE Deploy 4 fund system on Base 8453 to the hardened code of
# v0.8.0-onevault (owner, 2026-11-14: "stop waiting on 24 h holds; upgrade Deploy 4 in place to test upgradeability and the new features"). It runs against the
# existing deployment, as v0.6.0's upgrade flow ran against Deploy 3: the record of the live run (releases/v0.7.0-onevault.yaml, Deploy 4) is copied, never edited.
# A full copy of template.yaml's steps, unchanged and in order, plus the steps this release adds, each `added: v0.8.0-onevault-upgrade` and `flow: fund-upgrade`.
# The release runs only the fund-upgrade flow (flows: below), so no template step runs. scripts/runbook/validate-contract-qa.ts checks it; scripts/runbook/run.ts runs it.
# The rc tag of the code is v0.8.0-onevault's: release/v0.8.0-onevault-rc.N-rehearsal.
release: v0.8.0-onevault-upgrade
template: contract-qa
productionReady: false
vaults: ["fund"]
flows:
  twin: ["fund-upgrade"]
  rehearsal: ["fund-upgrade"]
  production: ["fund-upgrade"]
notes: |
  Why a release file of its own. releases/v0.8.0-onevault.yaml deploys the hardened fund system as a NEW system (its flow fund publishes a Safe, every proxy and a
  timelock whose CREATE2 address differs from Deploy 4's, decision D4-10). This file upgrades the live Deploy 4 system to the same code instead. Folding it into
  v0.8.0-onevault.yaml as a second flow (the v0.6.0 model, flows twin [new, upgrade]) would make a Twin run of either publish a whole new fund system it does not need,
  and would change what an 8453 run of v0.8.0-onevault means. A file of its own keeps v0.8.0-onevault.yaml the record of a new deploy and gives the upgrade its own
  report and sign-off. Its flow is fund-upgrade: a fund-system flow (the fund sheet and manifests, and every rule of the fund flow: keeper gas, Safe-only executes, the
  hold wait), which the validator and the runner treat as the fund flow (FUND_FLOWS). production is named only so it does not default to the new flow: every step is
  onlyFor twin or rehearsal, so a production run has no step and is refused.

  What changes on chain (7c23569f8, the live build, against this sha; publish-contracts' masked runtime comparison, links, immutables and the metadata trailer masked).
  Two implementations change executable code: RobotMoneyFund (shutdown and emergencyUnwind move from EMERGENCY_ROLE to ADMIN_ROLE) and FlowQueue (MIN_HOLD, the floor
  setFlowParams accepts, 1 day to 1 hour). Rebalancer, RebalanceGovernance, ConsensusRecommendationReceipt, ERC1967Proxy, ProposerFloorTimelock, every fund library
  (fund-libs: FundAdminLib, FundFlowsLib, FundPositionLib, FundStepLib, FundValuationLib, FlowCheckLib, FlowClaimLib, FlowSettleLib, StepFeedLib, BasketSwaps,
  BasketAssetConfigGuard, GovernedUpgrade, TickMath, TwapTickMath), the adapters and the exclusion ledger differ in their metadata trailer only. So no library is
  deployed: deploy-implementation links the two new implementations to the live libraries, which it reads from the live implementations. Storage layouts:
  scripts/ci/check-core-storage-layout.sh --baseline 7c23569f8 passes (every snapshot equal, every fund proxy extends the live layout), and deploy-implementation's
  layout gate checks the new build's snapshot against the live build's again before each deploy.

  The sequence (every governed call a Safe transaction to the fund timelock with two owner signatures, the deployer as gas payer, publish-contracts/src/safe/cli.ts):
  P1.81 and P1.82 deploy the two implementations; P2.80 and P2.81 schedule fund.upgradeToAndCall and queue.upgradeToAndCall, ONE operation each; P2.82 and P2.83
  execute them, and fund-upgrade-record.ts re-records the run's manifest copy and the run manifest's proxy_upgrades (the record govern --row upgrade-proxy writes for
  the vaults system); P3.80 schedules (A) queue.setFlowParams with minHold 3600 and every other field the live value, and (B) the executor switch on the timelock
  itself, grantRole(EXECUTOR_ROLE, Safe) then revokeRole(EXECUTOR_ROLE, address(0)) in one batch, with A as B's predecessor; P3.81 executes A, P3.82 executes B last and
  fund-upgrade-record.ts re-records executorPolicy safe-only. setFlowParams must come after the queue upgrade (the live code refuses minHold under 1 day). The switch
  goes last and every execute of this file goes through the Safe, before the switch as after it, so nothing waits on a non-Safe executor. The pause drill's unpause
  (P9.81, P9.82) is the first operation executed under the Safe-only executor, and P9.82 first proves the timelock refuses that ready operation to the deployer.

  The deposits in their hold. Deploy 4 settled three 1 USDC deposit requests of the deployer at the 24 h hold before the upgrade. Each claim's unlockAt was fixed at its
  settlement (FlowSettleLib: unlockAt = settlement time + minHold), so neither the upgrade nor the new minHold moves it: P0.94 snapshots every claim (claims-before.json)
  and P2.84, P6.93, P6.94, P6.99 and P9.83 read them the same; on the Twin P9.84 moves the clock past their unlockAt and reads them claimable. The queue delivers a
  receiver's deposit claims oldest first, so the flow test's claim (P6.94) would take a Deploy 4 claim whose hold has ended: its guard (fund-claims.ts guard) refuses
  while any other deposit claim of the deployer is open and out of its hold within 300 s. On 8453 those holds end 2026-11-15 01:00:15 UTC (unlockAt 1794704415): a claim
  after that waits until the v0.7.0-onevault run's own claim steps (P6.62, P6.67, P6.68) took them. The rebalance plan Deploy 4 opened is not touched: the fund's plan id
  is read the same after the upgrade.

  Timing. The flow test requests 1 USDC, settles it, waits the 1 h hold, claims, redeems and claims. FLOW_EPOCH_LENGTH (21600) and FLOW_SETTLE_WINDOW (3600) stay: a new
  epochLength applies only from the end of the epoch in progress (FlowQueue.setFlowParams), so it would not shorten the first settle, and the fund keeps its own copy for
  the in-kind period (IRobotMoneyFund: the Safe keeps them equal), so a change is two more governed calls for no gain. A settle waits at most 7 h (the epoch's end plus the
  window), the claim 1 h more, the redemption settles in the next epoch. With the three timelock waits (900 s each) an 8453 run takes about 9 to 14 hours. The Twin
  moves its clock instead (decision D4-9: the feed step restates the pin answers; the runner warps the hold and the timelock waits).

  The live record and the run's copy. {liveManifestDir} and {liveEvidenceDir} are the Deploy 4 record (its manifests and publish-run.json) and {liveSheet} its run sheet:
  read only. P0.85 copies them to {manifestDir} and {evidenceDir} and writes their sha256; P9.83 proves them unchanged. On 8453 run.ts requires {manifestDir} equal to
  {v050ManifestDir} and {evidenceDir} to {v050EvidenceDir}: set both pairs to the run's copies. The CLI runs from this checkout and names the live build with --core-dir
  {runDir}/v070 and --core-sha 7c23569f8 ({d4common}): the release gate on 8453 runs at the live sha (release/v0.7.0-onevault-rc.5-rehearsal, its green CI, its frozen
  counts committed in 04d63aa3f), and the new build ({runDir}/v080, the run's sha) is deploy-implementation's --upgrade-build, which the CLI gates on 8453 as an rc build
  (decision D4-13). The verifier compares each upgraded proxy with the build its proxy_upgrades entry names and every other proxy with the live build.

  The Twin. A fork of Base at a current block (it holds the live Deploy 4), chain 918453, started by the operator before the run and stopped after it: on this machine
  for this rehearsal (owner instruction 2026-11-14), so no step starts or stops it (README Hosts). The Twin signs with the live keystores (the deployer, the keeper, the
  emergency key and Safe owners A and B), with a passphrase file, which only chain 918453 accepts; the config adds it to {signer}, {ownerSigner}, {ownerSigner2} and the
  cast lists. P0.86 and P0.88 set the Twin chain id in the run's copies (manifests and sheet); nothing else differs from an 8453 run. The Twin rows P6.90, P6.92,
  P6.95 and P6.97 are the feed step of decision D4-9; P9.84 reads the held claims claimable. The Twin config gives the cast lists Base's fee level
  (--priority-gas-price 1000000 --gas-price 20000000): anvil suggests a 1 gwei priority fee, and at that price the keeper's live 0.00095 ETH caps the settle's gas
  estimate under the 2.1 M gas it uses, so the estimate reverts; on 8453 cast reads the chain's own fees (about 0.005 gwei). No balance is written on the fork.

  Counts. The upgrade adds no deployer stage: deploy-implementation is one CREATE outside the stage table, recorded in the run manifest's implementation_deploys, and
  the gate's frozen counts are the live sha's. No counts file is added.

  The pinned records v0.4.0, v0.5.0, v0.6.0 and v0.7.0-onevault are not changed.
decisions:
  - id: "D4-10"
    question: "Who may execute a ready operation on the fund system's timelock: anyone (ADR-0004's open executor, which the vaults system keeps) or only the fund Safe"
    status: decided
    answer: "Owner, 2026-11-13: Safe-only executor for the fund timelock (releases/v0.8.0-onevault.yaml). The live Deploy 4 timelock was deployed with the open executor, so this release applies the decision to it in place: ONE timelock batch on the timelock itself, grantRole(EXECUTOR_ROLE, the Safe) and revokeRole(EXECUTOR_ROLE, address(0)), scheduled and executed by the Safe as the upgrade's last governed change (P3.80, P3.82)."
    decidedOn: "2026-11-13"
    ref: "owner decision relayed by the coordinator after the external review of Deploy 4, 2026-11-13; releases/v0.8.0-onevault.yaml D4-10"
  - id: "D4-11"
    question: "How long are deposit shares held after their settlement (FlowQueue minHold)"
    status: decided
    answer: "Owner, 2026-11-13: minHold 1 hour, the new floor (releases/v0.8.0-onevault.yaml D4-11). On the live queue it takes the upgrade to the v0.8.0 FlowQueue (the live code's floor is 1 day) and then ONE governed setFlowParams with every other field unchanged (P3.80, P3.81). Claims settled before it keep the unlockAt fixed at their settlement."
    decidedOn: "2026-11-13"
    ref: "owner decision relayed by the coordinator, Deploy 4 hardening session, 2026-11-13; releases/v0.8.0-onevault.yaml D4-11"
  - id: "D4-12"
    question: "Go to broadcast the in-place upgrade of Deploy 4 on Base 8453: run this file on the rehearsal target from the rc tag release/v0.8.0-onevault-rc.N-rehearsal at the commit whose Twin run passed (the owner runs it)"
    status: "decided"
    answer: "Owner, 2026-11-14: upgrade the live Deploy 4 in place to v0.8.0 on Base 8453, to test upgradeability and the new features, instead of finishing the v0.7.0 checks; this is the go to broadcast the upgrade."
    decidedOn: "2026-11-14"
    ref: "issue 2015"
  - id: "D4-13"
    question: "On 8453 deploy-implementation gates its --upgrade-build like a release candidate (publish-contracts/src/release-gate.ts assertUpgradeBuildGate): an annotated tag matching release/vA.B.C-rc.N[-rehearsal] that is on origin/releases-A.B.x. The one-vault line's tags (release/v0.8.0-onevault-rc.N-rehearsal) do not match that pattern and the branch is unmerged, so P1.81 refuses on 8453 (the Twin skips the gate). Which way: (a) waive the releases-A.B.x rule for this rehearsal as D4-6 waived the merge to dev, with a reviewed change that accepts the onevault rc tag at the branch's pushed commit; (b) cut a release branch for the one-vault line; (c) another way the owner names"
    status: "decided"
    answer: "Met, not waived (2026-11-14): branch releases-0.8.x and the annotated tag release/v0.8.0-rc.N-rehearsal on the upgrade build, as release-gate.ts assertUpgradeBuildGate requires."
    decidedOn: "2026-11-14"
    ref: "issue 2015"
  - id: "D4-14"
    question: "Gate the 8453 upgrade on green CI at the upgrade build (check-sha-green), as every 8453 broadcast does, or waive that one check for this rehearsal?"
    status: "decided"
    answer: "Owner, 2026-11-14: the 0.8.0 upgrade rehearsal does not gate on CI runs. The run sets CI_GATE_WAIVER=D4-14 (publish-contracts/src/release-gate.ts ciGateWaiver): the plan, the implementation deploys and every publish-contracts call skip check-sha-green and log ci.gate_waived; the tag, the canonical remote tag, the release branch and the counts are still enforced. A production sheet refuses the waiver."
    decidedOn: "2026-11-14"
    ref: "issue 2015"
  - id: "D4-15"
    question: "The flow test waits two 6 h epochs plus their 1 h settle windows. Shorten the queue's epochs on the upgraded Deploy 4?"
    status: "decided"
    answer: "Owner, 2026-11-14: yes. P3.85 and P3.86 set epochLength 3600 (the contract floor) and settleWindow 720 (12 slices of 60 s; 600 was refused, FlowParamOutOfBounds(10)) through the Safe and timelock, after the executor switch; it applies from the end of the epoch in progress."
    decidedOn: "2026-11-14"
    ref: "issue 2015"
recovery: |
  Contracts are not rolled back in place by this file, but a governed upgrade back to the live implementation is possible: the fund and queue proxies stay upgradeable
  (UPGRADE_MODE upgradeable) and the live implementations stay on chain (the run manifest's proxy_upgrades names each from_implementation). Before P1.80 nothing is sent:
  fix on the branch and run again. A failed implementation deploy reruns (deploy-implementation reuses a recorded implementation with the build's code). A scheduled
  operation that must not run is cancelled by the Safe before it is ready (safe/cli.ts propose --action cancel --id). The executor switch (B) cannot run before the minHold
  change (A): its predecessor is A, so a failed A leaves the open executor in place and B pending; cancel B and schedule both again. After B, every execute needs the Safe:
  a lost Safe threshold stops every governed change, as for any fund operation. The emergency key still pauses deposits and the queue at once (P9.80); redeem in kind,
  cancel, the in-kind exit and withdrawals stay open. shutdown and emergencyUnwind now take the Safe and the 900 s delay. The fund holds at most FUND_TVL_CAP (1,000 USDC).
scope:
  - {pr: 2000, what: "reproducible contract build across checkout paths, pinned forge and library code gates: the fund verifier compares every fund-system proxy's runtime code with its build, the upgraded ones with the v0.8.0 build", check: "P3.83-upg-verify"}
steps:
  - id: "P0.01-runbook-valid"
    standing: ["4.1"]
    description: "The release runbook is the template plus additions, the sheet and target make sense, and a production run has no open owner decision"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.02-run-dirs"
    standing: ["4.3"]
    description: "The run directory layout every later receipt and state file lives in; the run directory is outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.04-checkout"
    standing: ["4.1"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.05-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.06-forge-build"
    standing: ["4.1"]
    description: "forge build succeeds at the DEPLOY_SHA"
    host: "control"
    phase: 0
    cmds:
      - ["forge", "build"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
    maxMinutes: 30
  - id: "P0.08-dependency-manifest"
    standing: ["4.2"]
    description: "The third-party dependency manifest for this release is recorded at the deploy block; run from the dev checkout, because it writes a file under deployments/ that would dirty the DEPLOY_SHA checkout"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "{countsCheckout}/scripts/release/preflight-guards.sh", "--dependency-manifest", "8453:{release}"]
    env:
      DEPENDENCY_MANIFEST_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts:
      - {"dir": "{countsCheckout}/deployments/dependency-manifests/8453", "pattern": "{release}.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
    onlyFor: ["rehearsal", "production"]
  - id: "P0.12-twin-fork"
    standing: ["9"]
    description: "The Twin chain (918453), a pinned lazy fork of Base, runs on the stage host (never on this machine): the host checkout is brought to the run's sha, port 8545 is checked free, the fork starts and is ready, an ssh tunnel brings it to {tunnelPort} here (reopened on every invocation), and its anvil.json is copied back"
    host: "control"
    phase: 0
    cmds:
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; mkdir -p $HOME/{stageDir} && cd {stageCore} && git fetch -q origin && git checkout -q --detach {coreSha} && git submodule update -q --init --recursive && test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = {coreSha} && if test -s $HOME/{stageDir}/twin/anvil.json && (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"the fork on 8545 already runs\"; elif (echo >/dev/tcp/127.0.0.1/8545) 2>/dev/null; then echo \"port 8545 is busy on the stage host\" >&2; exit 70; else bun scripts/devnet/twin-fork.ts start --port 8545 --state-dir $HOME/{stageDir}/twin; fi"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts wait-ready --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O check {stageHost} 2>/dev/null || { rm -f {runDir}/tunnel-8545.sock; ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -f -N -M -S {runDir}/tunnel-8545.sock -L {tunnelPort}:127.0.0.1:8545 {stageHost}; }"]
      - ["bash", "-c", "mkdir -p {runDir}/twin && scp -q {stageHost}:{stageDir}/twin/anvil.json {runDir}/twin/anvil.json"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/twin", "pattern": "anvil.json", "required": true}
    irreversible: false
    onlyFor: "twin"
    refresh: true
    maxMinutes: 15
  - id: "P0.13-twin-keys"
    standing: ["4.3"]
    description: "Throwaway keystores for the deployer, pauser, emergency key and three Safe owners; the passphrase stays in a 0600 file; the public addresses become the sheet fragment"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "umask 077 && head -c 24 /dev/urandom | od -An -tx1 | tr -d ' \\n' > {runDir}/passphrase"]
      - ["bash", "-c", "bun publish-contracts/src/rehearsal/cli.ts keys --dir {runDir}/keys --password-file {runDir}/passphrase --chain-id 918453 > {runDir}/fragment.env"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "fragment.env", "required": true}
    irreversible: false
    onlyFor: "twin"
    gateAbsent: "{runDir}/fragment.env"
  - id: "P0.15-sheet-merge"
    standing: ["4.3"]
    description: "The run sheet is the environment's committed sheet with the fragment's lines, through the real sheet parser"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/ci/merge-sheet.ts", "--template", "{sheetTemplate}", "--fragment", "{runDir}/fragment.env", "--out", "{sheet}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "sheet.env", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P0.17-check-sheet"
    standing: ["4.2", "4.10"]
    description: "The sheet agrees with the environment: chain id, deployment kind, timelock delay band, 1 USDC seed, caps, and as many owner signer specs as Safe owners"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--check-sheet", "{sheet}", "--target", "{target}", "--owner-signers", "{ownerSignerCount}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P0.07-preflight-guards"
    standing: ["4.2"]
    description: "EIP-170 size gate and the zero timelock delay guard pass on the exact build artifacts"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "scripts/release/preflight-guards.sh"]
    env:
      TIMELOCK_MIN_DELAY: "{sheet:TIMELOCK_MIN_DELAY}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.18-twin-fund"
    standing: ["9"]
    description: "Gas for every throwaway key and the real FiatToken balance of the deployer, on the Twin fork only"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-gas", "--rpc", "{rpcUrl}", "--sheet", "{sheet}"]
      - ["bun", "publish-contracts/src/rehearsal/cli.ts", "fund-usdc", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--usdc-units", "2000000000"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"
  - id: "P0.19-funding"
    standing: ["4.2"]
    description: "The deployer holds 7 USDC. The most a run needs at once is 5.32 (the contract ceilings: rmRWA maxSlippageBps at most 500 on the buy and on the sale, its exit fee at most 100 bps, so a round trip through rmRWA loses at most 11 percent; rmUSDC and rmRWA redeem to USDC, rmPROTO redeemInKind pays in tokens). It is the 1 USDC seed, plus what the round before the rebalance does not return as USDC (1.1 in rmPROTO tokens: 1 redeemed in kind, and the router's rmPROTO leg of 2 USDC at the 500 bps of the vector in effect, on a new deployment the sheet's default; at most 0.11 lost on the 1 USDC rmRWA round trip; that vector sends nothing to rmRWA), plus either the 3 vault deposits held at once after it (5.21) or, once they are redeemed (another 1 in rmPROTO tokens, at most 0.11 on rmRWA), the 2 USDC router deposit (5.32). The receipt's vector only splits that last router deposit, so it does not move the floor. The 1.68 spare is margin. A run without the pre-rebalance round (production) needs 4.11. The ETH balance is advisory: below 0.005 ETH the step prints a warning and the run goes on (the gas the run burns is about 0.003 ETH; every send goes through cast at the network fee). The upgrade flow checks its own funding at P8.25"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'cast balance "{sheet:ADMIN_ADDRESS}" > {runDir}/state/deployer-eth']
      - ["bash", "-c", "bun scripts/runbook/qa-assert.ts ge {state:deployer-eth} 5000000000000000 || echo 'advisory: the deployer holds less than 0.005 ETH, the gas a full run burns at a high network fee; the run goes on' >&2"]
      - ["bash", "-c", 'cast call "{usdc}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1 > {runDir}/state/deployer-usdc']
      - ["bun", "scripts/runbook/qa-assert.ts", "ge", "{state:deployer-usdc}", "7000000"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "new"
    onlyFor: ["rehearsal", "production"]
    writes: ["deployer-eth", "deployer-usdc"]
  - id: "P0.20-plan"
    standing: ["3", "4.3"]
    description: "The plan job: sheet, floors, chain id, release tag of the sheet's kind, committed frozen counts, green CI and core's config-check, with no signer"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "--stage", "plan", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{evidenceDir}", "{gate}"]
    env:
      GITHUB_TOKEN: "{env:GITHUB_TOKEN}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P0.21-dry-run"
    standing: ["4.3"]
    description: "Every deployer stage simulates in order on a blank local anvil and sends nothing"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "--dry-run", "--chain", "{chainId}", "--rpc", "{rpcUrl}", "--sheet", "{sheet}", "--signer", "address:{sheet:ADMIN_ADDRESS}", "--environment", "{environmentName}", "--core-sha", "{coreSha}", "--counts-dir", "{countsDir}", "--evidence", "{runDir}/evidence-dry", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{runDir}/manifests-dry"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["rehearsal", "production"]
    maxMinutes: 60
  # ── v0.8.0-onevault-upgrade, flow fund-upgrade, phase 0 ──
  - id: "P0.80-upg-runbook-valid"
    standing: ["4.1", "4.15"]
    description: "The release runbook is the template plus additions, it runs the fund-upgrade flow on this target, and a production run of it is refused (no fund-upgrade step runs in production, productionReady false)"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts", "--release", "{release}", "--target", "{target}", "--runnable"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.81-upg-run-dirs"
    standing: ["4.3"]
    description: "The run directory of the upgrade run, outside the core checkout (which must stay clean): state, journal, go records, evidence (the run's copy of the Deploy 4 run manifest), manifests (the run's copy of the Deploy 4 manifests), counts, and the Safe bundles of the fund-system timelock calls"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{evidenceDir}", "{manifestDir}", "{runDir}/counts", "{runDir}/bundles"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "bundles", "required": true}
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.82-upg-checkout"
    standing: ["4.1"]
    description: "The tool checkout is clean and its HEAD is the run's sha: on 8453 the rc tag of v0.8.0-onevault, on the Twin the QA commit. The CLIs run from it; the live build is the separate checkout of P0.91, the new build the one of P0.92"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", "test -z \"$(git status --porcelain)\" && test \"$(git rev-parse HEAD)\" = \"{coreSha}\""]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: "fund-upgrade"
    onlyFor: ["twin", "rehearsal"]
    added: "v0.8.0-onevault-upgrade"
  - id: "P0.83-upg-install"
    standing: ["4.1"]
    description: "publish-contracts dependencies come from the committed lockfile"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "install", "--frozen-lockfile", "--cwd", "publish-contracts"]
    expectExit: 0
    receipts: []
