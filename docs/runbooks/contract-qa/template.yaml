    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:rwa-basket-vault.vault}", "redeem(uint256,address,address)", "{state:shares-RWA}", "{sheet:ADMIN_ADDRESS}", "{sheet:ADMIN_ADDRESS}", "--gas-limit", "5000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:rwa-basket-vault.vault}" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"
  - id: "P6.24-redeem-retired-vault"
    standing: ["4.4", "4.14"]
    description: "Every vault the run retired (the run manifest publish-run.json, vault_retirements, ADR-0017; the step fails when the manifest is missing) is withdraw-only: retired() is true, maxDeposit is 0, and the admin's shares in it, if any, redeem to USDC. A run that retired no vault passes with nothing to check"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'test -f "{evidenceDir}/publish-run.json" && for v in $(jq -r ".vault_retirements // [] | .[].vault" "{evidenceDir}/publish-run.json"); do test "$(cast call "$v" "retired()(bool)")" = true && test "$(cast call "$v" "maxDeposit(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; b=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "redeem(uint256,address,address)" "$b" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 "$@" || exit 1; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; fi; done', "_", "{cast}"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P6.30-router-deposit"
    standing: ["4.4"]
    description: "2 USDC straight into the router at 8,400,000 gas (the floor is 400,000 plus 2,550,000 per leg): one RouterDeposit event per leg with a non-zero effective weight and none for a zero-weight leg, and the deployer holds shares in every non-zero leg afterwards"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" | tail -n 1 | grep -oE "[0-9]+" | grep -vxc 0 > {runDir}/state/router-legs || true']
      - ["bash", "scripts/runbook/cast-send.sh", "{m:vault.usdc}", "approve(address,uint256)", "{m:router.router}", "2000000", "{cast}"]
      - ["bash", "-c", 'bash scripts/runbook/cast-send.sh "{m:router.router}" "deposit(uint256,uint256[])" 2000000 "[]" --gas-limit 8400000 {castFlagsInline} | tee {runDir}/state/router-deposit.json; test ${PIPESTATUS[0]} = 0']
      - ["bash", "-c", 'jq -e --arg t "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")" --argjson n "$(cat {runDir}/state/router-legs)" ''.status == "0x1" and ([.logs[] | select(.topics[0] == $t)] | length) == $n'' {runDir}/state/router-deposit.json']
      - ["bash", "-c", 'w=$(cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])"); vs=$(echo "$w" | sed -n 1p | grep -oE "0x[0-9a-fA-F]{40}"); bs=$(echo "$w" | sed -n 2p | grep -oE "[0-9]+"); i=1; for v in $vs; do b=$(echo "$bs" | sed -n "$i"p); i=$((i+1)); s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$b" != 0 ] && [ "$s" = 0 ]; then echo "no shares in $v (weight $b)" >&2; exit 1; fi; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["router-legs", "router-deposit.json"]
    exercises: "router-deposit"
  - id: "P6.32-router-split-changed"
    standing: ["4.4", "4.9"]
    description: "The rebalance changed the router split: the post-rebalance router deposit's RouterDeposit legs are exactly the non-zero effective weights now (the applied receipt's vector, P5.04), each minting shares, and they differ in vault or weight from the legs of the pre-rebalance router deposit (P5.30, the vector in effect before it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'cast call "{m:router.router}" "getEffectiveWeights()(address[],uint256[])" > {runDir}/state/post-router-weights']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts router-legs {runDir}/state/router-deposit.json {runDir}/state/post-router-weights "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
      - ["bash", "-c", 'bun scripts/runbook/qa-assert.ts legs-differ {runDir}/state/pre-router-deposit.json {runDir}/state/router-deposit.json "$(cast sig-event "RouterDeposit(address,address,uint256,uint256,uint256)")"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    writes: ["post-router-weights"]
  - id: "P6.31-sweep-positions"
    standing: ["4.4"]
    description: "The router deposit is redeemed in full: rmUSDC by redeem, rmPROTO by redeemInKind, rmRWA by redeem, so the deployer holds no shares anywhere (every later verify requires it)"
    host: "control"
    phase: 6
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeem"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "$fn(uint256,address,address)" "$s" "{sheet:ADMIN_ADDRESS}" "{sheet:ADMIN_ADDRESS}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "$v" "balanceOf(address)(uint256)" "{sheet:ADMIN_ADDRESS}" | cut -d" " -f1)" = 0 || exit 1; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    exercises: "redeem"

  # ── Phase 9, failure drills: the pause path and the recovery path run on real contracts. ──
  - id: "P9.01-pause-all"
    standing: ["4.5", "4.6"]
    description: "pause-all pauses deposits on all three vaults with the emergency key, reads each back and writes the rollout report; withdrawals stay open"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "pause-all", "{common}", "{emergency}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "rollout-report-{chainId}.json", "required": true}
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P9.03-resume-schedule"
    standing: ["4.5"]
    description: "Each paused vault comes back through a new numbered unpause round of the Safe; the three are scheduled together"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-USDC", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-PROTO", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-RWA", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: [0, 15]
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
  - id: "P9.04-resume-execute"
    standing: ["4.5"]
    description: "After the delay the same three commands execute the unpauses"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-USDC", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-PROTO", "{common}", "{owners}", "{gate}", "{wait}"]
      - ["bun", "publish-contracts/src/cli.ts", "govern", "--row", "unpause-RWA", "{common}", "{owners}", "{gate}", "{wait}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]
    notBefore: {"afterStep": "P9.03-resume-schedule", "hours": "timelockDelay"}
  - id: "P9.05-verify-after-resume"
    standing: ["4.5"]
    description: "Verify passes again with all three vaults open"
    host: "control"
    phase: 9
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: ["twin", "rehearsal"]

  # ── Phase 10, evidence and teardown. ──
  - id: "P10.01-evidence-check"
    standing: ["4.7"]
    description: "The evidence file is checked against the frozen counts and the chain: nonce, every receipt status, the unpause operations and their delay, the registry, the secret scan"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "publish-contracts/src/evidence-check.ts", "--evidence", "{evidenceDir}/evidence.json", "--frozen", "{countsDir}/{gateSha}.json", "--deploy-sha", "{gateSha}", "--deployment-kind", "{deploymentKind}", "--rpc", "{rpcUrl}"]
    expectExit: 0
    receipts:
      - {"dir": "{evidenceDir}", "pattern": "evidence.json", "required": true}
    irreversible: false
    onlyFor: ["rehearsal", "production"]
  - id: "P10.02-secret-scan"
    standing: ["4.7"]
    description: "No key, passphrase or keystore path is in the run's evidence folder"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "publish-contracts/src/ci/scan-rehearsal-secrets.ts", "--evidence", "{evidenceDir}"]
    expectExit: 0
    receipts: []
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P10.51-write-rollout-report"
    standing: ["4.7"]
    description: "The rollout report is written from the run: sha, network, sheet hash, tag, every step's journal, every evidence file's sha256; a failed step, a journaled step with no result and a vault still paused at report time are issues, a pause report from a drill is listed only"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "report", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{coreSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{sheet}", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.51-write-rollout-report"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "rollout-report.md", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P10.52-record-signoff"
    standing: ["4.4"]
    description: "The sign-off is written by the run, and only when the report lists no issue and matches the publish go"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "scripts/runbook/run-record.ts", "signoff", "--run-dir", "{runDir}", "--evidence-dir", "{evidenceDir}", "--manifest-dir", "{manifestDir}", "--rpc", "{rpcUrl}", "--sha", "{coreSha}", "--target", "{target}", "--chain-id", "{chainId}", "--sheet", "{sheet}", "--tag", "{releaseTag}", "--release", "{release}", "--step", "P10.52-record-signoff"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/go", "pattern": "signoff.json", "required": true}
    irreversible: false
    flow: ["new", "upgrade"]
  - id: "P10.07-twin-teardown"
    standing: ["9"]
    description: "The tunnel closes, the Twin fork stops on the stage host, and the throwaway keystores and the passphrase file are destroyed"
    host: "control"
    phase: 10
    cmds:
      - ["bash", "-c", "ssh -o BatchMode=yes -S {runDir}/tunnel-8545.sock -O exit {stageHost} 2>/dev/null; true"]
      - ["ssh", "-o", "BatchMode=yes", "{stageHost}", "export PATH=$HOME/.foundry/bin:$PATH; cd {stageCore} && bun scripts/devnet/twin-fork.ts stop --port 8545 --state-dir $HOME/{stageDir}/twin"]
      - ["shred", "-u", "{runDir}/passphrase"]
      - ["rm", "-rf", "{runDir}/keys"]
    expectExit: 0
    receipts: []
    irreversible: false
    onlyFor: "twin"