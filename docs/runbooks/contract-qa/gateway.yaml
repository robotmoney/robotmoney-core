# docs/runbooks/contract-qa/gateway.yaml: the gateway system release runbook (issue 1892).
#
# The rmpc gateway system deploys, verifies and records its evidence on its own, after the vaults system and against its manifests
# (docs/architecture.md section 1; docs/operations/contract-release-runbooks.md 4.13). The vaults release runbook is template.yaml and
# runs first. This runbook is a SEPARATE template with its own steps. It is checked against the real CLIs by
# scripts/runbook/validate-contract-qa.ts like the vaults template, and a vaults release file never contains one of its steps.
#
# The step keys are template.yaml's. The gateway sheet is a small sheet ({gatewaySheet}): the deployer, the pauser, the share receiver,
# UPGRADE_MODE and two names with no default, GATEWAY_ADMIN_ADDRESS and GATEWAY_UPGRADE_TIMELOCK. Which authority holds the production
# gateway ADMIN_ROLE and which nonzero timelock governs the production gateway release is an OPEN decision (docs/architecture.md section 10):
# a production run records its owner decision in {runDir}/go/gateway-governance.json before it publishes. Nothing here chooses it.
#
# There is no Safe, no control proof and no govern row in this runbook. The gateway verifier fails a run that authorized an agent before the
# handover block; after it, phase 3 proves the gateway is usable: the deployer consents to itself as an agent (commit, reveal), deposits through
# the gateway into the router, sweeps the shares and revokes itself, and the verifier passes again with the deployer holding nothing.
template: contract-qa-gateway
steps:
  - id: "P0.01-gateway-runbook-valid"
    standing: ["4.13"]
    description: "The gateway runbook is valid against the real CLIs and names no vaults-only step"
    host: "control"
    phase: 0
    cmds:
      - ["bun", "scripts/runbook/validate-contract-qa.ts"]
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P0.02-run-dirs"
    standing: ["4.13"]
    description: "The run directory layout the gateway run's receipts and state live in, outside the core checkout, which must stay clean"
    host: "control"
    phase: 0
    cmds:
      - ["mkdir", "-p", "{runDir}/state", "{runDir}/journal", "{runDir}/go", "{runDir}/evidence-gateway", "{runDir}/manifests", "{runDir}/counts"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}", "pattern": "state", "required": true}
    irreversible: false
  - id: "P0.04-checkout"
    standing: ["4.13"]
    description: "The core checkout is clean and its HEAD is the DEPLOY_SHA (the CLI refuses anything else)"
    host: "control"
    phase: 0
    cmds:
      - ["bash", "-c", 'test -z "$(git status --porcelain)" && test "$(git rev-parse HEAD)" = "{coreSha}"']
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P1.01-vaults-verified"
    standing: ["4.13"]
    description: "The vaults system this gateway binds to is deployed and its own verifier passes: the gateway run reads its router, vault and libs manifests and changes none of them"
    host: "control"
    phase: 1
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{common}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
    expectExit: 0
    receipts:
      - {"dir": "{manifestDir}", "pattern": "router.json", "required": true}
    irreversible: false
  - id: "P1.02-gateway-preflight"
    standing: ["4.13"]
    description: "The gateway system simulated on a local chain: both stages plan their counts, nothing is broadcast"
    host: "control"
    phase: 1
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "{gcommon}", "--dry-run"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P1.03-gateway-refusals"
    standing: ["4.13"]
    description: "A gateway sheet with no GATEWAY_UPGRADE_TIMELOCK, and one with an AGENT_ADDRESSES line, are each refused before any signer or broadcast (SHEET, exit 3)"
    host: "control"
    phase: 1
    cmds:
      - ["bash", "-c", "grep -v '^GATEWAY_UPGRADE_TIMELOCK=' {gatewaySheet} > {runDir}/state/gateway-sheet-no-timelock.env; { cat {gatewaySheet}; echo 'AGENT_ADDRESSES=0x000000000000000000000000000000000000a0aa'; } > {runDir}/state/gateway-sheet-agent.env"]
      - ["bash", "-c", "for f in gateway-sheet-no-timelock gateway-sheet-agent; do bun publish-contracts/src/cli.ts publish --chain {chainId} --rpc {rpcUrl} --sheet {runDir}/state/$f.env --signer {signer} --environment {environmentName} --core-sha {coreSha} --counts-dir {countsDir} --evidence {runDir}/evidence-gateway --system gateway --dry-run; test $? -eq 3 || exit 1; done"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P1.04-gateway-publish"
    standing: ["4.13"]
    description: "The gateway proxy bound to the vaults router and vault with the explicit upgrade timelock, then the handover of ADMIN_ROLE and DEFAULT_ADMIN_ROLE to GATEWAY_ADMIN_ADDRESS; each stage matches its frozen count"
    host: "control"
    phase: 1
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "publish", "{gcommon}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
      YES: "{yes}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/evidence-gateway", "pattern": "publish-run.json", "required": true}
      - {"dir": "{manifestDir}", "pattern": "gateway-handover.json", "required": true}
    irreversible: true
    go: "gateway-governance"
    maxMinutes: 60
  - id: "P2.01-gateway-verify"
    standing: ["4.13"]
    description: "The gateway verifier: the proxy and implementation equal the build, the sheet's upgrade timelock and admin hold, the deployer holds nothing, no AgentAuthorized log and no AGENT_ROLE grant up to the handover block, the vaults manifests are unchanged"
    host: "control"
    phase: 2
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{gcommon}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/evidence-gateway", "pattern": "publish-run.json", "required": true}
    irreversible: false
  # ── Phase 3, a real agent deposit through the gateway (runbook 4.4): the gateway is usable, not just deployed. ──
  - id: "P3.01-agent-policy"
    standing: ["4.4"]
    description: "The deployer of the gateway sheet, and the commit hash, salt and the deposit policy the consent steps use (the three vaults as the only destinations: the router is never a destination); validUntil is chain time plus a day, because the Twin clock is warped; assetRecipient and the other retired withdraw members are zero, or the v0.6.0 gateway reverts RetiredPolicyFieldNonZero"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "-c", "sed -n 's/^ADMIN_ADDRESS=//p' {gatewaySheet} | tr -d ' \\\"' > {runDir}/state/gateway-admin"]
      - ["bash", "-c", 'echo $(( $(cast block latest --field timestamp) + 86400 )) > {runDir}/state/agent-valid-until']
      - ["bash", "-c", 'cast keccak "qa-self-$(date +%s%N)" > {runDir}/state/agent-salt-self']
      - ["bash", "-c", 'cast keccak "$(cast abi-encode "f(address,address,bytes32)" "{state:gateway-admin}" "{state:gateway-admin}" "$(cat {runDir}/state/agent-salt-self)")" > {runDir}/state/agent-commit-self']
      - ["bash", "-c", 'echo "(true,$(cat {runDir}/state/agent-valid-until),1000000,3000000,{state:gateway-admin},[{m:vault.vault},{m:protocol-asset-vault.vault},{m:rwa-basket-vault.vault}],0x0000000000000000000000000000000000000000,0,0,[])" > {runDir}/state/agent-policy']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
    writes: ["gateway-admin", "agent-valid-until", "agent-salt-self", "agent-commit-self", "agent-policy"]
  - id: "P3.02-agent-self-commit"
    standing: ["4.4"]
    description: "The depositor commits its own authorization (agent and committer are the same key, so it consents by calling)"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:gateway.gateway}", "commitAuthorization(bytes32)", "{state:agent-commit-self}", "{cast}"]
      - ["sleep", "5"]
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P3.03-agent-self-reveal"
    standing: ["4.4"]
    description: "At least a block later the reveal authorizes the agent, with the three vaults as its only destinations (the router is never a destination); the gateway records the depositor as its owner"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:gateway.gateway}", "revealAuthorization(address,bytes32,(bool,uint64,uint256,uint256,address,address[],address,uint256,uint256,address[]))", "{state:gateway-admin}", "{state:agent-salt-self}", "{state:agent-policy}", "--gas-limit", "1000000", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "agentOwner(address)(address)" "{state:gateway-admin}" | tr A-F a-f)" = "$(echo "{state:gateway-admin}" | tr A-F a-f)"']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P3.04-gateway-deposit-vaults"
    standing: ["4.4"]
    description: "The agent approves the gateway for 1 USDC and deposits it with depositTo into each of rmUSDC, rmPROTO and rmRWA at 6,000,000 gas (the gateway floor is 2,000,000): each transaction is status 1 with exactly one AgentDeposit event of the gateway, and the deployer, the share receiver, holds more shares in that vault than before"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "-c", 'for v in {m:vault.vault} {m:protocol-asset-vault.vault} {m:rwa-basket-vault.vault}; do b=$(cast call $v "balanceOf(address)(uint256)" {state:gateway-admin} | cut -d" " -f1); o=$(cast keccak "qa-vault-$v-$(date +%s%N)"); bash scripts/runbook/cast-send.sh {m:vault.usdc} "approve(address,uint256)" {m:gateway.gateway} 1000000 {castFlagsInline} > /dev/null || exit 1; out=$(bash scripts/runbook/cast-send.sh {m:gateway.gateway} "depositTo(bytes32,uint256,uint64,bytes32,address,uint256[])" $o 1000000 "$(( $(cast block latest --field timestamp) + 300 ))" "$(cast keccak "key-$o")" $v "[]" --gas-limit 6000000 {castFlagsInline}) || exit 1; echo "$out"; echo "$out" | jq -e --arg t "$(cast sig-event "AgentDeposit(bytes32,bytes32,address,address,uint256,uint256,uint64)")" --arg g "$(echo {m:gateway.gateway} | tr A-F a-f)" ''.status == "0x1" and ([.logs[] | select((.address | ascii_downcase) == $g and .topics[0] == $t)] | length) == 1'' > /dev/null || exit 1; s=$(cast call $v "balanceOf(address)(uint256)" {state:gateway-admin} | cut -d" " -f1); { [ "${#s}" -gt "${#b}" ] || { [ "${#s}" -eq "${#b}" ] && [[ "$s" > "$b" ]]; }; } || { echo "no new shares in $v: before $b, after $s" >&2; exit 1; }; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P3.05-sweep-positions"
    standing: ["4.4"]
    description: "The gateway deposit is redeemed in full: rmUSDC by redeem, rmPROTO by redeemInKind, rmRWA by redeem, so the deployer holds no shares anywhere"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "-c", 'for pair in "{m:vault.vault}:redeem" "{m:protocol-asset-vault.vault}:redeemInKind" "{m:rwa-basket-vault.vault}:redeem"; do v=${pair%%:*}; fn=${pair##*:}; s=$(cast call "$v" "balanceOf(address)(uint256)" "{state:gateway-admin}" | cut -d" " -f1); if [ "$s" != 0 ]; then bash scripts/runbook/cast-send.sh "$v" "$fn(uint256,address,address)" "$s" "{state:gateway-admin}" "{state:gateway-admin}" --gas-limit 5000000 {castFlagsInline} || exit 1; fi; test "$(cast call "$v" "balanceOf(address)(uint256)" "{state:gateway-admin}" | cut -d" " -f1)" = 0 || exit 1; done']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P3.06-agent-revoke"
    standing: ["4.4"]
    description: "The deployer, the agent owner since P3.03, revokes itself as a gateway agent and AGENT_ROLE is read back gone; else the gateway verifier fails 'deployer: holds no role'"
    host: "control"
    phase: 3
    cmds:
      - ["bash", "scripts/runbook/cast-send.sh", "{m:gateway.gateway}", "revokeAgent(address)", "{state:gateway-admin}", "{cast}"]
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "hasRole(bytes32,address)(bool)" "$(cast keccak AGENT_ROLE)" "{state:gateway-admin}")" = false']
      - ["bash", "-c", 'test "$(cast call "{m:gateway.gateway}" "agentOwner(address)(address)" "{state:gateway-admin}")" = 0x0000000000000000000000000000000000000000']
    env:
      ETH_RPC_URL: "{rpcUrl}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P3.07-gateway-verify-again"
    standing: ["4.13"]
    description: "The gateway verifier passes again after the agent round: the deployer holds nothing, and the vaults manifests are unchanged"
    host: "control"
    phase: 3
    cmds:
      - ["bun", "publish-contracts/src/cli.ts", "verify", "{gcommon}", "{gate}"]
    env:
      PUBLISH_MANIFEST_DIR: "{manifestDir}"
    expectExit: 0
    receipts: []
    irreversible: false
  - id: "P10.01-gateway-evidence"
    standing: ["4.13"]
    description: "The gateway evidence (system gateway, filled from the run manifest and the manifests) passes the evidence check against the frozen counts of the sha"
    host: "control"
    phase: 10
    cmds:
      - ["bun", "publish-contracts/src/evidence-check.ts", "--evidence", "{runDir}/evidence-gateway/evidence.json", "--frozen", "{countsDir}/{gateSha}.json", "--deploy-sha", "{gateSha}", "--deployment-kind", "{deploymentKind}"]
    expectExit: 0
    receipts:
      - {"dir": "{runDir}/evidence-gateway", "pattern": "evidence.json", "required": true}
    irreversible: false
