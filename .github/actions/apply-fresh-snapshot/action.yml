name: apply-fresh-snapshot
description: >-
  Nightly job (b), core issue 1496. When enabled, downloads the fresh Base
  snapshot overlay built by suite-NN-nightly-fresh-snapshot.yml and copies it
  over this runner's checkout (CURRENT.*, genesis-alloc.json, fork-block.json,
  expected-prices.json) so the calling suite boots the Twin chain from it. When
  not enabled it does nothing, so a suite's own triggers are unchanged. The
  copied files are never committed. No secret is read.
inputs:
  enabled:
    description: "'true' to apply the fresh snapshot."
    required: false
    default: "false"
  artifact:
    description: Name of the artifact holding the snapshot overlay.
    required: false
    default: fresh-snapshot
runs:
  using: composite
  steps:
    - if: ${{ inputs.enabled == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/fresh-snapshot
    - if: ${{ inputs.enabled == 'true' }}
      uses: oven-sh/setup-bun@v2
    - if: ${{ inputs.enabled == 'true' }}
      shell: bash
      run: bun "${{ github.workspace }}/scripts/devnet/nightly-fresh-snapshot.ts" apply --from "${{ runner.temp }}/fresh-snapshot"
