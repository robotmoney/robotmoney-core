name: twin-publish
description: >-
  Runs the one deploy driver (bun publish-contracts/src/cli.ts publish) against the Twin chain (918453), for a
  job that needs a deployed core stack: throwaway encrypted keystores, the committed stage sheet merged with
  their addresses, gas and USDC for the deployer (Twin environment steps), then the publish run (libs through
  the timelock handover and the real Safe). Exports TWIN_MANIFEST_DIR (the stage manifests),
  TWIN_DEPLOYER_ADDRESS, TWIN_COUNTS_JSON (the measured per-stage counts and the deployer nonce, core 1523)
  and, with verify, TWIN_VERIFY_LABELS and, with govern, TWIN_GOVERN_ROWS (with both, the order is publish, verify, govern, verify and TWIN_VERIFY_LABELS_POST_GOVERN holds the second verify, issue 1667)
  and TWIN_SELF_ADMIN_ROWS (the govern matrix then runs one Safe self-administration row on the real SafeL2: safe-change-threshold raised to the owner count and restored to the sheet's value, QA plan v1 B5). The steps are in publish-contracts/src/ci/twin-publish.ts. No secret reaches a file in the repo, an argument or a log: the passphrase is a random
  0600 file in a 0700 directory under /tmp. Never use this against Base mainnet.
inputs:
  rpc-url:
    description: "The Twin chain RPC."
    required: false
    default: "http://127.0.0.1:8545"
  share-receiver-address:
    description: "Optional: the rmUSDC seed share receiver (SHARE_RECEIVER_ADDRESS in the sheet). Empty: the sheet's value."
    required: false
    default: ""
  verify:
    description: "'true' also runs the one verifier (the verify verb) afterwards and saves its labels."
    required: false
    default: "false"
  govern:
    description: "'true' also runs stage 13 (the govern verb, with the Twin time warp) after verify, then verify again (post-govern state) when verify is also on, then the safe-change-threshold pair on the real Safe (QA plan v1 B5)."
    required: false
    default: "false"
  rehearsal:
    description: >-
      'true' runs the Twin chain in the REHEARSAL kind of the Base mainnet rehearsal (issue 1727): the sheet gets DEPLOYMENT_KIND=rehearsal, TIMELOCK_MIN_DELAY=900 and a new SAFE_SALT_NONCE, the deployer
      is not fresh (one self-transfer first), and after govern and the second verify the receipt path runs with a REAL recorded receipt: register the submitter through the Safe and the timelock, record the
      receipt through the gateway, apply it with the Safe, verify again, check the run manifest's receipt path. Needs govern 'true'.
    required: false
    default: "false"
  predeploy-libs:
    description: "'true' first deploys the four CREATE2 libraries (TickMath, BasketAssetConfigGuard, TwapTickMath, BasketViews) on the Twin fork, so the run finds them all already deployed (issue 1721)."
    required: false
    default: "false"
  sheet-overlay:
    description: "Optional (issue 1811): a committed sheet overlay relative to the core checkout, merged over the committed Twin sheet (deployments/twin-918453/upgrade-rehearsal.env deploys UPGRADE_MODE=upgradeable). Empty: none."
    required: false
    default: ""
  pin-block:
    description: "Optional: the Base block the Twin fork is pinned at. Recorded in counts.json (pinBlock) and, when the baseline is rebuilt from an adopted run, in measured.reconstructed.fromRun (issue 1733)."
    required: false
    default: ""
  vaults-only:
    description: "'true' (issue 1892) runs the VAULTS system rehearsal with the gateway absent: after publish it asserts no gateway manifest, no gateway-handover manifest and no gateway stage in the run manifest, and prints the 'TWIN-SCENARIO vaults-only:' marker."
    required: false
    default: "false"
  gateway:
    description: "'true' (issue 1892) then runs the GATEWAY system against the vaults run's manifests: three negative scenarios (missing or zero GATEWAY_UPGRADE_TIMELOCK, an AGENT_ADDRESSES line) that must be refused before any broadcast, then publish and verify --system gateway, asserting the vaults manifests are byte-unchanged, the roles moved to GATEWAY_ADMIN_ADDRESS and zero agents at handover. Prints the gateway-refusals-before-broadcast and gateway-run markers."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: ./.github/actions/publish-contracts-setup
    - shell: bash
      env:
        RPC_URL: ${{ inputs.rpc-url }}
        SHARE_RECEIVER_IN: ${{ inputs.share-receiver-address }}
        VERIFY_IN: ${{ inputs.verify }}
        GOVERN_IN: ${{ inputs.govern }}
        REHEARSAL_IN: ${{ inputs.rehearsal }}
        PREDEPLOY_LIBS_IN: ${{ inputs.predeploy-libs }}
        PIN_BLOCK_IN: ${{ inputs.pin-block }}
        SHEET_OVERLAY_IN: ${{ inputs.sheet-overlay }}
        VAULTS_ONLY_IN: ${{ inputs.vaults-only }}
        GATEWAY_IN: ${{ inputs.gateway }}
      # The script prints one TWIN-SCENARIO marker line per scenario it ran. The log is kept for the marker guard (publish-contracts/src/ci/twin-markers.ts).
      run: |
        log="$RUNNER_TEMP/twin-publish.log"
        echo "TWIN_PUBLISH_LOG=$log" >> "$GITHUB_ENV"
        bun "${{ github.action_path }}/../../../publish-contracts/src/ci/twin-publish.ts" | tee "$log"
