# Canonical: docs/development/ci-suites.md §11 (opencode-headless)
#
# WHAT RUNS HERE
# The offline transcript-asserter, live-guard, replay-harness and keypair-parse unit tests, the
# G12 keystore negative control, and the offline rmpc refusal checks.
#
# The deposit and read replay jobs (opencode-headless-deposit-replay, opencode-headless-read-replay)
# and their twin-pin deployed the old multi-vault contracts on the Twin chain through publish
# contracts and drove a gateway deposit. Those contracts were replaced by the 0.9.0 fund (PR 2042),
# so the jobs, the twin-publish action and the two helpers only they ran
# (assert_headless_deposit_delta.py, assert_headless_deposit_sender.py) were removed.

name: opencode-headless-deposit-read

on:
  schedule:
    - cron: "17 3 * * *"  # nightly
  workflow_dispatch:
  pull_request:
    # PRs run ONLY the offline `asserter-tests` job (the live jobs below are gated
    # to non-pull_request events). This wires the previously-orphaned transcript
    # asserter unit tests AND the issue #1151 live-guard tests into PR CI so a
    # change to the guard or asserters is proven to execute, not silent-skipped.
    paths:
      - ".github/scripts/assert_headless_live_transcript.py"
      - ".github/scripts/assert_headless_read_transcript.py"
      - ".github/scripts/assert_headless_deposit_transcript.py"
      - ".github/scripts/replay_headless_transcript.py"
      - ".github/scripts/parse_cast_wallet_new.py"
      - ".github/scripts/tests/test_live_guard.py"
      - ".github/scripts/tests/test_transcript_asserter_provenance.py"
      - ".github/scripts/tests/test_replay_headless_transcript.py"
      - ".github/scripts/tests/test_parse_cast_wallet_new.py"
      - ".github/scripts/tests/negative_control_keystore_generate_flag.sh"
      - ".github/scripts/tests/fixtures/**"
      - ".github/workflows/suite-11b-opencode-headless.yml"
      # Its Foundry pin must equal this workflow's (test_parse_cast_wallet_new.py, issue #1682).
      - ".github/actions/twin-fork/action.yml"
      - "clients/rust-payment-client/src/bin/rmpc_keystore_import.rs"
      - "clients/rust-payment-client/Cargo.toml"

# Least privilege (issue #1428): read-only repo contents for every job. A job that
# needs more declares it at job level with the reason.
permissions:
  contents: read

jobs:
  # Offline, keyless unit tests for the transcript asserters and the issue #1151
  # live-fail guard. Runs on every trigger (including pull_request) so the guard
  # and asserter logic are executed-in-CI, not just at nightly time against a
  # live model. pytest exits non-zero (5) if it collects zero tests, so a
  # mis-pathed suite reds the job (loud-skip: no "0 tests = green").
  asserter-tests:
    name: opencode-headless-asserter-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyYAML: the keypair self-test reads this workflow and the twin-fork action for the Foundry pin.
      - name: Install pytest and PyYAML
        run: python -m pip install --upgrade pytest pyyaml

      # test_parse_cast_wallet_new.py is the keypair-parse self-test (issue #1682, QA plan v1 U2): the
      # cast >= 1.8 envelope, the cast <= 1.7.1 array and a bare object parse; a missing or malformed
      # address or key is refused without echoing the key; the deposit job reads the wallet through the
      # parser, runs govern, and pins the same exact Foundry release as the twin-fork action.
      - name: Run transcript-asserter + live-guard + replay-harness + keypair-parse unit tests
        run: |
          python -m pytest -v \
            .github/scripts/tests/test_transcript_asserter_provenance.py \
            .github/scripts/tests/test_live_guard.py \
            .github/scripts/tests/test_replay_headless_transcript.py \
            .github/scripts/tests/test_parse_cast_wallet_new.py

      # G12 negative control (issue #1235). This proves the historical broken
      # `rmpc-keystore-import -- --generate` invocation (issue #469) cannot
      # silently come back. It needs the built binary but no chain and no
      # model key, so it belongs in this offline job rather than the disabled
      # live `deposit` job it documents. Previously existed but was invoked by
      # no workflow (shape 6, issue #1235) — contributed zero executed
      # coverage.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rust-payment-client

      - name: G12 negative control — rmpc-keystore-import -- --generate must still fail
        run: bash .github/scripts/tests/negative_control_keystore_generate_flag.sh

  refusal:
    name: opencode-refusal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_CLASS: feature-correctness
    # Offline rmpc refusal checks remain useful and execute nightly/dispatch.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # An exact release, never `stable` (issue #1682): cast 1.8 changed `cast wallet new --json`
      # under a floating `stable` and kept the deposit replay red from 2026-09-05. Keep it equal to
      # the pin in .github/actions/twin-fork/action.yml (test_parse_cast_wallet_new.py checks both).
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Refusal transcript assertions
        run: |
          CARGO_TEST_MIN_EXECUTED=2 bash .github/scripts/cargo_test_require_executed.sh \
            --manifest-path testing/doctests/Cargo.toml --test opencode_refusal -- --nocapture
