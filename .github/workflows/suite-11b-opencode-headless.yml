# Canonical: docs/development/ci-suites.md §11 (opencode-headless)
#
# WHY THIS SUITE EXISTS
# The headless deposit and read tests are the only end-to-end proof that an AI agent,
# given a plain-English prompt, will call the correct tools in the correct order and
# produce a valid on-chain transaction. They catch regressions in prompt engineering,
# tool schema definitions, and the rmpc output contract — none of which are detectable
# by unit tests or structural checks. The refusal job runs first as a hard gate: an
# agent that fails safety checks should never proceed to a live chain interaction.
#
# WHY NIGHTLY ONLY (NOT EVERY PR)
# Each headless run invokes a live language model. This takes 3–10 min, costs API
# credits, and has non-deterministic output that can produce false positives. Running
# on every PR would slow down the feedback loop and create noise from model variability.
# Nightly gives a daily signal on model/tool drift without blocking development.
#
# WHY refusal RUNS BEFORE deposit AND read
# The refusal assertions are the safety contract: the agent must not broadcast to
# mainnet, must not leak secrets, must reject out-of-policy amounts. If these fail, a
# broken prompt or tool schema could send real transactions to the wrong network. The
# dependency makes it structurally impossible to reach the live-chain steps with a
# failing safety gate.
#
# WHY deposit AND read RUN IN PARALLEL (BOTH NEED refusal)
# They test orthogonal agent configurations (deposit-enabled vs read-only) against
# independent devnet instances. There is no shared state between them; running in
# parallel cuts the nightly wall time roughly in half.
#
# GOTCHAS
# - assert_headless_deposit_transcript.py validates tool-call ORDER, not just presence.
#   The agent must call get-vault before self-check before deposit. If the model changes
#   its reasoning order (common after a model version bump), this assertion fails even if
#   the final transaction succeeds. Update the expected order in the script if the new
#   order is intentional and correct.
# - The deposit job funds the agent via anvil_setBalance, which sets the ETH balance
#   directly without a transfer. This only works on Anvil/devnet. If this job is ever
#   pointed at a non-Anvil chain, the funding step will silently do nothing and the
#   deposit will fail with "insufficient funds" — which looks like an rmpc bug.
# - OpenCode is pinned at a specific version. A nightly failure after a new OpenCode
#   release is most likely a tool schema or prompt format change in the new version,
#   not a regression in rmpc. Check the OpenCode changelog before debugging rmpc.

name: opencode-headless-deposit-read

on:
  schedule:
    - cron: "17 3 * * *"  # nightly
  workflow_dispatch:
    inputs:
      # Issue #1151: the hosted zen model is an EXTERNAL, volatile dependency —
      # the free `big-pickle` model was rotated out from under the pin on
      # 2026-07-01 and 400ed thereafter. These dispatch overrides let an operator
      # re-point the nightly at a currently-working free model (or the same value
      # via the `OPENCODE_HEADLESS_MODEL` repo variable) WITHOUT a code+merge
      # cycle, and let them prove the loud-fail guard by dispatching an invalid
      # model name (the "Headless … run" step then reds itself; see §12.6).
      model:
        description: "Override opencode model (provider/model). Blank = repo default."
        required: false
        default: ""
      opencode_version:
        description: "Override pinned opencode-ai version. Blank = repo default."
        required: false
        default: ""
  pull_request:
    # PRs run ONLY the offline `asserter-tests` job (the live jobs below are gated
    # to non-pull_request events). This wires the previously-orphaned transcript
    # asserter unit tests AND the issue #1151 live-guard tests into PR CI so a
    # change to the guard or asserters is proven to execute, not silent-skipped.
    paths:
      - ".github/scripts/assert_headless_live_transcript.py"
      - ".github/scripts/assert_headless_read_transcript.py"
      - ".github/scripts/assert_headless_deposit_transcript.py"
      - ".github/scripts/tests/test_live_guard.py"
      - ".github/scripts/tests/test_transcript_asserter_provenance.py"
      - ".github/scripts/tests/fixtures/**"
      - ".github/workflows/suite-11b-opencode-headless.yml"

# Issue #1151: resolve the opencode version and model from dispatch input →
# repo variable → hardcoded default. Defaults are an empirically-verified
# no-credential path (opencode 1.18.4 fixed the 1.14.29 tool-schema
# serialization bug; `north-mini-code-free` is a currently-advertised free zen
# model that tool-calls anonymously). A `secrets.OPENCODE_API_KEY`, if the repo
# ever provisions one, upgrades the same jobs to an authenticated, reliable
# model with no further workflow change.
env:
  OPENCODE_VERSION: ${{ inputs.opencode_version || vars.OPENCODE_HEADLESS_VERSION || '1.18.4' }}
  OPENCODE_MODEL: ${{ inputs.model || vars.OPENCODE_HEADLESS_MODEL || 'opencode/north-mini-code-free' }}

jobs:
  # Offline, keyless unit tests for the transcript asserters and the issue #1151
  # live-fail guard. Runs on every trigger (including pull_request) so the guard
  # and asserter logic are executed-in-CI, not just at nightly time against a
  # live model. pytest exits non-zero (5) if it collects zero tests, so a
  # mis-pathed suite reds the job (loud-skip: no "0 tests = green").
  asserter-tests:
    name: opencode-headless-asserter-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pytest

      - name: Run transcript-asserter + live-guard unit tests
        run: |
          python -m pytest -v \
            .github/scripts/tests/test_transcript_asserter_provenance.py \
            .github/scripts/tests/test_live_guard.py

  refusal:
    name: opencode-refusal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Live jobs are nightly/dispatch only — never on pull_request (which runs
    # asserter-tests alone). A missing model path reds loudly via the guard, not
    # silently; it never blocks a PR merge.
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Refusal transcript assertions
        run: cargo test --manifest-path testing/doctests/Cargo.toml --test opencode_refusal -- --nocapture

  deposit:
    name: opencode-headless-deposit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: refusal
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.13"

      - name: Install OpenCode at pinned version
        # Issue #1151: version resolved from dispatch input / repo var / default
        # (1.18.4). 1.14.29 shipped a tool-schema serialization bug the hosted
        # provider began rejecting ("tools[0].function: missing field `name`").
        # `--trust` is REQUIRED: bun 1.2.13 blocks lifecycle scripts for packages
        # outside its default-trusted list, so a plain `bun install -g` leaves
        # opencode-ai's postinstall unrun and every later `opencode` invocation
        # dies with "opencode-ai's postinstall script was not run." That is what
        # reddened this nightly ~110 times between 2026-07 and 2026-08-24.
        run: |
          bun install -g --trust opencode-ai@"$OPENCODE_VERSION"
          # Fail loudly HERE if the install produced an unusable binary, rather
          # than 5 minutes later as an inscrutable transcript-assertion failure.
          opencode --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build rmpc binary
        run: cargo build --release --manifest-path clients/rust-payment-client/Cargo.toml --bin rmpc

      # Put the freshly-built rmpc on PATH so the headless agent's `rmpc <cmd>`
      # calls resolve without it having to `find` the binary — the prompt tells
      # the agent "rmpc is on PATH", so make that literally true and keep the
      # run deterministic.
      - name: Put rmpc on PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Boot Anvil from the warmed Base fork-state fixture so the three REAL
      # Aave V3 / Compound V3 / Morpho adapters have live protocol storage to
      # call (issue #912 — this replaced the bare non-forked anvil that forced
      # the now-deleted test-only no-yield deploy hatch). The helper loads
      # testing/fixtures/fork-state/CURRENT.anvil-state, replays the canonical
      # Base USDC proxy storage seed + impl bytecode, advances the next-block
      # timestamp, and funds ADMIN with USDC (the agent is funded later, after
      # its key is generated). It prints the canonical Base USDC address.
      - name: Start Anvil devnet from fork-state fixture
        run: |
          set -euo pipefail
          ADMIN=$(cast wallet address --mnemonic "test test test test test test test test test test test junk" --mnemonic-index 0)
          USDC_ADDR=$(scripts/devnet/boot-fork-state-anvil.sh http://127.0.0.1:8545 "$ADMIN")
          echo "USDC_ADDRESS=$USDC_ADDR" >> $GITHUB_ENV

      # Issue #469: derive ADMIN/PAUSER/SHARE_RECEIVER from Anvil's funded
      # accounts, but DO NOT pre-bake AGENT_ADDRESS from an Anvil account.
      # The agent EOA is generated fresh in a later step and that generated
      # address is what Deploy.s.sol authorizes — this is the proof that the
      # entire onboarding path (key generation -> authorizeAgent -> deposit)
      # works against a single identity.
      - name: Derive deploy addresses from Anvil accounts
        run: |
          set -euo pipefail
          ACCOUNTS=$(cast rpc eth_accounts --rpc-url http://127.0.0.1:8545)
          echo "ADMIN_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[0]')" >> $GITHUB_ENV
          echo "PAUSER_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[1]')" >> $GITHUB_ENV
          echo "SHARE_RECEIVER_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[3]')" >> $GITHUB_ENV
          PRIVKEY=$(cast wallet private-key --mnemonic "test test test test test test test test test test test junk" --mnemonic-index 0)
          echo "ANVIL_PRIVKEY=$PRIVKEY" >> $GITHUB_ENV
          # ADMIN_ADDRESS is the deployer EOA; remember it as the parent
          # (msg.sender at authorizeAgent) for the later authorization assert.
          ADMIN=$(echo "$ACCOUNTS" | jq -r '.[0]')
          echo "PARENT_ADDRESS=$ADMIN" >> $GITHUB_ENV

      # Issue #469: this step replaces the broken keystore-import
      # invocation that previously lived in this workflow (it passed the
      # literal string "--generate" as argv[1] expecting an unsupported
      # flag, and never set RMPC_IMPORT_PRIVKEY_HEX). There is no such
      # flag on rmpc-keystore-import — argv[1] is the OUTPUT keystore
      # path, the private key must be provided via
      # $RMPC_IMPORT_PRIVKEY_HEX, the passphrase via
      # $RMPC_KEYSTORE_PASSPHRASE, and on success the binary prints a bare
      # address (NOT JSON) to stdout. The supported flow is:
      #   1. Generate a secp256k1 keypair (we use `cast wallet new --json`).
      #   2. Export the private key under RMPC_IMPORT_PRIVKEY_HEX and a
      #      passphrase under RMPC_KEYSTORE_PASSPHRASE.
      #   3. Run rmpc-keystore-import with the desired keystore path as
      #      argv[1] and capture the printed address from stdout.
      #   4. Persist the captured address as AGENT_ADDRESS so Deploy.s.sol
      #      authorizes THIS key (not a pre-baked Anvil account).
      # A non-empty 0x[0-9a-fA-F]{40} address and an existing keystore file
      # are both required; either being missing fails the step.
      - name: Generate fresh agent keypair and keystore
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/robotmoney-opencode"
          WALLET=$(cast wallet new --json)
          AGENT_PRIVKEY=$(echo "$WALLET" | jq -r '.[0].private_key')
          AGENT_ADDR_FROM_CAST=$(echo "$WALLET" | jq -r '.[0].address')
          # Sanity: shape-check the address before doing any chain work.
          if ! [[ "$AGENT_ADDR_FROM_CAST" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "FAIL: cast wallet new produced malformed address: $AGENT_ADDR_FROM_CAST" >&2
            exit 1
          fi
          KEYSTORE="${RUNNER_TEMP}/robotmoney-opencode/agent-keystore.enc"
          # Strip 0x for the import-helper env var.
          export RMPC_IMPORT_PRIVKEY_HEX="${AGENT_PRIVKEY#0x}"
          export RMPC_KEYSTORE_PASSPHRASE="suite-11b-headless-passphrase"
          AGENT_ADDR_FROM_KEYSTORE=$(cargo run --release \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --bin rmpc-keystore-import -- "$KEYSTORE")
          unset RMPC_IMPORT_PRIVKEY_HEX
          # Both the keystore file and the printed address are required.
          if [ ! -s "$KEYSTORE" ]; then
            echo "FAIL: keystore not written at $KEYSTORE" >&2
            exit 1
          fi
          if ! [[ "$AGENT_ADDR_FROM_KEYSTORE" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "FAIL: rmpc-keystore-import did not print a 0x-prefixed 40-hex address (got: $AGENT_ADDR_FROM_KEYSTORE)" >&2
            exit 1
          fi
          # The keystore address must match the cast-wallet address —
          # otherwise we'd authorize one key and sign with another.
          if [ "${AGENT_ADDR_FROM_KEYSTORE,,}" != "${AGENT_ADDR_FROM_CAST,,}" ]; then
            echo "FAIL: keystore address $AGENT_ADDR_FROM_KEYSTORE != cast address $AGENT_ADDR_FROM_CAST" >&2
            exit 1
          fi
          echo "AGENT_ADDRESS=$AGENT_ADDR_FROM_KEYSTORE" >> $GITHUB_ENV
          echo "AGENT_KEYSTORE_PATH=$KEYSTORE" >> $GITHUB_ENV
          echo "RMPC_KEYSTORE_PASSPHRASE=$RMPC_KEYSTORE_PASSPHRASE" >> $GITHUB_ENV
          # Fund the freshly-generated agent EOA so it can pay gas for the
          # deposit. anvil_setBalance is the standard Anvil-only fast path.
          cast rpc anvil_setBalance "$AGENT_ADDR_FROM_KEYSTORE" "0xDE0B6B3A7640000" \
            --rpc-url http://127.0.0.1:8545
          # Fund the agent with USDC too: the gateway deposit pulls
          # `transferFrom(agent, gateway, amount)`, so the headless "deposit 1 USDC"
          # run reverts with ERC20InsufficientBalance unless the generated key
          # actually holds USDC. The fork-state USDC is the canonical Base
          # FiatToken (no permissionless mint), so write the agent's balance
          # slot directly — the same hermetic technique scripts/devnet/snapshot-fork.sh
          # uses for the deployer. FiatToken balances mapping lives at slot 9.
          AGENT_BAL_SLOT=$(cast index address "$AGENT_ADDR_FROM_KEYSTORE" 9)
          cast rpc anvil_setStorageAt "$USDC_ADDRESS" "$AGENT_BAL_SLOT" \
            "$(cast to-uint256 1000000000)" --rpc-url http://127.0.0.1:8545
          # Persist the agent privkey (masked) so a post-deploy step can sign
          # the USDC approval from the agent itself once the gateway address is
          # known. rmpc has no approve command (approvals flow through the human
          # dapp, not the agent client), and the deposit preflight (§4.4) hard-
          # refuses when allowance(agent, gateway) < amount.
          echo "::add-mask::$AGENT_PRIVKEY"
          echo "AGENT_PRIVKEY=$AGENT_PRIVKEY" >> $GITHUB_ENV

      - name: Deploy contracts on devnet (authorizes generated agent)
        # Deploys the three real Aave/Compound/Morpho adapters against the
        # warmed Base fork-state fixture (real protocol storage is present, so
        # the seed-deposit totalAssets() succeeds — no passthrough hatch needed).
        run: |
          mkdir -p deployments
          # Deploy.s.sol reads AGENT_ADDRESS from env and calls
          # gateway.authorizeAgent(AGENT_ADDRESS, policy) under msg.sender =
          # broadcaster (= ADMIN_ADDRESS = PARENT_ADDRESS). After this step
          # the generated key is the AGENT_ROLE holder for the gateway.
          forge script contracts/script/Deploy.s.sol --broadcast --rpc-url http://127.0.0.1:8545 --private-key "$ANVIL_PRIVKEY"

      # Issue #469 acceptance criterion: assert ON-CHAIN that
      # gateway.authorizeAgent has actually been called for the
      # freshly-generated key, BEFORE any deposit is attempted. Reads
      # agentOwner(generatedKey) and hasRole(AGENT_ROLE, generatedKey)
      # directly from the gateway with `cast call`. Either check missing
      # fails the job — proving the create-key -> authorize path is real.
      - name: Assert generated agent is authorized on-chain
        run: |
          set -euo pipefail
          DEPLOYMENT_JSON="deployments/$(cast chain-id --rpc-url http://127.0.0.1:8545).json"
          if [ ! -f "$DEPLOYMENT_JSON" ]; then
            echo "FAIL: deployment JSON not found at $DEPLOYMENT_JSON" >&2
            exit 1
          fi
          GATEWAY=$(jq -r '.gateway' "$DEPLOYMENT_JSON")
          echo "GATEWAY_ADDRESS=$GATEWAY" >> $GITHUB_ENV
          VAULT=$(jq -r '.vault' "$DEPLOYMENT_JSON")
          echo "VAULT_ADDRESS=$VAULT" >> $GITHUB_ENV
          GATEWAY_RUNTIME_HASH=$(jq -r '.gateway_runtime_hash' "$DEPLOYMENT_JSON")
          echo "GATEWAY_RUNTIME_HASH=$GATEWAY_RUNTIME_HASH" >> $GITHUB_ENV

          # 1. agentOwner(generatedKey) must equal the authorizing parent EOA.
          OWNER_RAW=$(cast call "$GATEWAY" "agentOwner(address)(address)" "$AGENT_ADDRESS" \
            --rpc-url http://127.0.0.1:8545)
          OWNER="${OWNER_RAW,,}"
          PARENT="${PARENT_ADDRESS,,}"
          if [ "$OWNER" != "$PARENT" ]; then
            echo "FAIL: agentOwner($AGENT_ADDRESS) = $OWNER_RAW, expected $PARENT_ADDRESS" >&2
            exit 1
          fi
          # 2. hasRole(AGENT_ROLE, generatedKey) must be true. AGENT_ROLE is
          #    keccak256("AGENT_ROLE") = 0xa9c1...; query the constant from
          #    the deployed gateway to stay drift-proof.
          AGENT_ROLE=$(cast call "$GATEWAY" "AGENT_ROLE()(bytes32)" \
            --rpc-url http://127.0.0.1:8545)
          HAS_ROLE=$(cast call "$GATEWAY" "hasRole(bytes32,address)(bool)" \
            "$AGENT_ROLE" "$AGENT_ADDRESS" --rpc-url http://127.0.0.1:8545)
          if [ "$HAS_ROLE" != "true" ]; then
            echo "FAIL: hasRole(AGENT_ROLE, $AGENT_ADDRESS) = $HAS_ROLE" >&2
            exit 1
          fi
          echo "OK: generated agent $AGENT_ADDRESS is owned by $PARENT_ADDRESS and holds AGENT_ROLE"

      # Approve the gateway to pull the agent's USDC, signed by the generated
      # agent key. rmpc's deposit preflight (§4.4) hard-refuses when
      # allowance(agent, gateway) < amount, and rmpc deliberately has no
      # approve command. Without this the headless deposit would silently fail
      # preflight. The approval is signed by the same generated key that signs
      # the deposit, keeping the single-identity onboarding proof intact.
      - name: Approve gateway to pull agent USDC
        run: |
          set -euo pipefail
          cast send "$USDC_ADDRESS" "approve(address,uint256)" "$GATEWAY_ADDRESS" 1000000000 \
            --rpc-url http://127.0.0.1:8545 --private-key "$AGENT_PRIVKEY"
          ALLOWANCE=$(cast call "$USDC_ADDRESS" "allowance(address,address)(uint256)" \
            "$AGENT_ADDRESS" "$GATEWAY_ADDRESS" --rpc-url http://127.0.0.1:8545 | awk '{print $1}')
          echo "OK: agent->gateway USDC allowance = $ALLOWANCE"

      # The opencode skill requires a config.toml that pins chain id, RPC,
      # gateway/vault/USDC addresses, the gateway runtime-hash, the keystore
      # path, and a state_dir (the per-agent nonce-lock + replay-cache dir —
      # rmpc deposit fails fast with no silent /tmp fallback when it is unset).
      # Build it now so the generated key's keystore is the signer for the
      # headless deposit — i.e. step 4/5/deposit share one identity (the
      # freshly-authorized agent).
      - name: Write rmpc config.toml pointing at generated keystore
        run: |
          set -euo pipefail
          STATE_DIR="${RUNNER_TEMP}/robotmoney-opencode/state"
          mkdir -p "$STATE_DIR"
          CONFIG="${RUNNER_TEMP}/robotmoney-opencode/config.toml"
          CHAIN_ID=$(cast chain-id --rpc-url http://127.0.0.1:8545)
          cat > "$CONFIG" <<EOF
          chain_id              = $CHAIN_ID
          rpc_url               = "http://127.0.0.1:8545"
          gateway_address       = "$GATEWAY_ADDRESS"
          usdc_address          = "$USDC_ADDRESS"
          vault_address         = "$VAULT_ADDRESS"
          gateway_runtime_hash  = "$GATEWAY_RUNTIME_HASH"
          state_dir             = "$STATE_DIR"

          [signer]
          allow_software_fallback = true
          keystore_path           = "$AGENT_KEYSTORE_PATH"
          EOF
          echo "RMPC_CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Capture pre-deposit vault state
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/robotmoney-opencode"
          ./target/release/rmpc get-vault --config "$RMPC_CONFIG" --pretty \
            > "${RUNNER_TEMP}/robotmoney-opencode/vault-pre.json"

      - name: Install robotmoney-user skill bundle into opencode config
        # NOTE: plugins/robotmoney-user is a Claude-style SKILL bundle, NOT an
        # opencode JS plugin. `opencode plugin <path>` records it in
        # .opencode/opencode.json, but opencode's loader logs "Plugin export is
        # not a function" and never registers it as a tool. The headless agent
        # therefore drives rmpc through the built-in `bash` tool, guided by the
        # explicit prompt below. See docs/technical/opencode-headless-invocation.md.
        run: opencode plugin "$PWD/plugins/robotmoney-user" || true

      - name: Headless deposit run
        env:
          # Belt-and-suspenders: the config already pins state_dir, but export
          # RMPC_STATE_DIR so any rmpc invocation in the agent's shell resolves
          # the per-agent nonce-lock dir even if it omits --config nuances.
          RMPC_STATE_DIR: ${{ runner.temp }}/robotmoney-opencode/state
          # Optional (issue #1151): if the repo provisions an opencode zen API
          # key, opencode authenticates and uses a reliable paid model; absent,
          # OPENCODE_MODEL runs on the anonymous free tier (current behaviour).
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/robotmoney-opencode/state"
          ORDER_ID="0x$(openssl rand -hex 32)"
          # Explicit, deterministic prompt: opencode cannot load the SKILL
          # bundle as a tool, so we name the exact rmpc commands (read prefix in
          # the order the asserter requires, then deposit). The agent runs each
          # via the bash tool; the transcript then contains real `rmpc` tool
          # calls with exit 0 against the live devnet.
          # Single-line prompt (no embedded newlines) so the YAML block scalar
          # and shell quoting stay simple. The numbered steps are separated by
          # " | " — the model follows them deterministically.
          PROMPT="You are operating the Robot Money rmpc client against a local devnet to make a guarded USDC deposit. The rmpc binary is on PATH. RMPC_STATE_DIR and RMPC_KEYSTORE_PASSPHRASE are already set in your shell. Using the bash tool ONLY, run EXACTLY these commands in this exact order, one per bash call, printing each command's output; do not use any other tool and do not access any explorer or web URL: (1) rmpc get-vault --config ${RMPC_CONFIG} --pretty | (2) rmpc get-agent --config ${RMPC_CONFIG} --agent ${AGENT_ADDRESS} --pretty | (3) rmpc get-balance --config ${RMPC_CONFIG} --address ${AGENT_ADDRESS} --pretty | (4) rmpc get-allowance --config ${RMPC_CONFIG} --owner ${AGENT_ADDRESS} --spender ${GATEWAY_ADDRESS} --pretty | (5) rmpc self-check --config ${RMPC_CONFIG} --pretty | (6) rmpc deposit --config ${RMPC_CONFIG} --amount 1000000 --order-id ${ORDER_ID} --pretty. After the deposit, report the deposit's tx_hash and amount, then stop."
          # Model resolved from dispatch input / repo var / default (see the
          # workflow-level env block). The default is an empirically-verified
          # no-credential free zen model that tool-calls anonymously.
          opencode run "$PROMPT" --model "$OPENCODE_MODEL" --format json --dangerously-skip-permissions \
            | tee "${RUNNER_TEMP}/robotmoney-opencode/headless-deposit.json"
          # Loud-fail guard (issue #1151): opencode run exits 0 even when the
          # hosted model session dies in a provider error with zero tool calls,
          # and that error-only transcript is non-empty, so the old `test -s`
          # check green-lit a dead run and the outage only surfaced 3 steps later
          # at the assert step. This guard reds THIS step when the transcript is
          # empty, error-only, or has zero rmpc invocations — a broken model path
          # fails loudly here instead of masquerading as an assertion failure.
          python3 .github/scripts/assert_headless_live_transcript.py \
            "${RUNNER_TEMP}/robotmoney-opencode/headless-deposit.json"

      - name: Capture post-deposit vault state
        run: |
          set -euo pipefail
          ./target/release/rmpc get-vault --config "$RMPC_CONFIG" --pretty \
            > "${RUNNER_TEMP}/robotmoney-opencode/vault-post.json"

      - name: Assert deposit transcript
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python3 .github/scripts/assert_headless_deposit_transcript.py "${RUNNER_TEMP}/robotmoney-opencode/headless-deposit.json"

      - name: Assert deposit on-chain delta
        run: |
          python3 .github/scripts/assert_headless_deposit_delta.py \
            --transcript "${RUNNER_TEMP}/robotmoney-opencode/headless-deposit.json" \
            --vault-pre "${RUNNER_TEMP}/robotmoney-opencode/vault-pre.json" \
            --vault-post "${RUNNER_TEMP}/robotmoney-opencode/vault-post.json"

      # Issue #469 acceptance criterion: the on-chain sender of the deposit
      # transaction must equal the generated key, proving steps 4/5/deposit
      # share one identity. Extract tx_hash from the transcript, fetch the
      # transaction with `cast tx`, and compare `from` to AGENT_ADDRESS.
      - name: Assert deposit was signed by generated agent
        run: |
          set -euo pipefail
          python3 .github/scripts/assert_headless_deposit_sender.py \
            --transcript "${RUNNER_TEMP}/robotmoney-opencode/headless-deposit.json" \
            --expected-sender "$AGENT_ADDRESS" \
            --rpc-url http://127.0.0.1:8545

      - name: Upload deposit transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-deposit-transcript
          path: ${{ runner.temp }}/robotmoney-opencode/headless-deposit.json

  read:
    name: opencode-headless-read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: refusal
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.13"

      - name: Install OpenCode at pinned version
        # Issue #1151: version resolved from dispatch input / repo var / default
        # (1.18.4). 1.14.29 shipped a tool-schema serialization bug the hosted
        # provider began rejecting ("tools[0].function: missing field `name`").
        # `--trust` is REQUIRED: bun 1.2.13 blocks lifecycle scripts for packages
        # outside its default-trusted list, so a plain `bun install -g` leaves
        # opencode-ai's postinstall unrun and every later `opencode` invocation
        # dies with "opencode-ai's postinstall script was not run." That is what
        # reddened this nightly ~110 times between 2026-07 and 2026-08-24.
        run: |
          bun install -g --trust opencode-ai@"$OPENCODE_VERSION"
          # Fail loudly HERE if the install produced an unusable binary, rather
          # than 5 minutes later as an inscrutable transcript-assertion failure.
          opencode --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build rmpc binary
        run: cargo build --release --manifest-path clients/rust-payment-client/Cargo.toml --bin rmpc

      # Put the freshly-built rmpc on PATH so the headless agent's `rmpc <cmd>`
      # calls resolve without it having to `find` the binary — the prompt tells
      # the agent "rmpc is on PATH", so make that literally true and keep the
      # run deterministic.
      - name: Put rmpc on PATH
        run: echo "$PWD/target/release" >> "$GITHUB_PATH"

      # Boot Anvil from the warmed Base fork-state fixture (issue #912) so the
      # three real adapters have live protocol storage; fund ADMIN (deployer)
      # and the read-only AGENT account with USDC. See the deposit job for the
      # rationale and the helper's seed/funding steps.
      - name: Start Anvil devnet from fork-state fixture
        run: |
          set -euo pipefail
          ADMIN=$(cast wallet address --mnemonic "test test test test test test test test test test test junk" --mnemonic-index 0)
          AGENT=$(cast wallet address --mnemonic "test test test test test test test test test test test junk" --mnemonic-index 2)
          USDC_ADDR=$(scripts/devnet/boot-fork-state-anvil.sh http://127.0.0.1:8545 "$ADMIN" "$AGENT")
          echo "USDC_ADDRESS=$USDC_ADDR" >> $GITHUB_ENV

      - name: Derive deploy addresses from Anvil accounts
        run: |
          set -euo pipefail
          ACCOUNTS=$(cast rpc eth_accounts --rpc-url http://127.0.0.1:8545)
          echo "ADMIN_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[0]')" >> $GITHUB_ENV
          echo "PAUSER_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[1]')" >> $GITHUB_ENV
          echo "AGENT_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[2]')" >> $GITHUB_ENV
          echo "SHARE_RECEIVER_ADDRESS=$(echo "$ACCOUNTS" | jq -r '.[3]')" >> $GITHUB_ENV
          PRIVKEY=$(cast wallet private-key --mnemonic "test test test test test test test test test test test junk" --mnemonic-index 0)
          echo "ANVIL_PRIVKEY=$PRIVKEY" >> $GITHUB_ENV

      - name: Deploy contracts + fund agent on devnet
        # Deploys the three real Aave/Compound/Morpho adapters against the
        # warmed Base fork-state fixture (real protocol storage is present, so
        # the seed-deposit totalAssets() succeeds — no passthrough hatch needed).
        run: |
          mkdir -p deployments
          forge script contracts/script/Deploy.s.sol --broadcast --rpc-url http://127.0.0.1:8545 --private-key "$ANVIL_PRIVKEY"

      - name: Read-only isolation assertions
        run: cargo test --manifest-path testing/doctests/Cargo.toml --test opencode_read_only -- --nocapture

      # rmpc reads require a config.toml pinning chain id, RPC, and the deployed
      # gateway/vault/USDC addresses. The read job is read-only, but rmpc's
      # ClientConfig makes the [signer] table a REQUIRED field (SignerConfig is
      # non-Option in clients/rust-payment-client/src/config.rs), so a config
      # without [signer] fails to deserialize and every rmpc command exits 3 —
      # which is exactly what the first dispatch hit. Read commands never load
      # the keystore (they only read chain state), so a [signer] block with
      # allow_software_fallback=true and a dummy keystore_path satisfies the
      # schema without needing a real key.
      - name: Write rmpc read config.toml
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/robotmoney-opencode"
          DEPLOYMENT_JSON="deployments/$(cast chain-id --rpc-url http://127.0.0.1:8545).json"
          GATEWAY=$(jq -r '.gateway' "$DEPLOYMENT_JSON")
          VAULT=$(jq -r '.vault' "$DEPLOYMENT_JSON")
          GATEWAY_RUNTIME_HASH=$(jq -r '.gateway_runtime_hash' "$DEPLOYMENT_JSON")
          echo "GATEWAY_ADDRESS=$GATEWAY" >> $GITHUB_ENV
          CONFIG="${RUNNER_TEMP}/robotmoney-opencode/config.toml"
          CHAIN_ID=$(cast chain-id --rpc-url http://127.0.0.1:8545)
          cat > "$CONFIG" <<EOF
          chain_id              = $CHAIN_ID
          rpc_url               = "http://127.0.0.1:8545"
          gateway_address       = "$GATEWAY"
          usdc_address          = "$USDC_ADDRESS"
          vault_address         = "$VAULT"
          gateway_runtime_hash  = "$GATEWAY_RUNTIME_HASH"

          [signer]
          allow_software_fallback = true
          keystore_path           = "${RUNNER_TEMP}/robotmoney-opencode/read-only-unused-keystore.json"
          EOF
          echo "RMPC_CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Install robotmoney-user skill bundle into opencode config
        # plugins/robotmoney-user is a SKILL bundle, not an opencode JS plugin;
        # opencode cannot register it as a tool. The explicit prompt below drives
        # rmpc through the bash tool instead. See
        # docs/technical/opencode-headless-invocation.md.
        run: opencode plugin "$PWD/plugins/robotmoney-user" || true

      - name: Headless read run
        env:
          # Optional (issue #1151): opencode zen API key upgrades the run to an
          # authenticated model when provisioned; absent, the free tier is used.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/robotmoney-opencode"
          # Explicit, deterministic prompt naming the exact rmpc read commands.
          # opencode cannot load the SKILL bundle as a tool, so a vague prompt
          # makes the agent improvise (glob/read/task) and never run rmpc.
          # Single-line prompt (no embedded newlines) so the YAML block scalar
          # and shell quoting stay simple.
          PROMPT="You are operating the Robot Money rmpc client against a local devnet. The rmpc binary is on PATH. Using the bash tool ONLY, run EXACTLY these read commands in this exact order, one per bash call, printing each command's JSON output; do not use any other tool and do not access any explorer or web URL: (1) rmpc get-vault --config ${RMPC_CONFIG} --pretty | (2) rmpc get-gateway --config ${RMPC_CONFIG} --pretty | (3) rmpc get-balance --config ${RMPC_CONFIG} --address ${AGENT_ADDRESS} --pretty. After running the three commands, summarize the vault state, gateway state, and balance, then stop."
          # Model resolved from dispatch input / repo var / default (workflow-level
          # env block). Default is an empirically-verified no-credential free model.
          opencode run "$PROMPT" --model "$OPENCODE_MODEL" --format json --dangerously-skip-permissions \
            | tee "${RUNNER_TEMP}/robotmoney-opencode/headless-read.json"
          # Loud-fail guard (issue #1151): reds THIS step on an empty, error-only,
          # or zero-rmpc transcript so a broken model path fails loudly here
          # rather than surfacing later at the assert step. See §12.6.
          python3 .github/scripts/assert_headless_live_transcript.py \
            "${RUNNER_TEMP}/robotmoney-opencode/headless-read.json"

      - name: Assert read transcript
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: python3 .github/scripts/assert_headless_read_transcript.py "${RUNNER_TEMP}/robotmoney-opencode/headless-read.json"

      - name: Upload read transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-read-transcript
          path: ${{ runner.temp }}/robotmoney-opencode/headless-read.json
