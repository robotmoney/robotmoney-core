# Canonical: docs/technical/upstream-monitoring-runbook.md §5
name: upstream-live-monitoring
on:
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-monitor:
    name: live-monitor
    env:
      CI_CLASS: heavy
      RPC_URL: ${{ secrets.BASE_RPC_URL || secrets.BASE_UPSTREAM_RPC || vars.BASE_RPC_URL || 'https://base-rpc.publicnode.com' }}
      RPC_FALLBACK_URLS: ${{ (secrets.BASE_RPC_URL || secrets.BASE_UPSTREAM_RPC || vars.BASE_RPC_URL) && '' || 'https://mainnet.base.org' }}
    # Only meaningful on schedule / manual dispatch against live RPC. Skipped on
    # push/PR so contributor CI never depends on an external RPC.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Require RPC_URL on the nightly schedule
        # Fails the scheduled run loudly if RPC_URL is somehow empty so the
        # nightly can never report success while running no monitors.
        run: bash scripts/monitor-require-rpc.sh

      - name: Venue liveness (Compound v3 / Aave v3)
        run: bash scripts/monitor-venue-liveness.sh

      - name: Governance proposals (Compound / Aave)
        run: bash scripts/monitor-governance-proposals.sh

      - name: USDC upgrade (Circle)
        run: bash scripts/monitor-usdc-upgrade.sh
