# Canonical: docs/development/ci-suites.md §29 (nightly Twin fork)
# Issue: robotmoney-core 1496 (nightly job (b)); siblings 1495 (a) and 1497 (c); owner decision 2026-10-05.
#
# WHY THIS WORKFLOW EXISTS
# Every chain suite runs on the Twin chain (chain id 918453): a pinned lazy fork of real Base state
# made with anvil, started with .github/actions/twin-fork. The pin is the upstream head at the
# start of a run minus 2, so every run is already as fresh as the upstream allows. This nightly runs
# every chain suite in ONE workflow run with ONE shared pin, so a green run shows our contracts and
# clients still work against Base as it is today. There is no snapshot to take, no genesis to build
# and no overlay to apply.
#
# ONE PIN FOR THE WHOLE RUN
# The `pin` job chooses the block once (.github/actions/twin-pin). Each suite is the existing
# workflow, called with workflow_call and pin_block: suites 5, 7, 8, 10, 11b, 14 and 28. Steps are not
# copied: a suite change lands in one file and this nightly picks it up. Each suite's own pin job
# hands that block through unchanged, then its chain jobs start their own Twin fork at it.
#
# SECRETS
# `secrets: inherit` hands the called suites what they already use when they run on their own
# triggers: the optional BASE_UPSTREAM_RPC (a
# paid upstream, never printed) and the base-testnet secrets of suite 5. The workflow itself
# references none of them.
#
# PERMISSIONS
# A called workflow can keep or lower the caller's GITHUB_TOKEN permissions, never raise them. When
# a called job asks for a scope the caller job does not grant, GitHub refuses the whole run as
# `startup_failure` before any job starts. That kept this nightly from ever running (7/7
# startup_failure 2026-10-07..13, QA plan v1 T1): the suite-07 `parity` job asks for
# `pull-requests: read`. So the workflow default stays `contents: read` and each caller job that
# needs more grants it at job level with the reason. scripts/ci/check_reusable_workflow_permissions.py
# (suite 13) fails when a caller grants less than any job it calls asks for.
#
# Suite 26 is NOT in this list: it targets the shared stage devnet (a Twin fork kept alive as a
# service on the stage host) and needs secrets.FUSION_RMPC_CONFIG, so it does not start a fork per
# run. See docs/development/ci-suites.md §26.
#
# THE UPGRADE REHEARSAL (QA plan v1 P4, issue 1811, ADR-0014 stage 4)
# The `twin-upgrade-rehearsal` job is the governed-proxy lifecycle on its own Twin fork at the run's
# pin, nightly only (this workflow has no pull_request or push trigger): twin-publish deploys the
# exact release artifacts of this commit (publish, verify, stage 13 through the real Safe and
# timelock), then publish-contracts/src/ci/twin-upgrade-rehearsal.ts runs a governed upgrade of one
# proxy, the freeze of every proxy and a post-freeze upgrade that the tool refuses and that the
# proxy refuses at execute after the Safe scheduled it on the timelock, verifies again and checks
# the run manifest and the chain with `evidence-check --proxy-lifecycle`. It uploads
# upgrade-rehearsal-<sha> (the secret-scanned evidence folder, the verifier labels, the manifests).
#
# RESULT
# The `results` job fails when the pin job, any suite or the upgrade rehearsal did not succeed
# (failure, cancelled and skipped all count as not passing). It uploads suite-results (one JSON
# per suite and one for the upgrade rehearsal, with the pin).
# The pin job uploads twin-pin (the pin file: block, run id and time, never the upstream URL).
# No secret is required. BASE_UPSTREAM_RPC is optional and never printed.

name: nightly-twin-fork

env:
  CI_CLASS: ignore

on:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC, after the 02:00 nightly and the 03:xx / 04:10 jobs
  workflow_dispatch:

concurrency:
  group: nightly-twin-fork
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pin:
    name: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      block: ${{ steps.pin.outputs.block }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        uses: ./.github/actions/twin-pin
        with:
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      - name: Write the pin file
        env:
          PIN_BLOCK: ${{ steps.pin.outputs.block }}
          BASE_UPSTREAM_RPC: ${{ secrets.BASE_UPSTREAM_RPC }}
          TWIN_LIB: ${{ github.workspace }}/scripts/devnet/twin-fork-lib.ts
          OUT_DIR: ${{ runner.temp }}/twin-pin
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          # Block, hash, block timestamp and upstream HOST only. The URL is never written.
          bun -e '
            const {selectPin, resolveUpstream} = await import(process.env.TWIN_LIB!);
            const up = resolveUpstream();
            const secrets = up === process.env.BASE_UPSTREAM_RPC?.trim() ? [up] : [];
            const p = await selectPin(up, process.env.PIN_BLOCK!, {secrets});
            const out = {chain_id: 918453, pin_block: p.block, pin_hash: p.hash, pin_timestamp: p.timestamp,
              upstream_host: p.upstreamHost, pin_rule: "upstream head at run start minus 2",
              run_id: process.env.GITHUB_RUN_ID, chosen_at: new Date().toISOString()};
            await Bun.write(process.env.OUT_DIR + "/twin-pin.json", JSON.stringify(out, null, 2) + "\n");
          '
          cat "$OUT_DIR/twin-pin.json"

      - name: Upload the pin file
        uses: actions/upload-artifact@v4
        with:
          name: twin-pin
          path: ${{ runner.temp }}/twin-pin
          retention-days: 30

  suite-05:
    name: suite-05 fork integration
    needs: pin
    uses: ./.github/workflows/suite-05-fork-integration.yml
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  suite-07:
    name: suite-07 rmpc integration
    needs: pin
    uses: ./.github/workflows/suite-07-rmpc-integration.yml
    # The called `parity` job reads the pulls/compare APIs for its changed-path list and asks for
    # pull-requests: read. Without this grant GitHub refuses the whole nightly as startup_failure.
    permissions:
      contents: read
      pull-requests: read
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  suite-08:
    name: suite-08 explorer indexer
    needs: pin
    uses: ./.github/workflows/suite-08-explorer-indexer.yml
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  suite-10:
    name: suite-10 dapp e2e
    needs: pin
    uses: ./.github/workflows/suite-10-dapp-e2e.yml
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  suite-11b:
    name: suite-11b opencode headless
    needs: pin
    uses: ./.github/workflows/suite-11b-opencode-headless.yml
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  suite-14:
    name: suite-14 smoke test
    needs: pin
    uses: ./.github/workflows/suite-14-smoke-test.yml
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  suite-28:
    name: suite-28 core stages rehearsal
    needs: pin
    uses: ./.github/workflows/suite-28-core-stages.yml
    secrets: inherit
    with:
      pin_block: ${{ needs.pin.outputs.block }}

  # QA plan v1 P4 (issue 1811, ADR-0014 stage 4): deploy, governed upgrade, freeze and a rejected
  # post-freeze upgrade on a Twin fork this job starts at the run's pin. Nightly only.
  twin-upgrade-rehearsal:
    name: twin-upgrade-rehearsal
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Start the Twin chain at the run pin
        id: fork
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}
      # The exact release artifacts of this commit: publish (the authority stage's timelock before
      # the nine proxies, UPGRADE_MODE=upgradeable from the committed Twin sheet), verify, stage 13.
      - name: Deploy the release artifacts, verify and govern on the Twin chain with the one driver
        uses: ./.github/actions/twin-publish
        with:
          rpc-url: ${{ steps.fork.outputs.rpc-url }}
          verify: "true"
          govern: "true"
          predeploy-libs: "true"
          pin-block: ${{ needs.pin.outputs.block }}
      - name: Governed upgrade, freeze and rejected post-freeze upgrade through the real Safe and timelock
        env:
          RPC_URL: ${{ steps.fork.outputs.rpc-url }}
        run: bun publish-contracts/src/ci/twin-upgrade-rehearsal.ts
      - name: Collect the rehearsal evidence
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/upgrade-rehearsal-out"
          mkdir -p "$out"
          # Only folders the script wrote for upload (the evidence folder passed its secret scan) and the stage manifests: never the run dir (keys, passphrase).
          [ -z "${TWIN_UPGRADE_REHEARSAL_DIR:-}" ] || cp -r "$TWIN_UPGRADE_REHEARSAL_DIR" "$out/evidence"
          [ -z "${TWIN_UPGRADE_REHEARSAL_LABELS_DIR:-}" ] || cp -r "$TWIN_UPGRADE_REHEARSAL_LABELS_DIR" "$out/labels"
          [ -z "${TWIN_MANIFEST_DIR:-}" ] || cp -r "$TWIN_MANIFEST_DIR" "$out/manifests"
          [ -z "${TWIN_VERIFY_LABELS_POST_GOVERN:-}" ] || cp "$TWIN_VERIFY_LABELS_POST_GOVERN" "$out/verify-labels-post-govern.txt"
          ls -R "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-rehearsal-out
          if-no-files-found: error
          retention-days: 90
      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  results:
    name: record-results
    if: ${{ always() }}
    needs: [pin, suite-05, suite-07, suite-08, suite-10, suite-11b, suite-14, suite-28, twin-upgrade-rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write one result file per suite and fail on any that did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PIN_BLOCK: ${{ needs.pin.outputs.block }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/suite-results"
          bad=0
          # Every needed job but the pin: the seven suites (suite-NN.json) and the upgrade rehearsal (twin-upgrade-rehearsal.json).
          while IFS=$'\t' read -r job result; do
            suite="${job#suite-}"
            jq -n --arg suite "$suite" --arg result "$result" --arg run "$GITHUB_RUN_ID" --arg pin "$PIN_BLOCK" \
              '{suite: $suite, result: $result, run_id: $run, pin_block: $pin}' > "$RUNNER_TEMP/suite-results/${job}.json"
            echo "$job: $result" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$result" = "success" ] || bad=1
          done < <(echo "$NEEDS" | jq -r 'to_entries[] | select(.key != "pin") | "\(.key)\t\(.value.result)"')
          pin_result="$(echo "$NEEDS" | jq -r '.pin.result')"
          echo "pin job: $pin_result (Twin pin block ${PIN_BLOCK:-none})" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$pin_result" = "success" ] || bad=1
          [ "$(find "$RUNNER_TEMP/suite-results" -maxdepth 1 -name "suite-*.json" | wc -l)" -ge 7 ] || { echo "::error::fewer than seven suite results were recorded"; bad=1; }
          [ -f "$RUNNER_TEMP/suite-results/twin-upgrade-rehearsal.json" ] || { echo "::error::the upgrade rehearsal result was not recorded"; bad=1; }
          exit "$bad"

      - name: Upload the suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results
          path: ${{ runner.temp }}/suite-results
          retention-days: 30
