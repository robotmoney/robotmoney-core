# Canonical: docs/development/ci-suites.md §21 — Nightly full-suite run
#
# WHY THIS SUITE EXISTS
# The per-commit CI on dev runs all workflows that are triggered on push:dev.
# However several suites are either too heavy for per-commit runs (suite-11b
# opencode-headless was such a suite; its `deposit`/`read` jobs now run replay
# coverage on a live devnet instead of a live model — issue #1210 option C,
# closed by #1233), currently disabled pending implementation
# (suite-18-security-gates,
# suite-19-erc4626-demo-tvl-matrix),
# or benefit from a periodic re-run against the latest HEAD to catch
# time-dependent regressions (flaky tests, upstream API drift, stale fixtures).
# This nightly orchestrator re-dispatches ALL suites against dev HEAD so every
# suite gets a daily green/red signal regardless of whether that day's commits
# touched its path filters.
#
# WHY workflow_dispatch ON EACH SUITE
# Re-running via the REST API's workflow_dispatch endpoint is the simplest way
# to re-trigger each suite against a specific ref without duplicating job steps.
# Each suite retains its own timeout, matrix, and concurrency settings.
#
# NOTE ON SUITE-11B COVERAGE: its `deposit`/`read` jobs run a scripted replay
# against a live devnet instead of a live model (issue #1210 option C, closed
# by #1233) — they exercise the rmpc CLI / on-chain pipeline for real but do
# not exercise live model tool-choice or refusal (docs/development/
# headless-opencode-tests.md gap G10 stays open pending option A).
#
# WHY 02:00 UTC
# Avoids collision with suite-11b (03:17 UTC) and suite-18-upstream-monitoring
# (03:00 UTC). The nightly run should complete before those fire so artifacts
# don't overlap.
#
# SELF-TEST: scripts/ci/check_nightly_dispatch_list.py (run by
# suite-13-doc-checks.yml) fails when a suite workflow is missing from the
# SUITES list below, unless it is on that script's explicit exclusion list.
#
# WHY secrets.GITHUB_TOKEN IS SUFFICIENT
# workflow_dispatch only requires the `actions: write` permission which the
# default GITHUB_TOKEN has on private repos.

name: nightly-full-suite

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly
  workflow_dispatch:      # allow manual trigger

concurrency:
  group: nightly-full-suite
  cancel-in-progress: true

permissions:
  actions: write
  issues: write

jobs:
  dispatch-all-suites:
    name: Dispatch all CI suites against dev HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_CLASS: ignore
    steps:
      - name: Dispatch suites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: dev
        run: |
          set -euo pipefail
          SUITES=(
            natspec-coverage.yml
            suite-01-02-forge-tests.yml
            suite-03-solidity-quality.yml
            suite-04-rust-quality.yml
            suite-05-fork-integration.yml
            suite-06-rmpc-unit.yml
            suite-07-rmpc-integration.yml
            suite-08-explorer-indexer.yml
            suite-09-dapp-quality.yml
            suite-10-dapp-e2e.yml
            suite-11a-opencode-smoke.yml
            suite-11b-opencode-headless.yml
            suite-12-openclaw.yml
            suite-13-doc-checks.yml
            suite-14-smoke-test.yml
            suite-15-regime-classifier.yml
            suite-16-abi-drift.yml
            suite-17-swarm-plugin.yml
            suite-18-secrets-scan.yml
            suite-18-security-gates.yml
            suite-18-upstream-monitoring.yml
            suite-19-erc4626-demo-tvl-matrix.yml
            suite-20-watchdog.yml
            suite-23-skill-url-monitor-selftest.yml
            suite-22-formal-verification.yml
            suite-23-skill-url-reachability.yml
            suite-25-fusion-harness-selftests.yml
            suite-26-fusion-devnet-acceptance.yml
            suite-27-fusion-assertion-floor.yml
            suite-27-rmpc-unit-releases.yml
            suite-28-core-stack-selftest.yml
            fusion-cross-repo-drift.yml
            config-check.yml
            suite-28-core-stages.yml
            suite-30-check-sha-green.yml
          )
          FAILED_LIST=()
          for workflow in "${SUITES[@]}"; do
            echo "Dispatching $workflow..."
            if ! gh api -X POST \
              "repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              --field ref="${REF}"; then
              echo "::error::failed to dispatch $workflow"
              FAILED_LIST+=("$workflow")
            fi
          done
          if [ "${#FAILED_LIST[@]}" -gt 0 ]; then
            echo "::error::${#FAILED_LIST[@]} suite dispatch(es) failed; the nightly did not start the whole suite: ${FAILED_LIST[*]}"
            exit 1
          fi
          echo "All dispatches sent."

  fork-pin-age-warning:
    name: Fork pin age (warning only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: ignore
    steps:
      - uses: actions/checkout@v4
      # Never fails the run. check-fork-pin-age.sh without --max-age-days only
      # reports the age and emits a ::warning:: past the refresh cadence.
      # continue-on-error: true keeps an unexpected script error from reddening
      # the nightly: this step is a maintenance signal, not a gate. The selftest
      # (scripts/ci/check-nightly-dispatch-selftest.ts) asserts the flag by yq.
      - name: Fork pin age warning
        continue-on-error: true
        run: scripts/devnet/check-fork-pin-age.sh
