# Canonical: docs/development/ci-suites.md §21 — Nightly full-suite run
#
# WHY THIS SUITE EXISTS
# The per-commit CI on dev runs all workflows that are triggered on push:dev.
# However several suites are either too heavy for per-commit runs (suite-11b
# opencode-headless was such a suite; its live-LLM jobs are now disabled by
# issue #1210 and it fails on purpose every night — see #1233), currently
# disabled pending implementation (suite-18-security-gates,
# suite-19-erc4626-demo-tvl-matrix),
# or benefit from a periodic re-run against the latest HEAD to catch
# time-dependent regressions (flaky tests, upstream API drift, stale fixtures).
# This nightly orchestrator re-dispatches ALL suites against dev HEAD so every
# suite gets a daily green/red signal regardless of whether that day's commits
# touched its path filters.
#
# WHY workflow_dispatch ON EACH SUITE
# Re-running via the REST API's workflow_dispatch endpoint is the simplest way
# to re-trigger each suite against a specific ref without duplicating job steps.
# Each suite retains its own timeout, matrix, and concurrency settings.
#
# NOTE ON THE EXPECTED RED: suite-11b is dispatched below and is deliberately
# red on every run (issue #1210 option B — live OpenCode agent coverage is
# unavailable and must not look green). Do not treat that as a nightly
# regression; issue #1233 owns restoring it.
#
# WHY 02:00 UTC
# Avoids collision with suite-11b (03:17 UTC) and suite-18-upstream-monitoring
# (03:00 UTC). The nightly run should complete before those fire so artifacts
# don't overlap.
#
# WHY secrets.GITHUB_TOKEN IS SUFFICIENT
# workflow_dispatch only requires the `actions: write` permission which the
# default GITHUB_TOKEN has on private repos.

name: nightly-full-suite

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC nightly
  workflow_dispatch:      # allow manual trigger

concurrency:
  group: nightly-full-suite
  cancel-in-progress: true

permissions:
  actions: write
  issues: write

jobs:
  dispatch-all-suites:
    name: Dispatch all CI suites against dev HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_CLASS: ignore
    steps:
      - name: Dispatch suites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: dev
        run: |
          set -euo pipefail
          SUITES=(
            natspec-coverage.yml
            suite-01-02-forge-tests.yml
            suite-03-solidity-quality.yml
            suite-04-rust-quality.yml
            suite-05-fork-integration.yml
            suite-06-rmpc-unit.yml
            suite-07-rmpc-integration.yml
            suite-08-explorer-indexer.yml
            suite-09-dapp-quality.yml
            suite-10-dapp-e2e.yml
            suite-11a-opencode-smoke.yml
            suite-11b-opencode-headless.yml
            suite-12-openclaw.yml
            suite-13-doc-checks.yml
            suite-14-smoke-test.yml
            suite-15-regime-classifier.yml
            suite-16-abi-drift.yml
            suite-17-swarm-plugin.yml
            suite-18-secrets-scan.yml
            suite-18-security-gates.yml
            suite-18-upstream-monitoring.yml
            suite-19-erc4626-demo-tvl-matrix.yml
            suite-20-watchdog.yml
            suite-23-skill-url-monitor-selftest.yml
          )
          for workflow in "${SUITES[@]}"; do
            echo "Dispatching $workflow..."
            gh api -X POST \
              "repos/${REPO}/actions/workflows/${workflow}/dispatches" \
              --field ref="${REF}" || echo "WARNING: failed to dispatch $workflow"
          done
          echo "All dispatches sent."

  live-base-fork-drift:
    name: Non-blocking live Base fork drift alarm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: heavy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the last release before 1.8.0 (issue #1263). Foundry 1.8.0
          # switched `forge doc` from mdbook to vocs output and changed `forge fmt`,
          # reddening the repo with no repo change. Unpin via issue #1264.
          version: v1.7.1
      - name: Run live fork drift suite
        id: drift
        continue-on-error: true
        env:
          FORK_RPC_URL: ${{ vars.RMPC_FORK_RPC_URL || 'https://base-rpc.publicnode.com' }}
        run: scripts/devnet/run-live-base-fork-drift.sh
      - name: Report unavailable live fork provider
        if: steps.drift.outputs.classification == 'provider'
        run: |
          echo "::warning::Live Base fork provider remained unavailable after retries; no drift issue was created."
      - name: Report invalid live fork harness
        if: steps.drift.outputs.classification == 'harness'
        run: |
          echo "::error::Live Base fork alarm did not execute its selected tests; no drift issue was created."
          exit 1
      - name: Open or update fork drift tracking issue
        if: steps.drift.outputs.classification == 'drift'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          title="ci: nightly Base fork drift detected"
          number="$(gh issue list --repo "$REPO" --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body="Nightly live Base fork drift failed at ${GITHUB_SHA}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" --label bug
          fi
