# Canonical: docs/development/ci-suites.md §6
#
# WHY THIS SUITE EXISTS
# rmpc's core logic (calldata encoding, preflight checks, nonce management, fee guards)
# must be correct before any devnet or fork test runs. Unit tests here are fast (<2 min),
# require no infrastructure, and catch the class of bugs that are most common during
# active development: off-by-one in calldata packing, wrong rejection logic, JSON schema
# drift. Suite 7 (devnet integration) depends on this suite being green — there is no
# point paying for a Docker boot if the binary itself is broken.
#
# WHY cargo test --lib (NOT --tests)
# --lib runs only the in-crate unit tests, not the integration test binaries in tests/.
# The integration tests require a running chain and belong in suite 7. Running them here
# would either fail (no chain) or silently skip, which is misleading.
#
# WHY plugin_skill_command_examples IS THE ONE INTEGRATION BINARY RUN HERE (issue #1203)
# It is the exception the rule above is about: it needs no chain, no fixture, and not
# even the built binary — it parses the `rmpc` command lines published in
# plugins/**/skills/**.md against the library's clap `Cli` type. Its subject IS markdown,
# so it has to run on the docs-only PRs that suite 7 deliberately skips via
# paths-ignore: ['**.md']. Putting it in suite 7 would mean a PR that edits a SKILL.md —
# precisely the change that can break a documented command — never runs the check that
# catches it: the same false-green shape issue #1199 was filed about. This suite has no
# paths filter and runs on every PR, so the guard cannot be bypassed. It is wrapped in
# cargo_test_require_executed.sh so a zero-tests-collected run fails RED rather than
# passing as a silent green.
#
# GOTCHAS
# - The Cargo cache is scoped to clients/rust-payment-client/target, not the workspace
#   root. If you add a workspace-level dependency that affects rmpc, the cache key
#   (based on clients/rust-payment-client/Cargo.toml) may not invalidate. Widen the
#   cache path or add the workspace Cargo.lock to the key if cross-crate cache misses
#   become a problem.
# - clippy -D warnings here and in suite 4 may produce different results because suite 4
#   runs --all-features while this job runs with default features. A warning gated behind
#   a feature flag will only appear in suite 4.

name: rust-client-unit-tests

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: rmpc-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # A crate's tests/ binaries are compiled by NOTHING in `cargo test --lib`
      # (issue #1295). `--all-targets` type-checks them here, in the job named
      # after the crate, so a struct literal that went short of a newly-required
      # field fails in THIS job rather than only in the workspace-wide rust-lint
      # nine minutes later. Enforced by
      # .github/scripts/check_rust_test_target_compile_coverage.py.
      - name: cargo clippy -p rust-payment-client --all-targets (compiles tests/ binaries)
        run: cargo clippy -p rust-payment-client --all-targets -- -D warnings

      - name: cargo test --lib
        working-directory: clients/rust-payment-client
        run: cargo test --lib -- --nocapture

      - name: Plugin skill command parser conformance
        run: |
          bash .github/scripts/cargo_test_require_executed.sh \
            --manifest-path clients/rust-payment-client/Cargo.toml \
            --test plugin_skill_command_examples -- --nocapture
