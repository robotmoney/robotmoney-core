# Canonical: docs/development/ci-suites.md §28
#
# WHY A NEW FILE AND NOT A JOB FOLDED INTO suite-01-02
# -----------------------------------------------------
# core-stack (scripts/stage/core-stack.ts, Bun TypeScript) has nothing to do with the forge
# unit/invariant/coverage gate suite-01-02 runs: it is the stage-deployment
# verb surface (devops#42), not a Solidity test. It was folded into
# suite-01-02-forge-tests.yml as a fourth job for convenience when it landed,
# which meant its own trigger set was whatever suite-01-02 happened to have
# (push: dev, pull_request, workflow_dispatch) rather than the refs the stage
# tooling actually ships on — a release branch or a `v*.*.*` tag never ran it.
# This file gives the selftest an independent trigger set and stops it riding
# along with (and being invisible inside) the forge suite's run list.
#
# WHY ITS OWN ASSERTION FLOOR, SEPARATE FROM THE SCRIPT'S OWN
# -------------------------------------------------------------
# scripts/stage/tests/core-stack.test.ts is a bun test file. This job reads the
# passed count from bun's summary and checks it against a floor held here, so a
# run that silently did less (a section skipped, a truncated file, a lost exit
# status) is red. Raise the floor when cases are added.
name: core-stack-selftest

on:
  pull_request: {}
  push:
    branches: ["releases-*"]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-stack-selftest:
    name: core-stack-selftest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_CLASS: system-correctness
      # Executed-test floor: a run that silently did less (a section skipped, a
      # truncated file, a lost exit status) is red. Raise it when cases are added.
      CORE_STACK_SELFTEST_FLOOR: "45"
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # scripts/stage/tests/core-stack.test.ts: the stage verbs in
    # scripts/stage/core-stack.ts (publish / governance / parity / record) against a fake
    # runner standing in for publish contracts, offline: the exact Twin chain
    # argument list with the keystore:PATH:PASSFILE signer, exit-code passthrough, the govern
    # row gate, a fresh keystore set per boot and the record contract. core-stack deploys
    # nothing itself (core 1488).
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: core-stack test (bun test)
        run: |
          set -o pipefail
          bun test scripts/stage/tests/core-stack.test.ts 2>&1 | tee core-stack-selftest.log
          passed="$(grep -E '^ *[0-9]+ pass$' core-stack-selftest.log | tail -1 | tr -dc '0-9')"
          failed="$(grep -E '^ *[0-9]+ fail$' core-stack-selftest.log | tail -1 | tr -dc '0-9')"
          echo "core-stack test: ${passed:-0} passed, ${failed:-unknown} failed, floor $CORE_STACK_SELFTEST_FLOOR"
          if [ "${failed:-1}" != 0 ] || [ "${passed:-0}" -lt "$CORE_STACK_SELFTEST_FLOOR" ]; then
            echo "::error::core-stack test: ${passed:-0} passed / ${failed:-unknown} failed, floor $CORE_STACK_SELFTEST_FLOOR"
            exit 1
          fi

  # The grep gate: exits 0 only when the second deployment path is gone. The
  # stage ceremony shell, the deleted stage deploy script, the deploy workflow and the Rust
  # harness deployment (forge script calls, demo seeding, faucet funding) must be
  # absent, and core-stack must hold no deploy or ceremony logic.
  deleted-stage-gate:
    name: deleted-stage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Grep gate for the deleted stage paths
        run: bun scripts/stage/check-deleted-stage-scripts.ts .

  # Pure Bun TypeScript tests for the stage tooling: the govern row parser (tx
  # hash and receipt status 1 on every row), the sheet-diff allow-list, the
  # label-diff, and the gate itself. Fast, no chain.
  stage-tooling-tests:
    name: stage-tooling-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun test scripts/stage/tests
        working-directory: scripts/stage
        run: bun test tests
