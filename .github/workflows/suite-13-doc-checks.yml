# Canonical: docs/development/ci-suites.md §13
#
# WHY THIS SUITE EXISTS
# Several ADRs and runbooks have downstream consumers that depend on their structure —
# the browser-keygen ADR is read by auditors, the explorer schema ADR is read by the
# migration tooling, the demo runbook is followed live during investor demos. Drift in
# these docs (a renamed heading, a deleted section) causes the consumer to break at the
# worst possible time. These checks are the only automated signal that cross-cutting
# documentation is staying in sync with the code.
#
# WHY NO paths: FILTER
# Drift can be introduced by any change anywhere — a contract rename affects the gateway
# coverage report, a schema change affects the explorer ADR, a runbook heading change
# affects the demo validator. A paths filter would create a false sense of safety: a PR
# that renames a contract but doesn't touch docs/ would skip the check that would catch
# the drift. No paths filter means every PR pays a ~1 min cost; that is the right
# tradeoff for cross-cutting invariants.
#
# WHY doc-validators AND schema-validators ARE SEPARATE JOBS
# They use different checkers with no shared state. Running them in parallel means a
# failure in one does not mask a failure in the other, and both results are reported
# simultaneously in the PR check list.
#
# GOTCHAS
# - Several validator scripts (check_browser_keygen_adr.py, check_dapp_credential_adr.py,
#   check_demo_runbook.py, check_explorer_adr.py) use GH_TOKEN to read issue bodies from
#   the GitHub API. If the token is absent or lacks repo read permissions, these scripts
#   will fail with a 401 or a JSON parse error — not a "token missing" error. If you see
#   unexpected 401s, check whether the GITHUB_TOKEN secret is correctly scoped.
# - check_gateway_coverage.py is also used in suite 1–2 (coverage job). Here it checks
#   for the presence and threshold of a previously-generated lcov.info. It does NOT
#   re-run forge coverage. If called without a lcov.info file on disk, it exits 1 with
#   FileNotFoundError.
# - check_explorer_migrations.py enforces that migration SQL files exist only in
#   services/explorer-indexer/migrations/. A developer who copies a migration to a
#   scratch location during debugging and forgets to delete the copy will fail this check.

name: doc-adr-runbook-migration-checks

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  doc-validators:
    name: doc-validators
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Browser keygen ADR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_browser_keygen_adr.py

      - name: dApp credential ADR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_dapp_credential_adr.py

      - name: Explorer schema ADR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_explorer_adr.py

      - name: Explorer positions response-body doc/model contract (issue #1041)
        run: python3 .github/scripts/check_explorer_positions_doc.py

      - name: Source-doc reconciliation
        run: python3 .github/scripts/check_source_doc_reconciliation.py

      - name: environments.md script-paths and env-var coverage
        run: python3 .github/scripts/check_environments_doc.py

      - name: Four-vault reference invariant (issue #479)
        run: python3 .github/scripts/check_four_vault_references.py

      - name: Self-test passthrough guard bare-substring rule (issue #921)
        # Confirms the bare-`Passthrough` rule fires (and is correctly
        # contracts/-scoped) BEFORE running the real check, so a silent
        # regression in the rule cannot let stale natspec ship undetected.
        run: python3 .github/scripts/check_no_passthrough_adapter.py --self-test

      - name: Passthrough-removal invariant (issue #912 / #921)
        run: python3 .github/scripts/check_no_passthrough_adapter.py

      - name: Self-test shutdownVault recoverability docs guard (issue #923)
        # Confirms the stale-wording / missing-restoreVault / `permanently`
        # rules fire BEFORE running the real check, so a silent regression in
        # the guard cannot let a stale "irreversible shutdown" claim ship.
        run: python3 .github/scripts/check_shutdown_restore_docs.py --self-test

      - name: shutdownVault recoverability docs invariant (issue #923)
        run: python3 .github/scripts/check_shutdown_restore_docs.py

      - name: RmpcError §7.2 variants documented in rmpc-read-output-contract.md (issue #806)
        run: python3 .github/scripts/check_rmpc_error_variants_doc.py

      - name: Canonical-header staleness — retired-plan phrase and impl-plan links (issue #823)
        run: python3 .github/scripts/check_canonical_header_staleness.py

      - name: Self-test adapter/router doc-symbol guard
        # Confirms the guard fires for every missing required symbol BEFORE
        # running the real check, so a silent regression in the guard cannot
        # let a dropped maxExposure / UsdcLegTransferFailed symbol ship.
        run: python3 .github/scripts/check_adapter_router_doc_symbols.py --self-test

      - name: Adapter/router contract-surface doc-symbol invariant
        run: python3 .github/scripts/check_adapter_router_doc_symbols.py

      - name: Self-test Geth state-lag doc/back-link guard
        # Confirms the guard fires for a missing section heading and for each
        # dropped helper back-link BEFORE running the real check, so a silent
        # regression in the guard cannot let the read-after-write state-lag
        # class lose its canonical documentation.
        run: python3 .github/scripts/check_geth_state_lag_docs.py --self-test

      - name: Geth read-after-write state-lag doc/back-link invariant
        run: python3 .github/scripts/check_geth_state_lag_docs.py

  schema-validators:
    name: schema-validators
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Explorer migrations single-canonical-home
        run: python3 .github/scripts/check_explorer_migrations.py

      - name: Install jsonschema (committee vote schema validation)
        run: pip install jsonschema

      - name: Committee vote JSON schema — valid fixture passes, invalid fixture fails (issue #1044, #1050)
        run: python3 .github/scripts/check_committee_vote_schema.py

  generated-docs-freshness:
    name: generated-docs-freshness
    # WHY THIS JOB EXISTS
    # contracts/doc/src/contracts/ is machine-generated output from `forge doc`. It carries
    # a top-of-file banner marking it as generated. Without a staleness check, a
    # developer who adds NatSpec to a contract and forgets to commit the regenerated
    # markdown will leave the docs stale — and a later `forge doc` run will silently
    # overwrite any manual edits. This job catches both failure modes: stale docs
    # (committed behind the source) and spurious hand-edits (committed ahead of the
    # generator).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Self-test freshness comparator (issue #450)
        # Confirms the drift comparator fires for added/removed/changed
        # generated files BEFORE running the real check. Without this, a silent
        # regression in the comparator could let stale docs ship undetected.
        run: python3 .github/scripts/check_generated_contract_docs_freshness.py --self-test

      - name: Check generated contract docs freshness
        run: python3 .github/scripts/check_generated_contract_docs_freshness.py

  feature-flag-consistency:
    name: feature-flag-consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cross-system feature flag consistency
        # Verifies that flag IDs in config/feature-flags.json match the
        # constants in contracts/FeatureFlags.sol, clients/dapp/src/feature-flags.ts,
        # and services/explorer-indexer/src/feature_flags.rs.
        # Implements: issue #389
        run: python3 .github/scripts/check_feature_flag_consistency.py

  tracked-path-charset:
    name: tracked-path-charset
    # WHY THIS JOB EXISTS (issue #1252)
    # Every anchored path regex in this repo — the swarm plugin's restricted-path
    # coupling guard, the analyst plugin's, the migration-placement invariant —
    # assumes `git ls-files` / `git diff --name-only` emits a bare path. git only
    # does that while the path is printable ASCII. Give a file a non-ASCII byte, a
    # quote, a backslash, a tab or a newline and git C-quotes the whole path:
    #
    #     "contracts/caf\303\251.sol"
    #
    # The leading `"` defeats every `^`-anchored match, silently. #1252 reproduced
    # exactly that against the guard PR #1234 had just added.
    #
    # The repo has zero such paths today, so this job pins the state the repo is
    # already in rather than imposing a new constraint. It rejects the filename
    # instead of teaching each parser to unquote — a filename we would reject in
    # review is not one any parser should have to survive.
    #
    # WHY IT LIVES IN THIS SUITE AND NOT SUITE 17
    # The subject of this check IS a filename, so a `paths:`-gated job structurally
    # cannot see the file that would trip it — the change that adds `contracts/café.sol`
    # is the change a path filter skips. This suite is the repo's designated home
    # for path-unfiltered cross-cutting invariants and defends that property in its
    # own header ("WHY NO paths: FILTER"), so scoping this job away would require
    # overriding a documented invariant rather than doing it by accident. Suite 17
    # was rejected as a host: it is the swarm plugin's suite, this rule is repo-wide,
    # and its assertion floors (#1222) would have to move in lockstep for no gain.
    # This is the third time the repo has had to reason about it — #1203 put a
    # markdown guard behind `paths-ignore: ['**.md']`, #1235 repeated the shape.
    #
    # WHY THE SELF-TEST STEP IS NOT SEPARATE
    # It is not a separate step because the script runs it itself, first, on every
    # invocation, and refuses to scan if it fails. Same shape as the
    # generated-docs-freshness self-test above, but the ordering cannot be lost to a
    # later edit of this file.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Unit-level liveness check of a repo invariant; no external resource.
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the charset guard, then scan every tracked path
        # The script proves on this runner that it can emit a FAIL (non-ASCII,
        # quote, backslash, tab, newline, DEL, untrusted input, empty listing)
        # before it is allowed to report a PASS on the real tree. It shells out to
        # nothing but git — no `grep -P`, no `grep -z` — so it has no flag that a
        # runner image could fail to support.
        run: bash scripts/check-tracked-path-charset.sh
