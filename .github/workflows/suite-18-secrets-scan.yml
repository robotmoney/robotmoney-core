# Canonical: docs/technical/security-model.md §13 (CI secrets-scanning control)
#
# WHY THIS SUITE EXISTS
# security-model.md §13 mandates: "CI must run a secrets-scanning step on every
# PR." Leaked credentials (private keys, API tokens, AWS keys) committed to any
# branch are catastrophic and effectively irreversible once pushed. This QUICK-
# tier gate runs gitleaks against every pull request before the code can reach
# dev or main, failing the build non-zero on the first detected secret so the
# merge is blocked.
#
# WHY A PINNED BINARY, NOT THE MARKETPLACE ACTION
# gitleaks/gitleaks-action requires a paid org license key and uploads SARIF to
# GitHub Advanced Security. We instead download a digest-pinned gitleaks release
# tarball and run the CLI directly: no license, no external upload, fully
# reproducible, and the version is explicit in GITLEAKS_VERSION below.
#
# WHY full history ON PRs
# We scan the PR's commit range (base..head) so every commit pushed to the open
# PR is checked, not just the tip — a secret added and then "removed" in a later
# commit still lives in history and must be caught.
#
# CONFIG
# Allowlist and rule extension live in .gitleaks.toml at the repo root. Only
# known-safe test fixtures are allowlisted, each with a justifying comment.

name: secrets-scan

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; push:main/dev keep a distinct non-cancelling lane
# (group keyed by github.ref). Matches the issue #600 velocity-tier invariant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned gitleaks release. Bumping this is the single point of version control
  # for the scanner; the SHA256 below must be updated in lockstep.
  GITLEAKS_VERSION: "8.18.4"
  GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"

jobs:
  gitleaks:
    name: secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 so the PR commit range (base..head) is available for a
      # full-history scan, not just the shallow tip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scan only the PR's commit range so the gate runs on every commit pushed
      # to the open PR. On push to main/dev (and manual dispatch) we scan the
      # full working tree instead.
      - name: Run gitleaks (PR commit range)
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact \
            --verbose \
            --exit-code 1

      - name: Run gitleaks (full tree)
        if: github.event_name != 'pull_request'
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --redact \
            --verbose \
            --exit-code 1
