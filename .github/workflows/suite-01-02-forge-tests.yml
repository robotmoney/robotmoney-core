# Canonical: docs/development/ci-suites.md §1–2
#
# WHY THIS SUITE EXISTS
# RobotMoneyGateway is the trust boundary for all user funds. Any regression in its
# access control, rounding, or event emission is a potential loss event. Unit tests
# run on every contracts/** change so regressions are caught before review. Invariant
# tests exercise stateful sequences a human reviewer would never enumerate manually —
# they are the only reliable check against subtle share-accounting drift. Coverage is
# gated (not just reported) because an uncovered branch in a vault contract is a known
# audit finding that will block launch.
#
# WHY unit AND invariant ARE PARALLEL JOBS
# They touch different test suites (test/ vs test/invariant/) and take similar wall time.
# Running in parallel halves the feedback loop. coverage runs after both because it is
# only worth paying for lcov instrumentation when the tests actually pass.
#
# GOTCHAS
# - The Foundry cache key includes all *.sol files. If the cache is stale after a
#   dependency update in lib/, force a cache miss by bumping the key suffix.
# - forge coverage uses --ir-minimum to keep instrumentation cheap. Without it the
#   optimizer inlines everything and lcov reports misleading coverage gaps.
# - check_gateway_coverage.py reads lcov.info from the working directory. If forge
#   writes it elsewhere (e.g. after a Foundry version bump), the script will exit 1
#   with a FileNotFoundError that looks like a test failure.
# - invariant tests run with the default fuzzer seed. Flaky failures are almost always
#   real invariant violations found on a specific seed; re-running locally with
#   --fuzz-seed <seed> from the CI log will reproduce them.

name: forge-unit-invariant-coverage

on:
  # Unit tests are feature-correctness and run throughout the PR lifecycle.
  # Stateful invariants, fork regressions, and whole-suite coverage are
  # system-correctness and start once a PR is ready for review.
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: forge-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the last release before 1.8.0 (issue #1263). Foundry 1.8.0
          # switched `forge doc` from mdbook to vocs output and changed `forge fmt`,
          # reddening the repo with no repo change. Unpin via issue #1264.
          version: v1.7.1

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (unit)
        # `--no-match-test "^testFail_"` skips the two deprecated `testFail_*`
        # functions that the vendored a16z `erc4626-tests` suite still ships.
        # Modern forge rejects them by name (gas:0 failure) before execution,
        # so excluding them at the runner is the cleanest seam. The 24 vanilla
        # ERC-4626 properties in RobotMoneyVault4626Conformance still run.
        #
        # `--no-match-contract "UniV3AssetPositionAdapterForkTest|UniV4AssetPositionAdapterForkTest|AerodromeAssetPositionAdapterForkTest"`:
        # those contracts are LOUD-SKIP fork tests (issues #1118 / #1124 / #1125) —
        # their setUp reverts when no fork RPC is configured (never a silent
        # skip). This light unit job has no fork RPC, so it excludes the fork
        # contracts; they execute in the `fork-regressions` job below, which
        # supplies one. The non-fork `UniV3AssetPositionAdapterTest` /
        # `UniV4AssetPositionAdapterTest` / `AerodromeAssetPositionAdapterTest`
        # mock harnesses still run here.
        run: >-
          forge test -vvv
          --no-match-test "^testFail_"
          --no-match-path "contracts/test/{DeploySeedDeposit,SafeIntegration,VaultForkRegressions}.t.sol"
          --no-match-contract "UniV3AssetPositionAdapterForkTest|UniV4AssetPositionAdapterForkTest|AerodromeAssetPositionAdapterForkTest"

      - name: forge test (four-vault real-TVL pyramid — issue #592)
        # Explicit, named guard for the four-vault real-TVL end state so it
        # cannot silently regress (the suite above already runs these, but a
        # dedicated step gives a discrete CI signal):
        #   - DeployDemoExtraVaults.t.sol — four vaults Active and all four
        #     router-eligible (8500/500/500/500 bps split, rmRWA at 500 per
        #     issue #621), all with non-zero totalAssets after a routed +
        #     direct deposit.
        #   - RwaVault.t.sol — deSPXA deposit/redeem round-trip and stale-oracle
        #     halt (PRD §11.4, ADR-0006).
        #   - BasketVault / AgentTokenVault — per-vault basket composition.
        run: |
          forge test -vvv --match-path "contracts/test/DeployDemoExtraVaults.t.sol"
          forge test -vvv --match-contract 'Rwa|DeSPXA|Despxa|BasketVault|AgentTokenVault'

      - name: forge test (unified-vault ERC-4626 conformance per composition + EIP-170 size gate — issue #1127)
        # Explicit, named guard so the ADR-0010 unified-vault deliverables cannot
        # silently regress (the unit suite above already runs these; a dedicated
        # step gives a discrete, required CI signal — M-A2/M-A3):
        #   - UnifiedVaultConformanceTest{Exact,RedeemOnly}: ERC-4626 conformance
        #     re-verified PER COMPOSITION — lending-only EXACT mode (live withdraw,
        #     non-zero max*, fee-on-gross) vs basket REDEEM-ONLY mode (withdraw
        #     reverts RedeemOnly, max*==0, fee-on-realized, floored previews). The
        #     two modes expose different withdraw/redeem/preview/fee-base semantics
        #     that integrators branch on, so one pass over one mode is insufficient.
        #   - VaultCodeSizeGuard: asserts the unified `Vault` AND every deployable
        #     adapter fit under the EIP-170 24576-byte runtime limit and fails the
        #     build otherwise — undeployable-on-Base bytecode caught in CI, not on
        #     broadcast (cf. issue #865). Runs OUTSIDE `forge coverage` (which
        #     instruments bytecode and inflates every contract past the limit).
        run: |
          forge test -vvv --match-contract "UnifiedVaultConformanceTest"
          forge test -vvv --match-contract "VaultCodeSizeGuard"

      - name: forge test (unified-vault per-composition gas measurement — issue #1127)
        # Gas MEASUREMENT for the two compositions (M-A3). The per-composition
        # NUMERIC gas budget is set after the Phase-2 spike (out of scope here), so
        # this step measures and reports rather than asserting a threshold; the
        # EIP-170 size gate above is the gating budget check in this PR. Emitting
        # the gas report in CI keeps the measurement running so a regression is
        # visible in the log the moment the numeric budget lands.
        run: forge test --match-contract "UnifiedVaultConformanceTest" --gas-report

  invariant:
    name: forge-invariant-fuzz-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the last release before 1.8.0 (issue #1263). Foundry 1.8.0
          # switched `forge doc` from mdbook to vocs output and changed `forge fmt`,
          # reddening the repo with no repo change. Unpin via issue #1264.
          version: v1.7.1

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (invariant / fuzz)
        run: forge test --match-path "test/invariant/**" -vvv

  fork-regressions:
    name: forge-fork-vault-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # The fork gate is deterministic and offline: every target loads the checked-in
    # Base state and fails loudly if the fixture or executed test count is missing.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fork-state digest helper round-trip self-test (issue #1152)
        # Offline, no network/Docker: exercises scripts/devnet/fork-state-digest.sh
        # write+verify against a throwaway temp blob before anything below relies
        # on it against the real fixture.
        run: scripts/devnet/check-fork-state-digest-selftest.sh

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # CURRENT.anvil-state uses the Anvil 1.6 serializer; anvil v1.7.1 loads it
          # (verified locally against testing/fixtures/fork-state/CURRENT.anvil-state),
          # so this site no longer needs the floating `nightly` channel.
          # Pinned to the last release before 1.8.0 (issue #1263). Foundry 1.8.0
          # switched `forge doc` from mdbook to vocs output and changed `forge fmt`,
          # reddening the repo with no repo change. Unpin via issue #1264.
          version: v1.7.1

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (fork vault regressions)
        run: scripts/devnet/run-golden-forge-forks.sh --match-path "contracts/test/VaultForkRegressions.t.sol"

      - name: forge test (deploy seed deposit precondition — issue #656)
        run: scripts/devnet/run-golden-forge-forks.sh --match-contract "DeploySeedDeposit"

      - name: forge test (Safe multisig integration — issue 422)
        run: scripts/devnet/run-golden-forge-forks.sh --match-path "contracts/test/SafeIntegration.t.sol"

      - name: Assert missing fixture is red
        run: |
          mv testing/fixtures/fork-state/CURRENT.anvil-state /tmp/CURRENT.anvil-state
          if scripts/devnet/run-golden-forge-forks.sh --match-path "contracts/test/VaultForkRegressions.t.sol"; then
            echo "missing fixture unexpectedly passed" >&2
            exit 1
          fi
          mv /tmp/CURRENT.anvil-state testing/fixtures/fork-state/CURRENT.anvil-state

      - name: Assert tampered fixture is red
        # ADR-0011 addendum (issue #1152): a byte-flipped blob must fail the
        # sha256 integrity check in check-fork-manifest.sh, not silently load.
        run: |
          cp testing/fixtures/fork-state/CURRENT.anvil-state /tmp/CURRENT.anvil-state.bak
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("testing/fixtures/fork-state/CURRENT.anvil-state")
          data = bytearray(p.read_bytes())
          data[0] ^= 0xFF
          p.write_bytes(data)
          PY
          if scripts/devnet/run-golden-forge-forks.sh --match-path "contracts/test/VaultForkRegressions.t.sol"; then
            echo "tampered fixture unexpectedly passed" >&2
            mv /tmp/CURRENT.anvil-state.bak testing/fixtures/fork-state/CURRENT.anvil-state
            exit 1
          fi
          mv /tmp/CURRENT.anvil-state.bak testing/fixtures/fork-state/CURRENT.anvil-state

      - name: Assert missing digest is red
        # ADR-0011 addendum (issue #1152): a manifest lacking state_sha256 must
        # fail loudly, not warn-and-continue.
        run: |
          cp testing/fixtures/fork-state/CURRENT.json /tmp/CURRENT.json.bak
          jq 'del(.state_sha256)' /tmp/CURRENT.json.bak > testing/fixtures/fork-state/CURRENT.json
          if scripts/devnet/run-golden-forge-forks.sh --match-path "contracts/test/VaultForkRegressions.t.sol"; then
            echo "missing digest unexpectedly passed" >&2
            mv /tmp/CURRENT.json.bak testing/fixtures/fork-state/CURRENT.json
            exit 1
          fi
          mv /tmp/CURRENT.json.bak testing/fixtures/fork-state/CURRENT.json

      - name: Verify ADR-0011 workflow structure
        run: scripts/devnet/check-adr0011-ci.sh

      - name: forge test (Uniswap V3 AssetPositionAdapter fork — issue #1118)
        env:
          # UniV3AssetPositionAdapterForkTest swaps USDC<->wETH through a REAL Base
          # Uniswap V3 pool via the concrete UniswapV3SwapAdapter venue seam,
          # asserting TWAP-priced totalAssets, the composed slippage-floor revert,
          # and the ORA-4 NAV-deviation guard on a manipulated spot. It cannot run
          # against the offline golden fixture above (run-golden-forge-forks.sh):
          # that snapshot only carries the state touched while generating the
          # vault/adapter deployment fixtures, which never touched the Uniswap V3
          # factory/pool — `getPool` has no code to call there. It genuinely needs
          # a live RPC, same as the `live-base-fork-drift` job in
          # suite-21-nightly.yml, so it uses the same `vars.RMPC_FORK_RPC_URL`
          # (repo/org variable, not secret) with the same public-RPC fallback —
          # no repo secret named RMPC_FORK_RPC_URL exists (`gh api
          # repos/.../actions/secrets` returns zero), so leaving this pinned to
          # `secrets.*` made the job loud-fail on every run, not just when
          # genuinely misconfigured.
          #
          # LOUD-SKIP (test-coverage-policy invariant 1): this contract's setUp
          # REVERTS when neither RMPC_FORK_RPC_URL nor FORK_RPC_URL resolves to a
          # non-empty string — it never silent-skips. The public-RPC fallback
          # means that never happens in practice; if the fallback endpoint is ever
          # deleted, the job goes red rather than green-skipping.
          FORK_RPC_URL: ${{ vars.RMPC_FORK_RPC_URL || 'https://base-rpc.publicnode.com' }}
        run: |
          forge test --match-contract "UniV3AssetPositionAdapterForkTest" -vvv

      - name: forge test (Uniswap V4 AssetPositionAdapter fork — issue #1124)
        env:
          # UniV4AssetPositionAdapterForkTest exercises a full deploy/withdraw
          # round-trip against REAL Base-mainnet USDC (`deal`d balances, genuine
          # ERC-20 6-decimal token bytecode) through the concrete
          # `UniswapV4SwapAdapter` venue seam. It deploys a local V4 router/pool
          # harness on the fork (see the test file header): no genuinely deployed
          # third-party Uniswap V4 pool is ABI-compatible with this repo's
          # `IUniswapV4Pool`/`IUniswapV4SwapRouter` seam (documented architecture
          # gap, docs/code-review/20260623-code-review-testmachine-azimuth.md,
          # info-severity, out of #1124's scope to redesign). Same
          # `vars.RMPC_FORK_RPC_URL` (repo/org variable, not secret) with the same
          # public-RPC fallback as the V3 fork test above and the
          # `live-base-fork-drift` job in suite-21-nightly.yml.
          #
          # LOUD-SKIP (test-coverage-policy invariant 1): this contract's setUp
          # REVERTS when neither RMPC_FORK_RPC_URL nor FORK_RPC_URL resolves to a
          # non-empty string — it never silent-skips.
          FORK_RPC_URL: ${{ vars.RMPC_FORK_RPC_URL || 'https://base-rpc.publicnode.com' }}
        run: |
          forge test --match-contract "UniV4AssetPositionAdapterForkTest" -vvv

      - name: forge test (Aerodrome AssetPositionAdapter fork — issue #1125)
        env:
          # AerodromeAssetPositionAdapterForkTest swaps USDC<->wETH through a REAL
          # Base Aerodrome Slipstream CL pool via the concrete AerodromeSwapAdapter
          # venue seam, asserting TWAP-priced totalAssets, the composed
          # slippage-floor revert, and the ORA-4 NAV-deviation guard on a
          # manipulated spot — invariant parity with the sibling Uniswap V3 fork
          # test above. It cannot run against the offline golden fixture
          # (run-golden-forge-forks.sh): that snapshot never touched the Aerodrome
          # Slipstream factory/pool. Same public-RPC-fallback rationale as the V3
          # fork job above.
          #
          # LOUD-SKIP (test-coverage-policy invariant 1): this contract's setUp
          # REVERTS when neither RMPC_FORK_RPC_URL nor FORK_RPC_URL resolves to a
          # non-empty string — it never silent-skips.
          FORK_RPC_URL: ${{ vars.RMPC_FORK_RPC_URL || 'https://base-rpc.publicnode.com' }}
        run: |
          forge test --match-contract "AerodromeAssetPositionAdapterForkTest" -vvv

  coverage:
    name: forge-coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: system-correctness
    needs: [unit, invariant]
    # The expensive lcov coverage gate is system-correctness: it starts at
    # ready-for-review and also runs after merge on push to dev.
    # See docs/development/ci-suites.md (CI velocity tiers).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned to the last release before 1.8.0 (issue #1263). Foundry 1.8.0
          # switched `forge doc` from mdbook to vocs output and changed `forge fmt`,
          # reddening the repo with no repo change. Unpin via issue #1264.
          version: v1.7.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge coverage
        # See the unit job for why `--no-match-test "^testFail_"` is required.
        # `--no-match-contract VaultCodeSizeGuard`: that guard asserts each vault's
        # deployed bytecode is under the EIP-170 24576-byte limit (issue #865), but
        # `forge coverage` instruments bytecode, inflating every contract well past
        # the limit (RobotMoneyVault ~34KB) — the assertion is meaningless under
        # coverage. The guard still runs in the unit job above; only coverage skips it.
        # `--no-match-contract CustodyInvariantGuardTest`: this guard scans each
        # production source file for forbidden arbitrary-recipient asset movers
        # (INV-1/INV-2, issue #929). It reads and substring-scans large source files
        # in a loop; under `--ir-minimum` coverage instrumentation the per-instruction
        # tracing overhead multiplies gas ~100x and exhausts the block gas limit
        # (issue #944). The invariant still runs in the unit job above; only the
        # coverage instrumentation pass is excluded.
        # `^test_getPastVotes_` tests are excluded: they all rely on `vm.roll` to
        # create historical voting-power checkpoints, but under
        # `forge coverage --ir-minimum` the roll does not take effect, so
        # getPastVotes either returns the latest value instead of the historical
        # one, or does not revert when it should (AZ-GOV-1). All pass in the
        # forge test (unit) job; only the coverage instrumentation pass is affected.
        # `UniV3AssetPositionAdapterForkTest` / `UniV4AssetPositionAdapterForkTest` /
        # `AerodromeAssetPositionAdapterForkTest` are excluded: all three are
        # LOUD-SKIP fork tests (issues #1118 / #1124 / #1125) whose
        # setUp reverts without a fork RPC, which this coverage job does not set.
        # They execute in `fork-regressions` above.
        run: >-
          forge coverage --report lcov --ir-minimum
          --no-match-test "^testFail_|^test_getPastVotes_"
          --no-match-contract "VaultCodeSizeGuard|CustodyInvariantGuardTest|UniV3AssetPositionAdapterForkTest|UniV4AssetPositionAdapterForkTest|AerodromeAssetPositionAdapterForkTest"
          --no-match-path "contracts/test/{DeploySeedDeposit,SafeIntegration,VaultForkRegressions}.t.sol"

      - name: Enforce branch-coverage gate
        run: python3 .github/scripts/check_gateway_coverage.py lcov.info
