# Canonical: docs/development/ci-suites.md §1–2
#
# WHY THIS SUITE EXISTS
# RobotMoneyGateway is the trust boundary for all user funds. Any regression in its
# access control, rounding, or event emission is a potential loss event. Unit tests
# run on every contracts/** change so regressions are caught before review. Invariant
# tests exercise stateful sequences a human reviewer would never enumerate manually —
# they are the only reliable check against subtle share-accounting drift. Coverage is
# gated (not just reported) because an uncovered branch in a vault contract is a known
# audit finding that will block launch.
#
# WHY unit AND invariant ARE PARALLEL JOBS
# They touch different test suites (test/ vs test/invariant/) and take similar wall time.
# Running in parallel halves the feedback loop. coverage runs after both because it is
# only worth paying for lcov instrumentation when the tests actually pass.
#
# GOTCHAS
# - The Foundry cache key includes all *.sol files. If the cache is stale after a
#   dependency update in lib/, force a cache miss by bumping the key suffix.
# - forge coverage uses --ir-minimum to keep instrumentation cheap. Without it the
#   optimizer inlines everything and lcov reports misleading coverage gaps.
# - check_gateway_coverage.py reads lcov.info from the working directory. If forge
#   writes it elsewhere (e.g. after a Foundry version bump), the script will exit 1
#   with a FileNotFoundError that looks like a test failure.
# - invariant tests run with the default fuzzer seed. Flaky failures are almost always
#   real invariant violations found on a specific seed; re-running locally with
#   --fuzz-seed <seed> from the CI log will reproduce them.

name: forge-unit-invariant-coverage

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: forge-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (unit)
        # `--no-match-test "^testFail_"` skips the two deprecated `testFail_*`
        # functions that the vendored a16z `erc4626-tests` suite still ships.
        # Modern forge rejects them by name (gas:0 failure) before execution,
        # so excluding them at the runner is the cleanest seam. The 24 vanilla
        # ERC-4626 properties in RobotMoneyVault4626Conformance still run.
        run: forge test -vvv --no-match-test "^testFail_"

      - name: forge test (four-vault real-TVL pyramid — issue #592)
        # Explicit, named guard for the four-vault real-TVL end state so it
        # cannot silently regress (the suite above already runs these, but a
        # dedicated step gives a discrete CI signal):
        #   - DeployDemoExtraVaults.t.sol — four vaults Active, three router-
        #     eligible + the direct-seed deSPXA RWA vault, all with non-zero
        #     totalAssets after a routed + direct deposit.
        #   - RwaVault.t.sol — deSPXA deposit/redeem round-trip and stale-oracle
        #     halt (PRD §11.4, ADR-0006).
        #   - BasketVault / AgentTokenVault — per-vault basket composition.
        run: |
          forge test -vvv --match-path "contracts/test/DeployDemoExtraVaults.t.sol"
          forge test -vvv --match-contract 'Rwa|DeSPXA|Despxa|BasketVault|AgentTokenVault'

  invariant:
    name: forge-invariant-fuzz-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (invariant / fuzz)
        run: forge test --match-path "test/invariant/**" -vvv

  fork-regressions:
    name: forge-fork-vault-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Run on push to main/dev so the full suite is always exercised on merged commits.
    # On PRs the job still runs but the fork tests skip cleanly when the RPC secret is
    # absent (contributor forks without the secret stay green).
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (fork vault regressions)
        env:
          # When RMPC_FORK_RPC_URL is set (secret available), the tests run against a
          # live Base archive fork.  When the secret is absent (contributor fork / PR),
          # every test in VaultForkRegressions.t.sol skips cleanly via the _setUp()
          # guard — the job still passes.
          FORK_RPC_URL: ${{ secrets.RMPC_FORK_RPC_URL }}
        run: |
          forge test --match-path "contracts/test/VaultForkRegressions.t.sol" -vvv

      - name: forge test (Safe multisig integration — issue 422)
        env:
          # SafeIntegration.t.sol deploys a real Safe proxy via SafeProxyFactory on
          # Base mainnet. When RMPC_FORK_RPC_URL is set the tests exercise the full
          # quorum-enforcement path. When the secret is absent they skip cleanly via
          # the _forkAvailable() guard — the job still passes.
          FORK_RPC_URL: ${{ secrets.RMPC_FORK_RPC_URL }}
        run: |
          forge test --match-path "contracts/test/SafeIntegration.t.sol" -vvv

  coverage:
    name: forge-coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit, invariant]
    # HEAVY tier (issue #600): unit + invariant stay quick and run on every feature
    # PR, but the expensive lcov coverage gate is re-anchored at the phase-integration
    # boundary. It runs on push (dev / dev-phase-* / main) and on PRs that target a
    # dev-phase-* branch, but NOT on ordinary feature-branch PRs (to main/dev).
    # See docs/development/ci-suites.md (CI velocity tiers).
    if: >-
      github.event_name != 'pull_request' ||
      startsWith(github.base_ref, 'dev-phase-')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge coverage
        # See the unit job for why `--no-match-test "^testFail_"` is required.
        run: forge coverage --report lcov --ir-minimum --no-match-test "^testFail_"

      - name: Enforce branch-coverage gate
        run: python3 .github/scripts/check_gateway_coverage.py lcov.info
