# Canonical: docs/development/ci-suites.md §1–2
#
# WHY THIS SUITE EXISTS
# RobotMoneyGateway is the trust boundary for all user funds. Any regression in its
# access control, rounding, or event emission is a potential loss event. Unit tests
# run on every contracts/** change so regressions are caught before review. Invariant
# tests exercise stateful sequences a human reviewer would never enumerate manually —
# they are the only reliable check against subtle share-accounting drift. Coverage is
# gated (not just reported) because an uncovered branch in a vault contract is a known
# audit finding that will block launch.
#
# WHY unit AND invariant ARE PARALLEL JOBS
# They touch different test suites (test/ vs test/invariant/) and take similar wall time.
# Running in parallel halves the feedback loop. coverage runs after both because it is
# only worth paying for lcov instrumentation when the tests actually pass.
#
# GOTCHAS
# - The Foundry cache key includes all *.sol files. If the cache is stale after a
#   dependency update in lib/, force a cache miss by bumping the key suffix.
# - forge coverage deliberately does NOT pass --ir-minimum (issue #1298). That flag
#   enables viaIR, whose peak memory grows steeply with the compile set: it wanted
#   17.5 GiB of a 16 GB runner at 174 files and OOM-killed it at 178. It is
#   also not needed — nothing in contracts/ hits "stack too deep" without it — and
#   removing it *raised* measured branch coverage, because viaIR's own warning about
#   degraded source mappings was costing real branch hits. Do not re-add it; the
#   memory guard below will fail the job if anything reintroduces that cost.
# - the coverage compile runs under .github/scripts/run_coverage_memory_guard.py, which
#   fails the job once the run exceeds 50% of runner RAM. That is on purpose: past the
#   real ceiling GitHub reports only "The runner has received a shutdown signal" and
#   "exit code 143", which reads as flake and provokes re-runs that cannot succeed.
# - check_gateway_coverage.py reads lcov.info from the working directory. If forge
#   writes it elsewhere (e.g. after a Foundry version bump), the script will exit 1
#   with a FileNotFoundError that looks like a test failure.
# - invariant tests run with the default fuzzer seed. Flaky failures are almost always
#   real invariant violations found on a specific seed; re-running locally with
#   --fuzz-seed <seed> from the CI log will reproduce them.

name: forge-unit-invariant-coverage

on:
  # Unit tests are feature-correctness and run throughout the PR lifecycle.
  # Stateful invariants, fork regressions, and whole-suite coverage are
  # system-correctness and start once a PR is ready for review.
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: forge-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Core S1 (issue 1483): the flags that lifted a deploy floor must not return.
      - uses: oven-sh/setup-bun@v2

      - name: Removed deploy flags are absent
        run: |
          bun scripts/ci/check-removed-flags.ts
          bun test scripts/ci/check-removed-flags.test.ts

      # Core S10 (issue 1489): no test-only code ships. The gate fails when it scans zero
      # files, and its self-test plants a Demo contract, a stub and a mock Safe.
      - name: No test-only code in the build
        run: |
          bun scripts/ci/check-no-test-only-code.ts
          bun test scripts/ci/check-no-test-only-code.test.ts

      # Core 1490 (clean room rule, core 1498): no test or harness file hard-codes a Robot Money
      # production address. Tests deploy their own vault and read the manifests.
      - name: No production Robot Money addresses in tests or harnesses
        run: |
          bun scripts/ci/check-no-production-addresses.ts
          bun test scripts/ci/check-no-production-addresses.test.ts scripts/deploy/third-party-addresses.test.ts

      - name: Audit ledger covers every shipped contract
        run: |
          bash scripts/check-audit-ledger.sh
          bash scripts/check-audit-ledger.test.sh

      # Core S3 (issue 1485): no reader of the deploy manifest names a retired key or script.
      - name: Retired manifest keys are absent
        run: bun scripts/ci/check-manifest-keys.ts

      - name: Manifest-key gate and core stage table tests
        run: bun test scripts/ci/check-manifest-keys.test.ts scripts/deploy/stage-table.test.ts

      # Core S2 (issue 1484): config rules and the offline config-check test.
      - name: Config-check offline test
        run: bun test scripts/ci/config-check.test.ts

      - name: Twin chain tooling unit tests (core issues 1498, 1447)
        # Offline, no anvil, no network: the Twin fork tool, the Safe set check against a stub
        # chain and the forge fork test runner's executed-test counter.
        run: bun test scripts/devnet --timeout 60000

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (unit)
        # `--no-match-test "^testFail_"` skips the two deprecated `testFail_*`
        # functions that the vendored a16z `erc4626-tests` suite still ships.
        # Modern forge rejects them by name (gas:0 failure) before execution,
        # so excluding them at the runner is the cleanest seam. The 24 vanilla
        # ERC-4626 properties in RobotMoneyVault4626Conformance still run.
        #
        run: >-
          forge test -vvv
          --no-match-test "^testFail_"
          --no-match-path "contracts/test/{DeploySeedDeposit,SafeIntegration,VaultForkRegressions,GovernanceExecutePathAfterHandover,RwaBasketVaultFork,CoreStagesFork}.t.sol"

      # Fusion's named evidence files need an execution boundary in the CI log.
      # A whole-suite `forge test` is not enough for a fail-closed external
      # evidence reader to know that an individual file actually ran.
      - name: Fusion contract evidence targets
        run: |
          for f in ConsensusRecommendationReceipt InvestmentCommitteePolicy AccessRoles GovernanceSeparationInvariant QuorumFloorInvariant GatewayAgentPolicyAuthorization; do
            echo "::group::contracts/test/${f}.t.sol:"
            forge test -vvv --match-path "contracts/test/${f}.t.sol"
            echo "::endgroup::"
          done

      - name: Gateway storage-layout gate (issue 1476)
        # RobotMoneyGateway state may only be appended. The gate diffs the
        # AST-id-free (label, slot, offset, type) of every state variable and
        # storage-struct member from `forge inspect` against the committed
        # snapshot (taken from dev before issue 1476). The self-test runs first
        # and proves the gate fails on a mutated snapshot.
        run: |
          scripts/ci/check-gateway-storage-layout.sh --selftest
          scripts/ci/check-gateway-storage-layout.sh

      - name: Gateway agent-policy gas report (issue 1476)
        # Measurement, not a budget: prints the RobotMoneyGateway rows for
        # authorizeAgent, revealAuthorization, setPolicy and
        # transferAgentOwnership so a change in their cost shows in the log.
        run: forge test --match-contract "GatewayAgentPolicyAuthorizationTest" --gas-report

      - name: forge test (basket vault production scripts and eligibility — core 1486)
        # Explicit, named guard for the three basket vault scripts (one deployment scheme):
        #   - DeployProtocolAssetVault.t.sol: rmPROTO paused with exactly wETH and cbBTC,
        #     asset config read back equals config/protocol-assets.json.
        #   - DeployAgentTokenVault.t.sol: rmAGENT empty, paused, registered.
        #   - DeployBasketVaultRwa.t.sol: rmRWA is a plain BasketVault row for deSPXA through
        #     the UniswapV3SwapAdapter on the fee 500 pool.
        #   - ActivateBasketVaultEligibility.t.sol: atomic migrateEligibility per basket.
        #   - BasketVault / AgentTokenVault / ProtocolAssetVault: per-vault composition.
        run: |
          forge test -vvv --match-path "contracts/test/DeployProtocolAssetVault.t.sol"
          forge test -vvv --match-path "contracts/test/DeployAgentTokenVault.t.sol"
          forge test -vvv --match-path "contracts/test/DeployBasketVaultRwa.t.sol"
          forge test -vvv --match-path "contracts/test/ActivateBasketVaultEligibility.t.sol"
          forge test -vvv --match-contract 'BasketVault|AgentTokenVault|ProtocolAssetVault'
          bash scripts/ci/check-no-devnet-config.sh
          bun scripts/ci/check-set-registry-owner.ts
          bun test scripts/ci/check-set-registry-owner.test.ts
          forge test -vvv --match-path "contracts/test/DeployTimelock.t.sol"

      - name: forge test (non-zero test count guard for deploy input and timelock suites — core 1483)
        # A path filter that matches nothing must be red, not green. Each named file has to run
        # at least one test, counted from the JSON result.
        run: |
          set -euo pipefail
          for f in DeployTimelock DeployMainnetInputs DeployScriptChainGuards; do
            forge test --json --match-path "contracts/test/${f}.t.sol" > "/tmp/${f}.json"
            count="$(jq '[.. | objects | select(has("status"))] | length' "/tmp/${f}.json")"
            echo "${f}.t.sol executed ${count} tests"
            [[ "${count}" -gt 0 ]] || { echo "zero tests executed for ${f}.t.sol" >&2; exit 1; }
          done

      - name: forge test (EIP-170 size gate)
        # VaultCodeSizeGuard asserts every deployable vault and adapter fits under
        # the EIP-170 24576-byte runtime limit and fails the build otherwise:
        # undeployable-on-Base bytecode is caught in CI, not on broadcast (cf. issue
        # #865). It runs OUTSIDE `forge coverage` (which instruments bytecode and
        # inflates every contract past the limit).
        run: forge test -vvv --match-contract "VaultCodeSizeGuard"

  invariant:
    name: forge-invariant-fuzz-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (invariant / fuzz)
        run: forge test --match-path "test/invariant/**" -vvv

  # ONE pin per workflow run (core 1498, 1496): the upstream head at the start of the run minus 2.
  # The fork tests run on the Twin chain, a pinned lazy anvil fork of real Base state. There is no
  # saved state file, no golden fixture and no secret (BASE_UPSTREAM_RPC is optional).
  twin-pin:
    name: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    outputs:
      block: ${{ steps.pin.outputs.block }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        uses: ./.github/actions/twin-pin
        with:
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

  fork-regressions:
    name: forge-fork-vault-regressions
    needs: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Every test deploys its OWN contracts through the production deploy scripts and reads the
    # addresses from what it deployed. None reads the live production v1 vault. FORK_RPC_URL names
    # the Twin chain; with it unset a fork test skips with a named reason, and the runner below
    # fails a run in which nothing executed.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Installs foundry and bun, restores anvil's RPC cache keyed by the pin block, starts the
      # Twin chain and exports TWIN_RPC_URL.
      - name: Start the Twin fork
        id: twin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.twin-pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      - name: Canonical Safe v1.4.1 set is on the Twin chain (issue 1447)
        run: bun scripts/devnet/safe-set.ts

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (fork vault regressions)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-path "contracts/test/VaultForkRegressions.t.sol"

      - name: forge test (deploy seed deposit precondition — issue #656)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-contract "DeploySeedDeposit"

      - name: forge test (Safe multisig integration — issue 422)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-path "contracts/test/SafeIntegration.t.sol"

      - name: forge test (governance execute path through a real 2-of-3 Safe — issue 1447)
        # A Fusion named evidence file (AC-GOV-03). It drives the timelock through
        # a canonical SafeL2 proxy, which exists only on a Base fork; the group markers keep the
        # per-file boundary the external evidence reader looks for.
        run: |
          echo "::group::contracts/test/GovernanceExecutePathAfterHandover.t.sol:"
          bun scripts/devnet/forge-fork-tests.ts -- --match-path "contracts/test/GovernanceExecutePathAfterHandover.t.sol"
          echo "::endgroup::"

      - name: forge test (redeem gas estimate then include and root cause — core 1482)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-path "contracts/test/{RobotMoneyVaultRedeemGas,RobotMoneyVaultRedeemGasRootCause}.t.sol" --match-contract "ForkTest|RootCauseTest"

      - name: forge test (rmRWA fork regression — core 1492)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-path "contracts/test/RwaBasketVaultFork.t.sol"

      - name: forge test (split-stage router deposit and withdraw on the fork — core 1485)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-path "contracts/test/CoreStagesFork.t.sol"

      - name: forge test (gateway router split stages on the fork)
        run: bun scripts/devnet/forge-fork-tests.ts -- --match-contract "GatewayRouterSplitStagesForkTest"

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  coverage:
    name: forge-coverage-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: system-correctness
    needs: [unit, invariant]
    # The expensive lcov coverage gate is system-correctness: it starts at
    # ready-for-review and also runs after merge on push to dev.
    # See docs/development/ci-suites.md (CI velocity tiers).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: Coverage memory-guard self-test (issue #1298)
        # The guard below is the only thing standing between this job and a repeat
        # of the #1298 OOM, so prove it can actually go red before trusting it: the
        # self-test asserts the measurement sees a known allocation, passes under
        # budget, fails over budget, and propagates a failing inner command.
        run: python3 .github/scripts/run_coverage_memory_guard.py --self-test

      - name: forge coverage (memory-guarded — issue #1298)
        # NO `--ir-minimum` (issue #1298). This job was memory-bound, not slow.
        # `--ir-minimum` turns on viaIR, and solc holds the whole compilation unit's
        # Yul IR resident, so its demand climbs steeply with the compile set. Peak
        # RSS of the whole coverage run, pinned solc 0.8.24, measured on an
        # unconstrained host (so these are what solc *wants*, an upper bound on what
        # it would touch on a 16 GB runner):
        #
        #     174 files, --ir-minimum    -> 17.48 GiB, 7m12s   (dev @ 969cfc84)
        #     178 files, --ir-minimum    -> 18.00 GiB, 9m30s   (#1293 @ 3faeadd9)
        #     174 files, no --ir-minimum ->  2.27 GiB, 0m24s
        #     178 files, no --ir-minimum ->  2.30 GiB, 1m10s
        #
        # A GitHub-hosted `ubuntu-latest` runner has 16 GB, and BOTH viaIR figures
        # are above it. `dev` at 174 files survived only because under memory
        # pressure the allocator reuses arenas instead of growing, keeping the
        # resident set just inside 16 GB; at 178 files it no longer could. That is
        # why this looked like a cliff rather than a slope: demand had been over the
        # runner's RAM for some time and only the allocator's give kept it alive.
        #
        # The kill was an OOM, not a timeout. `timeout-minutes` is 20 and the two
        # deaths landed at 7m26s and 8m42s of compiling — different elapsed times,
        # so not a fixed deadline — reported as "The runner has received a shutdown
        # signal" / "exit code 143", which is how GitHub surfaces a runner-level OOM.
        #
        # Note the second-order win: dropping viaIR also collapses sensitivity to
        # compile-set size, from ~133 MB per added Solidity file to ~7.7 MB.
        #
        # Dropping the flag is safe on both counts the flag existed for:
        #   - "stack too deep": does not occur. Nothing in contracts/ needs viaIR to
        #     compile under coverage's unoptimised profile — the sources were written
        #     to stay inside the non-viaIR stack limit on purpose (see the notes in
        #     BasketViews.sol, StaleOracleRedemption.t.sol).
        #   - coverage accuracy: it improves. `--ir-minimum` prints its own warning
        #     that it "can result in inaccurate source mappings", and that was costing
        #     real hits. Same instrumentation universe (LF 5772 / BRF 1263), more of
        #     it recorded: lines 4532 -> 4559, branches 619 -> 739 (49.0% -> 58.5%).
        #     check_gateway_coverage.py passes identically either way.
        #
        # Two exclusions were removed with the flag, because both existed ONLY as
        # `--ir-minimum` workarounds and both now pass under coverage:
        #   - `^test_getPastVotes_` (AZ-GOV-1): `vm.roll` did not take effect under
        #     viaIR instrumentation, so historical voting-power checkpoints read back
        #     wrong. It behaves correctly without the flag.
        #   - `CustodyInvariantGuardTest` (issue #944): the INV-1/INV-2 source scan
        #     exhausted the block gas limit because viaIR instrumentation multiplied
        #     per-instruction gas ~100x. It fits comfortably now.
        # Restoring them is a coverage *increase*; no exclusion was added here.
        #
        # The exclusions that remain are unrelated to viaIR and stay:
        #   - `^testFail_`: the vendored a16z erc4626-tests ships two deprecated
        #     `testFail_*` functions that modern forge rejects by name. See the unit
        #     job.
        #   - `VaultCodeSizeGuard` / `GatewayAgentPolicyCodeSizeGuard`: assert
        #     deployed bytecode is under the EIP-170 24576-byte limit (issues #865,
        #     1476), but coverage instruments bytecode and inflates every contract
        #     past it, so the assertion is meaningless here. They run in the unit job.
        #   - `DeploySeedDeposit` / `SafeIntegration` / `VaultForkRegressions` /
        #     `GovernanceExecutePathAfterHandover`: fork tests, same reason.
        #
        # The wrapper measures the run's peak RSS and fails the job above 50% of
        # runner RAM, so the next contract-adding PR meets an explanatory red gate
        # instead of rediscovering the OOM as an unfixable "flake".
        run: >-
          python3 .github/scripts/run_coverage_memory_guard.py
          forge coverage --report lcov
          --no-match-test "^testFail_"
          --no-match-contract "VaultCodeSizeGuard|GatewayAgentPolicyCodeSizeGuard"
          --no-match-path "contracts/test/{DeploySeedDeposit,SafeIntegration,VaultForkRegressions,GovernanceExecutePathAfterHandover,RwaBasketVaultFork,CoreStagesFork}.t.sol"

      - name: Enforce branch-coverage gate
        run: python3 .github/scripts/check_gateway_coverage.py lcov.info
