# Canonical: docs/technical/smart-contract-invariants.md (invariant spec)
#            docs/code-review/20260619-code-review-pekshield.md (findings)
#            docs/development/ci-suites.md §22
#
# CI_CLASS: feature-correctness
#
# WHAT THIS SUITE IS NOT (QA plan v1 T5)
# There is no prover here. The file name and the contracts/test/fv/ directory say
# "formal verification", but every step is plain `forge test`: unit tests, bounded
# fuzz tests and invariant tests. The workflow and job used to be named
# contracts-formal-verification / forge-formal-verification, which read as a proof
# in a check list. They are named for what runs: the invariant spec tests. The file
# name and the fv/ directory stay, because suite 21 and the docs name them.
#
# WHY THIS SUITE EXISTS
# docs/technical/smart-contract-invariants.md is the textual source of truth for
# every property the on-chain system must never violate. This suite runs the
# invariant spec harness (contracts/test/fv/) that turns that spec into tests:
#   - CoverageMap.t.sol enforces a 1:1 mapping between every invariant ID in the
#     spec and an entry in the executable InvariantRegistry — CI fails if a new
#     invariant is documented without a corresponding FV test, or vice versa.
#   - FvInvariants.t.sol drives one named test per invariant ID. A test whose
#     name says expectedFail asserts the registry entry, and none is skipped today.
#     A RED invariant would skip through _skipRed, naming the remediation issue
#     that must remove the skip and flip it green.
#   - The dedicated harnesses (CustodyMultiVault, TwapManipulation,
#     DeployAssertions) carry the family-wide custody, TWAP-manipulation and
#     post-deploy assertion scaffolding. The fv/ tree is these three, CoverageMap
#     and FvInvariants: CustodyMultiVault 4, TwapManipulation 2, DeployAssertions 3,
#     CoverageMap 3 and FvInvariants 25, the floor of 37 below. There is no
#     stale-oracle harness: StaleOracleRedemption.t.sol was deleted in #1505 with
#     the Chronicle oracle, and SUP-5 is the registry assertion in FvInvariants.
#
# This is the phase scout gate for contract-security-remediation-2: it pins the
# spec BEFORE any remediation lands, so every later fix is anchored by the
# invariant it restores.
#
# TIER / TRIGGERS
# feature-correctness (LIGHT): the suite is forge unit + static-guard + bounded
# fuzz/invariant tests that finish in well under a minute. It runs on every
# pull_request (any base branch — so it gates PRs into phase/* staging branches as
# well as into dev) and on push to dev/dev-phase-*. Skipped 🔴 invariants keep the
# suite green; an un-skipped red test (a landed remediation) must pass.
#
# GOTCHAS
# - The coverage-map test reads docs/technical/smart-contract-invariants.md from
#   the working tree (fs_permissions in foundry.toml already grants read on docs/).
#   Adding an invariant ID to the spec without a registry entry is a deliberate
#   build break — add the InvariantRegistry entry in the same PR.
# - Red invariants use vm.skip(true, "...remediation #NNN"); removing a skip
#   before the linked fix lands will fail the suite (that is the point — the test
#   pins the bug). Downstream issues remove the skip in the same PR as the fix.
# - EXECUTED FLOORS (QA plan v1 T5). `forge test` exits 0 when its filter matches
#   nothing, so both test steps run through .github/scripts/forge_test_require_executed.sh
#   with FORGE_TEST_MIN_EXECUTED set to the number of tests the step runs: 37 in
#   contracts/test/fv/ and 37 in the four anchoring contracts. One test fewer is red.
#   A skipped test is not a passed test, so a new RED invariant lowers the floor by
#   one. Adding or removing a test means editing the floor in the same PR:
#   .github/scripts/check_executed_floors.py (suite 14) fails when a floor and the
#   step's test count differ.

name: contracts-invariant-spec-tests

# CI taxonomy: every job in this workflow is feature-correctness — scoped Foundry
# tests (coverage-map gate, per-invariant unit tests, bounded custody/fuzz
# harnesses, static guards) asserting the contracts under change. Runs at draft
# and r4r; sweep-warn on push to the default branch.
env:
  CI_CLASS: feature-correctness

on:
  # LIGHT tier (feature-correctness): runs on pull_requests to any branch
  # (including PRs into phase/* staging branches) and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
    paths:
      - "contracts/**"
      - "foundry.toml"
      - "docs/technical/smart-contract-invariants.md"
      - ".github/workflows/suite-22-formal-verification.yml"
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does not
# pile up duplicate suites. push:dev runs keep a distinct concurrency lane per ref
# and never cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege (issue #1428): read-only repo contents for every job. A job that
# needs more declares it at job level with the reason.
permissions:
  contents: read

jobs:
  invariant-spec:
    # QA plan v1 T5: plain forge test, no prover. Formerly forge-formal-verification.
    name: forge-invariant-spec-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build
        run: forge build

      - name: forge test (invariant spec harness, contracts/test/fv)
        # The coverage-map gate, the per-invariant tests and the dedicated harnesses.
        # A red invariant would be skipped; an un-skipped red test (landed
        # remediation) must pass. Floor 49 is every test in contracts/test/fv/
        # (QA plan v1 T5): CoverageMap 5, CustodyMultiVault 4, DeployAssertions 3,
        # FvInvariants 27, SystemSplit 8 (Sys1 4, Acl9 3, Invariant 1), TwapManipulation 2.
        run: |
          FORGE_TEST_MIN_EXECUTED=49 bash .github/scripts/forge_test_require_executed.sh \
            --match-path 'contracts/test/fv/**' -vvv

      - name: forge test (custody invariant + guards — anchoring proofs)
        # The deep behavioural proofs the per-ID layer points at. Kept in the
        # same gate so a regression in the proven invariants surfaces here too.
        # Floor 38 (QA plan v1 T5): AccessRolesTest 25, CustodyInvariantGuardTest 4,
        # AdapterDelegatecallGuardTest 8, CustodyInvariantTest 1 (forge reports its four
        # invariant_* functions as one passed test).
        run: |
          FORGE_TEST_MIN_EXECUTED=38 bash .github/scripts/forge_test_require_executed.sh \
            --match-contract 'CustodyInvariant|CustodyInvariantGuard|AdapterDelegatecallGuard|AccessRoles' -vvv
