# Canonical: core issue 1499, core S3 (1485), S5 (1487), 1493, 1523.
#
# There is ONE deploy driver: the publish-contracts CLI (bun publish-contracts/src/cli.ts). This workflow
# runs the offline checks of the data it reads (scripts/deploy/stage-table.json, the manifest rules and the
# stage tools) on every pull request. The rehearsal job (core-stages-twin-chain) starts its own Twin chain
# (918453, a pinned lazy anvil fork, .github/actions/twin-fork) and runs the CLI publish (stages 0 to 11),
# verify (12) and govern (13, with the time warp) with the committed stage sheet. It runs on every push to
# dev, on a ready pull request, and nightly (suite-29 calls this workflow with the run's one pin). It writes
# counts.json (per-stage broadcast counts and the deployer nonce), checks it, compares it with
# deployments/frozen-counts/<sha>.json when that file exists, and uploads rehearsal-counts-<sha>.
# At release time a person turns that artifact's counts.json into the frozen counts file (docs/operations/contract-release-runbooks.md): freeze-counts.ts --counts for a run that ran every
# stage, freeze-counts.ts --from-adopted-run for a run that adopted the CREATE2 libraries (issue 1733, the normal case since Base block 52401633). The job rebuilds that baseline itself as a check.
# The router, basket and timelock role proofs are labels of the one verifier.
# The upgrade rehearsal job (core-stages-twin-upgrade-lifecycle, issue 1811) starts a second Twin chain, publishes the same release artifacts with the upgrade overlay
# (deployments/twin-918453/upgrade-rehearsal.env, UPGRADE_MODE=upgradeable), then upgrades the gateway, freezes every core proxy and shows a queued upgrade is refused,
# each through the real Safe and timelock (publish-contracts/src/ci/twin-upgrade-lifecycle.ts; the upgrade and the freeze are `govern --row upgrade-proxy` and
# `govern --row freeze-upgrades` themselves, issue 1859), and checks the record with evidence-check --upgrade-lifecycle against the chain.
name: core-stages

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["dev", "releases-*"]
    tags: ["v*.*.*"]
  # Called by suite-29-nightly-twin-fork.yml, which chooses ONE pin for the whole nightly run.
  workflow_call:
    inputs:
      pin_block:
        description: "Twin chain pin handed down by a parent run. Empty: this run chooses one."
        type: string
        required: false
        default: ""
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-suite28-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core-stages-offline:
    name: core-stages-offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Stage table, manifest rules and config-check fixtures
        run: |
          set -euo pipefail
          # scripts/ci/check-timelock-prediction-parity.test.ts imports publish-contracts' timelock prediction, which needs its viem (issue 1853)
          (cd publish-contracts && bun install --frozen-lockfile)
          # scripts/release/preflight-guards.test.ts: CEREMONY_CONTRACTS covers every vault contract the stage table deploys (issue 1926)
          bun test scripts/deploy scripts/ci scripts/release/preflight-guards.test.ts 2>&1 | tee core-stages.log
          grep -Eq '^ *[1-9][0-9]* pass' core-stages.log || { echo "zero tests passed" >&2; exit 1; }

  publish-contracts-tests:
    name: publish-contracts-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/publish-contracts-setup
      - name: Typecheck
        working-directory: publish-contracts
        run: bun x tsc --noEmit
      - name: Unit tests (stub forge and cast, no chain)
        working-directory: publish-contracts
        run: |
          set -euo pipefail
          bun test --timeout 60000 2>&1 | tee ../publish-contracts-tests.log
          grep -Eq '^ *[1-9][0-9]* pass' ../publish-contracts-tests.log || { echo "zero tests passed" >&2; exit 1; }
      # Issue 1888: each receipt target runs on its own with a positive pass count and no failure, so an emptied or renamed target is red even while the rest of the suite is green.
      - name: Receipt targets run with a positive count each
        working-directory: publish-contracts
        run: |
          set -euo pipefail
          for target in tests/record-receipt.test.ts tests/receipt-digest.test.ts tests/submitter-safe.test.ts tests/govern.test.ts tests/evidence-check.test.ts tests/evidence-kind.test.ts; do
            test -f "$target" || { echo "missing test target $target" >&2; exit 1; }
            bun test --timeout 60000 "$target" 2>&1 | tee "../receipt-target.log"
            grep -Eq '^ *[1-9][0-9]* pass' ../receipt-target.log || { echo "zero tests passed in $target" >&2; exit 1; }
            ! grep -Eq '^ *[1-9][0-9]* fail' ../receipt-target.log || { echo "failures in $target" >&2; exit 1; }
          done
      # Issue 1892: the vaults and gateway systems on their own. Each file runs by itself and must pass at least 4 tests: a removed file, a skipped-only file and a zero count fail.
      - name: Require the system cases (gateway run and refusals before broadcast, both verifiers, historical combined reading, gateway evidence)
        working-directory: publish-contracts
        run: bun src/ci/require-tests.ts --suite systems --min 4
      # Issue 1912, ADR-0017: the retire-vault row, its evidence entry and the verifier after it each run on their own with a positive count, so a removed or emptied file is red.
      - name: Require the retire-vault cases (govern row, evidence, verifier after the retirement, the 1e15 pool floor)
        working-directory: publish-contracts
        run: bun src/ci/require-tests.ts --suite retire --min 4

  pin:
    name: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: feature-correctness
    outputs:
      block: ${{ steps.pin.outputs.block }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        uses: ./.github/actions/twin-pin
        with:
          pin-block: ${{ inputs.pin_block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

  # THE REHEARSAL (core 1523): publish, verify and govern on a Twin chain this job starts itself.
  core-stages-twin:
    name: core-stages-twin-chain
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    env:
      CI_CLASS: system-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Start the Twin chain at the run pin
        id: fork
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}
      # Throwaway keystores, the committed stage sheet, gas and USDC for the deployer, then
      # `publish` (libs through the timelock handover and the real Safe), `verify`, `govern` and `verify` again (issue 1667).
      # Any stage that exits non-zero fails this step.
      - name: Publish, verify and govern on the Twin chain with the one driver
        uses: ./.github/actions/twin-publish
        with:
          rpc-url: ${{ steps.fork.outputs.rpc-url }}
          verify: "true"
          govern: "true"
          # issue 1721: every CREATE2 library is deployed on the fork first, the state Base is in after the real deploy: libs and the first basket stage are ADOPTED
          predeploy-libs: "true"
          pin-block: ${{ needs.pin.outputs.block }}
          # Issue 1727: the Twin chain runs the REHEARSAL kind of the Base mainnet rehearsal (900 s timelock, non-fresh deployer, new Safe salt) and
          # the receipt path with a REAL recorded receipt (register the submitter, record through the gateway, apply with the Safe, read back).
          rehearsal: "true"
          # Issue 1892: the vaults system runs with the gateway absent (no gateway manifest, no gateway transaction), then the gateway system runs separately against its
          # manifests: its refusals happen before any broadcast, the vaults manifests stay byte-unchanged and the gateway roles move to GATEWAY_ADMIN_ADDRESS.
          vaults-only: "true"
          gateway: "true"
      - name: Require the system scenario markers (a removed scenario fails the job)
        run: bun publish-contracts/src/ci/twin-markers.ts check --log "$TWIN_PUBLISH_LOG" --require vaultsOnly,receiptPath,gatewayRefusals,gatewayRun
      - name: Check counts.json against the stage table
        run: bun publish-contracts/src/ci/rehearsal-counts.ts check --file "$TWIN_COUNTS_JSON"
      # Issue 1733: this run ADOPTED the CREATE2 libraries, so its counts.json is not a frozen file. The reconstruct verb rebuilds the BASELINE from the adoption records,
      # re-derives every adopted library from the build, reads its code hash from the Twin fork, and the strict loader (the 8453 rules) must accept the result.
      # Issue 1926: the libraries are rebuilt from a SECOND checkout of this sha at another absolute path and depth (--core-dir), not the checkout the Twin run built
      # in. The build is path-independent (foundry.toml: no auto-detected remappings) and uses the pinned forge the twin-fork action installed, so the addresses the
      # Twin run adopted must re-derive there. A path-dependent build fails this step with LIBS_ADOPTION.
      - name: Rebuild the baseline frozen counts from the adopted measuring counts.json in a second checkout path and load it strictly
        env:
          TWIN_RPC: ${{ steps.fork.outputs.rpc-url }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          base="$RUNNER_TEMP/baseline-frozen"
          second="$RUNNER_TEMP/freeze-path/a/b/c/core"
          mkdir -p "$(dirname "$second")"
          git worktree add --detach "$second" "$sha"
          # the submodule sources, copied (not symlinked: a symlink target outside the checkout would change the source paths forge records)
          rm -rf "$second/lib" && cp -a lib "$second/lib"
          test "$(git -C "$second" rev-parse HEAD)" = "$sha"
          test "$(cd "$second" && pwd -P)" != "$(pwd -P)"
          jq '. + {rehearsal: {conclusion: "success"}}' "$TWIN_COUNTS_JSON" > "$RUNNER_TEMP/counts-green.json"
          bun publish-contracts/scripts/freeze-counts.ts --from-adopted-run "$RUNNER_TEMP/counts-green.json" --sha "$sha" --rpc "$TWIN_RPC" --counts-dir "$base" --core-dir "$second"
          bun publish-contracts/src/ci/rehearsal-counts.ts check-baseline --counts-dir "$base" --sha "$sha"
          jq -e '(.measured.reconstructed.adopted | length > 0) and (.measured.adopted == null)' "$base/$sha.json" >/dev/null
          cp "$base/$sha.json" "$RUNNER_TEMP/baseline-$sha.json"
      - name: Drift check against the frozen counts of this SHA
        run: bun publish-contracts/src/counts-drift.ts --counts "$TWIN_COUNTS_JSON"
      - name: Collect the counts and the run files
        if: always()
        env:
          # success only when every step above passed: freeze-counts (core 1602) refuses a counts.json without it
          REHEARSAL_CONCLUSION: ${{ job.status }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/rehearsal-out"
          mkdir -p "$out"
          [ -z "${TWIN_COUNTS_JSON:-}" ] || jq --arg c "$REHEARSAL_CONCLUSION" '. + {rehearsal: {conclusion: $c}}' "$TWIN_COUNTS_JSON" > "$out/counts.json"
          [ -z "${TWIN_MANIFEST_DIR:-}" ] || cp -r "$TWIN_MANIFEST_DIR" "$out/manifests"
          [ -z "${TWIN_VERIFY_LABELS:-}" ] || cp "$TWIN_VERIFY_LABELS" "$out/verify-labels.txt"
          [ -z "${TWIN_GOVERN_ROWS:-}" ] || cp "$TWIN_GOVERN_ROWS" "$out/govern-rows.txt"
          [ -z "${TWIN_VERIFY_LABELS_POST_GOVERN:-}" ] || cp "$TWIN_VERIFY_LABELS_POST_GOVERN" "$out/verify-labels-post-govern.txt"
          [ -z "${TWIN_SELF_ADMIN_ROWS:-}" ] || cp "$TWIN_SELF_ADMIN_ROWS" "$out/self-admin-rows.txt"
          [ ! -f "$RUNNER_TEMP/baseline-$(git rev-parse HEAD).json" ] || cp "$RUNNER_TEMP/baseline-$(git rev-parse HEAD).json" "$out/"
          ls -R "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-counts-${{ github.sha }}
          path: ${{ runner.temp }}/rehearsal-out
          if-no-files-found: error
          retention-days: 90
      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  # UPGRADEABILITY STAGE 4 (issue 1811): deploy upgradeable, governed upgrade, freeze, refused upgrade after the freeze, on a Twin chain this job starts itself.
  # It never skips: a Twin chain that does not start, or any step that exits non-zero, fails the job.
  # Issue 1846: it runs AFTER core-stages-twin, not beside it, so the two 60-minute forks never load the rate-limited upstream at once and this job
  # restores the exact-pin RPC cache (twin-anvil-rpc-<pin>) core-stages-twin saved. !cancelled() keeps it independent of the rehearsal's result, yet a cancelled
  # (superseded) run starts no 60-minute fork against the rate-limited upstream (issue 1861); the pin and draft guards keep the skip rules of a job that only needs pin.
  core-stages-twin-upgrade:
    name: core-stages-twin-upgrade-lifecycle
    needs: [pin, core-stages-twin]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ !cancelled() && needs.pin.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    env:
      CI_CLASS: system-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Start the Twin chain at the run pin
        id: fork
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}
      - name: Publish, verify, govern and verify the release artifacts in upgradeable mode
        uses: ./.github/actions/twin-publish
        with:
          rpc-url: ${{ steps.fork.outputs.rpc-url }}
          verify: "true"
          govern: "true"
          predeploy-libs: "true"
          pin-block: ${{ needs.pin.outputs.block }}
          sheet-overlay: deployments/twin-918453/upgrade-rehearsal.env
      - name: Governed upgrade and freeze through the govern rows, refused upgrade, through the real Safe and timelock, then the evidence check
        env:
          RPC_URL: ${{ steps.fork.outputs.rpc-url }}
        run: bun publish-contracts/src/ci/twin-upgrade-lifecycle.ts
      - name: Assert the evidence output
        run: |
          set -euo pipefail
          cat "$TWIN_UPGRADE_LIFECYCLE_EVIDENCE"
          grep -Eq '^evidence ok \(upgrade lifecycle: .*refused upgrade, chain read\)$' "$TWIN_UPGRADE_LIFECYCLE_EVIDENCE"
          jq -e '(.deploy.upgradeability.mode == "upgradeable") and (.deploy.upgradeability.core_immutable == false)
            and (.upgrade.to_implementation != .upgrade.from_implementation)
            and ((.freeze.targets | length) == (.final.upgradeability.proxies | length)) and ((.freeze.targets | length) > 0)
            and ([.final.upgradeability.proxies[].upgrades_frozen] | all)
            and (.final.upgradeability.core_immutable == true)
            and (.rejected_upgrade.revert_error == "UpgradesAreFrozen")' "$TWIN_UPGRADE_LIFECYCLE" >/dev/null
      - name: Collect the lifecycle record and the run files
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/upgrade-lifecycle-out"
          mkdir -p "$out"
          [ -z "${TWIN_RUN_DIR:-}" ] || for f in upgrade-lifecycle.json upgrade-lifecycle-evidence.txt verify-labels.txt verify-labels-post-govern.txt verify-labels-post-upgrade.txt verify-labels-post-freeze.txt govern-upgrade-proxy.txt govern-freeze-schedule.txt govern-freeze-execute.txt evidence/publish-run.json; do [ ! -f "$TWIN_RUN_DIR/$f" ] || cp "$TWIN_RUN_DIR/$f" "$out/"; done
          [ -z "${TWIN_MANIFEST_DIR:-}" ] || cp -r "$TWIN_MANIFEST_DIR" "$out/manifests"
          [ -z "${TWIN_COUNTS_JSON:-}" ] || cp "$TWIN_COUNTS_JSON" "$out/counts-upgradeable.json"
          ls -R "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-lifecycle-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-lifecycle-out
          if-no-files-found: error
          retention-days: 90
      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  # Issue 1927: the v0.6.0 governed upgrade of the live v0.5.0 deployment (docs/operations/contract-release-runbooks.md 4.15), rehearsed from REAL v0.5.0 state. It publishes
  # release/v0.5.0-rehearsal with that tag's own publish-contracts CLI (its twin-publish step script, rehearsal kind, upgradeable overlay) and its committed Twin sheet: four vaults,
  # rmAGENT router-eligible, the receipt in ic-policy.json and an applied receipt vector, as on Deploy 3. Then it runs the 4.15 commands from this checkout with --core-dir and
  # --core-sha of the v0.5.0 checkout and --upgrade-build of this one (publish-contracts/src/ci/twin-upgrade-from-v050.ts): both upgrades, the receipt migration, the clear of the
  # applied vector, the rmAGENT retire, verify and both evidence checks, every schedule and execute through the real Safe and timelock (the warp is the only Twin step).
  # The pin is FIXED at Base block 52881000: the live RM V4 pool the v0.5.0 rmAGENT holds was drained at block 52881518 (in-range liquidity 9.8e17 before, 6.5e13 after), so the
  # tag's agent stage refuses its unlowered 1e15 floor at any later block. The fork is the Base state that release was built for. Nothing is lowered, seeded or skipped.
  # It runs after core-stages-twin-upgrade-lifecycle (the same upstream, never two forks at once); the pin and draft guards are those of that job.
  core-stages-twin-upgrade-from-v050:
    name: core-stages-twin-upgrade-from-v050
    needs: [pin, core-stages-twin-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: ${{ !cancelled() && needs.pin.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    env:
      CI_CLASS: system-correctness
      V050_PIN: "52881000"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check out release/v0.5.0-rehearsal beside this checkout
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/tags/release/v0.5.0-rehearsal:refs/tags/release/v0.5.0-rehearsal"
          git worktree add --detach "$RUNNER_TEMP/v050" release/v0.5.0-rehearsal
          git -C "$RUNNER_TEMP/v050" submodule update --init --recursive
          echo "V050_DIR=$RUNNER_TEMP/v050" >> "$GITHUB_ENV"
      - name: Start the Twin chain at the v0.5.0 pin
        id: fork
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ env.V050_PIN }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}
      # The fork must serve the fixed pin. An upstream that no longer serves archive state at it would let twin-fork repin past the drain, and the v0.5.0 agent stage would then
      # refuse its floor with a misleading cause: the job fails here instead, naming the pin.
      - name: The fork serves the v0.5.0 pin (BASE_UPSTREAM_RPC must serve archive state at it)
        env:
          FORK_PIN: ${{ steps.fork.outputs.pin-block }}
        run: |
          set -euo pipefail
          [ "$FORK_PIN" = "$V050_PIN" ] || { echo "::error::the Twin fork is pinned at '$FORK_PIN', not $V050_PIN: BASE_UPSTREAM_RPC must serve archive state at Base block $V050_PIN" >&2; exit 1; }
      - uses: ./.github/actions/publish-contracts-setup
      - name: Publish release/v0.5.0-rehearsal with that tag's own CLI and Twin sheet
        env:
          RPC_URL: ${{ steps.fork.outputs.rpc-url }}
          VERIFY_IN: "true"
          GOVERN_IN: "true"
          REHEARSAL_IN: "true"
          PREDEPLOY_LIBS_IN: "true"
          SHEET_OVERLAY_IN: deployments/twin-918453/upgrade-rehearsal.env
          PIN_BLOCK_IN: ${{ env.V050_PIN }}
        run: |
          set -euo pipefail
          (cd "$V050_DIR/publish-contracts" && bun install --frozen-lockfile)
          GITHUB_WORKSPACE="$V050_DIR" bun "$V050_DIR/publish-contracts/src/ci/twin-publish.ts" | tee "$RUNNER_TEMP/v050-publish.log"
      - name: Build this checkout (the --upgrade-build)
        run: forge build
      - name: The runbook 4.15 commands against the v0.5.0 deployment, through the real Safe and timelock
        env:
          RPC_URL: ${{ steps.fork.outputs.rpc-url }}
        run: V050_RUN_DIR="$TWIN_RUN_DIR" bun publish-contracts/src/ci/twin-upgrade-from-v050.ts
      - name: Assert the record (a record with no executed upgrade fails)
        run: |
          set -euo pipefail
          jq -e '(.kind == "twin-upgrade-from-v050") and (.v050.agent_min_pool_liquidity == "1000000000000000")
            and ([.proxy_upgrades[] | select(.execute_tx != null)] | length == 2)
            and ([.proxy_upgrades[] | select(.execute_tx != null) | .proxy_name] | sort == ["gateway", "receipt"])
            and (. as $r | [.proxy_upgrades[] | (.from_implementation | ascii_downcase) == ($r.v050.upgradeability.proxies[.proxy_name].implementation | ascii_downcase)] | all)
            and ([.proxy_upgrades[] | select(.proxy_name == "receipt") | .migration] == ["receipt-submitter-roles"])
            and ([.vault_retirements[] | select(.execute_tx != null)] | length == 1)
            and (.chain.router_eligible_count == 3) and (.chain.rmagent_retired == true) and (.chain.rmagent_router_eligible == false)
            and ((.chain.receipt_releaser_role_holders | map(ascii_downcase)) == [.chain.governance | ascii_downcase])
            and ((.chain.receipt_admin_role_holders | map(ascii_downcase)) == [.chain.timelock | ascii_downcase])
            and (.chain.second_migration_revert_selector == .chain.invalid_initialization_selector)
            and ([.commands[] | select(.exit != 0)] | length == 0)' "$TWIN_UPGRADE_FROM_V050" >/dev/null
      - name: Collect the record and the run files
        if: always()
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/upgrade-from-v050-out"
          mkdir -p "$out"
          [ ! -f "$RUNNER_TEMP/v050-publish.log" ] || cp "$RUNNER_TEMP/v050-publish.log" "$out/"
          [ -z "${TWIN_RUN_DIR:-}" ] || for f in upgrade-from-v050.json sheet.env verify-labels.txt verify-labels-post-govern.txt evidence/publish-run.json; do [ ! -f "$TWIN_RUN_DIR/$f" ] || cp "$TWIN_RUN_DIR/$f" "$out/"; done
          [ -z "${TWIN_RUN_DIR:-}" ] || for f in "$TWIN_RUN_DIR"/upgrade-from-v050-*.out; do [ ! -f "$f" ] || cp "$f" "$out/"; done
          [ -z "${TWIN_MANIFEST_DIR:-}" ] || cp -r "$TWIN_MANIFEST_DIR" "$out/manifests"
          ls -R "$out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-from-v050-${{ github.sha }}
          path: ${{ runner.temp }}/upgrade-from-v050-out
          if-no-files-found: error
          retention-days: 90
      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache
