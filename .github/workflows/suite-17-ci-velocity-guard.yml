# Canonical: docs/development/ci-suites.md (CI velocity tiers)
#
# WHY THIS SUITE EXISTS
# Issue #600 split CI into a QUICK tier (every feature PR) and a HEAVY tier
# (devnet e2e matrices + the forge coverage gate, anchored at the dev-phase-*/dev
# integration boundary). The split, the per-binary devnet matrices, the
# concurrency cancellation, and the Swatinem/rust-cache adoption are structural
# invariants that a one-line YAML edit can silently undo and that no human
# reviewer reliably catches. This QUICK-tier guard statically validates every
# workflow YAML on every PR via scripts/ci/check-workflow-tiers.sh so the
# velocity work cannot regress. It boots no chain and finishes in well under a
# minute.
#
# The release-runner-pinning job (issue #660, security-model.md §13) guards the
# release-workflow hardening invariants the same way: no floating `*-latest`
# runner label in .github/workflows/release-*.yml and a mandatory
# `environment: production` declaration gating the publish jobs. See
# docs/technical/ci-environments.md.

name: ci-velocity-tier-guard

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# Cancel superseded PR runs; push:main/dev keep a distinct non-cancelling lane.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tier-guard:
    name: workflow-tier-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Validate CI velocity tier invariants
        run: bash scripts/ci/check-workflow-tiers.sh

  release-runner-pinning:
    name: release-runner-pinning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate release-workflow runner pinning and production environment gate
        run: bash scripts/ci/check-release-runner-pinning.sh
