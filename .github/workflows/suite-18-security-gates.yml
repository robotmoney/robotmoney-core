# Canonical: docs/development/ci-suites.md §18 (planned — issue #702 dev-scout stub)
#
# WHY THIS SUITE EXISTS
# Security gate checks that run fast and require no chain: cargo audit scans Rust
# dependency advisories, bun audit scans JS/TS dependency advisories, secrets-scanning
# prevents credential commits, and the dapp Content-Security-Policy (CSP) gate asserts
# that the production bundle's meta-CSP header is not weakened by dependency upgrades.
# These gates run on every PR so a vulnerable dependency or a weakened CSP is caught
# before review, not after deployment.
#
# WHY THIS IS A STUB (issue #702 dev-scout)
# The gate implementations (advisory databases, CSP extraction script, secrets patterns)
# are the implementation work of downstream issues in the CI/testing infrastructure
# phase. This stub registers the seams — workflow name, trigger paths, and job
# placeholders — so the downstream issues can replace TODO blocks with real steps
# without changing the workflow trigger surface or job IDs.
#
# INTEGRATION POINTS DISCOVERED BY SCOUT (issue #702)
# - cargo audit:     needs `cargo install cargo-audit`; DB lives at ~/.cargo/advisory-db.
#                    Relevant: crates/*, clients/rust-payment-client/*, Cargo.lock.
#                    No existing `deny.toml` or `.cargo/audit.toml` in the repo as of scout.
#                    Risk: advisory DB fetch is network-bound; use --db cache or the
#                    rustsec/audit-check GitHub Action to avoid rate limits.
# - bun audit:       `bun audit` reads clients/dapp/package.json and its lock.
#                    Bun's audit exits non-zero on any HIGH/CRITICAL — confirm exit
#                    code semantics before wiring to CI (bun audit --level moderate).
# - secrets-scanning: gitleaks is the standard OSS tool; truffleHog is the alternative.
#                    Recommend `gitleaks detect --source . --config .gitleaks.toml`.
#                    A `.gitleaks.toml` allowlist is needed for test private keys in
#                    testing/smoke-test/src/lib.rs (DEPLOYER_PRIVATE_KEY_HEX etc.) and
#                    clients/dapp/src/lib/keyring/*.ts (well-known test vectors).
# - CSP gate:        The dapp's Vite build writes Content-Security-Policy into
#                    clients/dapp/dist/index.html (meta tag). Extraction: grep the meta
#                    tag, parse the header, assert no 'unsafe-inline' / 'unsafe-eval'
#                    in script-src. Script does not exist yet — add as scripts/ci/check-csp.sh.
#
# DOWNSTREAM ISSUES TO UPDATE AFTER SCOUT:
# None identified yet — downstream implementation issues should be created from the
# plan as the CI/testing infrastructure phase opens.

