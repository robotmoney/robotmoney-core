# Canonical: docs/development/ci-suites.md §18
#
# WHY THIS SUITE EXISTS
# Security gate checks that run fast and require no chain: cargo audit scans Rust
# dependency advisories, bun audit scans JS/TS dependency advisories, and the dapp
# Content-Security-Policy (CSP) gate asserts that the production bundle's CSP header
# is not weakened by dependency upgrades. These gates run on every PR so a vulnerable
# dependency or a weakened CSP is caught before review, not after deployment.
#
# SECRETS SCANNING is handled by suite-18-secrets-scan.yml (shipped) — not duplicated here.
#
# ACTIVATION HISTORY (issue #804)
# - cargo-audit: activated — installs cargo-audit and runs directly (avoids rustsec/audit-check
#   action's checks:write permission requirement which causes annotation errors on PRs).
# - bun-audit:   activated — `bun audit` from clients/dapp/ (exits 1 on any HIGH/CRITICAL).
# - csp-gate:    activated — clients/dapp/scripts/check-csp.sh shipped in #735.
# - secrets-scanning: REMOVED from this file; covered by suite-18-secrets-scan.yml.
#
# HARDENING HISTORY
# - Issue #813: cargo-audit advisory allow-list + severity policy lives in
#   .cargo/audit.toml (the file `cargo audit` actually reads; deny.toml is
#   cargo-deny's file and is not consumed here). The §8 gate blocks HIGH/CRITICAL
#   (CVSS >= 7.0) and downgrades unmaintained/notice advisories to warnings.
#   bun-audit: the transitive CRITICAL (vitest <3.2.6) and HIGH (axios) advisories
#   were resolved — vitest/@vitest/browser pinned to ^3.2.6 and axios pinned to
#   ^1.17.0 via a package.json `overrides`. The gate now runs `bun audit
#   --audit-level=high` (the real bun flag; the previous `--level high` was
#   silently ignored, which is why the warn-only `|| true` was needed) with no
#   warn-only override.
# - Issue #835: bun-audit now runs clients/dapp/scripts/audit-deps.sh (the same
#   gate suite-09 dapp-lint-build uses) instead of a bare `bun audit`, so the
#   accepted-advisory list with dated justifications lives in exactly one place.

name: security-gates

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
    paths:
      - "Cargo.lock"
      - "clients/dapp/bun.lock"
      - "clients/dapp/package.json"
      - "clients/dapp/scripts/audit-deps.sh"
      - "clients/dapp/scripts/check-csp.sh"
      - "scripts/check-audit-ledger.sh"
      - "docs/audits.md"
      - "SECURITY.md"
      - ".github/workflows/suite-18-security-gates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cargo audit ────────────────────────────────────────────────────────────
  # Scans Cargo.lock for Rust advisory database (RustSec) hits.
  # Uses cargo-audit CLI directly (not rustsec/audit-check action) to avoid the
  # action's checks:write permission requirement that causes annotation errors on PRs.
  # Advisory allow-list + severity policy: .cargo/audit.toml (issue #813).
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit

  # ── Bun audit ──────────────────────────────────────────────────────────────
  # Scans clients/dapp package manifest for JS advisory (npm) hits.
  # Hard gate (issue #813): fails on any HIGH/CRITICAL advisory. The transitive
  # CRITICAL (vitest <3.2.6) and HIGH (axios) advisories were resolved by pinning
  # vitest/@vitest/browser to ^3.2.6 and axios to ^1.17.0 (package.json overrides).
  # `--audit-level=high` is bun's real severity flag — it suppresses sub-HIGH
  # advisories from both output AND the exit code, so remaining moderate
  # transitive advisories (vite/esbuild/ws/uuid/hono/brace-expansion) do not fail
  # the gate. The previous `--level high` was an unrecognized flag (silently
  # ignored), which is why a `|| true` warn-only override used to be required.
  bun-audit:
    name: bun-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun audit (fail on HIGH/CRITICAL, accepted advisories suppressed)
        working-directory: clients/dapp
        run: bash scripts/audit-deps.sh

  # ── CSP gate ───────────────────────────────────────────────────────────────
  # Asserts the dapp production bundle does not weaken the Content-Security-Policy.
  # Script: clients/dapp/scripts/check-csp.sh (shipped in #735).
  csp-gate:
    name: csp-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dapp dependencies
        working-directory: clients/dapp
        run: bun install --frozen-lockfile
      - name: Check CSP
        working-directory: clients/dapp
        run: bash scripts/check-csp.sh

  # ── Audit-ledger gate ──────────────────────────────────────────────────────
  # Enforces the security-model.md §9/§14 institutional-memory artifacts:
  # docs/audits.md (audit-scope ledger + finding register with disposition and
  # "checked against" columns, every row carrying a valid disposition enum) and
  # the repo-root SECURITY.md (disclosure address + max response-time SLA).
  # Script: scripts/check-audit-ledger.sh (issue #1010). shellcheck runs first
  # because the gate is shell-driven (matches the per-suite shellcheck pattern).
  audit-ledger:
    name: audit-ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: shellcheck audit-ledger script
        run: shellcheck scripts/check-audit-ledger.sh
      - name: Check audit ledger + SECURITY.md
        run: bash scripts/check-audit-ledger.sh
