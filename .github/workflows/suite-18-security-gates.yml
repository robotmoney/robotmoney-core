# Canonical: docs/development/ci-suites.md §18
#
# WHY THIS SUITE EXISTS
# Security gate checks that run fast and require no chain: cargo audit scans Rust
# dependency advisories, bun audit scans JS/TS dependency advisories, and the dapp
# Content-Security-Policy (CSP) gate asserts that the production bundle's CSP header
# is not weakened by dependency upgrades. These gates run on every PR so a vulnerable
# dependency or a weakened CSP is caught before review, not after deployment.
#
# SECRETS SCANNING is handled by suite-18-secrets-scan.yml (shipped) — not duplicated here.
#
# ACTIVATION HISTORY (issue #804)
# - cargo-audit: activated — uses rustsec/audit-check action (no deny.toml needed for basic scan).
# - bun-audit:   activated — `bun audit` from clients/dapp/ (exits 1 on any HIGH/CRITICAL).
# - csp-gate:    activated — clients/dapp/scripts/check-csp.sh shipped in #735.
# - secrets-scanning: REMOVED from this file; covered by suite-18-secrets-scan.yml.
#
# FOLLOW-UP ISSUES
# - Issue #813: Add deny.toml to allow-list known-safe RustSec advisories and pin
#   cargo-audit policy (block CRITICAL/HIGH, warn MEDIUM/LOW).

name: security-gates

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths:
      - "Cargo.lock"
      - "clients/dapp/bun.lock"
      - "clients/dapp/package.json"
      - "clients/dapp/scripts/check-csp.sh"
      - ".github/workflows/suite-18-security-gates.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Cargo audit ────────────────────────────────────────────────────────────
  # Scans Cargo.lock for Rust advisory database (RustSec) hits.
  # Follow-up issue #813: add deny.toml for advisory allow-list and severity policy.
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # ── Bun audit ──────────────────────────────────────────────────────────────
  # Scans clients/dapp package manifest for JS advisory (npm) hits.
  # Follow-up issue #813: pin audit severity level via .npmrc or bun audit config.
  bun-audit:
    name: bun-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun audit
        working-directory: clients/dapp
        run: bun audit --level high

  # ── CSP gate ───────────────────────────────────────────────────────────────
  # Asserts the dapp production bundle does not weaken the Content-Security-Policy.
  # Script: clients/dapp/scripts/check-csp.sh (shipped in #735).
  csp-gate:
    name: csp-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dapp dependencies
        working-directory: clients/dapp
        run: bun install --frozen-lockfile
      - name: Check CSP
        working-directory: clients/dapp
        run: bash scripts/check-csp.sh
