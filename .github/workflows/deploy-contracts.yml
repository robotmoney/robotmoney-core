# Canonical: docs/technical/security-model.md §8 / §13
#
# WHY THIS WORKFLOW EXISTS
# security-model.md §8 row "Verified-source / deployed-bytecode mismatch" states:
#   "The CI deploy pipeline must assert verification before closing the deploy job."
# §13 row "Deploy-key compromise pushes a malicious contract" states:
#   "BaseScan verification must complete within one hour of deploy."
# Neither release-dapp.yml nor release-rmpc.yml previously included any
# BaseScan API call or forge verify-contract step.  This workflow:
#   1. Runs forge script Deploy.s.sol --broadcast to deploy the protocol contracts.
#   2. Extracts the deployed addresses from the broadcast JSON output.
#   3. Calls scripts/assert-basescan-verified.sh for every deployed address.
#   4. Fails the job (non-zero exit) if verification does not complete within
#      BASESCAN_TIMEOUT_SECONDS (default 3600 s / 1 h).
#
# WHY DISPATCH-ONLY
# Contract deployments to Base mainnet and Base Sepolia are rare, deliberate
# operations performed by an operator with the deploy key.  Automating them on
# every tag push would increase risk.  Manual workflow_dispatch provides an
# auditable trigger with required reviewer sign-off (GitHub environment protection
# rules) and lets the operator choose the commit SHA and network per deployment.
#
# WHY BASESCAN_API_KEY IS INJECTED FROM SECRETS
# The key must never be hardcoded.  It is stored as a GitHub Actions secret and
# referenced below.  Absent the secret, the verification step emits a workflow
# error and the job fails.
#
# WHY BOTH NETWORKS ARE PARAMETERISED
# Base Sepolia is used for pre-production validation; Base mainnet for production.
# The same workflow handles both — the operator selects via the `network` input.
#
# MOCK TESTS
# The unit tests in .github/scripts/tests/test_assert_basescan_verified.sh
# exercise all code paths of scripts/assert-basescan-verified.sh using
# MOCK_BASESCAN_VERIFIED / MOCK_BASESCAN_UNVERIFIED without any live API call.
# They run in the assert-basescan-mock-tests job inside
# suite-18-upstream-monitoring.yml which fires on every PR.

name: deploy-contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Target network: 'base' (mainnet) or 'base-sepolia'"
        required: true
        type: choice
        options:
          - base-sepolia
          - base
        default: base-sepolia
      commit_hash:
        description: "Commit SHA to deploy from (defaults to the dispatched ref HEAD)"
        required: false
        type: string
      basescan_timeout_seconds:
        description: "Max seconds to wait for BaseScan source verification (default 3600)"
        required: false
        type: string
        default: "3600"

# No pull_request trigger — deploy jobs never run on feature PRs.
# No concurrency cancel-in-progress: dispatch jobs must always complete.
concurrency:
  group: deploy-contracts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # deploy
  # Deploys contracts via forge script and then asserts BaseScan verification.
  # Only runs on manual workflow_dispatch.
  # ---------------------------------------------------------------------------
  deploy:
    name: deploy-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ inputs.network == 'base' && 'production' || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.sha }}
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Resolve chain ID
        id: chain
        run: |
          case "${{ inputs.network }}" in
            base)
              echo "chain_id=8453" >> "$GITHUB_OUTPUT"
              echo "rpc_url_env=BASE_MAINNET_RPC_URL" >> "$GITHUB_OUTPUT"
              ;;
            base-sepolia)
              echo "chain_id=84532" >> "$GITHUB_OUTPUT"
              echo "rpc_url_env=BASE_SEPOLIA_RPC_URL" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unknown network: ${{ inputs.network }}"
              exit 1
              ;;
          esac

      - name: Deploy contracts (forge broadcast)
        env:
          NETWORK: ${{ inputs.network }}
          CHAIN_ID: ${{ steps.chain.outputs.chain_id }}
          RPC_URL: ${{ steps.chain.outputs.rpc_url_env == 'BASE_MAINNET_RPC_URL' && secrets.BASE_MAINNET_RPC_URL || secrets.BASE_SEPOLIA_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          ADMIN_ADDRESS: ${{ secrets.DEPLOY_ADMIN_ADDRESS }}
          PAUSER_ADDRESS: ${{ secrets.DEPLOY_PAUSER_ADDRESS }}
          AGENT_ADDRESS: ${{ secrets.DEPLOY_AGENT_ADDRESS }}
          SHARE_RECEIVER_ADDRESS: ${{ secrets.DEPLOY_SHARE_RECEIVER_ADDRESS }}
          USDC_ADDRESS: ${{ secrets.DEPLOY_USDC_ADDRESS }}
          ETHERSCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          DEPLOYMENT_OUT: deployments/${{ steps.chain.outputs.chain_id }}-${{ github.sha }}.json
        run: |
          forge script contracts/script/Deploy.s.sol \
            --rpc-url "${RPC_URL}" \
            --private-key "${PRIVATE_KEY}" \
            --broadcast \
            --verify \
            --etherscan-api-key "${ETHERSCAN_API_KEY}" \
            --chain-id "${CHAIN_ID}"

      - name: Extract deployed addresses
        id: addrs
        env:
          CHAIN_ID: ${{ steps.chain.outputs.chain_id }}
        run: |
          DEPLOYMENT_JSON="deployments/${CHAIN_ID}-${{ github.sha }}.json"
          if [[ ! -f "${DEPLOYMENT_JSON}" ]]; then
            # Fallback to the canonical full-stack deployment JSON if the
            # per-run file was not written (e.g. dry-run / forge broadcast
            # without DEPLOYMENT_OUT configured).
            DEPLOYMENT_JSON="deployments/${CHAIN_ID}.json"
          fi
          if [[ ! -f "${DEPLOYMENT_JSON}" ]]; then
            echo "::error::No deployment JSON found at ${DEPLOYMENT_JSON}"
            exit 1
          fi
          VAULT=$(python3 -c "import json,sys; d=json.load(open('${DEPLOYMENT_JSON}')); print(d['vault'])")
          GATEWAY=$(python3 -c "import json,sys; d=json.load(open('${DEPLOYMENT_JSON}')); print(d['gateway'])")
          AAVE=$(python3 -c "import json,sys; d=json.load(open('${DEPLOYMENT_JSON}')); print(d['aave_adapter'])")
          COMPOUND=$(python3 -c "import json,sys; d=json.load(open('${DEPLOYMENT_JSON}')); print(d['compound_adapter'])")
          MORPHO=$(python3 -c "import json,sys; d=json.load(open('${DEPLOYMENT_JSON}')); print(d['morpho_adapter'])")
          echo "vault=${VAULT}" >> "$GITHUB_OUTPUT"
          echo "gateway=${GATEWAY}" >> "$GITHUB_OUTPUT"
          echo "aave_adapter=${AAVE}" >> "$GITHUB_OUTPUT"
          echo "compound_adapter=${COMPOUND}" >> "$GITHUB_OUTPUT"
          echo "morpho_adapter=${MORPHO}" >> "$GITHUB_OUTPUT"
          echo "Addresses extracted:"
          echo "  vault:            ${VAULT}"
          echo "  gateway:          ${GATEWAY}"
          echo "  aave_adapter:     ${AAVE}"
          echo "  compound_adapter: ${COMPOUND}"
          echo "  morpho_adapter:   ${MORPHO}"

      - name: Assert BaseScan source verification
        env:
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          NETWORK: ${{ inputs.network }}
          TIMEOUT_SECONDS: ${{ inputs.basescan_timeout_seconds }}
          POLL_INTERVAL_SECONDS: "30"
        run: |
          bash scripts/assert-basescan-verified.sh \
            "${{ steps.addrs.outputs.vault }}" \
            "${{ steps.addrs.outputs.gateway }}" \
            "${{ steps.addrs.outputs.aave_adapter }}" \
            "${{ steps.addrs.outputs.compound_adapter }}" \
            "${{ steps.addrs.outputs.morpho_adapter }}"
