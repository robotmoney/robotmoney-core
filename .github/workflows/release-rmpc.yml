# Canonical: Plan tracking issue #109 (formerly docs/implementation-plan.md §Release & distribution)
#
# WHY THIS WORKFLOW EXISTS
# Operators and developers need pre-built rmpc binaries without building from source.
# Cross-compiling for all four targets (linux/amd64, linux/arm64, macos/amd64,
# macos/arm64) and attaching the resulting tar.gz archives as GitHub Release assets
# makes distribution frictionless — no Rust toolchain required.
#
# WHY BUILD BEFORE TAGGING
# The publish step only runs after every matrix build succeeds. If any target fails
# we never push a tag and never create a Release, so we never end up with an orphan
# tag pointing at a commit whose binaries can't be produced.
#
# WHY verify-version RUNS BEFORE build AND NOT INSIDE IT
# That invariant only holds for the workflow_dispatch path, where WE create the tag.
# On the `push: tags` trigger the tag already exists when the build starts, so any
# check that can fail on tag CONTENT must run before it can strand that tag. It also
# has to precede the matrix because `fail-fast: false` lets the surviving legs upload
# mislabelled archives as workflow artifacts even when the Release is blocked.
# verify-version (issue #1191) is exactly such a check — manifest version vs tag —
# so it is a job-level precondition, not a build step. See its own comment block.
#
# WHY CROSS FOR ARM TARGETS
# GitHub-hosted runners are x86_64 only. arm64 cross-compilation is handled by the
# cross-rs/cross action which wraps cargo in a Docker container with the appropriate
# sysroot. aarch64-apple-darwin builds natively on macos-latest (M1 runners).
#
# WHY WE STRIP BINARIES
# Rust debug symbols roughly double binary size. strip removes them. Native targets
# use the host strip; the aarch64 Linux cross build needs aarch64-linux-gnu-strip
# from binutils-aarch64-linux-gnu because host x86_64 strip can't read ARM64 ELF.
#
# DISPATCH MODES
# - workflow_dispatch + tag=vX.Y.Z  -> build all targets, then tag + publish Release
# - workflow_dispatch + dry_run=true -> build all targets, upload as workflow
#                                       artifacts only (no tag, no Release). Use to
#                                       validate the workflow from any branch.
# - push: tags v*.*.*               -> build all targets, attach to the existing tag
#
# GOTCHAS
# - dtolnay/rust-toolchain@stable is the pinned toolchain action already used in suite-04.
# - cross-rs/cross requires Docker; ubuntu-latest runners include Docker by default.
# - commit_hash may be a short or full SHA; the resolve job expands it.

name: release-rmpc

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create on success (e.g. v0.3.1). Required unless dry_run=true."
        required: false
        type: string
      commit_hash:
        description: "Commit SHA (short or full) to build from. Defaults to the dispatched ref's HEAD."
        required: false
        type: string
      dry_run:
        description: "Build all targets and upload as workflow artifacts only — no tag, no GitHub Release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# CI TAXONOMY
# Release plumbing, not a test suite: resolve/build/publish cross-compile and
# attach artifacts, and assert nothing about product behaviour. Per the taxonomy
# that is `ignore`. This workflow has no `pull_request` trigger and must never
# gain one — it pushes tags and creates GitHub Releases.
#
# The behaviour that DOES need proving — that every archive ships a matching
# `.sha256` and that the documented install path refuses a download which does
# not match it — is covered on every PR by
# scripts/release/install-rmpc-selftest.sh (issue #1204). That selftest does not
# grep this file for the text of those steps: it EXTRACTS the `Package tar.gz`
# and `Assert every archive ships its checksum` step bodies and RUNS them —
# packaging with `sha256sum` removed from PATH (the macOS runner case), pairing
# against a deliberately unpaired artifact set. A grep proves presence; only
# execution proves the step can run on the runners this matrix names. This
# workflow only fires on a tag, so without that selftest none of it would be
# exercised anywhere.
env:
  CI_CLASS: ignore

jobs:
  resolve:
    name: resolve-inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # Every `${{ }}` below is read through step-level `env:`, never interpolated
      # into shell source. This workflow holds `contents: write`, and an expression
      # spliced into a `run:` body is executed by bash — an actor with only
      # `actions:write` could dispatch a tag like `v1$(...)` and reach code
      # execution on the runner with that token. Via `env:` the value arrives as
      # data in a variable and is never parsed as shell.
      - name: Validate inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME:-}" != "workflow_dispatch" ]; then
            exit 0
          fi

          if [ "${DRY_RUN:-}" != "true" ] && [ -z "${INPUT_TAG:-}" ]; then
            echo "::error::tag input is required when dry_run is false"
            exit 1
          fi

          # Shape-check the tag before anything consumes it. `inputs.tag` reaches
          # `git tag`, the archive filenames, the Release name and the version
          # assertion; constraining it once here is the cheapest mitigation for
          # all of those sinks at the same time. It also forecloses a tag whose
          # value carries a newline, which would otherwise inject a second
          # `version=` line into $GITHUB_OUTPUT below and let the version we
          # VERIFY differ from the version we RELEASE.
          # Deliberately bash's `[[ =~ ]]` and not `grep -E`: grep matches
          # LINE-wise, so `v1.2.3\nanything` would satisfy `^…$` on its first
          # line and pass. bash anchors against the whole string, so an embedded
          # newline fails the match — which is precisely the case that matters.
          if [ -n "${INPUT_TAG:-}" ]; then
            if [[ ! "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag input '${INPUT_TAG}' is not a release tag. Expected vX.Y.Z or vX.Y.Z-prerelease."
              exit 1
            fi
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve sha + version
        id: r
        env:
          INPUT_COMMIT_HASH: ${{ inputs.commit_hash }}
          INPUT_TAG: ${{ inputs.tag }}
          GITHUB_SHA_IN: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_COMMIT_HASH:-}" ]; then
            SHA=$(git rev-parse "${INPUT_COMMIT_HASH}^{commit}")
          else
            SHA="${GITHUB_SHA_IN:-}"
          fi

          if [ -n "${INPUT_TAG:-}" ]; then
            VERSION="${INPUT_TAG}"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            VERSION="${REF_NAME}"
          else
            VERSION="dryrun-$(echo "${SHA}" | cut -c1-7)"
          fi

          # $GITHUB_OUTPUT is a `key=value` file with no delimiter of its own, so
          # a value carrying a newline writes a SECOND key and silently wins.
          # `Validate inputs` rejects such a tag on the dispatch path; this is the
          # same guarantee for the push-tags path, where the value comes from
          # github.ref_name rather than from inputs.
          for v in "${SHA}" "${VERSION}"; do
            if [ "$(printf '%s' "${v}" | wc -l)" -ne 0 ]; then
              echo "::error::resolved value contains a newline and cannot be written to \$GITHUB_OUTPUT"
              exit 1
            fi
          done

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # WHY THIS IS A JOB AND NOT A STEP INSIDE build
  # The binary's version comes from clients/rust-payment-client/Cargo.toml
  # (clap's `version` derive expands to CARGO_PKG_VERSION); nothing in this
  # workflow injects the tag. For six releases that manifest sat at the 0.1.0
  # placeholder, so every published archive was NAMED rmpc-v0.3.x-* while the
  # binary inside reported 0.1.0 and no operator could tell builds apart
  # (issue #1191).
  #
  # Checking that inside `build` would be too late in two ways. `fail-fast: false`
  # means the other three matrix legs run to completion and upload MISLABELLED
  # archives via actions/upload-artifact — a 7-day channel readable by anyone
  # with repo read — even though the Release itself is correctly blocked. And on
  # the `push: tags` trigger the tag ALREADY EXISTS when the build runs, so a
  # late failure strands an orphan tag with no Release, contradicting this
  # workflow's own invariant above ("we never end up with an orphan tag").
  # As a precondition it costs seconds, needs no toolchain and no built binary,
  # and gates all four archives plus the workflow-artifact channel at once.
  verify-version:
    name: verify-manifest-matches-tag
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Manifest version must equal the tag being released
        # Keyed on the actual dispatch MODE, not on the shape of the version
        # string. Keying on a `dryrun-*` prefix let `dry_run=false` +
        # `tag=dryrun-abc1234` skip the only version assertion in the pipeline
        # while `publish` still pushed a real tag and cut a real Release — the
        # control silently disabled by a caller-supplied string.
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST=clients/rust-payment-client/Cargo.toml
          EXPECTED="${VERSION#v}"
          ACTUAL="$(
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{
                   gsub(/^version[[:space:]]*=[[:space:]]*"/,""); gsub(/".*$/,""); print; exit }' \
              "${MANIFEST}"
          )"
          echo "tag: ${VERSION}   manifest: ${ACTUAL}"

          if [ -z "${ACTUAL}" ]; then
            echo "::error::could not read [package] version from ${MANIFEST}"
            exit 1
          fi

          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch. Releasing '${VERSION}' but ${MANIFEST} says '${ACTUAL}' (expected '${EXPECTED}'), so every binary in this release would report 'rmpc ${ACTUAL}' — see issue #1191. Re-running this workflow CANNOT fix it: it re-checks-out the same commit. Recovery is: delete the tag (git push --delete origin ${VERSION}), set version=${EXPECTED} in ${MANIFEST} on dev, then re-tag that commit."
            exit 1
          fi
          echo "OK: manifest matches tag ${VERSION}"

  build:
    name: build-${{ matrix.target }}
    needs: [resolve, verify-version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            os_label: linux-amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
            os_label: linux-arm64

          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            os_label: macos-amd64

          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            os_label: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM only)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Build (cross — arm64 Linux)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Strip binary (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (Linux aarch64 cross)
        if: runner.os == 'Linux' && matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Smoke-test binary and assert it reports the released version
        # `verify-version` already proved manifest == tag before any build ran,
        # and is what actually gates the release. This step closes the last link
        # of the chain by EXECUTING the artifact: it proves the built binary
        # reports the manifest version, catching a build that somehow overrode
        # CARGO_PKG_VERSION (a custom clap `long_version`, a stale cached
        # artifact) rather than a stale manifest. Keyed on the dispatch mode, not
        # on a `dryrun-*` string prefix — see verify-version for why that
        # distinction is load-bearing.
        if: matrix.target == 'x86_64-unknown-linux-gnu' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="./target/${TARGET}/release/rmpc"
          REPORTED="$("$BIN" --version)"
          echo "binary reports: ${REPORTED}"

          EXPECTED="rmpc ${VERSION#v}"
          if [ "${REPORTED}" != "${EXPECTED}" ]; then
            echo "::error::Built binary reports '${REPORTED}' but tag '${VERSION}' expects '${EXPECTED}', even though the manifest matched. Something overrides CARGO_PKG_VERSION at build time — check clap's version derive in clients/rust-payment-client/src/cli.rs; see issue #1191."
            exit 1
          fi
          echo "OK: binary version matches tag ${VERSION}"

      - name: Package tar.gz
        # sha256sum is GNU coreutils and does NOT exist on the macos-latest half
        # of this matrix; macOS ships `shasum` instead. A bare `sha256sum` here
        # exits 127 under the default `bash -e` shell, failing both macOS builds
        # and skipping `publish` (which `needs: build`) — so a tag would publish
        # nothing at all, not even the Linux archives. Same dispatch as
        # scripts/release/install-rmpc.sh; both emit `<64-hex>  <name>`, which
        # `sha256sum -c` and `shasum -a 256 -c` both consume.
        # This step is extracted and executed with sha256sum removed from PATH by
        # scripts/release/install-rmpc-selftest.sh on every PR. That extractor
        # parses this step-level `env:` and splices the values into its `env -i`
        # invocation, so any NEW `${{ }}` key added to this block must also be
        # added to that script's SUBS map or the extraction is refused.
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OS_LABEL: ${{ matrix.os_label }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ARCHIVE="rmpc-${VERSION}-${OS_LABEL}.tar.gz"
          tar -czf "${ARCHIVE}" -C "target/${TARGET}/release" rmpc
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            echo "::error::neither sha256sum nor shasum is available on this runner — refusing to publish an unverifiable archive"
            exit 1
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${ARCHIVE}.sha256" >> "$GITHUB_ENV"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: tag-and-publish
    needs: [resolve, build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded archives
        run: ls -la artifacts/

      - name: Assert every archive ships its checksum
        # The two options named below this step are NOT a pairing check.
        # `if-no-files-found: error` fires only when the COMBINED glob set is
        # empty, and `fail_on_unmatched_files: true` only when a PATTERN matches
        # nothing — so one surviving checksum satisfies both while three archives
        # ship with nothing to verify them against. This step is the actual 1:1
        # guarantee, and scripts/release/install-rmpc-selftest.sh extracts and
        # runs it against a paired and an unpaired fixture on every PR.
        #
        # EXPECTED_ARCHIVES tracks the `build` matrix length; the selftest asserts
        # the two numbers stay equal, so adding a target here is caught rather
        # than silently under-counted.
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXPECTED_ARCHIVES=4
          archives=(artifacts/*.tar.gz)
          if [[ ${#archives[@]} -ne $EXPECTED_ARCHIVES ]]; then
            echo "::error::expected $EXPECTED_ARCHIVES release archives (one per build-matrix target), found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if [[ ! -f "${archive}.sha256" ]]; then
              echo "::error::${archive} has no ${archive}.sha256 — refusing to publish an archive nobody can verify"
              exit 1
            fi
          done
          echo "all ${#archives[@]} archives ship a matching .sha256"

      # Both the tag and the Release read `needs.resolve.outputs.version`, the
      # SAME value verify-version checked. Reading `inputs.tag` here instead was
      # a second, independent read of the same nominal value: whatever
      # verify-version validated, this step could still tag something else.
      # One value is resolved once, validated once, and released.
      - name: Create and push git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}"
          git push origin "${VERSION}"

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          draft: false
          fail_on_unmatched_files: true
