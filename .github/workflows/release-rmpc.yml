# Canonical: Plan tracking issue #109 (formerly docs/implementation-plan.md §Release & distribution)
#
# WHY THIS WORKFLOW EXISTS
# Operators and developers need pre-built rmpc binaries without building from source.
# Cross-compiling for all four targets (linux/amd64, linux/arm64, macos/amd64,
# macos/arm64) and attaching the resulting tar.gz archives as GitHub Release assets
# makes distribution frictionless — no Rust toolchain required.
#
# WHY A RELEASE IS A TAG PUSH AND NOTHING ELSE
# A release is cut by pushing an `rmpc-vX.Y.Z` tag. The `protect-rmpc-release-tags`
# ruleset lets only organization admins create that ref, and the tag-push run is the
# ONLY run that attests build provenance (see the attest step). install-rmpc.sh
# accepts an archive only with an attestation whose source ref is the tag it
# installs and whose trigger is `push`. A dispatched run used to release too, and it
# attested on every run, dry runs and branch dispatches included: any writer could
# dispatch it on a branch with `commit_hash` set to a trojan and get a genuine
# Sigstore attestation for those bytes, then swap them into a release with
# `contents: write`. So workflow_dispatch is now a dry run only and never attests.
#
# WHY verify-version RUNS BEFORE build AND NOT INSIDE IT
# On the `push: tags` trigger the tag already exists when the build starts, so any
# check that can fail on tag CONTENT must run before it can strand that tag. It also
# has to precede the matrix because `fail-fast: false` lets the surviving legs upload
# mislabelled archives as workflow artifacts even when the Release is blocked.
# verify-version (issue #1191) is exactly such a check — manifest version vs tag —
# so it is a job-level precondition, not a build step. See its own comment block.
#
# WHY arm64 LINUX BUILDS ON A NATIVE ARM RUNNER, NOT WITH cross
# The aarch64-unknown-linux-gnu leg used to run `cross build`, which links inside
# the Docker image ghcr.io/cross-rs/aarch64-unknown-linux-gnu:<cross version>. That
# is a tag, not a digest, so whoever can move it upstream chooses the linker and
# sysroot that produce the binary, inside the job that attests it. So the leg now
# builds natively on the GitHub-hosted `ubuntu-24.04-arm` runner (free for public
# repositories) with the same cargo and the same steps as x86_64, and no
# container. audit_workflow_run_splice_and_perms.py refuses a `cross` build in an
# attesting job unless Cross.toml pins that target's image by @sha256 digest.
# aarch64-apple-darwin builds natively on macos-latest (M1 runners).
#
# WHY WE STRIP BINARIES
# Rust debug symbols roughly double binary size. strip removes them. Every target
# builds on a runner of its own architecture, so the host strip reads its ELF or
# Mach-O.
#
# WHY THE TAG NAMESPACE IS `rmpc-v*` AND NOT `v*` (issue #1243)
# This workflow used to trigger on `v*.*.*` — the SAME namespace release-dapp.yml
# publishes into, from an unvalidated `inputs.tag`. Nothing could tell the two
# apart, and three tags (v0.2.2, v0.3.0, v0.3.1) really did fire both pipelines
# at once. Two consequences, both live:
#   1. .github/scripts/assert_manifest_ahead_of_tags.sh raised the rmpc floor to
#      whatever the dApp last released, so a dApp-only release blocked every rmpc
#      PR until the rmpc crate was bumped past a version chosen for the dApp.
#   2. verify-version compared the rmpc MANIFEST against a tag chosen for the
#      dApp, failed, and told the operator to `git push --delete` that tag —
#      which would have destroyed the dApp Release published from it.
# rmpc releases now own `rmpc-vX.Y.Z` exclusively. release-dapp.yml keeps `v*.*.*`;
# neither workflow can see the other's tags, and this workflow is the sole owner
# of every tag it can be triggered by, which is what makes the tag-deletion
# recovery in verify-version safe to print.
# Archive names are unchanged: `rmpc-v0.4.0-linux-amd64.tar.gz` for tag
# `rmpc-v0.4.0` exactly as for the legacy `v0.4.0`, because the packaging step
# strips the `rmpc-` prefix (scripts/release/install-rmpc.sh strips it the same
# way, so old and new tags both resolve).
#
# WHY publish IS FOLLOWED BY bump-manifest
# verify-version demands manifest == tag; assert_manifest_ahead_of_tags.sh demands
# manifest > newest release. Publishing therefore leaves `dev` in exactly the
# state the PR guard rejects, by construction. bump-manifest closes that loop by
# opening the patch-bump PR automatically. See docs/development/releasing.md.
#
# DISPATCH MODES
# - push: tags rmpc-v*.*.*          -> build all targets, attest, publish the Release
#                                       on the existing tag. The only release path.
# - workflow_dispatch (dry_run=true) -> build all targets from the dispatched
#                                       ref's HEAD, upload as workflow artifacts
#                                       only (no attestation, no tag, no Release).
#                                       Use to validate the workflow from any
#                                       branch. dry_run=false is refused, and there
#                                       is no commit_hash input: see "WHY THE
#                                       ATTESTING JOB RESTORES NO CACHE".
#
# GOTCHAS
# - Every `uses:` is pinned to a full commit SHA with its version in a comment. The
#   build job holds id-token: write and attestations: write, and publish holds
#   contents: write, so a moved upstream tag would run inside the job that signs or
#   publishes the archive. audit_workflow_run_splice_and_perms.py refuses an
#   unpinned `uses:` in any job that holds a write scope. Bump a pin by resolving
#   the new release tag to its commit (git ls-remote --tags <action repo>).
# - dtolnay/rust-toolchain is pinned to a commit of its master branch, so the
#   toolchain is named by the `toolchain:` input rather than by a branch ref.
# - The build job uses no Actions cache (no rust-cache, no actions/cache). Its
#   restore keys hold no ref, so a cache another run saved would be linked into
#   the binary the tag push attests. audit_workflow_run_splice_and_perms.py
#   refuses any cache step in a job that runs attest-build-provenance.

name: release-rmpc

on:
  push:
    tags:
      # rmpc's own namespace. `v*.*.*` belongs to release-dapp.yml — see the
      # "WHY THE TAG NAMESPACE IS `rmpc-v*`" block above.
      - "rmpc-v*.*.*"
  # A dry run only (see "WHY A RELEASE IS A TAG PUSH AND NOTHING ELSE"). There is no
  # `tag` input: a release is the push of an admin-created rmpc-vX.Y.Z tag. There is
  # no `commit_hash` input either: a dry run builds the dispatched ref's HEAD, so it
  # cannot run an unreviewed commit under dev's or a release tag's identity and
  # cache scope (see "WHY THE ATTESTING JOB RESTORES NO CACHE" on the build job).
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Must stay true: a dispatched run builds and uploads workflow artifacts only. Releases are cut by pushing an rmpc-vX.Y.Z tag."
        required: false
        type: boolean
        default: true

# WHY THE DEFAULT IS READ AND WRITE IS GRANTED PER JOB (issue #1237)
# `contents: write` used to be declared here, at workflow scope, so EVERY job
# inherited it — including the `build` matrix, which never needs it. That matrix
# checks out `submodules: recursive` at a caller-chosen commit (a dispatch runs
# any branch a writer pushes) and runs
# `cargo build`, which executes `build.rs` and proc-macro code out of that tree.
# The token is in the job's environment the whole time. "Can dispatch a release"
# therefore silently meant "can run arbitrary code with a repo-write token", for
# a caller who only needed `actions: write` to get there.
# So the workflow default is the floor, not the ceiling: read. Every job then
# declares its own block, which makes the authority a job-local, reviewable fact
# rather than something inherited from 400 lines away — and a job added later
# starts read-only instead of silently inheriting write.
# scripts/release/install-rmpc-selftest.sh audits this map on every PR: the
# default must not be write, every job must declare a block, resolve /
# verify-version / build must not reach write, and `publish` must (an audit that
# passed because the release lost the authority to publish would assert nothing).
permissions:
  contents: read

# CI TAXONOMY
# Release plumbing, not a test suite: resolve/build/publish cross-compile and
# attach artifacts, and assert nothing about product behaviour. Per the taxonomy
# that is `ignore`. This workflow has no `pull_request` trigger and must never
# gain one — it pushes tags and creates GitHub Releases.
#
# The behaviour that DOES need proving — that every archive ships a matching
# `.sha256`, that this job still grants the scopes that mint a build-provenance
# attestation, and that the documented install path refuses both a download which
# does not match its checksum and an archive whose attestation does not verify —
# is covered on every PR by
# scripts/release/install-rmpc-selftest.sh (issue #1204). That selftest does not
# grep this file for the text of those steps: it EXTRACTS the `Package tar.gz`
# and `Assert every archive ships its checksum` step bodies and RUNS them —
# packaging with `sha256sum` removed from PATH (the macOS runner case), pairing
# against a deliberately unpaired artifact set. A grep proves presence; only
# execution proves the step can run on the runners this matrix names. This
# workflow only fires on a tag, so without that selftest none of it would be
# exercised anywhere.
env:
  CI_CLASS: ignore

jobs:
  resolve:
    name: resolve-inputs
    # Reads the run's own event (no checkout) and writes nothing.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # Every `${{ }}` below is read through step-level `env:`, never interpolated
      # into shell source. An expression spliced into a `run:` body is substituted
      # into the shell SOURCE before bash ever parses it, so quoting at the call
      # site does not help — a value like `rmpc-v1$(...)` would reach code
      # execution on the runner. Via `env:` the value arrives as data in a
      # variable and is never parsed as shell.
      # This job holds no write scope (see the permissions block above), but the
      # sink is the runner, not the token: the guard stands on its own.
      # install-rmpc-selftest.sh extracts this step and RUNS it: a non-dry-run
      # dispatch must be refused, a dry run accepted, and a pushed tag carrying a
      # `$(...)` payload or a newline refused without running. It separately
      # refuses any `${{ }}` other than `matrix.*` anywhere in a `run:` body here.
      - name: Validate inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A dispatched run is a dry run, never a release. Only the push of an
          # admin-created rmpc-vX.Y.Z tag attests build provenance, and
          # install-rmpc.sh refuses any archive whose attestation was not minted
          # by the push of the tag it installs. A dispatch that published would
          # therefore ship archives no operator can install, and a dispatch that
          # attested would let any writer mint a genuine attestation for a
          # trojan commit (see "WHY A RELEASE IS A TAG PUSH AND NOTHING ELSE").
          if [ "${EVENT_NAME:-}" = "workflow_dispatch" ]; then
            if [ "${DRY_RUN:-}" != "true" ]; then
              echo "::error::a dispatched release-rmpc run is a dry run only; dry_run=false is refused. Cut a release by pushing an rmpc-vX.Y.Z tag (admin-only ruleset): that run alone attests build provenance, and install-rmpc.sh accepts only an attestation minted by the push of the tag it installs. See docs/development/releasing.md."
              exit 1
            fi
            exit 0
          fi

          # push: tags rmpc-v*.*.* — shape-check the tag before anything
          # consumes it. The trigger's glob admits `rmpc-vX.Y.Z` with anything in
          # the X/Y/Z positions, and the tag reaches the archive filenames, the
          # Release name, the version assertion and $GITHUB_OUTPUT. Deliberately
          # bash's `[[ =~ ]]` and not `grep -E`: grep matches LINE-wise, so
          # `rmpc-v1.2.3\nanything` would satisfy `^…$` on its first line and
          # pass. bash anchors against the whole string, so an embedded newline
          # fails the match — which is precisely the case that matters. The
          # `rmpc-` prefix is REQUIRED (issue #1243): bare `vX.Y.Z` belongs to
          # release-dapp.yml.
          if [[ ! "${REF_NAME:-}" =~ ^rmpc-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '${REF_NAME:-}' is not an rmpc release tag. Expected rmpc-vX.Y.Z or rmpc-vX.Y.Z-prerelease. The bare 'vX.Y.Z' namespace belongs to release-dapp.yml (issue #1243)."
            exit 1
          fi

      - name: Resolve sha + version
        id: r
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GITHUB_SHA_IN: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The run's own commit: the pushed tag's commit, or the dispatched ref's
          # HEAD. There is no caller-supplied commit (see the dispatch inputs).
          SHA="${GITHUB_SHA_IN:-}"

          # dry_run is checked FIRST and wins over every other source of a
          # version, so "a dry run is never named after a release" is a property
          # of the step that RESOLVES the name. A release version comes only from
          # the pushed tag: `Validate inputs` refuses every dispatch that is not
          # a dry run, and there is no `tag` input. Everything downstream
          # (archive filenames, the mode-keyed version assertions) reads this one
          # value.
          if [ "${DRY_RUN:-}" = "true" ]; then
            VERSION="dryrun-$(echo "${SHA}" | cut -c1-7)"
          elif [ "${REF_TYPE:-}" = "tag" ]; then
            VERSION="${REF_NAME}"
          else
            VERSION="dryrun-$(echo "${SHA}" | cut -c1-7)"
          fi

          # $GITHUB_OUTPUT is a `key=value` file with no delimiter of its own, so
          # a value carrying a newline writes a SECOND key and silently wins.
          # `Validate inputs` already refuses such a tag; this guarantee belongs
          # to the step that writes the file, so it stands on its own.
          for v in "${SHA}" "${VERSION}"; do
            if [ "$(printf '%s' "${v}" | wc -l)" -ne 0 ]; then
              echo "::error::resolved value contains a newline and cannot be written to \$GITHUB_OUTPUT"
              exit 1
            fi
          done

          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # WHY THIS IS A JOB AND NOT A STEP INSIDE build
  # The binary's version comes from clients/rust-payment-client/Cargo.toml
  # (clap's `version` derive expands to CARGO_PKG_VERSION); nothing in this
  # workflow injects the tag. For six releases that manifest sat at the 0.1.0
  # placeholder, so every published archive was NAMED rmpc-v0.3.x-* while the
  # binary inside reported 0.1.0 and no operator could tell builds apart
  # (issue #1191).
  #
  # Checking that inside `build` would be too late in two ways. `fail-fast: false`
  # means the other three matrix legs run to completion and upload MISLABELLED
  # archives via actions/upload-artifact — a 7-day channel readable by anyone
  # with repo read — even though the Release itself is correctly blocked. And on
  # the `push: tags` trigger the tag ALREADY EXISTS when the build runs, so a
  # late failure strands an orphan tag with no Release, contradicting this
  # workflow's own invariant above ("we never end up with an orphan tag").
  # As a precondition it costs seconds, needs no toolchain and no built binary,
  # and gates all four archives plus the workflow-artifact channel at once.
  verify-version:
    name: verify-manifest-matches-tag
    # Checks out and reads a manifest. Writes nothing.
    permissions:
      contents: read
    needs: [resolve]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Manifest version must equal the tag being released
        # Keyed on the actual dispatch MODE, not on the shape of the version
        # string. Keying on a `dryrun-*` prefix let `dry_run=false` +
        # `tag=dryrun-abc1234` skip the only version assertion in the pipeline
        # while `publish` still pushed a real tag and cut a real Release — the
        # control silently disabled by a caller-supplied string.
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          MANIFEST=clients/rust-payment-client/Cargo.toml
          # rmpc-v0.4.0 -> 0.4.0. The strip is prefix-only, so the legacy
          # dryrun-<sha7> shape and any bare vX.Y.Z both still reduce correctly.
          EXPECTED="${VERSION#rmpc-}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL="$(
            awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{
                   gsub(/^version[[:space:]]*=[[:space:]]*"/,""); gsub(/".*$/,""); print; exit }' \
              "${MANIFEST}"
          )"
          echo "tag: ${VERSION}   manifest: ${ACTUAL}"

          if [ -z "${ACTUAL}" ]; then
            echo "::error::could not read [package] version from ${MANIFEST}"
            exit 1
          fi

          # The recovery differs by trigger, and printing the wrong one is a
          # destructive instruction (issue #1243).
          #
          # push: the tag already exists and this workflow is its sole owner —
          # `rmpc-v*` is not shared with release-dapp.yml — so deleting it
          # destroys nothing else. Under the old shared `v*.*.*` namespace this
          # same line told an operator to delete a tag a dApp Release had
          # already been published from.
          #
          # workflow_dispatch: verify-version runs BEFORE publish, so no tag has
          # been created yet. There is nothing to delete, and saying otherwise
          # sends the operator hunting for a ref that does not exist.
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            if [ "${EVENT_NAME:-}" = "push" ]; then
              RECOVERY="delete the tag (git push --delete origin ${VERSION}) — this workflow owns the rmpc-v* namespace outright, so no other component's release depends on it — then set version=${EXPECTED} in ${MANIFEST} on dev and re-tag that commit."
            else
              RECOVERY="no tag was created (this check runs before publish), so nothing needs deleting. Set version=${EXPECTED} in ${MANIFEST} on dev, then re-dispatch this workflow against that commit."
            fi
            echo "::error::Version mismatch. Releasing '${VERSION}' but ${MANIFEST} says '${ACTUAL}' (expected '${EXPECTED}'), so every binary in this release would report 'rmpc ${ACTUAL}' — see issue #1191. Re-running this workflow CANNOT fix it: it re-checks-out the same commit. Recovery: ${RECOVERY}"
            exit 1
          fi
          echo "OK: manifest matches tag ${VERSION}"

  build:
    name: build-${{ matrix.target }}
    # The job this issue is about. It checks out `submodules: recursive` at
    # needs.resolve.outputs.sha and runs cargo, so build.rs and every proc macro
    # in that tree execute here. Read is all a checkout needs; the archives leave
    # via actions/upload-artifact, which does not use the contents scope.
    needs: [resolve, verify-version]
    runs-on: ${{ matrix.runner }}
    # WHY THIS JOB HAS ITS OWN PERMISSION MAP (issue #1236)
    # `actions/attest-build-provenance` mints a Sigstore attestation using this
    # run's OIDC identity, which needs `id-token: write`, and writes it to the
    # repository's attestation store, which needs `attestations: write`. Neither
    # is grantable from the workflow-level map, so the map is restated here. Since
    # #1237 the workflow default is `contents: read`, so this block no longer has
    # a workflow-level write to drop — it states the two attestation scopes this
    # job needs, alongside the `contents: read` a checkout requires. `publish` and
    # `bump-manifest` declare the write scopes they need in their own maps.
    #
    # WHY THE ATTESTING JOB RESTORES NO CACHE
    # This job used to run Swatinem/rust-cache on every trigger. Its key is
    # v0-rust-<job>-<os>-<arch>-<env hash>-<Cargo.toml/Cargo.lock hash>, with no ref
    # and no trigger in it, it caches target/ and CARGO_HOME, and a tag-push run
    # restores from its own ref and from dev. A writer could dispatch a dry run on
    # dev at a commit whose build.rs rewrote a dependency rlib, let the post step
    # save that target/ under the exact key the next release computes, and the
    # admin's tag push would restore it, treat the rlib as fresh, link it, and
    # attest the result as a push of refs/tags/rmpc-vX.Y.Z. So this job restores
    # and saves no Actions cache at all, on any trigger, and the dispatch takes no
    # commit_hash. A release build costs a few more minutes. Do not add a cache
    # step here: audit_workflow_run_splice_and_perms.py refuses any cache step in
    # a job that runs attest-build-provenance, and install-rmpc-selftest.sh
    # asserts this job has none.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os_label: linux-amd64

          # Native, not `cross`: see "WHY arm64 LINUX BUILDS ON A NATIVE ARM RUNNER".
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os_label: linux-arm64

          - target: x86_64-apple-darwin
            runner: macos-latest
            os_label: macos-amd64

          - target: aarch64-apple-darwin
            runner: macos-latest
            os_label: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, toolchain named below
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # No cache step: see "WHY THE ATTESTING JOB RESTORES NO CACHE" above.
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Smoke-test binary and assert it reports the released version
        # `verify-version` already proved manifest == tag before any build ran,
        # and is what actually gates the release. This step closes the last link
        # of the chain by EXECUTING the artifact: it proves the built binary
        # reports the manifest version, catching a build that somehow overrode
        # CARGO_PKG_VERSION (a custom clap `long_version`, a stale cached
        # artifact) rather than a stale manifest. Keyed on the dispatch mode, not
        # on a `dryrun-*` string prefix — see verify-version for why that
        # distinction is load-bearing.
        if: matrix.target == 'x86_64-unknown-linux-gnu' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          BIN="./target/${TARGET}/release/rmpc"
          REPORTED="$("$BIN" --version)"
          echo "binary reports: ${REPORTED}"

          SEMVER="${VERSION#rmpc-}"
          EXPECTED="rmpc ${SEMVER#v}"
          if [ "${REPORTED}" != "${EXPECTED}" ]; then
            echo "::error::Built binary reports '${REPORTED}' but tag '${VERSION}' expects '${EXPECTED}', even though the manifest matched. Something overrides CARGO_PKG_VERSION at build time — check clap's version derive in clients/rust-payment-client/src/cli.rs; see issue #1191."
            exit 1
          fi
          echo "OK: binary version matches tag ${VERSION}"

      - name: Package tar.gz
        # sha256sum is GNU coreutils and does NOT exist on the macos-latest half
        # of this matrix; macOS ships `shasum` instead. A bare `sha256sum` here
        # exits 127 under the default `bash -e` shell, failing both macOS builds
        # and skipping `publish` (which `needs: build`) — so a tag would publish
        # nothing at all, not even the Linux archives. Same dispatch as
        # scripts/release/install-rmpc.sh; both emit `<64-hex>  <name>`, which
        # `sha256sum -c` and `shasum -a 256 -c` both consume.
        # This step is extracted and executed with sha256sum removed from PATH by
        # scripts/release/install-rmpc-selftest.sh on every PR. That extractor
        # parses this step-level `env:` and splices the values into its `env -i`
        # invocation, so a NEW key here needs TWO edits in that script, and is
        # refused (loudly, reddening the PR) until it gets them:
        #   - `SUBS`, so the `${{ }}` expression renders instead of being dropped;
        #   - `ALLOWED_ENV_NAMES`, which is an ALLOW-list, not a deny-list.
        # The allow-list is deliberate friction (issue #1292). The harness runs
        # this step's body, so any name this block declares reaches the loader
        # and the shell that start that body: `LD_AUDIT` alone bought arbitrary
        # code execution outside the harness's fixture root while every assertion
        # stayed green. Refusing everything but the three names below closes that
        # whole family rather than the members of it anyone happened to list, and
        # puts a human in front of each new one.
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          OS_LABEL: ${{ matrix.os_label }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # `rmpc-` is stripped from the tag so `rmpc-v0.4.0` produces
          # `rmpc-v0.4.0-linux-amd64.tar.gz`, not `rmpc-rmpc-v0.4.0-…`. Archive
          # names are therefore unchanged by the namespace split (issue #1243),
          # and scripts/release/install-rmpc.sh applies the same strip so both
          # legacy `v0.3.3` and new `rmpc-v0.4.0` tags resolve to a real asset.
          ARCHIVE="rmpc-${VERSION#rmpc-}-${OS_LABEL}.tar.gz"
          tar -czf "${ARCHIVE}" -C "target/${TARGET}/release" rmpc
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            echo "::error::neither sha256sum nor shasum is available on this runner — refusing to publish an unverifiable archive"
            exit 1
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${ARCHIVE}.sha256" >> "$GITHUB_ENV"

      # THE OUT-OF-BAND TRUST ANCHOR (issue #1236)
      # The `.sha256` published beside each archive shares its trust root with the
      # archive: same release, same host, same token. Anyone who can write the
      # release can write both, so a checksum-only install path cannot detect a
      # substituted release — only a substituted DOWNLOAD. This step is what does
      # not share that root. It signs a SLSA provenance statement over the
      # archive's digest with a Fulcio certificate carrying this workflow's OIDC
      # identity; producing one requires an `id-token: write` Actions run in this
      # repository, which a leaked release-write token is not.
      #
      # The subject is `${{ env.ARCHIVE }}` — the exact name `Package tar.gz`
      # exported to GITHUB_ENV one step above, so the attested bytes and the
      # uploaded bytes cannot drift apart. The attestation is keyed by digest in
      # the repository's attestation store, not attached as a release asset, so
      # nothing here changes what the Release holds.
      #
      # The consuming half is `gh attestation verify` in
      # scripts/release/install-rmpc.sh, pinned to this repository, this
      # workflow path, the source ref `refs/tags/<tag>` and the `push` trigger.
      # scripts/release/install-rmpc-selftest.sh asserts on every PR that the
      # installer refuses an archive whose attestation does not verify, and that
      # this job still grants the two scopes above.
      #
      # WHY ONLY A TAG PUSH ATTESTS. Every run of this job used to attest: a dry
      # run, and a dispatch on any branch with any `commit_hash`. Any writer could
      # dispatch on a branch whose copy of this file they had edited, get a
      # genuine attestation over a trojan archive, and swap that archive into an
      # existing Release with `contents: write`; the `rmpc-v*` tag ruleset guards
      # refs, not release assets. So the step runs only for the push of an
      # `rmpc-v*` tag, which only an org admin can create, and the installer
      # pins the same two facts from the certificate (source ref, trigger), so an
      # attestation minted any other way, by any copy of this file, is refused.
      # audit_workflow_run_splice_and_perms.py refuses an attest step without
      # exactly this condition.
      #
      # What this does NOT prove: that the tagged commit was reviewed. The admin
      # who pushes the tag vouches for that commit.
      - name: Attest build provenance for the archive
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rmpc-v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: tag-and-publish
    # Writes the Release created by softprops/action-gh-release on the tag an
    # admin pushed. It runs no code from the built tree — it downloads the
    # matrix's artifacts and attaches them. A tag push is the only release path
    # (see "WHY A RELEASE IS A TAG PUSH AND NOTHING ELSE"), so a dispatched run
    # never reaches this job.
    permissions:
      contents: write
    needs: [resolve, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rmpc-v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded archives
        run: ls -la artifacts/

      - name: Assert every archive ships its checksum
        # The two options named below this step are NOT a pairing check.
        # `if-no-files-found: error` fires only when the COMBINED glob set is
        # empty, and `fail_on_unmatched_files: true` only when a PATTERN matches
        # nothing — so one surviving checksum satisfies both while three archives
        # ship with nothing to verify them against. This step is the actual 1:1
        # guarantee, and scripts/release/install-rmpc-selftest.sh extracts and
        # runs it against a paired and an unpaired fixture on every PR.
        #
        # EXPECTED_ARCHIVES tracks the `build` matrix length; the selftest asserts
        # the two numbers stay equal, so adding a target here is caught rather
        # than silently under-counted.
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXPECTED_ARCHIVES=4
          archives=(artifacts/*.tar.gz)
          if [[ ${#archives[@]} -ne $EXPECTED_ARCHIVES ]]; then
            echo "::error::expected $EXPECTED_ARCHIVES release archives (one per build-matrix target), found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if [[ ! -f "${archive}.sha256" ]]; then
              echo "::error::${archive} has no ${archive}.sha256 — refusing to publish an archive nobody can verify"
              exit 1
            fi
          done
          echo "all ${#archives[@]} archives ship a matching .sha256"

      # The Release reads `needs.resolve.outputs.version`, the SAME value
      # verify-version checked: one value is resolved once, validated once, and
      # released. The tag already exists (an admin pushed it), so nothing here
      # creates a ref.
      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          draft: false
          fail_on_unmatched_files: true

  # THE OTHER HALF OF THE VERSION CONTRACT (issue #1243)
  # verify-version above requires manifest == tag. The PR guard
  # (.github/scripts/assert_manifest_ahead_of_tags.sh) requires manifest >
  # newest published release. Both are correct and they are mutually exclusive:
  # the moment this workflow publishes, `dev` is BY CONSTRUCTION in the state the
  # PR guard rejects, and it stays there until a human bumps the manifest. That
  # trap was documented nowhere, which is what made it a trap.
  #
  # So the release opens its own fix. This job runs after the Release exists,
  # checks whether `dev` is actually in the self-rejecting state, and if it is,
  # pushes a patch bump and opens the PR. Nothing is force-merged: the bump PR
  # goes through the same CI everything else does, and the guard it satisfies is
  # scoped to rmpc-crate changes, so unrelated PRs are never red in the meantime.
  #
  # It is a SEPARATE job, not a step in publish, so a failure here (the most
  # likely cause being the repo/org setting "Allow GitHub Actions to create and
  # approve pull requests" being off) is reported as its own red signal and can
  # never roll back or obscure a Release that already published. When it does
  # fail, the manual recipe is docs/development/releasing.md §"If the bump PR was
  # not opened".
  bump-manifest:
    name: open-post-release-bump-pr
    needs: [resolve, publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rmpc-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: dev
          fetch-depth: 0

      - name: Open the patch-bump PR against dev
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          MANIFEST=clients/rust-payment-client/Cargo.toml

          # All the logic — prerelease supersession, patch arithmetic, and an
          # in-place rewrite that must not touch dependency `version =` keys —
          # lives in a script so it can be executed on every PR by
          # .github/scripts/tests/test_bump_rmpc_manifest.sh. This workflow fires
          # only on a tag; a `run:` block here would first run during a real
          # release, on dev, holding contents: write.
          #
          # Exit 3 means dev is not in the post-release collision state (the
          # release was cut from an older commit, or the bump already merged).
          # That is a legitimate no-op, not a failure.
          BUMP_OUT="$(bash .github/scripts/bump_rmpc_manifest.sh "${VERSION}" "${MANIFEST}")" && BUMP_CODE=0 || BUMP_CODE=$?
          printf '%s\n' "${BUMP_OUT}"

          if [ "${BUMP_CODE}" -eq 3 ]; then
            exit 0
          fi
          if [ "${BUMP_CODE}" -ne 0 ]; then
            echo "::error::the post-release manifest bump could not be computed; the release itself is published and unaffected. Follow docs/development/releasing.md to bump ${MANIFEST} by hand."
            exit "${BUMP_CODE}"
          fi

          NEXT="$(printf '%s\n' "${BUMP_OUT}" | sed -n 's/^next=//p')"
          RELEASED="${VERSION#rmpc-}"
          RELEASED="${RELEASED#v}"

          BRANCH="chore/post-release-manifest-bump-${NEXT}"
          TITLE="chore(rmpc): bump manifest to ${NEXT} after releasing ${VERSION}"

          # Written to a file rather than inlined so the message keeps its line
          # breaks without dedenting out of this YAML block scalar.
          cat > "${RUNNER_TEMP}/bump-body.md" <<EOF
          Automated post-release bump opened by release-rmpc.yml.

          ${VERSION} published with ${MANIFEST} at ${RELEASED}. Until this merges every
          build from dev reports "rmpc ${RELEASED}" — indistinguishable from the shipped
          release (issue #1191) — and any PR touching clients/rust-payment-client/ fails
          .github/scripts/assert_manifest_ahead_of_tags.sh. Merging this restores both
          invariants.

          Runbook: docs/development/releasing.md. Reconciliation: issue #1243.
          EOF

          # A retry can arrive after a prior run pushed the branch but failed at
          # `gh pr create` (for example, because the repository disallows
          # Actions from creating PRs). A branch alone is not completion: only
          # an open PR means the bump can reach dev. Check the actual PR before
          # treating this job as green.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            if [ "$(gh pr list --base dev --head "${BRANCH}" --state open --json number --jq 'length')" -gt 0 ]; then
              echo "open bump PR already exists for ${BRANCH}"
              exit 0
            fi

            echo "branch ${BRANCH} exists on origin but has no open bump PR; retrying PR creation"
            gh pr create \
              --base dev \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body-file "${RUNNER_TEMP}/bump-body.md"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add "${MANIFEST}"
          git commit -F - <<EOF
          ${TITLE}

          $(cat "${RUNNER_TEMP}/bump-body.md")
          EOF

          git push origin "${BRANCH}"

          gh pr create \
            --base dev \
            --head "${BRANCH}" \
            --title "${TITLE}" \
            --body-file "${RUNNER_TEMP}/bump-body.md"
