# Canonical: Plan tracking issue #109 (formerly docs/implementation-plan.md §Release & distribution)
#
# WHY THIS WORKFLOW EXISTS
# Operators and developers need pre-built rmpc binaries without building from source.
# Cross-compiling for all four targets (linux/amd64, linux/arm64, macos/amd64,
# macos/arm64) and attaching the resulting tar.gz archives as GitHub Release assets
# makes distribution frictionless — no Rust toolchain required.
#
# WHY BUILD BEFORE TAGGING
# The publish step only runs after every matrix build succeeds. If any target fails
# we never push a tag and never create a Release, so we never end up with an orphan
# tag pointing at a commit whose binaries can't be produced.
#
# WHY CROSS FOR ARM TARGETS
# GitHub-hosted runners are x86_64 only. arm64 cross-compilation is handled by the
# cross-rs/cross action which wraps cargo in a Docker container with the appropriate
# sysroot. aarch64-apple-darwin builds natively on macos-latest (M1 runners).
#
# WHY WE STRIP BINARIES
# Rust debug symbols roughly double binary size. strip removes them. Native targets
# use the host strip; the aarch64 Linux cross build needs aarch64-linux-gnu-strip
# from binutils-aarch64-linux-gnu because host x86_64 strip can't read ARM64 ELF.
#
# DISPATCH MODES
# - workflow_dispatch + tag=vX.Y.Z  -> build all targets, then tag + publish Release
# - workflow_dispatch + dry_run=true -> build all targets, upload as workflow
#                                       artifacts only (no tag, no Release). Use to
#                                       validate the workflow from any branch.
# - push: tags v*.*.*               -> build all targets, attach to the existing tag
#
# RUNNER PINNING + PRODUCTION APPROVAL (issue #660, security-model.md §13)
# Every job runs on a version-pinned runner label (ubuntu-24.04 / macos-15) —
# never a floating `*-latest` alias. GitHub-hosted runners cannot be pinned to an
# image SHA digest; the versioned label is the strongest pin available, and the
# upgrade path to digest-level pinning is a self-hosted runner label (see
# docs/technical/ci-environments.md). The `publish` job — the only job that
# performs external writes (tag push, GitHub Release) — declares
# `environment: production`, so GitHub blocks it until a required reviewer
# approves the pending deployment. Build jobs stay credential-free: workflow-level
# permissions are read-only and `contents: write` is granted only to `publish`.
# The lint `scripts/ci/check-release-runner-pinning.sh` (suite-17) enforces both
# invariants on every PR.
#
# RELEASE SIGNING + PROVENANCE (issue #659, security-model.md §13 "Release signing")
# All signing happens inside `publish`, behind the production approval gate
# (signing is an irreversible external write — it records entries in the public
# Rekor transparency log). The identity is keyless: an ephemeral certificate is
# minted by Sigstore Fulcio from the job's GitHub Actions OIDC token
# (`id-token: write`); no long-lived signing key or secret exists.
# - Tags: workflow_dispatch releases create the tag as a gitsign-signed
#   annotated tag (`git tag -s`) and verify it (`git tag -v`) before pushing.
#   Tag-push releases fail closed unless the pushed tag is a signed annotated
#   tag.
# - Archives: every tar.gz gets a keyless cosign bundle
#   (`<archive>.sigstore.json`), verified with `cosign verify-blob` before the
#   GitHub Release is created; the bundles are attached as Release assets.
# Signing or verification failure fails `publish` — no unsigned artifact can
# be published silently. The lint `scripts/ci/check-release-signing.sh`
# (suite-17) enforces these invariants statically on every PR.
#
# GOTCHAS
# - dtolnay/rust-toolchain@stable is the pinned toolchain action already used in suite-04.
# - cross-rs/cross requires Docker; ubuntu-24.04 runners include Docker by default.
# - commit_hash may be a short or full SHA; the resolve job expands it.

name: release-rmpc

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create on success (e.g. v0.3.1). Required unless dry_run=true."
        required: false
        type: string
      commit_hash:
        description: "Commit SHA (short or full) to build from. Defaults to the dispatched ref's HEAD."
        required: false
        type: string
      dry_run:
        description: "Build all targets and upload as workflow artifacts only — no tag, no GitHub Release."
        required: false
        type: boolean
        default: false

# Read-only by default; `contents: write` is granted only to the `publish` job,
# which is gated behind the protected `production` environment (issue #660).
permissions:
  contents: read

jobs:
  resolve:
    name: resolve-inputs
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "true" ] && [ -z "${{ inputs.tag }}" ]; then
            echo "::error::tag input is required when dry_run is false"
            exit 1
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve sha + version
        id: r
        run: |
          if [ -n "${{ inputs.commit_hash }}" ]; then
            SHA=$(git rev-parse "${{ inputs.commit_hash }}^{commit}")
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dryrun-$(echo "${SHA}" | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.target }}
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: false
            os_label: linux-amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross: true
            os_label: linux-arm64

          - target: x86_64-apple-darwin
            runner: macos-15
            cross: false
            os_label: macos-amd64

          - target: aarch64-apple-darwin
            runner: macos-15
            cross: false
            os_label: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM only)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Build (cross — arm64 Linux)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Strip binary (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (Linux aarch64 cross)
        if: runner.os == 'Linux' && matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Smoke-test binary (linux/amd64 only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: ./target/${{ matrix.target }}/release/rmpc --version

      - name: Package tar.gz
        run: |
          ARCHIVE="rmpc-${{ needs.resolve.outputs.version }}-${{ matrix.os_label }}.tar.gz"
          tar -czf "${ARCHIVE}" -C target/${{ matrix.target }}/release rmpc
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

  # The only job with write credentials and the only job performing external
  # writes (git tag push, GitHub Release creation, Rekor transparency-log
  # entries from signing). `environment: production` makes GitHub hold this
  # job until a required reviewer approves the pending deployment (issue #660;
  # repository Environments settings define the reviewer list — see
  # docs/technical/ci-environments.md). Dry runs skip this job entirely, so no
  # approval is requested for artifact-only builds. `id-token: write` (issue
  # #659) lets cosign/gitsign mint the keyless Sigstore signing certificate;
  # it is granted only here so signing can never precede approval.
  publish:
    name: tag-and-publish
    needs: [resolve, build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up release signing tooling (cosign + gitsign)
        uses: ./.github/actions/setup-release-signing

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded archives
        run: ls -la artifacts/

      - name: Create, verify, and push signed git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -s -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}" "${{ needs.resolve.outputs.sha }}"
          # Fail closed: never push a tag whose signature does not verify.
          git tag -v "${{ inputs.tag }}"
          git push origin "refs/tags/${{ inputs.tag }}"

      - name: Verify pushed tag is a signed annotated tag (tag-push only)
        if: github.event_name == 'push'
        run: |
          TAG="${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::release tag ${TAG} is a lightweight tag — release tags must be signed annotated tags (security-model.md §13 Release signing)"
            exit 1
          fi
          if ! git cat-file tag "refs/tags/${TAG}" | grep -qE -- '-----BEGIN (PGP SIGNATURE|SSH SIGNATURE|SIGNED MESSAGE)-----'; then
            echo "::error::release tag ${TAG} carries no signature — release tags must be signed (security-model.md §13 Release signing)"
            exit 1
          fi

      - name: Sign release archives (keyless cosign bundles)
        run: |
          for f in artifacts/*.tar.gz; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "${f}"
          done

      - name: Verify archive signatures (fail closed before publishing)
        run: |
          for f in artifacts/*.tar.gz; do
            cosign verify-blob \
              --bundle "${f}.sigstore.json" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-rmpc\.yml@" \
              "${f}"
          done

      - name: Create GitHub Release with all assets and signature bundles
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sigstore.json
          draft: false
          fail_on_unmatched_files: true

  # Dev-scout seam only. Issue #662 owns the reusable BaseScan assertion and
  # the contract-deploy workflow. rmpc does not deploy contracts; this routing
  # seam records the required predecessor without making release-rmpc a caller.
  # Issue #659 absorbed the former sign-and-attest seam into `publish` (signing
  # must be atomic with publication, behind the same approval gate), so this
  # seam now depends on `publish` directly.
  contract-source-verification:
    name: contract-source-verification-seam
    if: ${{ false }}
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: BaseScan verification routing seam
        run: |
          printf '%s\n' "Issue #662 implements this gate in the contract-deploy workflow."
