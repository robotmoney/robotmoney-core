# Canonical: Plan tracking issue #109 (formerly docs/implementation-plan.md §Release & distribution)
#
# WHY THIS WORKFLOW EXISTS
# Operators and developers need pre-built rmpc binaries without building from source.
# Cross-compiling for all four targets (linux/amd64, linux/arm64, macos/amd64,
# macos/arm64) and attaching the resulting tar.gz archives as GitHub Release assets
# makes distribution frictionless — no Rust toolchain required.
#
# WHY BUILD BEFORE TAGGING
# The publish step only runs after every matrix build succeeds. If any target fails
# we never push a tag and never create a Release, so we never end up with an orphan
# tag pointing at a commit whose binaries can't be produced.
#
# WHY CROSS FOR ARM TARGETS
# GitHub-hosted runners are x86_64 only. arm64 cross-compilation is handled by the
# cross-rs/cross action which wraps cargo in a Docker container with the appropriate
# sysroot. aarch64-apple-darwin builds natively on macos-latest (M1 runners).
#
# WHY WE STRIP BINARIES
# Rust debug symbols roughly double binary size. strip removes them. Native targets
# use the host strip; the aarch64 Linux cross build needs aarch64-linux-gnu-strip
# from binutils-aarch64-linux-gnu because host x86_64 strip can't read ARM64 ELF.
#
# DISPATCH MODES
# - workflow_dispatch + tag=vX.Y.Z  -> build all targets, then tag + publish Release
# - workflow_dispatch + dry_run=true -> build all targets, upload as workflow
#                                       artifacts only (no tag, no Release). Use to
#                                       validate the workflow from any branch.
# - push: tags v*.*.*               -> build all targets, attach to the existing tag
#
# GOTCHAS
# - dtolnay/rust-toolchain@stable is the pinned toolchain action already used in suite-04.
# - cross-rs/cross requires Docker; ubuntu-latest runners include Docker by default.
# - commit_hash may be a short or full SHA; the resolve job expands it.

name: release-rmpc

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create on success (e.g. v0.3.1). Required unless dry_run=true."
        required: false
        type: string
      commit_hash:
        description: "Commit SHA (short or full) to build from. Defaults to the dispatched ref's HEAD."
        required: false
        type: string
      dry_run:
        description: "Build all targets and upload as workflow artifacts only — no tag, no GitHub Release."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# CI TAXONOMY
# Release plumbing, not a test suite: resolve/build/publish cross-compile and
# attach artifacts, and assert nothing about product behaviour. Per the taxonomy
# that is `ignore`. This workflow has no `pull_request` trigger and must never
# gain one — it pushes tags and creates GitHub Releases.
#
# The behaviour that DOES need proving — that every archive ships a matching
# `.sha256` and that the documented install path refuses a download which does
# not match it — is covered on every PR by
# scripts/release/install-rmpc-selftest.sh (issue #1204). That selftest does not
# grep this file for the text of those steps: it EXTRACTS the `Package tar.gz`
# and `Assert every archive ships its checksum` step bodies and RUNS them —
# packaging with `sha256sum` removed from PATH (the macOS runner case), pairing
# against a deliberately unpaired artifact set. A grep proves presence; only
# execution proves the step can run on the runners this matrix names. This
# workflow only fires on a tag, so without that selftest none of it would be
# exercised anywhere.
env:
  CI_CLASS: ignore

jobs:
  resolve:
    name: resolve-inputs
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - name: Validate inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" != "true" ] && [ -z "${{ inputs.tag }}" ]; then
            echo "::error::tag input is required when dry_run is false"
            exit 1
          fi

      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve sha + version
        id: r
        run: |
          if [ -n "${{ inputs.commit_hash }}" ]; then
            SHA=$(git rev-parse "${{ inputs.commit_hash }}^{commit}")
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dryrun-$(echo "${SHA}" | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: build-${{ matrix.target }}
    needs: [resolve]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            os_label: linux-amd64

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
            os_label: linux-arm64

          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
            os_label: macos-amd64

          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            os_label: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux ARM only)
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build (native)
        if: "!matrix.cross"
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Build (cross — arm64 Linux)
        if: matrix.cross
        run: |
          cross build --release --target ${{ matrix.target }} \
            --package rust-payment-client \
            --bin rmpc

      - name: Strip binary (Linux native)
        if: runner.os == 'Linux' && !matrix.cross
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (Linux aarch64 cross)
        if: runner.os == 'Linux' && matrix.cross && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-aarch64-linux-gnu
          aarch64-linux-gnu-strip target/${{ matrix.target }}/release/rmpc

      - name: Strip binary (macOS)
        if: runner.os == 'macOS'
        run: strip target/${{ matrix.target }}/release/rmpc

      - name: Smoke-test binary and assert it reports the released version
        # Issue #1191: the binary takes its version from CARGO_PKG_VERSION, i.e.
        # clients/rust-payment-client/Cargo.toml — nothing here injects the tag.
        # For years that manifest sat at 0.1.0, so every published archive was
        # named rmpc-v0.3.x-* while the binary inside reported 0.1.0 and no
        # operator could tell builds apart. Printing --version without checking
        # it is what let that ship, so compare it to the tag we are releasing.
        # Skipped on dry runs, whose synthetic "dryrun-<sha>" version has no
        # manifest counterpart.
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          set -euo pipefail
          BIN=./target/${{ matrix.target }}/release/rmpc
          REPORTED="$("$BIN" --version)"
          echo "binary reports: ${REPORTED}"

          VERSION="${{ needs.resolve.outputs.version }}"
          case "${VERSION}" in
            dryrun-*)
              echo "dry run (${VERSION}) — skipping tag/version equality check"
              exit 0
              ;;
          esac

          EXPECTED="rmpc ${VERSION#v}"
          if [ "${REPORTED}" != "${EXPECTED}" ]; then
            echo "::error::Version mismatch. Releasing tag '${VERSION}' but the binary reports '${REPORTED}' (expected '${EXPECTED}'). Bump 'version' in clients/rust-payment-client/Cargo.toml to ${VERSION#v} and re-run; see issue #1191."
            exit 1
          fi
          echo "OK: binary version matches tag ${VERSION}"

      - name: Package tar.gz
        # sha256sum is GNU coreutils and does NOT exist on the macos-latest half
        # of this matrix; macOS ships `shasum` instead. A bare `sha256sum` here
        # exits 127 under the default `bash -e` shell, failing both macOS builds
        # and skipping `publish` (which `needs: build`) — so a tag would publish
        # nothing at all, not even the Linux archives. Same dispatch as
        # scripts/release/install-rmpc.sh; both emit `<64-hex>  <name>`, which
        # `sha256sum -c` and `shasum -a 256 -c` both consume.
        # This step is extracted and executed with sha256sum removed from PATH by
        # scripts/release/install-rmpc-selftest.sh on every PR.
        run: |
          ARCHIVE="rmpc-${{ needs.resolve.outputs.version }}-${{ matrix.os_label }}.tar.gz"
          tar -czf "${ARCHIVE}" -C target/${{ matrix.target }}/release rmpc
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            echo "::error::neither sha256sum nor shasum is available on this runner — refusing to publish an unverifiable archive"
            exit 1
          fi
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "CHECKSUM=${ARCHIVE}.sha256" >> "$GITHUB_ENV"

      - name: Upload archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.CHECKSUM }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: tag-and-publish
    needs: [resolve, build]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded archives
        run: ls -la artifacts/

      - name: Assert every archive ships its checksum
        # The two options named below this step are NOT a pairing check.
        # `if-no-files-found: error` fires only when the COMBINED glob set is
        # empty, and `fail_on_unmatched_files: true` only when a PATTERN matches
        # nothing — so one surviving checksum satisfies both while three archives
        # ship with nothing to verify them against. This step is the actual 1:1
        # guarantee, and scripts/release/install-rmpc-selftest.sh extracts and
        # runs it against a paired and an unpaired fixture on every PR.
        #
        # EXPECTED_ARCHIVES tracks the `build` matrix length; the selftest asserts
        # the two numbers stay equal, so adding a target here is caught rather
        # than silently under-counted.
        run: |
          set -euo pipefail
          shopt -s nullglob
          EXPECTED_ARCHIVES=4
          archives=(artifacts/*.tar.gz)
          if [[ ${#archives[@]} -ne $EXPECTED_ARCHIVES ]]; then
            echo "::error::expected $EXPECTED_ARCHIVES release archives (one per build-matrix target), found ${#archives[@]}"
            exit 1
          fi
          for archive in "${archives[@]}"; do
            if [[ ! -f "${archive}.sha256" ]]; then
              echo "::error::${archive} has no ${archive}.sha256 — refusing to publish an archive nobody can verify"
              exit 1
            fi
          done
          echo "all ${#archives[@]} archives ship a matching .sha256"

      - name: Create and push git tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          draft: false
          fail_on_unmatched_files: true
