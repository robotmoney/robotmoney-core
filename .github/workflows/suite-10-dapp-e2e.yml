# Canonical: docs/development/ci-suites.md §10
#
# WHY THIS SUITE EXISTS
# The dApp's primary user-facing flows — connect wallet, render verified state,
# preview authorize/revoke/pause/unpause/grant calldata, surface the history
# pane — are tested end-to-end through a real Chromium against a real
# Geth+Lighthouse devnet with the gateway, vault, and explorer indexer all
# deployed. Type-checking (suite 9) does not prove these flows work.
#
# WHY ONE JOB
# Every spec runs against the same smoke-test full-stack devnet, booted by
# Playwright globalSetup. There is no "fast" local-dev variant — the dapp
# bundle is built bit-identically to a production deployment, with the
# gateway runtime code hash pinned at build time. The principle:
# **no test-only code lands in production**. See docs/development/smoke-test-design.md.
#
# WHY PLAYWRIGHT REPORT IS UPLOADED ON FAILURE
# Screenshots + traces are needed to diagnose flaky browser-side failures.
# Without the report a CI failure is often just a stack trace.

name: dapp-e2e

on:
  # Nightly job (b), core issue 1496: reused by suite-NN-nightly-fresh-snapshot.yml
  # with fresh_snapshot=true so this suite boots the Twin chain from a snapshot
  # taken at the latest Base block instead of the checked-in pin. Steps are not
  # copied: the nightly calls this very workflow.
  workflow_call:
    inputs:
      fresh_snapshot:
        description: "Apply the nightly fresh snapshot overlay before booting a chain."
        type: boolean
        required: false
        default: false
  # HEAVY tier: the dapp-e2e Playwright suite boots a full devnet and is the
  # merge gate for `dev` — it runs on every pull_request targeting dev (no path
  # filter, so the gate always reports for any branch merging to dev) and on
  # push to dev for merged-commit coverage.
  # See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  # suite tag keeps called copies (nightly fresh snapshot, issue 1496) in separate lanes:
  # inside workflow_call github.workflow is the CALLER's name, shared by every suite.
  group: ${{ github.workflow }}-suite10-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: dapp-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: clients/dapp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Apply the nightly fresh Base snapshot (no-op unless called by the nightly)
        uses: ./.github/actions/apply-fresh-snapshot
        with:
          enabled: ${{ inputs.fresh_snapshot == true }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pre-build smoke-test binary
        # Build the binary before the Playwright BOOT_TIMEOUT_MS countdown starts.
        # globalSetup re-runs `cargo run` which reuses the compiled artefacts here.
        run: cargo build -p smoke-test
        working-directory: ${{ github.workspace }}

      # The full-stack devnet publishes contracts through the devops "publish contracts" runbook,
      # so it needs the same devops checkout as suite-14 (secret DEVOPS_READ_TOKEN, owner-provided).
      - name: Check out devops (publish contracts)
        uses: actions/checkout@v4
        with:
          repository: robotmoney/devops
          ref: ${{ vars.DEVOPS_PUBLISH_REF || 'main' }}
          token: ${{ secrets.DEVOPS_READ_TOKEN }}
          path: devops

      - name: Install publish-contracts dependencies
        working-directory: devops/publish-contracts
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright (boots smoke-test full-stack devnet via globalSetup)
        env:
          SMOKE_TEST_LOG_FILE: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test-suite-10.log
          PLAYWRIGHT_HTML_REPORT: ${{ runner.temp }}/robotmoney-playwright/report
          PLAYWRIGHT_OUTPUT_DIR: ${{ runner.temp }}/robotmoney-playwright/test-results
          PUBLISH_CONTRACTS_DIR: ${{ github.workspace }}/devops/publish-contracts
          STAGE_SHEET: ${{ github.workspace }}/devops/deployments/twin-918453/stage-sheet.env
        run: bun run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ runner.temp }}/robotmoney-playwright/report/

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs
          path: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test-suite-10.log*
