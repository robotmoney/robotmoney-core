# Canonical: docs/development/ci-suites.md §5
#
# WHY THIS SUITE EXISTS
# The Rust client (rmpc) contains protocol adapter code that must correctly encode
# calldata for the live RobotMoneyGateway ABI and handle real-world RPC error shapes.
# Unit tests (suite 6) mock the chain; only a fork test proves the ABI encoding,
# address constants, and error handling work against the contract as deployed on
# mainnet. This suite is the line of defence between a refactor breaking a live
# integration and that breakage reaching users.
#
# WHY A PARALLEL MATRIX (issue #607)
# Running all test files with --test-threads=1 against one chain took ~60 min because
# governance tests each wait on a voting period. Splitting into independent matrix slots,
# each on its own runner with its own chain, cuts wall-clock to the heaviest slot.
# fail-fast: false keeps every slot's signal independent.
#
# THE CHAIN IS THE TWIN FORK (core 1498, 1496)
# Every slot starts the Twin chain with .github/actions/twin-fork: anvil --fork-url <upstream>
# --fork-block-number <pin> --chain-id 918453, a pinned lazy fork of real Base state. There is no
# saved .anvil-state fixture, no genesis snapshot and no docker compose chain. ONE pin per workflow
# run: the `pin` job chooses it (upstream head minus 2) and every slot takes it as input. The
# upstream is https://mainnet.base.org unless the optional secret BASE_UPSTREAM_RPC is set.
# - The three twin-* slots run the tests straight on the Twin fork (RMPC_TESTNET_RPC_URL).
# - The goldens and governance slots point RMPC_FORK_RPC_URL at the Twin fork, so each test forks
#   the Twin again at the pin (RMPC_FORK_BLOCK) and may move time and rewind state without
#   touching the shared Twin chain. Governance scenarios advance the EVM clock with
#   evm_increaseTime: no real waiting.
#
# WHY --test-threads=1
# Within a slot, ephemeral accounts are funded through the anvil admin RPCs (fund gas, fund USDC).
# Running tests concurrently on one chain would race on block time and shared state.
# Sequential within a slot, parallel across slots.
#
# WHY forge build RUNS IN EVERY SLOT
# tests/registry.rs reads the VaultRegistry.json artefact. The twin-fork action installs foundry
# and bun first.
#
# GOTCHAS
# - The pinned block must be recent for a non-archive upstream, so the slots start right after the
#   pin job. A rate-limited upstream (HTTP 429) is retried by anvil and the twin-fork tool; the RPC
#   cache is persisted per pin block.

name: fork-protocol-adapter-integration

on:
  # Called by suite-29-nightly-twin-fork.yml, which chooses ONE pin for the whole nightly run and
  # hands it down as pin_block. Steps are not copied: the nightly calls this very workflow.
  workflow_call:
    inputs:
      pin_block:
        description: "Twin chain pin handed down by a parent run. Empty: this run chooses one."
        type: string
        required: false
        default: ""
  # System-correctness: boots isolated Twin forks (20-25 min wall-clock)
  # once a PR is ready for review, and reruns on push to dev for merged-commit
  # coverage. Draft PRs rely on suite-06 (rmpc-unit) for fast feedback.
  # See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  # suite tag keeps called copies (nightly Twin chain run) in separate lanes:
  # inside workflow_call github.workflow is the CALLER's name, shared by every suite.
  group: ${{ github.workflow }}-suite05-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ONE pin per workflow run (core 1498, 1496): the upstream head at the start of the run minus 2,
  # chosen here and handed to every slot below.
  pin:
    name: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    outputs:
      block: ${{ steps.pin.outputs.block }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        uses: ./.github/actions/twin-pin
        with:
          pin-block: ${{ inputs.pin_block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

  fork-integration:
    name: fork-integration-${{ matrix.group }}
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: twin-router
            cargo_tests: --test router
            mode: shared
          - group: twin-withdrawal-registry
            cargo_tests: --test withdrawal --test registry
            mode: shared
          - group: twin-light
            cargo_tests: >-
              --test failure_surface_smoke
              --test rmpc_get_timelock_fork
              --test rmpc_get_vault_fork
              --test rmpc_get_balance_fork
              --test rmpc_get_allowance_fork
              --test rmpc_get_tx_fork
              --test devnet_adapter_round_trip
              --test gas_estimate_reality_check
              --test landing_price_strip_fork
              --test basket_vault_round_trip
            mode: shared
          - group: anvil-goldens
            cargo_tests: >-
              --test abi_address_sanity
              --test dex_route_smoke
              --test vault_deposit_redeem_smoke
            mode: fork
          - group: anvil-governance
            cargo_tests: --test governance
            mode: fork

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # The Twin chain (918453): a pinned lazy fork of real Base state. Installs foundry and bun,
      # restores anvil's RPC cache keyed by the pin block, exports TWIN_RPC_URL and TWIN_PIN_BLOCK.
      - name: Start the Twin chain at the run pin
        id: twin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      # The fixture deploys through the one deploy driver and the rehearsal key helper (publish-contracts/, Bun).
      - name: Install publish-contracts dependencies (the one deploy driver, in this repo)
        uses: ./.github/actions/publish-contracts-setup

      - name: Build Solidity contracts (required by registry fork-e2e)
        run: forge build

      - name: Build test binaries
        working-directory: testing/fork-e2e-rust
        run: cargo test --no-run --release

      # shared: the tests run straight on the Twin fork. fork: each test forks the Twin again at the
      # pin (anvil forking anvil), so it can warp and rewind without touching the shared chain.
      - name: Fork integration tests (${{ matrix.group }})
        working-directory: testing/fork-e2e-rust
        env:
          RMPC_TESTNET_RPC_URL: ${{ matrix.mode == 'shared' && steps.twin.outputs.rpc-url || '' }}
          RMPC_FORK_RPC_URL: ${{ matrix.mode == 'fork' && steps.twin.outputs.rpc-url || '' }}
          RMPC_FORK_BLOCK: ${{ matrix.mode == 'fork' && steps.twin.outputs.pin-block || '' }}
        run: cargo test --release ${{ matrix.cargo_tests }} -- --test-threads=1 --nocapture

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  base-testnet-adapters:
    name: base-testnet-adapters
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    env:
      CI_CLASS: system-correctness
      # Live Base public testnet RPC + faucet-funded EOA key. Absent ⇒ tests skip.
      BASE_TESTNET_RPC_URL: ${{ secrets.BASE_TESTNET_RPC_URL }}
      BASE_TESTNET_FUNDER_KEY: ${{ secrets.BASE_TESTNET_FUNDER_KEY }}
      BASE_TESTNET_FUNDER_ADDR: ${{ secrets.BASE_TESTNET_FUNDER_ADDR }}
      # Robot Money contracts deployed to Base's public testnet (deploy is a prerequisite,
      # out of scope for #839). Absent ⇒ the vault-stack adapter sub-test skips
      # while the live Aave/Uniswap legs still run.
      RM_TESTNET_VAULT_ADDR: ${{ secrets.RM_TESTNET_VAULT_ADDR }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Base testnet account-funding assertion (smoke-test)
        run: cargo test -p smoke-test --release --test base_testnet_fixture -- --nocapture

      # The live third-party service legs (Aave, Uniswap, Curve) run on the Twin fork, which also
      # installs foundry (anvil) and bun. The BASE_TESTNET_* secrets drive the testnet leg.
      - name: Start the Twin chain at the run pin
        id: twin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      # The fixture deploys through the one deploy driver and the rehearsal key helper (publish-contracts/, Bun).
      - name: Install publish-contracts dependencies (the one deploy driver, in this repo)
        uses: ./.github/actions/publish-contracts-setup

      - name: Base testnet multi-network adapter e2e (fork-e2e)
        working-directory: testing/fork-e2e-rust
        env:
          RMPC_TESTNET_RPC_URL: ${{ steps.twin.outputs.rpc-url }}
        run: cargo test --release --test multi_network_adapters -- --test-threads=1 --nocapture

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache
