# Canonical: docs/development/ci-suites.md §5
#
# WHY THIS SUITE EXISTS
# The Rust client (rmpc) contains protocol adapter code that must correctly encode
# calldata for the live RobotMoneyGateway ABI and handle real-world RPC error shapes.
# Unit tests (suite 6) mock the chain; only a fork test proves the ABI encoding,
# address constants, and error handling work against the contract as deployed on
# mainnet. This suite is the line of defence between a refactor breaking a live
# integration and that breakage reaching users.
#
# WHY GETH DEVNET INSTEAD OF ANVIL
# Tests run against the shared Geth+Lighthouse devnet (issue #607). The devnet boots
# from the committed genesis-alloc.json which mirrors the Base mainnet state at the
# pinned fork block. RMPC_TESTNET_RPC_URL is set to http://localhost:8545, which
# triggers testnet mode in ForkFixture: no anvil is spawned, accounts are funded via
# signed transactions from HARNESS_USDC_HOLDER (pre-funded in genesis). This
# eliminates the behavioural gap between the two EVM backends and removes the anvil
# binary from the critical path.
#
# WHY --test-threads=1
# Testnet mode shares the HARNESS_USDC_HOLDER nonce across concurrent tests. Running
# single-threaded avoids nonce collisions. Boot time (~15-30s) is amortised across
# all tests in one sequential run.
#
# WHY FOUNDRY IS STILL INSTALLED
# forge build is required by tests/registry.rs which reads the VaultRegistry compiled
# artefact from out/VaultRegistry.sol/VaultRegistry.json. anvil is NOT invoked.
#
# GOTCHAS
# - The devnet's genesis-alloc.json must stay in sync with CURRENT.json (the fork pin).
#   If the fixture is refreshed (snapshot-fork.sh), re-run smoke-test-genesis-ingester
#   and commit the new genesis-alloc.json.
# - If GETH_RPC_PORT is not set, docker compose maps geth:8545 -> host:8545.
# - cargo test --no-run is a separate step so compile errors are surfaced immediately
#   with clear output, rather than buried in the test runner's timeout output.
# - The registry fork-e2e scenarios (tests/registry.rs) deploy VaultRegistry from the
#   Foundry build artefact (out/VaultRegistry.sol/VaultRegistry.json). The "forge build"
#   step below must run before cargo test so that artefact is present.

name: fork-protocol-adapter-integration

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fork-integration:
    name: fork-integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Build Solidity contracts (required by registry fork-e2e)
        run: forge build

      - name: Boot Geth+Lighthouse devnet
        working-directory: testing/ethereum-testnet/config
        run: |
          BOOT_START=$(date +%s)
          docker compose up -d
          echo "Waiting for Geth RPC to be ready..."
          until curl -sf -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
            http://localhost:8545 2>/dev/null | grep -q '"result"'; do
            sleep 2
          done
          BOOT_END=$(date +%s)
          echo "devnet-boot-seconds=$((BOOT_END - BOOT_START))" >> "$GITHUB_STEP_SUMMARY" || true
          echo "Devnet ready in $((BOOT_END - BOOT_START))s"

      - name: Build test binaries
        working-directory: testing/fork-e2e-rust
        run: cargo test --no-run

      - name: Full fork integration suite (testnet mode)
        working-directory: testing/fork-e2e-rust
        env:
          RMPC_TESTNET_RPC_URL: http://localhost:8545
        run: cargo test --release -- --test-threads=1 --nocapture

      - name: Devnet teardown (always)
        if: always()
        working-directory: testing/ethereum-testnet/config
        run: docker compose down -v --remove-orphans || true
