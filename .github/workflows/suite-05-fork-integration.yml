# Canonical: docs/development/ci-suites.md §5
#
# WHY THIS SUITE EXISTS
# The Rust client (rmpc) contains protocol adapter code that must correctly encode
# calldata for the live RobotMoneyGateway ABI and handle real-world RPC error shapes.
# Unit tests (suite 6) mock the chain; only a fork test proves the ABI encoding,
# address constants, and error handling work against the contract as deployed on
# mainnet. This suite is the line of defence between a refactor breaking a live
# integration and that breakage reaching users.
#
# WHY A PARALLEL MATRIX (issue #607)
# Running all test files with --test-threads=1 against one chain took ~60 min because the
# pre-1698 governance tests each waited on a voting period. Splitting into independent matrix slots,
# each on its own runner with its own chain, cuts wall-clock to the heaviest slot.
# fail-fast: false keeps every slot's signal independent.
#
# THE CHAIN IS THE TWIN FORK (core 1498, 1496)
# Every slot starts the Twin chain with .github/actions/twin-fork: anvil --fork-url <upstream>
# --fork-block-number <pin> --chain-id 918453, a pinned lazy fork of real Base state. There is no
# saved .anvil-state fixture, no genesis snapshot and no docker compose chain. ONE pin per workflow
# run: the `pin` job chooses it (upstream head minus 2) and every slot takes it as input. The
# upstream is https://mainnet.base.org unless the optional secret BASE_UPSTREAM_RPC is set.
# - The three twin-* slots run the tests straight on the Twin fork (RMPC_TESTNET_RPC_URL).
# - The goldens and governance slots point RMPC_FORK_RPC_URL at the Twin fork, so each test forks
#   the Twin again at the pin (RMPC_FORK_BLOCK) and may move time and rewind state without
#   touching the shared Twin chain. The governance scenarios deploy their own receipt-path stack
#   and drive the one-call RouterGovernance.applyReceipt (issue 1698): there is no voting period
#   to wait for.
#
# WHY --test-threads=1
# Within a slot, ephemeral accounts are funded through the anvil admin RPCs (fund gas, fund USDC).
# Running tests concurrently on one chain would race on block time and shared state.
# Sequential within a slot, parallel across slots.
#
# WHY forge build RUNS IN EVERY SLOT
# tests/registry.rs reads the VaultRegistry.json artefact. The twin-fork action installs foundry
# and bun first.
#
# EXECUTED FLOORS (issue 1656, QA plan v1 T5)
# Every wrapped step names its floor, and the floor is the number of tests the step selects, so
# one test fewer is red. .github/scripts/check_executed_floors.py (suite 14) counts the tests each
# step selects and fails when a floor differs: a new test means a new floor in the same PR.
#
# GOTCHAS
# - The pinned block must be recent for a non-archive upstream, so the slots start right after the
#   pin job. A rate-limited upstream (HTTP 429) is retried by anvil and the twin-fork tool; the RPC
#   cache is persisted per pin block.

name: fork-protocol-adapter-integration

on:
  # Called by suite-29-nightly-twin-fork.yml, which chooses ONE pin for the whole nightly run and
  # hands it down as pin_block. Steps are not copied: the nightly calls this very workflow.
  workflow_call:
    inputs:
      pin_block:
        description: "Twin chain pin handed down by a parent run. Empty: this run chooses one."
        type: string
        required: false
        default: ""
  # System-correctness: boots isolated Twin forks (20-25 min wall-clock)
  # once a PR is ready for review, and reruns on push to dev for merged-commit
  # coverage. Draft PRs rely on suite-06 (rmpc-unit) for fast feedback.
  # See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  # suite tag keeps called copies (nightly Twin chain run) in separate lanes:
  # inside workflow_call github.workflow is the CALLER's name, shared by every suite.
  group: ${{ github.workflow }}-suite05-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege (issue #1428): read-only repo contents for every job. A job that
# needs more declares it at job level with the reason.
permissions:
  contents: read

jobs:
  # ONE pin per workflow run (core 1498, 1496): the upstream head at the start of the run minus 2,
  # chosen here and handed to every slot below.
  pin:
    name: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    outputs:
      block: ${{ steps.pin.outputs.block }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        uses: ./.github/actions/twin-pin
        with:
          pin-block: ${{ inputs.pin_block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

  fork-integration:
    name: fork-integration-${{ matrix.group }}
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_CLASS: system-correctness
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # QA plan U3: the sixth test drives the shipping rmpc through a five-leg router deposit and
          # prints the marker only after the gas-floor assertions passed.
          - group: twin-router
            cargo_tests: --test router
            mode: shared
            min_executed: 6
            required_markers: |
              [deposit_router_default_gas_clears_gateway_floor] passed
          - group: twin-withdrawal-registry
            cargo_tests: --test withdrawal --test registry
            mode: shared
            min_executed: 8
          - group: twin-light
            cargo_tests: >-
              --test failure_surface_smoke
              --test rmpc_get_vault_fork
              --test rmpc_get_balance_fork
              --test rmpc_get_allowance_fork
              --test rmpc_get_tx_fork
            mode: shared
            min_executed: 5
          # Issue 1647: rmpc get-timelock on the REAL Safe topology. The smoke-test Fixture runs the one
          # deploy driver on the shared Twin chain (real 2-of-3 Safe, timelock, handover), the Safe
          # schedules a pending operation, and the test reads rmpc's output against on-chain state.
          # Its own group: the topology deploy takes minutes and must not eat twin-light's budget.
          - group: twin-governance-topology
            cargo_tests: --test rmpc_get_timelock_fork
            mode: shared
            min_executed: 1
            required_markers: |
              [get_timelock_integration] all assertions passed
          - group: anvil-goldens
            cargo_tests: >-
              --test abi_address_sanity
              --test dex_route_smoke
              --test vault_deposit_redeem_smoke
            mode: fork
            min_executed: 3
          # Issue 1656: these four binaries use skip_if_no_devnet_fork!, which needs RMPC_FORK_RPC_URL
          # and anvil. Under mode shared that variable is empty, so they silently skipped (and counted
          # as passed) in twin-light. mode fork sets it, so they now run, and the macro panics under CI
          # if the fork is ever absent.
          # Issue 1683 (QA plan T3): the deposit gas ceiling was 920,000 (measured 833,900 plus about
          # 10%) and is 1,060,000 since the QA merge measured 964,197 (see the test). The test prints the marker below only after the deposit assertion passed; the
          # wrapper matches it as a line prefix, so the line's gasUsed and budget values may vary.
          - group: anvil-devnet-adapters
            cargo_tests: >-
              --test devnet_adapter_round_trip
              --test gas_estimate_reality_check
              --test landing_price_strip_fork
              --test basket_vault_round_trip
            mode: fork
            min_executed: 5
            required_markers: |
              [gas_estimate_reality_check] deposit gasUsed=
          - group: anvil-governance
            cargo_tests: --test governance
            mode: fork
            min_executed: 5

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # The Twin chain (918453): a pinned lazy fork of real Base state. Installs foundry and bun,
      # restores anvil's RPC cache keyed by the pin block, exports TWIN_RPC_URL and TWIN_PIN_BLOCK.
      - name: Start the Twin chain at the run pin
        id: twin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      # The fixture deploys through the one deploy driver and the rehearsal key helper (publish-contracts/, Bun).
      - name: Install publish-contracts dependencies (the one deploy driver, in this repo)
        uses: ./.github/actions/publish-contracts-setup

      - name: Build Solidity contracts (required by registry fork-e2e)
        run: forge build

      - name: Build test binaries
        working-directory: testing/fork-e2e-rust
        run: cargo test --no-run --release

      # shared: the tests run straight on the Twin fork. fork: each test forks the Twin again at the
      # pin (anvil forking anvil), so it can warp and rewind without touching the shared chain.
      - name: Fork integration tests (${{ matrix.group }})
        working-directory: testing/fork-e2e-rust
        env:
          RMPC_TESTNET_RPC_URL: ${{ matrix.mode == 'shared' && steps.twin.outputs.rpc-url || '' }}
          RMPC_FORK_RPC_URL: ${{ matrix.mode == 'fork' && steps.twin.outputs.rpc-url || '' }}
          RMPC_FORK_BLOCK: ${{ matrix.mode == 'fork' && steps.twin.outputs.pin-block || '' }}
          # Issue 1647: a group that executes zero tests is red, and a group that names markers needs
          # each printed on a real assertion's success path (cargo_test_require_executed.sh).
          REQUIRE_EXECUTED_MARKERS: ${{ matrix.required_markers }}
          # Issue 1656: the floor is the executed count in a green run, so one test fewer is red.
          CARGO_TEST_MIN_EXECUTED: ${{ matrix.min_executed }}
        run: >-
          bash ../../.github/scripts/cargo_test_require_executed.sh
          --release ${{ matrix.cargo_tests }} -- --test-threads=1 --nocapture

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  base-testnet-adapters:
    name: base-testnet-adapters
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    env:
      CI_CLASS: system-correctness
      # Live Base public testnet RPC + faucet-funded EOA key. Absent: the steps that need them do
      # not run (a skipped step, visible in the run), and the tests refuse to skip under CI.
      BASE_TESTNET_RPC_URL: ${{ secrets.BASE_TESTNET_RPC_URL }}
      BASE_TESTNET_FUNDER_KEY: ${{ secrets.BASE_TESTNET_FUNDER_KEY }}
      BASE_TESTNET_FUNDER_ADDR: ${{ secrets.BASE_TESTNET_FUNDER_ADDR }}
      # Robot Money contracts deployed to Base's public testnet (deploy is a prerequisite,
      # out of scope for #839). Only the separate vault_stack_base_testnet test reads it, and
      # every step below leaves that test out by name (QA plan v1 T5).
      RM_TESTNET_VAULT_ADDR: ${{ secrets.RM_TESTNET_VAULT_ADDR }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # The crate's #[cfg(test)] unit tests (src/**) are hermetic (no chain) and were never run by
      # the per-binary `--test` invocations (issue #1471). Floor 26: every lib test, the three
      # network skip gate tests of QA plan v1 T5 included.
      - name: fork-e2e-rust lib unit tests (cargo test --lib)
        run: |
          CARGO_TEST_MIN_EXECUTED=28 bash .github/scripts/cargo_test_require_executed.sh \
            --manifest-path testing/fork-e2e-rust/Cargo.toml --release --lib -- --nocapture

      # Issue 1643: skip_if_no_fork! must be RED in CI when no fork is available, never a quiet pass.
      # Runs one fork test with CI=true and both fork URLs unset and requires a non-zero exit that
      # names the refusal. If the macro ever goes back to returning early, this step goes red.
      - name: fork-e2e-rust refuses to skip without a fork when CI is set (issue 1643)
        run: |
          # bare-cargo-test-allowed: this step expects cargo test to FAIL (the skip refusal).
          set +e
          out="$(env -u RMPC_TESTNET_RPC_URL -u RMPC_FORK_RPC_URL CI=true \
            cargo test --manifest-path testing/fork-e2e-rust/Cargo.toml --release \
            --test rmpc_get_balance_fork 2>&1)"
          status=$?
          set -e
          echo "$out" | tail -25
          [ "$status" -ne 0 ] || { echo "ERROR: fork test exited 0 with CI=true and no fork URL" >&2; exit 1; }
          echo "$out" | grep -q "Refusing to skip" || { echo "ERROR: failure was not the skip refusal" >&2; exit 1; }

      # Issue 1656: the funding assertion skips locally when the testnet secrets are absent and
      # panics under CI. The secrets are not provisioned on every ref, so the live assertion has its
      # own step that runs only when both are present, and the hermetic tests of the binary run
      # always under the executed-test guard. The refusal step proves the panic with CI=true.
      - name: Base testnet fixture hermetic tests (smoke-test)
        run: |
          CARGO_TEST_MIN_EXECUTED=12 bash .github/scripts/cargo_test_require_executed.sh \
            -p smoke-test --release --test base_testnet_fixture \
            -- --nocapture --skip base_testnet_account_funding_assertion

      - name: Base testnet account-funding assertion (smoke-test, needs the testnet secrets)
        if: ${{ env.BASE_TESTNET_RPC_URL != '' && env.BASE_TESTNET_FUNDER_ADDR != '' }}
        run: |
          CARGO_TEST_MIN_EXECUTED=1 bash .github/scripts/cargo_test_require_executed.sh \
            -p smoke-test --release --test base_testnet_fixture \
            -- --nocapture base_testnet_account_funding_assertion

      - name: Funding assertion refuses to skip without testnet env when CI is set (issue 1656)
        run: |
          # bare-cargo-test-allowed: this step expects cargo test to FAIL (the skip refusal).
          set +e
          out="$(env -u BASE_TESTNET_RPC_URL -u BASE_TESTNET_FUNDER_ADDR CI=true \
            cargo test -p smoke-test --release --test base_testnet_fixture \
            base_testnet_account_funding_assertion 2>&1)"
          status=$?
          set -e
          echo "$out" | tail -25
          [ "$status" -ne 0 ] || { echo "ERROR: funding test exited 0 with CI=true and no testnet env" >&2; exit 1; }
          echo "$out" | grep -q "Refusing to skip" || { echo "ERROR: failure was not the skip refusal" >&2; exit 1; }

      # The live third-party service legs (Aave, Uniswap, Curve) run on the Twin fork, which also
      # installs foundry (anvil) and bun. The BASE_TESTNET_* secrets drive the testnet leg.
      - name: Start the Twin chain at the run pin
        id: twin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      # The fixture deploys through the one deploy driver and the rehearsal key helper (publish-contracts/, Bun).
      - name: Install publish-contracts dependencies (the one deploy driver, in this repo)
        uses: ./.github/actions/publish-contracts-setup

      # QA plan v1 T5: parameterized_e2e! makes one test per network. This step runs the devnet leg
      # on the Twin fork and leaves the Base testnet leg out by name. Before T5 both legs were one
      # test, and the devnet leg met the floor of 1 while the testnet leg skipped on every run. The
      # markers are printed only after each adapter's assertions passed on the devnet leg.
      - name: Multi-network adapter e2e, devnet leg on the Twin fork (fork-e2e)
        working-directory: testing/fork-e2e-rust
        env:
          RMPC_TESTNET_RPC_URL: ${{ steps.twin.outputs.rpc-url }}
          REQUIRE_EXECUTED_MARKERS: |
            [multi_network_adapters] Uniswap on Robot Money Devnet: OK
            [multi_network_adapters] Aave on Robot Money Devnet: OK
            [multi_network_adapters] Compound/Morpho/Curve via vault on Robot Money Devnet: OK
        run: |
          CARGO_TEST_MIN_EXECUTED=1 bash ../../.github/scripts/cargo_test_require_executed.sh \
            --release --test multi_network_adapters -- --test-threads=1 --nocapture --skip base_testnet

      # The Base testnet leg talks to Base's public testnet, so it needs the RPC and a funded key.
      # Like the funding assertion above, it runs only when both secrets are set, and the leg
      # panics under CI when either is missing. The leg runs Uniswap and Aave and skips nothing.
      # The vault-stack part is its own test, vault_stack_base_testnet, which this step leaves out
      # by name: no Robot Money deploy exists on Base's public testnet (RM_TESTNET_VAULT_ADDR,
      # #839), and that test panics under CI without one (QA plan v1 T5). Drop the --skip when the
      # deploy exists.
      - name: Multi-network adapter e2e, Base testnet leg (needs the testnet secrets)
        if: ${{ env.BASE_TESTNET_RPC_URL != '' && env.BASE_TESTNET_FUNDER_KEY != '' }}
        working-directory: testing/fork-e2e-rust
        env:
          REQUIRE_EXECUTED_MARKERS: |
            [multi_network_adapters] Uniswap on Base testnet: OK
            [multi_network_adapters] Aave on Base testnet: OK
        run: |
          CARGO_TEST_MIN_EXECUTED=1 bash ../../.github/scripts/cargo_test_require_executed.sh \
            --release --test multi_network_adapters -- --test-threads=1 --nocapture base_testnet \
            --skip vault_stack_base_testnet

      # A ref without the testnet secrets does not run the leg above. Say so in the run summary
      # instead of letting a skipped step pass unnoticed.
      - name: Report the Base testnet leg as not run (no testnet secrets on this ref)
        if: ${{ env.BASE_TESTNET_RPC_URL == '' || env.BASE_TESTNET_FUNDER_KEY == '' }}
        run: |
          echo "::warning title=Base testnet leg not run::BASE_TESTNET_RPC_URL or BASE_TESTNET_FUNDER_KEY is not set on this ref, so adapters_against_live_services::base_testnet did not run. Only the devnet leg was tested."

      # QA plan v1 T5: the Base testnet leg must be RED in CI without its env, never a quiet pass.
      # Runs the leg with CI=true and the testnet env unset and requires a non-zero exit that names
      # the refusal. If the leg ever goes back to skipping, this step goes red.
      - name: Base testnet leg refuses to skip without testnet env when CI is set (QA plan v1 T5)
        working-directory: testing/fork-e2e-rust
        run: |
          # bare-cargo-test-allowed: this step expects cargo test to FAIL (the skip refusal).
          set +e
          out="$(env -u BASE_TESTNET_RPC_URL -u BASE_TESTNET_FUNDER_KEY CI=true \
            cargo test --release --test multi_network_adapters base_testnet \
            -- --skip vault_stack_base_testnet 2>&1)"
          status=$?
          set -e
          echo "$out" | tail -25
          [ "$status" -ne 0 ] || { echo "ERROR: the Base testnet leg exited 0 with CI=true and no testnet env" >&2; exit 1; }
          echo "$out" | grep -q "Refusing to skip" || { echo "ERROR: failure was not the skip refusal" >&2; exit 1; }

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache
