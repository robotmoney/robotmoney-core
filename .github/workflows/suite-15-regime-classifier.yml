# Canonical: plugins/robotmoney-analyst/skills/robotmoney-analyst/SKILL.md
#
# WHY THIS SUITE EXISTS
# The robotmoney-analyst plugin is a read-only Claude skill that fetches
# https://www.robotmoney.net/data/regime-snapshot.json and surfaces regime
# context for deposit decisions. The plugin has no contract or Rust dependencies
# but must be tested against offline fixtures to guarantee: (a) the plugin.json
# is valid and correctly named, (b) the helper surfaces the expected snapshot
# fields from a valid offline fixture, (c) the fetch helper validates required
# fields and exits non-zero with a named error on missing fields, and (d) the
# cache layer works correctly (second call on the same UTC date reads from
# cache, not the network). The helper is also shellchecked (see below).
#
# WHY THERE IS NO RESTRICTED-PATH CHECK HERE (issue #1251)
# This suite used to claim a further guarantee: that no restricted paths
# (contracts/, crates/, clients/rust-payment-client/, services/) were touched.
# That assertion never executed — the checkout below is shallow, so its
# merge-base/HEAD~1 diff always failed into an empty pipeline and reported PASS
# unconditionally (same defect as #1232; the swarm copy was fixed in #1234).
# It was also unscoped: it fired on any restricted path in the change set,
# whether or not the analyst plugin was involved, so a working version would
# have vetoed most PRs in this repo. Its one historical trigger (e6fbfc41,
# adding rmpc propose/vote and documenting them in the analyst SKILL.md) was a
# false positive. It was removed rather than repaired. Do not re-add it here.
# The analogous rule for the swarm plugin, deliberately scoped to "the plugin
# AND a restricted path in the same change set", lives in suite-17.
#
# WHY OFFLINE FIXTURES ONLY
# CI does not have reliable network access to robotmoney.net, and the snapshot
# URL can change without notice during early development. Testing against fixtures
# gives deterministic output regardless of network state. The fetch helper supports
# --offline for exactly this purpose.
#
# WHY shellcheck IS INCLUDED
# The fetch helper is a bash script with set -euo pipefail. Shell bugs (unquoted
# variables, missing error handling, path injection) can silently pass all output
# tests but still misbehave at runtime. shellcheck catches these statically.
#
# THERE IS NO paths: FILTER HERE (corrected in #1251)
# This header used to claim a paths: filter restricted the suite to the plugin
# tree. No such filter exists. The trigger below is a bare `pull_request:`, so
# this suite runs on EVERY pull request in the repo, including ones that touch
# nothing under plugins/robotmoney-analyst/.
# The reasoning for wanting a filter still holds: this suite only verifies
# robotmoney-analyst plugin artifacts and the helper script, it checks no
# cross-cutting repo invariant, and a filter would keep it off unrelated
# changes. But nothing on record says whether the missing filter is an
# oversight or a deliberate choice, so do not read this comment as a
# justification for the current trigger. #1251 corrected the comment only and
# deliberately left the trigger alone — narrowing it is a behaviour change that
# needs its own decision.

name: robotmoney-analyst-plugin-checks

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  robotmoney-analyst:
    name: robotmoney-analyst
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (jq, shellcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck

      - name: Run robotmoney-analyst tests
        run: bash plugins/robotmoney-analyst/test/run-tests.sh
