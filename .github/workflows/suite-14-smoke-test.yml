# Canonical: docs/development/ci-suites.md §14
#
# WHY THIS SUITE EXISTS
# This suite is the CI contract for `make testnet`: the cli_meta matrix entry boots
# `cargo run -p smoke-test -- --full-stack` — the exact path `make testnet` runs — so a
# devnet boot regression (e.g. a deploy script drifting from a contract invariant, like
# the RouterGovernance ExecutionDelayBelowMinimum revert) is caught in CI on push to
# main/dev/dev-phase-* and in the nightly full-suite run (suite-21), not only when a
# human next runs `make testnet` locally.
#
# The smoke-test crate is the shared devnet fixture used by suites 7, 8, 10, 11, and 12.
# If Fixture::new() is broken — because the Twin fork tool changed, the publish run regressed, or a
# port mapping shifted — every one of those suites will fail at boot time with a confusing
# "connection refused" error, not a "fixture broken" error. Validating the fixture in isolation, on
# every change to the devnet config, means a broken fixture is caught and diagnosed here, rather
# than discovered as mysterious failures across five other suites.
#
# THE CHAIN IS THE TWIN FORK (core 1498, 1496)
# Every chain job starts the Twin chain (id 918453) with .github/actions/twin-fork: anvil
# --fork-url <upstream> --fork-block-number <pin> --chain-id 918453, a pinned lazy fork of real
# Base state. There is no geth, no lighthouse, no genesis alloc and no saved state. ONE pin per
# workflow run: the `pin` job chooses it (upstream head minus 2) and every chain job takes it as
# input. The Rust harness reuses the running fork through TWIN_RPC_URL, funds keys with fund-gas
# and fund-usdc, and warps time (evm_increaseTime) instead of waiting.
#
# WHY --test-threads=1
# Each test binary shares one Fixture in a OnceLock and one Twin fork. Parallel tests would race
# on nonces and block time. Matrix rows run on separate runners, each with its own fork.
#
# WHY cargo build RUNS BEFORE cargo test
# The smoke-test crate includes a CLI binary (`cargo run smoke-test`). Building it
# explicitly before the test run ensures that both the library and the binary compile
# cleanly. Without this step, a binary-only compile error would be hidden by cargo test
# (which does not build binaries by default).
#
# WHY THE CLI META TEST RUNS SEPARATELY
# The `cli_meta` integration test boots `cargo run -p smoke-test -- --full-stack`
# and checks the harness contract around endpoint summary output, `--dapp-port`,
# and Ctrl-C teardown. Keeping it as its own cargo invocation makes failures easier
# to interpret than mixing it into the shared fixture suite.
#
# WHY THE SAFETY-NET TEARDOWN USES || true
# The teardown runs with if: always(), including when the job is cancelled by GitHub Actions
# (e.g. timeout). It removes dapp containers by label. The || true prevents the teardown step
# from overwriting the real failure exit code with a docker error exit code in the job summary.
# The Twin fork needs no teardown: it dies with the runner.
#
# GOTCHAS
# - The Cargo cache path is testing/smoke-test/target, not the workspace root target.
#   This crate is not part of the main workspace Cargo.toml (by design — it has its own
#   version pin for devnet tooling). If you add it to the workspace, move the cache path
#   to target/ and add smoke-test/Cargo.toml to all other cache keys.
# - A rate-limited upstream (HTTP 429) is retried by anvil and the twin-fork tool. If a job still
#   fails to start the fork, set the optional secret BASE_UPSTREAM_RPC to a paid provider.

name: smoke-test-devnet-boot-teardown

on:
  # Called by suite-29-nightly-twin-fork.yml, which chooses ONE pin for the whole nightly run and
  # hands it down as pin_block. Steps are not copied: the nightly calls this very workflow.
  workflow_call:
    inputs:
      pin_block:
        description: "Twin chain pin handed down by a parent run. Empty: this run chooses one."
        type: string
        required: false
        default: ""
      production_fixtures_dir:
        description: "Optional: a directory with production fixtures (verifier-labels.txt, production-sheet.env), relative to the workspace, for a caller that has them. Empty: the parity step uses the label and sheet fixtures committed in publish-contracts/tests/fixtures."
        type: string
        required: false
        default: ""
  # HEAVY tier: this devnet boot/teardown suite is a merge gate for `dev` — it
  # runs on every pull_request targeting dev (no path filter, so the gate always
  # reports for any branch merging to dev) and on push to dev for merged-commit
  # coverage. See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      production_fixtures_dir:
        description: "Optional: a directory with production fixtures (verifier-labels.txt, production-sheet.env), relative to the workspace, for a caller that has them. Empty: the parity step uses the label and sheet fixtures committed in publish-contracts/tests/fixtures."
        type: string
        required: false
        default: ""

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  # suite tag keeps called copies (nightly Twin chain run) in separate lanes:
  # inside workflow_call github.workflow is the CALLER's name, shared by every suite.
  group: ${{ github.workflow }}-suite14-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Hermetic guards that need the binary/lib but NO chain and NO Docker. Kept as their own fast
  # job so a manifest/alignment regression fails in seconds, before paying for any
  # chain boot in the devnet matrix below.
  guards:
    name: smoke-test-guards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # feature-correctness (not system-correctness): this job runs on every
    # PR including drafts (no draft-exclusion `if:`), matching
    # feature-correctness's pr_draft:run/pr_r4r:run shape. See the `devnet`
    # job below for why the heavier integration job below is classed the
    # same way despite being system-correctness by content.
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The harness unit tests call `cast` and bun helpers, so both are installed even though this
      # job never boots a chain.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: cargo build (includes CLI binary)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test

      # A crate's tests/ binaries are compiled by NOTHING in `cargo test --lib`
      # (issue #1295). `--all-targets` type-checks them here, in the job named
      # after the crate, so a struct literal that went short of a newly-required
      # field fails in THIS job rather than only in the workspace-wide rust-lint
      # nine minutes later. Enforced by
      # .github/scripts/check_rust_test_target_compile_coverage.py.
      - name: cargo clippy -p smoke-test --all-targets (compiles tests/ binaries)
        run: cargo clippy -p smoke-test --all-targets -- -D warnings

      # Core 1488: the Twin chain publish run has a unit-test floor. cargo test
      # -p smoke-test --lib must execute a non-zero number of tests, and at
      # least SMOKE_TEST_LIB_TEST_FLOOR of them, so the deletions cannot
      # silently empty the crate.
      # Floor calibrated to the real count after the fork_manifest and genesis
      # machinery was retired (52 lib tests at the final tree; the earlier 60 was
      # never reachable). Raise it when tests are added.
      - name: smoke-test lib test count floor
        working-directory: testing/smoke-test
        env:
          SMOKE_TEST_LIB_TEST_FLOOR: "52"
        run: |
          set -o pipefail
          cargo test -p smoke-test --lib 2>&1 | tee "$RUNNER_TEMP/smoke-lib.log"
          n="$(grep -E '^test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/smoke-lib.log" | sed -E 's/^test result: ok\. ([0-9]+) passed.*/\1/' | awk '{s+=$1} END {print s+0}')"
          echo "smoke-test lib tests executed: ${n:-0} (floor $SMOKE_TEST_LIB_TEST_FLOOR)"
          if [ -z "$n" ] || [ "$n" -lt "$SMOKE_TEST_LIB_TEST_FLOOR" ]; then
            echo "::error::cargo test -p smoke-test ran ${n:-0} tests, floor is $SMOKE_TEST_LIB_TEST_FLOOR"
            exit 1
          fi

      # Hermetic unit tests for the boot harness internals: the zombie-reaper
      # stale-vs-current classification (run-id labels), the Twin fork arguments and the nonce
      # tracker. No chain and no Docker required, so a regression is caught here in seconds rather
      # than as a mysterious failure in the devnet matrix below.
      - name: harness unit tests (reaper, Twin fork args, nonce tracker, hermetic)
        working-directory: testing/smoke-test
        run: "cargo test -p smoke-test --lib tests:: -- --nocapture"

  # ONE pin per workflow run (core 1498, 1496): upstream head minus 2, chosen once. Every chain job
  # below takes it as input.
  pin:
    name: twin-pin
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: feature-correctness
    outputs:
      block: ${{ steps.pin.outputs.block }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        uses: ./.github/actions/twin-pin
        with:
          pin-block: ${{ inputs.pin_block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

  # PARALLEL TWIN MATRIX (issue #600): one runner per devnet-booting binary, each with its OWN
  # Twin fork at the run pin (no shared port or chain). fail-fast: false keeps every binary's
  # signal independent.
  #   - cli_meta:            boots `smoke-test --full-stack`, asserts summary + Ctrl-C teardown
  #   - fixture_meta:        deploys contracts, asserts RPC + the four-vault manifests
  #   (demo_seeding, full_stack_demo_tvl, faucet_eth and faucet_rm were deleted in core 1488 with demo seeding
  #   and the dapp faucet funding: the one deployment scheme has no demo-only code.)
  #   - fund_usdc:           the Fixture wrappers of the Twin environment steps: fund USDC (a grant on the real
  #                          FiatToken slot), fund gas, warp
  #   - twin_fork_env:       the same three steps straight through TwinFork on the real Base USDC, no publish run
  #   - twin_publish:        its own job below (not a matrix row): path-gated on pull_request
  #   - governance:          the deployer holds no voting power or admin; the timelock is admin (core 1488)
  #
  # The 70-minute budget covers the dapp image builds of cli_meta (the indexer compiles with cargo
  # --release, issue #880) plus the publish run. The Twin fork itself is ready in about a minute
  # once the upstream answers.
  devnet:
    name: smoke-test-devnet-${{ matrix.binary }}
    needs: pin
    runs-on: ubuntu-latest
    # 70 min (was 45): full_stack_demo_tvl boots the entire compose stack and,
    # since the rust-services images are built from source, recompiles the
    # indexer (cargo --release) before the 90s indexer-settle wait — on slower
    # GitHub-hosted runners this tipped the heaviest binary past the 45-min cap
    # and it was cancelled at exactly 45m (issue #880). 70 min gives headroom for
    # the build + boot + settle without masking a genuinely hung boot. Issue
    # #1354 split that one image into two (indexer, explorer-api) but did NOT
    # add a second compile: both are targets of one multi-stage build sharing a
    # single `builder` stage, so the cargo --release cost this budget covers is
    # still paid once. The four
    # rows added by issue #1311 (faucet_eth, faucet_rm, fund_usdc, governance) are
    # all lighter than fixture_meta, so the existing 70-min ceiling already covers
    # them with headroom.
    timeout-minutes: 70
    # feature-correctness, not system-correctness, despite this being a full
    # devnet integration matrix: this job has no draft-exclusion `if:` and
    # runs on every PR to dev including drafts (pre-existing, by design --
    # see "WHY THIS SUITE EXISTS" above: a broken Fixture::new() must be
    # caught here before suites 7/8/10/11/12 pay their own boot cost).
    # system-correctness mandates skip-on-draft, which would misdescribe
    # this job's actual (intentional) trigger shape -- declaring it here
    # would make `ci lint` flag a must-not-run-pr_draft error against
    # behavior nobody wants changed. feature-correctness is the class whose
    # cells actually match what this job does today.
    env:
      CI_CLASS: feature-correctness
    strategy:
      fail-fast: false
      matrix:
        binary:
          [
            cli_meta,
            fixture_meta,
            fund_usdc,
            governance,
            twin_fork_env,
          ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # The harness calls the one runbook, "publish contracts" (publish-contracts/ in this repo, Bun TypeScript).
      # The Twin chain arguments are the only difference from a mainnet run.
      - name: Install publish-contracts dependencies (the one deploy driver, in this repo)
        uses: ./.github/actions/publish-contracts-setup

      # cli_meta boots the dapp compose stack, so Docker must be available.
      - name: Verify Docker is available
        run: |
          docker version
          docker compose version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      # The Twin chain: installs foundry (anvil, forge, cast) and bun, restores anvil's RPC cache
      # keyed by the pin block, starts the fork and exports TWIN_RPC_URL for the harness to reuse.
      # It listens on every interface and mines a block per second: the explorer-indexer container
      # (cli_meta) reaches it over the Docker bridge and its safe head is tip minus 5.
      - name: Start the Twin chain at the run pin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}
          host: "0.0.0.0"
          block-time: "1"

      - name: cargo build (includes CLI binary)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test

      # The four-vault real-TVL gate (issue #592) IS the `demo_seeding` matrix
      # binary: `cargo test --release --test demo_seeding` asserts the
      # VaultRegistry lists exactly four Active vaults (PRD §11.1–§11.4), the
      # router weights cover all four router-eligible vaults summing to 10000
      # bps with the 8500/500/500/500 split (the deSPXA RWA vault is
      # router-eligible at 500 bps — ADR-0006 §1 amended 2026-06-05 / issue
      # #621), and that **all four** vaults report non-zero on-chain
      # totalAssets after seeding. It therefore runs exactly once across this
      # matrix — on the `demo_seeding` binary — and is NOT re-appended as an
      # unconditional final step on every binary (issue #915): that previously
      # booted a second devnet + reseed on cli_meta/fixture_meta/full_stack_demo_tvl
      # (~25 min each on full_stack_demo_tvl) with zero net coverage, since the
      # assertions already run as the demo_seeding binary. Runs single-threaded
      # for the same fixed-port reason as fixture_meta.
      #
      # Routed through cargo_test_require_executed.sh (issue #1311 AC) so a run
      # that collects zero tests (e.g. a --test filter that silently matched
      # nothing) fails loudly instead of reporting a false green — the same
      # guard suites 4/6/7/8/20 already use.
      - name: cargo test (${{ matrix.binary }} — boots + tears down its own devnet)
        working-directory: testing/smoke-test
        env:
          SMOKE_TEST_LOG_FILE: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test-${{ matrix.binary }}.log
          # Core 1488: a Twin chain matrix binary that executes zero tests is a silent skip. Every
          # binary in this matrix holds at least one test, so the floor is one (non-zero count).
          CARGO_TEST_MIN_EXECUTED: "1"
          SMOKE_TEST_VERIFY_OUT: ${{ runner.temp }}/stage-verify-labels.txt
          SMOKE_TEST_SHEET_OUT: ${{ runner.temp }}/stage-run-sheet.env
        run: >-
          bash ../../.github/scripts/cargo_test_require_executed.sh
          -p smoke-test --release --test ${{ matrix.binary }} -- --test-threads=1 --nocapture

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-${{ matrix.binary }}
          path: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test*.log*

      # Dapp containers carry the run-identity labels; remove any a cancelled run left behind.
      # The Twin fork needs no teardown: it dies with the runner.
      - name: Safety-net teardown (always)
        if: always()
        run: docker ps -aq --filter "label=com.robotmoney.testnet" | xargs -r docker rm -f || true

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache

  # Which paths changed. twin_publish runs on a pull_request only when a path that affects the deploy
  # changed. push, workflow_dispatch and workflow_call (the nightly) always run it. The diff is read
  # from git: no third-party action, no token.
  changes:
    name: smoke-test-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CI_CLASS: feature-correctness
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD | grep -Eq '^(contracts/script/|scripts/deploy/|scripts/stage/|publish-contracts/|deployments/twin-918453/|config/|testing/smoke-test/|\.github/workflows/suite-14-smoke-test\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # THE TWIN CHAIN PUBLISH JOB (core 1488, 1486, 1485). Starts the Twin chain (918453), a pinned lazy
  # fork of real Base state, runs publish contracts (bun publish-contracts/src/cli.ts, the one deploy driver)
  # through the harness test twin_publish: all four vaults, the real Safe, the timelock handover, the
  # one verifier (its labels include the router, basket and timelock role proofs) and the govern matrix.
  # While the chain is up the same test runs scripts/stage/twin-run-report.ts. This job needs no Docker and runs only in CI.
  twin_publish:
    name: smoke-test-twin-publish
    needs: [changes, pin]
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI_CLASS: feature-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install publish-contracts dependencies (the one deploy driver, in this repo)
        uses: ./.github/actions/publish-contracts-setup

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Start the Twin chain at the run pin
        uses: ./.github/actions/twin-fork
        with:
          pin-block: ${{ needs.pin.outputs.block }}
          upstream-secret: ${{ secrets.BASE_UPSTREAM_RPC }}

      - name: cargo build (includes CLI binary)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test

      # Non-zero test count floor (core 1488): cargo_test_require_executed.sh fails a run that executes
      # fewer than CARGO_TEST_MIN_EXECUTED tests, so a filter that matches nothing is a failure, not a green.
      - name: Twin chain publish, verify and govern matrix
        working-directory: testing/smoke-test
        env:
          SMOKE_TEST_LOG_FILE: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test-twin_publish.log
          CARGO_TEST_MIN_EXECUTED: "1"
          SMOKE_TEST_VERIFY_OUT: ${{ runner.temp }}/stage-verify-labels.txt
          SMOKE_TEST_SHEET_OUT: ${{ runner.temp }}/stage-run-sheet.env
          SMOKE_TEST_PROOF_DIR: ${{ runner.temp }}/twin-proofs
        run: >-
          bash ../../.github/scripts/cargo_test_require_executed.sh
          -p smoke-test --release --test twin_publish -- --test-threads=1 --nocapture

      # Core 1488: the REAL stage outputs go through label-diff and sheet-diff. The Twin chain test
      # (twin_publish.rs) writes the verifier label file (SMOKE_TEST_VERIFY_OUT) and the run sheet
      # (SMOKE_TEST_SHEET_OUT). The other side is the input production_fixtures_dir when a caller gives
      # one, else the label and sheet fixtures committed in publish-contracts/tests/fixtures. A missing or
      # empty file fails this step and names the path.
      - name: Stage vs mainnet parity (label-diff, sheet-diff on real output)
        env:
          FIXTURES_DIR: ${{ inputs.production_fixtures_dir }}
        run: |
          args=(--stage-labels "$RUNNER_TEMP/stage-verify-labels.txt" --stage-sheet "$RUNNER_TEMP/stage-run-sheet.env")
          if [ -n "$FIXTURES_DIR" ]; then
            args+=(--fixtures-dir "$GITHUB_WORKSPACE/$FIXTURES_DIR")
          else
            args+=(--mainnet-labels publish-contracts/tests/fixtures/verifier-labels.txt --production-sheet publish-contracts/tests/fixtures/frozen-sheet.env.example)
          fi
          bun scripts/stage/parity.ts "${args[@]}"

      - name: Upload manifests, proofs and the run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twin-publish-run
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/twin-proofs/
            ${{ runner.temp }}/stage-verify-labels.txt
            ${{ runner.temp }}/stage-run-sheet.env

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-logs-twin_publish
          path: ${{ runner.temp }}/robotmoney-smoke-test/smoke-test*.log*

      - name: Stop the Twin fork and save its RPC cache
        if: always()
        uses: ./.github/actions/twin-fork-save-cache
