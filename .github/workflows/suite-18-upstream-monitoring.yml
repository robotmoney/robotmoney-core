# Canonical: docs/technical/upstream-monitoring-runbook.md §5
#
# WHY THIS SUITE EXISTS
# docs/technical/security-model.md §5 and §8 mandate three monitoring processes
# for accepted upstream-trust assumptions:
#   1. Venue offline   — Compound v3 / Aave v3 going down (§5).
#   2. Governance       — upstream proposals that touch our adapter contracts (§8).
#   3. USDC upgrade     — Circle upgrading the USDC proxy on Base (§8).
# Each is implemented as a self-contained shell monitor under scripts/ that emits
# structured JSON and exits non-zero on alert. This suite is the only automated
# signal that those monitors still fire correctly and runs them against live RPC.
#
# Component alerts run here. External nightly monitoring, and the Base-fork keeper
# test that reads live Base state (QA plan v1 E10: nightly only, never on a PR),
# live in suite-18-live-monitoring.yml (heavy class).

name: upstream-contract-monitoring

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev]
    paths-ignore: ['**.md', '**.txt']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege (issue #1428): read-only repo contents for every job. A job that
# needs more declares it at job level with the reason.
permissions:
  contents: read

env:
  CI_CLASS: feature-correctness

jobs:
  mock-tests:
    name: mock-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run upstream monitoring mock tests
        run: bash .github/scripts/tests/test_upstream_monitoring.sh

  assert-basescan-mock-tests:
    name: assert-basescan-mock-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Run assert-basescan-verified unit tests (mock mode)
        run: bash .github/scripts/tests/test_assert_basescan_verified.sh

  recorder-keeper-selftest:
    name: recorder-keeper-selftest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    # Core 1779: runs the real keeper against a real UniswapV4PriceRecorder on a local anvil chain.
    # The test fails loudly when anvil, forge or cast is missing. The Base-fork half
    # (test-recorder-keeper-fork.sh) is the nightly job recorder-keeper-fork in
    # suite-18-live-monitoring.yml (QA plan v1 E10).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_CLASS: system-correctness
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.5

      - name: Recorder keeper self-test
        run: bash scripts/ops/test-recorder-keeper.sh
