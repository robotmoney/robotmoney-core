# Canonical: Plan tracking issue #109 (formerly docs/implementation-plan.md §Release & distribution)
#
# WHY THIS WORKFLOW EXISTS
# The dapp Dockerfile already exists but there was no automated path to publish the
# image. Operators previously had to build manually and wire VITE_* env vars by hand.
# This workflow builds the image on every v*.*.* tag and pushes it to GHCR so that
# operators can pull a versioned, ready-to-run image.
#
# WHY GHCR WITH GITHUB_TOKEN
# GHCR is tightly integrated with GitHub repositories and does not require any
# additional secrets. GITHUB_TOKEN is granted write:packages permission automatically
# during a workflow run, which is sufficient to push images to the org namespace.
#
# WHY BUILD-TIME VITE_* ARGS ARE DEFAULTED TO PLACEHOLDERS
# Vite inlines env vars into the static bundle at build time. The CI image is built
# with sane zero-value defaults (localhost RPC, zero-address contracts). Operators
# must pass their own VITE_* values when building locally via docker-compose.yml — the
# CI image is a distributable base, not a production-configured image.
#
# WHY :latest IS PUSHED ALONGSIDE THE TAG
# docker compose and helm charts frequently pin to :latest for rapid iteration.
# Providing both :tag and :latest eliminates the need for operators to look up the
# current version in most workflows.
#
# GOTCHAS
# - The workflow only fires on v*.*.* tags, never on branch pushes or pull requests.
# - `v*.*.*` is the dApp's namespace and is no longer shared (issue #1243). rmpc
#   releases moved to `rmpc-v*.*.*`, so a tag pushed here no longer triggers
#   release-rmpc.yml, no longer raises the rmpc manifest floor in
#   .github/scripts/assert_manifest_ahead_of_tags.sh, and can no longer be the
#   subject of a "delete the tag" recovery instruction printed by that workflow.
#   Do not re-point release-rmpc.yml at this namespace.
# - docker/metadata-action produces both the semver tag and :latest automatically.
# - The Dockerfile expects the build context to be the repo root (not clients/dapp/)
#   because it COPYs from clients/dapp/ explicitly. The context is therefore set to
#   the repo root via the build-args context.
# - The packages: write permission is required explicitly; the default token only has
#   contents: read.
# - Every `uses:` is pinned to a full commit SHA with its version in a comment.
#   build-and-push holds contents: write and packages: write, so a moved upstream
#   tag would run with the token that pushes the image and the git tag.
#   audit_workflow_run_splice_and_perms.py refuses an unpinned `uses:` in any job
#   that holds a write scope. Bump a pin by resolving the new release tag to its
#   commit (git ls-remote --tags <action repo>).
#
# WHY `inputs.tag` NEVER APPEARS INSIDE A `run:` BODY (issue #1301)
# Actions substitutes a `${{ }}` expression into the shell SOURCE before bash
# ever parses it, so quoting at the call site does nothing to contain it — a
# `workflow_dispatch` with `tag` set to `v1";$(...)  ;"` would reach code
# execution on the runner. `inputs.tag` is therefore read once, through the
# `Validate tag` and `Create and push git tag` steps' own `env:` blocks, and
# referenced only as the shell variable `"$INPUT_TAG"`. This is the same shape
# release-rmpc.yml was hardened into by #1279 (see that file's `Validate
# inputs` step for the fuller rationale) and this file never was, until now.
# `scripts/release/install-rmpc-selftest.sh` audits that shape for
# release-rmpc.yml; `.github/scripts/audit_workflow_run_splice_and_perms.py`
# (issue #1301) audits it here, plus the per-job permissions map below, and is
# proved non-vacuous against hostile mutated copies of this file by
# `.github/scripts/tests/test_audit_workflow_run_splice_and_perms.sh`.
#
# WHY THE TAG IS SHAPE-CHECKED BEFORE ANYTHING CONSUMES IT
# `inputs.tag` reaches `git tag`, and would otherwise reach the Docker image
# tags via docker/metadata-action's semver extraction. Matched with bash
# `[[ =~ ]]`, not `grep -E`: grep matches LINE-wise, so a tag carrying an
# embedded newline (`v1.2.3\nanything`) would satisfy a line-anchored `^…$` on
# its first line and pass, where `[[ =~ ]]` anchors the whole string and
# rejects it. The namespace is `v*.*.*` — this file's own (issue #1243); the
# `rmpc-v*` namespace belongs to release-rmpc.yml and is deliberately refused
# here so the two release pipelines can never be dispatched into each other's
# tag space.
#
# WHY `inputs.commit_hash` IS NOT SHAPE-CHECKED
# It reaches only `actions/checkout`'s `ref:` — a `with:` value the Actions
# runner passes to the checkout action as data, not text spliced into a shell
# body. An invalid or hostile value fails the checkout (unknown ref) rather
# than executing anything, so it is not a shell-injection sink the way
# `inputs.tag` was. (issue #1301 asked this be confirmed rather than assumed.)
#
# WHY `permissions:` IS PER-JOB, NOT WORKFLOW-SCOPE (issue #1301, mirroring #1237)
# This file used to declare `contents: write` and `packages: write` at
# workflow scope, so every job — including any job added to this file in the
# future — would silently inherit both. Today there is exactly one job
# (`build-and-push`), which genuinely needs both scopes (`contents: write` to
# push the tag, `packages: write` to push to GHCR), so the blast radius was
# smaller than #1237's rmpc matrix case — but the trap was armed the same way.
# The workflow default is now `contents: read`, the floor rather than the
# ceiling, and `build-and-push` states its own two scopes explicitly.

name: release-dapp

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create and publish (e.g. v0.3.1)"
        required: true
        type: string
      commit_hash:
        description: "Commit SHA to tag and release from"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-push:
    name: build-and-push-dapp-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.commit_hash || github.sha }}

      # Shape-checked before anything consumes it — see the "WHY THE TAG IS
      # SHAPE-CHECKED" comment at the top of this file. `[[ =~ ]]`, not
      # `grep -E`: a line-anchored grep would pass a tag carrying an embedded
      # newline on its first line; bash's `[[ =~ ]]` anchors the whole string.
      - name: Validate tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag input '${INPUT_TAG}' is not a dApp release tag. Expected vX.Y.Z or vX.Y.Z-prerelease. The 'rmpc-v*' namespace belongs to release-rmpc.yml (issue #1243)."
            exit 1
          fi

      # `inputs.tag` is read through this step's own env: and referenced only
      # as "$INPUT_TAG" — never spliced into the run: body. See the "WHY
      # `inputs.tag` NEVER APPEARS INSIDE A `run:` BODY" comment above.
      - name: Create and push git tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${INPUT_TAG}"
          git push origin "${INPUT_TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/dapp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: clients/dapp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_EXPLORER_API_URL=http://localhost:8080
            VITE_GATEWAY_ADDRESS=0x0000000000000000000000000000000000000000
            VITE_VAULT_ADDRESS=0x0000000000000000000000000000000000000000
            VITE_GATEWAY_EXPECTED_CODE_HASH=
            VITE_GATEWAY_EXPECTED_IMPLEMENTATION=
            VITE_GATEWAY_EXPECTED_IMPLEMENTATION_HASH=
            VITE_GATEWAY_CODE_HASH_VERIFIED=false
            VITE_ENV_CLASS=fork
            VITE_BROWSER_KEYGEN=false
            VITE_HISTORY_PANE=false
