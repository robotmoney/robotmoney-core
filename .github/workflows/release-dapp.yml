# Canonical: Plan tracking issue #109 (formerly docs/implementation-plan.md §Release & distribution)
#
# WHY THIS WORKFLOW EXISTS
# The dapp Dockerfile already exists but there was no automated path to publish the
# image. Operators previously had to build manually and wire VITE_* env vars by hand.
# This workflow builds the image on every v*.*.* tag and pushes it to GHCR so that
# operators can pull a versioned, ready-to-run image.
#
# WHY BUILD AND PUBLISH ARE SEPARATE JOBS (issue #660, security-model.md §13)
# The `build` job produces the image as a credential-free workflow artifact — it
# never logs in to a registry and never pushes anything. Every external write
# (git tag push, GHCR image push) lives in the `publish` job, which declares
# `environment: production`: GitHub blocks it until a required reviewer approves
# the pending deployment. This guarantees human approval precedes every
# irreversible write. Workflow-level permissions are read-only; `contents: write`
# and `packages: write` are granted only to `publish`.
#
# RUNNER PINNING (issue #660)
# Jobs run on the version-pinned `ubuntu-24.04` label, never a floating
# `*-latest` alias. GitHub-hosted runners cannot be pinned to an image SHA
# digest; the versioned label is the strongest pin available, and the upgrade
# path is a self-hosted runner label (docs/technical/ci-environments.md). The
# lint `scripts/ci/check-release-runner-pinning.sh` (suite-17) enforces this on
# every PR.
#
# RELEASE SIGNING + PROVENANCE (issue #659, security-model.md §13 "Release signing")
# The `build` job enables BuildKit SLSA provenance and SBOM generation
# (`provenance: true`, `sbom: true`) and exports the image as an OCI archive so
# the attestation manifests survive the trip to `publish`. All signing happens
# inside `publish`, behind the production approval gate (signing is an
# irreversible external write — it records entries in the public Rekor
# transparency log). The identity is keyless: an ephemeral certificate is
# minted by Sigstore Fulcio from the job's GitHub Actions OIDC token
# (`id-token: write`); no long-lived signing key or secret exists.
# - Tags: workflow_dispatch releases create the tag as a gitsign-signed
#   annotated tag (`git tag -s`) and verify it (`git tag -v`) before pushing.
#   Tag-push releases fail closed unless the pushed tag is a signed annotated
#   tag.
# - Image: after the push, the manifest digest is signed with `cosign sign`
#   and the BuildKit SLSA provenance predicate is attached with
#   `cosign attest --type slsaprovenance`, then both are verified
#   (`cosign verify`, `cosign verify-attestation`) in the same job.
# Signing or verification failure fails `publish` — no unsigned image can be
# published silently. The lint `scripts/ci/check-release-signing.sh`
# (suite-17) enforces these invariants statically on every PR.
#
# WHY GHCR WITH GITHUB_TOKEN
# GHCR is tightly integrated with GitHub repositories and does not require any
# additional secrets. GITHUB_TOKEN is granted write:packages permission on the
# publish job, which is sufficient to push images to the org namespace.
#
# WHY BUILD-TIME VITE_* ARGS ARE DEFAULTED TO PLACEHOLDERS
# Vite inlines env vars into the static bundle at build time. The CI image is built
# with sane zero-value defaults (localhost RPC, zero-address contracts). Operators
# must pass their own VITE_* values when building locally via docker-compose.yml — the
# CI image is a distributable base, not a production-configured image.
#
# WHY :latest IS PUSHED ALONGSIDE THE TAG
# docker compose and helm charts frequently pin to :latest for rapid iteration.
# Providing both :tag and :latest eliminates the need for operators to look up the
# current version in most workflows.
#
# GOTCHAS
# - The workflow only fires on v*.*.* tags, never on branch pushes or pull requests.
# - docker/metadata-action produces both the semver tag and :latest automatically.
# - The Dockerfile expects the build context to be the repo root (not clients/dapp/)
#   because it COPYs from clients/dapp/ explicitly. The context is therefore set to
#   the repo root via the build-args context.
# - The image travels from build to publish as an OCI image-layout tar artifact
#   (not a docker-archive): BuildKit can only attach provenance/SBOM attestation
#   manifests to OCI/image outputs, and `docker load` would drop them. `publish`
#   therefore pushes the archive with `skopeo copy --all --preserve-digests`,
#   which uploads the complete image index (image + attestation manifests)
#   byte-for-byte.

name: release-dapp

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create and publish (e.g. v0.3.1)"
        required: true
        type: string
      commit_hash:
        description: "Commit SHA to tag and release from"
        required: true
        type: string

# Read-only by default; write permissions are granted only to the `publish` job,
# which is gated behind the protected `production` environment (issue #660).
permissions:
  contents: read

jobs:
  # Credential-free artifact production: builds the image and uploads it as a
  # workflow artifact. No registry login, no push, no write permissions.
  build:
    name: build-dapp-image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/dapp
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build image to local OCI archive with provenance + SBOM (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: clients/dapp/Dockerfile
          push: false
          provenance: true
          sbom: true
          outputs: type=oci,dest=/tmp/dapp-image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_EXPLORER_API_URL=http://localhost:8080
            VITE_GATEWAY_ADDRESS=0x0000000000000000000000000000000000000000
            VITE_VAULT_ADDRESS=0x0000000000000000000000000000000000000000
            VITE_GATEWAY_EXPECTED_CODE_HASH=
            VITE_GATEWAY_CODE_HASH_VERIFIED=false
            VITE_ENV_CLASS=fork
            VITE_BROWSER_KEYGEN=false
            VITE_HISTORY_PANE=false

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dapp-image
          path: /tmp/dapp-image.tar
          if-no-files-found: error
          retention-days: 7

  # The only job with write credentials and the only job performing external
  # writes (git tag push, GHCR image push, Rekor transparency-log entries from
  # signing). `environment: production` makes GitHub hold this job until a
  # required reviewer approves the pending deployment (issue #660; repository
  # Environments settings define the reviewer list — see
  # docs/technical/ci-environments.md). `id-token: write` (issue #659) lets
  # cosign/gitsign mint the keyless Sigstore signing certificate; it is
  # granted only here so signing can never precede approval.
  publish:
    name: publish-dapp-image
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_hash || github.sha }}

      - name: Set up release signing tooling (cosign + gitsign)
        uses: ./.github/actions/setup-release-signing

      - name: Create, verify, and push signed git tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GITSIGN_TOKEN_PROVIDER: github-actions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -s -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}"
          # Fail closed: never push a tag whose signature does not verify.
          git tag -v "${{ inputs.tag }}"
          git push origin "refs/tags/${{ inputs.tag }}"

      - name: Verify pushed tag is a signed annotated tag (tag-push only)
        if: github.event_name == 'push'
        run: |
          TAG="${{ github.ref_name }}"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::release tag ${TAG} is a lightweight tag — release tags must be signed annotated tags (security-model.md §13 Release signing)"
            exit 1
          fi
          if ! git cat-file tag "refs/tags/${TAG}" | grep -qE -- '-----BEGIN (PGP SIGNATURE|SSH SIGNATURE|SIGNED MESSAGE)-----'; then
            echo "::error::release tag ${TAG} carries no signature — release tags must be signed (security-model.md §13 Release signing)"
            exit 1
          fi

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: dapp-image
          path: /tmp

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push OCI archive to GHCR (preserves attestation manifests)
        id: push
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/dapp"
          RAW_TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y skopeo
          fi
          skopeo copy --all --preserve-digests "oci-archive:/tmp/dapp-image.tar" "docker://${IMAGE}:${VERSION}"
          skopeo copy --all --preserve-digests "oci-archive:/tmp/dapp-image.tar" "docker://${IMAGE}:latest"
          DIGEST="sha256:$(skopeo inspect --raw "docker://${IMAGE}:${VERSION}" | sha256sum | cut -d' ' -f1)"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Sign image and attach SLSA provenance attestation (keyless)
        run: |
          IMAGE_REF="${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"
          cosign sign --yes "${IMAGE_REF}"
          # Extract the BuildKit-generated SLSA provenance predicate from the
          # pushed image index and re-attach it as a cosign-signed attestation.
          docker buildx imagetools inspect "${IMAGE_REF}" --format '{{ json .Provenance }}' \
            | jq -e '.SLSA // first(.[] | .SLSA?) // error("no SLSA provenance found in image index")' \
            > /tmp/slsa-predicate.json
          test -s /tmp/slsa-predicate.json
          cosign attest --yes --type slsaprovenance --predicate /tmp/slsa-predicate.json "${IMAGE_REF}"

      - name: Verify image signature and provenance attestation (fail closed)
        run: |
          IMAGE_REF="${{ steps.push.outputs.image }}@${{ steps.push.outputs.digest }}"
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-dapp\.yml@" \
            "${IMAGE_REF}"
          cosign verify-attestation --type slsaprovenance \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/\.github/workflows/release-dapp\.yml@" \
            "${IMAGE_REF}"

  # Dev-scout seam only. Issue #671 owns the serving-layer and deployed-domain
  # HSTS assertions after #662 establishes the deployment verification contract.
  # Issue #659 absorbed the former sign-and-attest seam into `publish` (signing
  # must be atomic with publication, behind the same approval gate), so this
  # seam now depends on `publish` directly.
  verify-dapp-headers:
    name: verify-dapp-headers-seam
    if: ${{ false }}
    needs: [publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Post-deploy header verification seam
        run: |
          printf '%s\n' "Issue #671 enables container and production-domain HSTS checks."
