# Canonical: docs/development/ci-suites.md §19
#
# WHY THIS SUITE EXISTS
# Two complementary test-matrix expansion concerns live here:
#
# 1. ERC-4626 PRECONDITION TESTS (activated — issue #814)
#    contracts/test/ERC4626PreconditionChecks.t.sol asserts asset()/decimals()
#    and empty-vault share-price invariants across the exitFeeBps × adapter matrix.
#    The matrix shards by exit-fee tier via the EXIT_FEE_BPS env var.
#
# 2. DEMO-TVL MATRIX (activated — issue #804)
#    The full_stack_demo_tvl smoke test
#    (testing/smoke-test/tests/full_stack_demo_tvl.rs) is wired here.
#    Runs HEAVY tier — it gates pull_requests targeting dev (and push to dev),
#    not ordinary feature PRs. Uses oven-sh/setup-bun@v2 for the DappStack dapp-build step.
#
# ACTIVATION HISTORY
# - erc4626-precondition: activated in issue #814 — ERC4626PreconditionChecks.t.sol
#   created and `if: false` removed.
# - demo-tvl: activated in issue #804 — full_stack_demo_tvl.rs exists; bun runner
#   dep resolved via oven-sh/setup-bun@v2.

name: erc4626-demo-tvl-matrix

on:
  # HEAVY tier: merge gate for `dev` — runs on every pull_request targeting dev
  # (no path filter, so the gate always reports for any branch merging to dev)
  # and on push to dev for merged-commit coverage.
  # See docs/development/ci-suites.md (CI velocity tiers).
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── ERC-4626 precondition checks ───────────────────────────────────────────
  # Activated in issue #814: contracts/test/ERC4626PreconditionChecks.t.sol asserts
  # asset()/decimals()/empty-vault share-price invariants for each exitFeeBps tier
  # × adapter (passthrough, aave, compound, morpho). The matrix shards the run by
  # exit-fee tier; the test reads the EXIT_FEE_BPS env var for its matrix-env tier.
  erc4626-precondition:
    name: erc4626-precondition
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        exit_fee_bps: [0, 30, 100]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge test ERC-4626 preconditions (exitFeeBps=${{ matrix.exit_fee_bps }})
        env:
          EXIT_FEE_BPS: ${{ matrix.exit_fee_bps }}
        run: |
          forge test \
            --match-contract ERC4626PreconditionChecks \
            --fuzz-runs 256 \
            -vv

  # ── Full-stack demo-TVL ────────────────────────────────────────────────────
  # Runs the full_stack_demo_tvl smoke test on HEAVY-tier branches.
  # timeout-minutes: 60 to account for DappStack boot + seed_demo_depositors
  # (typically 25-35 min on GitHub-hosted runners).
  demo-tvl:
    name: demo-tvl-full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Docker is available
        run: docker version && docker compose version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install bun (needed by DappStack dapp-build step)
        uses: oven-sh/setup-bun@v2
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "testing/smoke-test -> target"
      - name: cargo build (smoke-test crate)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test
      - name: cargo test full_stack_demo_tvl
        working-directory: testing/smoke-test
        run: cargo test -p smoke-test --release --test full_stack_demo_tvl -- --test-threads=1 --nocapture
      - name: Safety-net teardown (always)
        if: always()
        working-directory: testing/ethereum-testnet/config
        run: docker compose down -v --remove-orphans || true
