# Canonical: docs/development/ci-suites.md §19
#
# WHY THIS SUITE EXISTS
# Two complementary test-matrix expansion concerns live here:
#
# 1. ERC-4626 PRECONDITION TESTS (still disabled — follow-up issue #814)
#    contracts/test/ERC4626PreconditionChecks.t.sol does not exist yet.
#    Kept as a stub; re-enable when the file is created.
#
# 2. DEMO-TVL MATRIX (activated — issue #804)
#    The full_stack_demo_tvl smoke test
#    (testing/smoke-test/tests/full_stack_demo_tvl.rs) is wired here.
#    Runs HEAVY tier only (dev-phase-* branches and dev/main) to keep ordinary
#    PR cycles fast. Uses oven-sh/setup-bun@v2 for the DappStack dapp-build step.
#
# ACTIVATION HISTORY (issue #804)
# - erc4626-precondition: still disabled — ERC4626PreconditionChecks.t.sol not yet
#   created. Follow-up issue #814 covers creating the file and re-enabling this job.
# - demo-tvl: activated — full_stack_demo_tvl.rs exists; bun runner dep resolved
#   via oven-sh/setup-bun@v2.

name: erc4626-demo-tvl-matrix

on:
  push:
    branches: [main, dev, "dev-phase-*"]
  pull_request:
    branches: ["dev-phase-*"]
    paths:
      - "contracts/test/ERC4626PreconditionChecks.t.sol"
      - "testing/smoke-test/tests/full_stack_demo_tvl.rs"
      - ".github/workflows/suite-19-erc4626-demo-tvl-matrix.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── ERC-4626 precondition checks ───────────────────────────────────────────
  # Still disabled: contracts/test/ERC4626PreconditionChecks.t.sol not yet created.
  # Follow-up issue #814: create the file and remove `if: false`.
  erc4626-precondition:
    name: erc4626-precondition-stub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: false # disabled until ERC4626PreconditionChecks.t.sol is created (issue #814)
    strategy:
      fail-fast: false
      matrix:
        exit_fee_bps: [0, 30, 100]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge test ERC-4626 preconditions (exitFeeBps=${{ matrix.exit_fee_bps }})
        working-directory: contracts
        run: |
          forge test \
            --match-contract ERC4626PreconditionChecks \
            --fuzz-runs 256 \
            -vv \
            --env EXIT_FEE_BPS=${{ matrix.exit_fee_bps }}

  # ── Full-stack demo-TVL ────────────────────────────────────────────────────
  # Runs the full_stack_demo_tvl smoke test on HEAVY-tier branches.
  # timeout-minutes: 60 to account for DappStack boot + seed_demo_depositors
  # (typically 25-35 min on GitHub-hosted runners).
  demo-tvl:
    name: demo-tvl-full-stack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify Docker is available
        run: docker version && docker compose version
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install bun (needed by DappStack dapp-build step)
        uses: oven-sh/setup-bun@v2
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "testing/smoke-test -> target"
      - name: cargo build (smoke-test crate)
        working-directory: testing/smoke-test
        run: cargo build -p smoke-test
      - name: cargo test full_stack_demo_tvl
        working-directory: testing/smoke-test
        run: cargo test -p smoke-test --release --test full_stack_demo_tvl -- --test-threads=1 --nocapture
      - name: Safety-net teardown (always)
        if: always()
        working-directory: testing/ethereum-testnet/config
        run: docker compose down -v --remove-orphans || true
