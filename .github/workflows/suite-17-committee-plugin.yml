# Canonical: plugins/robotmoney-committee/skills/robotmoney-committee/SKILL.md
#
# WHY THIS SUITE EXISTS
# The robotmoney-committee plugin is a committee-agent skill that extends
# robotmoney-analyst. It forms per-vault tilt votes, posts rationale memos,
# and calls rmpc committee vote-submit. The plugin has no contract or Rust
# dependencies but must be tested against offline fixtures to guarantee:
# (a) plugin.json is valid and correctly named,
# (b) form-vote.sh produces schema-conformant vote JSON (ajv-validated against
#     schemas/committee-vote.json) for all three regime stances,
# (c) check-preflight.sh fails closed with MissingICConfig when
#     ic_contract_address is absent from config,
# (d) check-preflight.sh fails closed with RationaleURIUnreachable when the
#     rationale URI is not reachable,
# (e) check-preflight.sh fails closed with AgentNotRegistered when rmpc
#     returns that error variant, and
# (f) no restricted paths (contracts/, crates/, clients/, services/) are
#     touched by the plugin.
#
# WHY OFFLINE / MOCKED APPROACH
# CI has no network access to robotmoney.net, no rmpc binary, and no live
# IC contract. Tests use fixture files and a fake rmpc shell script to cover
# all four acceptance criteria deterministically.
#
# WHY ajv IS USED INSIDE THE TEST
# The vote JSON schema (schemas/committee-vote.json) is the canonical contract
# between rmpc vote-submit, the committee agent skill, and the explorer
# indexer. Validating form-vote.sh output against it inside the CI test suite
# guarantees that any schema drift breaks CI immediately.
#
# WHY paths: FILTER IS USED HERE
# This suite only verifies robotmoney-committee plugin artifacts. Restricting
# to plugin paths keeps the suite fast and avoids running it on unrelated
# changes.

name: robotmoney-committee-plugin-checks

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  robotmoney-committee:
    name: robotmoney-committee
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (jq, shellcheck)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq shellcheck

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run robotmoney-committee tests
        run: bash plugins/robotmoney-committee/tests/run-tests.sh
