# Canonical: docs/development/ci-suites.md §3
#
# WHY THIS SUITE EXISTS
# The unit/invariant suite (suite 1–2) validates behaviour; this suite validates
# quality signals that auditors and downstream integrators rely on. NatSpec on every
# public/external function is a hard requirement for the audit engagement — a missing
# @param tag on RobotMoneyGateway has caused audit delays in the past. Slither catches
# a class of issues (reentrancy, unchecked return values, tx.origin auth) that unit
# tests structurally cannot, because those tests don't adversarially vary call context.
#
# WHY slither NEEDS lint FIRST
# Slither runs on forge build artifacts. If the build fails or the code doesn't
# format-check, Slither produces noisy, misleading output and wastes several minutes
# of runner time. Gating on lint ensures Slither only runs on clean, buildable code.
#
# WHY forge build --force IN lint
# --force bypasses the incremental build cache so the lint job always sees a clean
# compile. Without it, a cached artifact from a previous push can mask a new warning.
#
# GOTCHAS
# - slither . reads foundry.toml to find the source root. If foundry.toml is moved
#   or renamed, Slither will silently analyse nothing and exit 0.
# - The dependency audit grep is intentionally conservative (major version check only).
#   It will not catch a patch-level vulnerability; for that, use `forge install` with a
#   pinned commit and track the OpenZeppelin security advisories separately.
# - forge doc generates NatSpec documentation and fails if the source cannot be parsed.
#   Every external/public function should have @notice, @param for each param, and
#   @return for each return value. Internal helper functions are exempt. If a new
#   function is added without NatSpec, documentation gaps will appear in the generated
#   output — add the tags to maintain coverage.

name: solidity-fmt-natspec-slither

on:
  # LIGHT tier: runs on pull_requests to any branch and on push to dev/dev-phase-*.
  push:
    branches: [dev, "dev-phase-*"]
  pull_request:
    paths:
      - "contracts/**"
      - "foundry.toml"
      - ".github/workflows/suite-03-solidity-quality.yml"
  workflow_dispatch:

# CI velocity tiers (issue #600): cancel superseded PR runs so a re-push does
# not pile up duplicate suites. push:main/dev runs are exempt — they keep a
# distinct concurrency lane per ref and never cancel, so merged-commit coverage
# always completes. See docs/development/ci-suites.md (CI velocity tiers).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: solidity-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build --force
        run: forge build --force

      - name: forge doc (NatSpec coverage)
        run: forge doc

  slither:
    name: solidity-slither
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Slither
        run: pip install slither-analyzer

      - name: Cache Foundry build artifacts
        uses: actions/cache@v4
        with:
          path: |
            cache
            out
          key: ${{ runner.os }}-foundry-${{ hashFiles('contracts/**/*.sol', 'foundry.toml') }}
          restore-keys: |
            ${{ runner.os }}-foundry-

      - name: forge build (produce artifacts for Slither)
        run: forge build

      - name: slither static analysis
        run: slither . --config-file slither.config.json --filter-paths 'lib/,contracts/test/,contracts/script/'

      - name: Dependency audit (OZ + Aave interface versions)
        run: |
          set -euo pipefail
          if grep -r '"@openzeppelin/contracts"' lib/ 2>/dev/null | grep -qE '"[0-3]\.|"4\.[0-8]\.'; then
            echo "::error::Potentially vulnerable OpenZeppelin version detected" >&2
            exit 1
          fi
          echo "Dependency audit passed."

      - name: Single production codebase — no environment-substituting variants (issue #475)
        # Enforces docs/development/single-production-codebase.md: production
        # contracts under contracts/ (excluding contracts/test/ and
        # contracts/script/) must not declare an isPrototype() function or
        # the prototypeOverride / nonPrototypeAttested / IPrototypeAware /
        # VaultIsPrototype / VaultEligibilityNotAttested machinery that
        # issue #475 replaced with the single VaultRegistry.isRouterEligible
        # flag. Tests configure router eligibility via the production
        # surface (VaultRegistry.setRouterEligible); a HardenedBasketVault
        # style readiness-flipping subclass under contracts/test/ is also
        # forbidden.
        run: |
          set -euo pipefail
          PROD_BAD=$(grep -RInE 'isPrototype\(|prototypeOverride|nonPrototypeAttested|IPrototypeAware|VaultIsPrototype|VaultEligibilityNotAttested' \
              contracts --include='*.sol' \
              --exclude-dir=test --exclude-dir=script || true)
          if [ -n "$PROD_BAD" ]; then
            echo "::error::Production contracts must not declare isPrototype()/prototypeOverride/nonPrototypeAttested/IPrototypeAware (issue #475 — use VaultRegistry.setRouterEligible)." >&2
            echo "$PROD_BAD" >&2
            exit 1
          fi
          TEST_BAD=$(grep -RInE 'HardenedBasketVault|MockPrototypeVault|DeclaresPrototype' \
              contracts/test --include='*.sol' || true)
          if [ -n "$TEST_BAD" ]; then
            echo "::error::Readiness-flipping test subclasses (HardenedBasketVault et al.) are forbidden (issue #475 — drive eligibility through VaultRegistry.setRouterEligible)." >&2
            echo "$TEST_BAD" >&2
            exit 1
          fi
          echo "Single-production-codebase grep gate passed."

      - name: Shared BpsMath + TwapTickMath — no duplicate constants or inline TWAP helpers (issue #927)
        # Enforces the issue #927 behaviour-preserving extraction:
        #   (1) the basis-points denominator (10000) lives only in
        #       contracts/lib/BpsMath.sol — PortfolioRouter, RouterGovernance,
        #       RobotMoneyVault, and BasketVault must consume the shared
        #       constant rather than redefining their own BPS_DENOMINATOR /
        #       MAX_BPS = 10000 literal.
        #   (2) the TWAP tick helpers _checkPoolPair / _meanTick / _priceFromTick
        #       live only in contracts/lib/TwapTickMath.sol — the Aerodrome and
        #       Uniswap V4 adapters must delegate, not carry inline copies.
        run: |
          set -euo pipefail
          BPS_DUP=$(grep -REn "(BPS_DENOMINATOR|MAX_BPS)[[:space:]]*=[[:space:]]*10_?000" \
              contracts/PortfolioRouter.sol contracts/RouterGovernance.sol \
              contracts/RobotMoneyVault.sol contracts/vaults/BasketVault.sol || true)
          if [ -n "$BPS_DUP" ]; then
            echo "::error::Duplicate basis-points denominator constant found (issue #927 — consume BpsMath.BPS_DENOMINATOR)." >&2
            echo "$BPS_DUP" >&2
            exit 1
          fi
          TWAP_INLINE=$(grep -REn "function (_meanTick|_priceFromTick|_checkPoolPair)" \
              contracts/adapters/AerodromeSwapAdapter.sol \
              contracts/adapters/UniswapV4SwapAdapter.sol || true)
          if [ -n "$TWAP_INLINE" ]; then
            echo "::error::Inline TWAP helper body found in a swap adapter (issue #927 — delegate to TwapTickMath)." >&2
            echo "$TWAP_INLINE" >&2
            exit 1
          fi
          echo "Shared BpsMath + TwapTickMath grep gate passed."
