# Canonical: docs/technical/security-model.md §9
# This file defines names and ownership only. Issue #658 must add parsing,
# validation, production values, and secret-backed pause/alert credentials.

enabled = false
poll_interval_seconds = 12
response_sla_seconds = 300

[indexer]
database_url_env = "DATABASE_URL"

[gateway]
rpc_url_env = "WATCHDOG_RPC_URL"
address_env = "WATCHDOG_GATEWAY_ADDRESS"
# The pauser key env var is WATCHDOG_PAUSER_KEY_HEX (was documented here as
# WATCHDOG_PAUSER_KEY, a name the code never read — issue #1357). It holds the
# DEPOSIT_PAUSER_ROLE private key as 64 hex chars, with or without a `0x` prefix, and
# overrides the `action.pauser_private_key_hex` literal in config.toml when set.
# Prefer it in deployments: a key delivered this way is never written to a file
# on the host. The daemon reads it once at startup, derives the signing key, and
# drops the raw hex — but note the value stays in the process environment block
# (readable via /proc/<pid>/environ and inherited by any child process), so this
# bounds the secret's lifetime in the daemon's own state rather than erasing it
# from the machine.
pauser_key_env = "WATCHDOG_PAUSER_KEY_HEX"

[alerts]
webhook_url_env = "WATCHDOG_ALERT_WEBHOOK_URL"

# Example values are intentionally non-production. Issue #658 owns selecting
# and documenting real global and per-vault limits.
[thresholds.global]
mint_per_block_units = "1000000000000"
mint_per_hour_units = "10000000000000"
burn_per_block_units = "1000000000000"
burn_per_hour_units = "10000000000000"

# Consensus-receipt anchoring-gap monitor (issue #1247 task 4.13).
# Alert-only: a missing receipt pages an operator and NEVER pauses the gateway.
# Absent or `enabled = false` disables the control.
#
# NOTE (2026-09-13): this example file is DOCUMENTATION ONLY and the running
# daemon cannot load it — its section names ([thresholds.global], [alerts],
# [indexer], [gateway]) predate services/watchdog/src/config.rs, which expects
# [global] / [action] / [sla], so `watchdog --config config.example.toml` exits
# with "missing field `global`". That divergence is pre-existing and out of
# scope for the Fusion remediation; services/watchdog/config.staging.toml is
# the profile that is actually parsed and deployed. Fixing the example's schema
# is tracked separately.
[consensus_receipts]
enabled = true
# Expected seconds between anchored receipts (the committee's publishing cadence).
expected_cadence_secs = 86400
# Extra seconds tolerated on top of the cadence before paging.
grace_secs = 21600

# Explorer-indexer lag budget (QA plan X5, DI-5). A poll that finds no new
# indexed block refreshes the liveness heartbeat only while the indexer is
# within this budget. Beyond it the daemon pages `indexer_behind:<chain>` and
# lets the heartbeat age, so watchdog-liveness reports `stale` as well.
# Absent means these defaults.
[indexer_lag]
max_lag_blocks = 150     # chain head minus indexed head (150 Base blocks = 300 s)
max_silence_secs = 300   # since the newest indexer run without an error
repage_secs = 3600
# Security round 2: the watchdog's own lag. While its cursor trails the indexed
# head by more than this, it keeps evaluating but stops refreshing the heartbeat,
# so watchdog-liveness reports `stale` for a watchdog slower than the chain.
max_cursor_lag_blocks = 150

# Proxy upgrade and freeze pages (issue 1810) need no section: every poll pages
# each governed `Upgraded` or `UpgradesFrozen` event the indexer stored in
# `admin_events` (contract_kind = 'proxy', migration 0019) once, through
# `action.webhook_url`. Alert-only: it never pauses, upgrades or freezes.
