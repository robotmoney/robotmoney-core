# rmpc operator configuration — example
#
# Copy this file to rmpc.toml and fill in your values.
# All unknown fields are rejected (deny_unknown_fields), so any typo will
# produce a startup error.
#
# Canonical reference: clients/rust-payment-client/src/config.rs

# ── Chain ─────────────────────────────────────────────────────────────────────

# EIP-155 chain id.  Base mainnet = 8453.
chain_id = 8453

# ── RPC endpoints ─────────────────────────────────────────────────────────────
#
# RECOMMENDED: configure at least two endpoints from different providers so
# that a single provider outage does not take down the payment client.
# (security-model.md §12 — RPC provider outage)
#
# Use rpc_urls (list) for automatic failover across multiple endpoints.
# rmpc tries each URL in order; the first successful response wins.
# A request only fails after every listed endpoint has been tried.
#
# Example with two providers (Alchemy + public fallback):
rpc_urls = [
  "https://base-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_KEY",
  "https://mainnet.base.org",
]

# Single-endpoint (backward-compatible) alternative.  Use rpc_url if you only
# have one provider; note this offers no failover protection.
#
# rpc_url = "https://base-mainnet.g.alchemy.com/v2/YOUR_ALCHEMY_KEY"

# ── Contracts ─────────────────────────────────────────────────────────────────

# Deployed RobotMoneyGateway address (0x-prefixed checksummed hex).
gateway_address = "0xYOUR_GATEWAY_ADDRESS"

# USDC token address on chain_id.
usdc_address = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"

# Vault that receives deposits.
vault_address = "0xYOUR_VAULT_ADDRESS"

# keccak256(eth_getCode(gateway_address)) pinned at deploy time (0x-hex).
# Obtain with: cast keccak $(cast code $GATEWAY_ADDRESS)
# Behind an ERC-1967 proxy (ADR-0014) this is the proxy's code, which an
# upgrade does not change: gateway.json's `gateway_runtime_hash`.
gateway_runtime_hash = "0xYOUR_GATEWAY_RUNTIME_HASH"

# ── Implementation pins (ADR-0014, issue 1810) ────────────────────────────────
# Every Robot Money core contract is deployed behind an ERC-1967 proxy. The
# address and runtime-hash pins above do not pin the logic behind a proxy, so
# every write reads the live implementation and refuses with
# `ErrImplementationNotApproved` unless its code hash is listed here. Leave a
# key out only when no contract it covers is a proxy.
#
# The gateway's implementation: gateway.json's `gateway_implementation_runtime_hash`,
# or: cast keccak $(cast code $(cast implementation $GATEWAY_ADDRESS))
gateway_implementation_hashes = ["0xYOUR_GATEWAY_IMPLEMENTATION_HASH"]
#
# The vault(s) a deposit lands in or a withdraw redeems from, every router leg,
# and the router itself. For each: cast keccak $(cast code $(cast implementation $ADDR))
# List the next reviewed implementation before its timelock upgrade executes.
proxy_implementation_hashes = ["0xYOUR_VAULT_IMPLEMENTATION_HASH"]

# ── Optional contract addresses ───────────────────────────────────────────────

# VaultRegistry — required for `rmpc get-vaults` / `rmpc get-vault`.
# registry_address = "0xYOUR_REGISTRY_ADDRESS"

# PortfolioRouter — required for `rmpc get-router`.
# router_address = "0xYOUR_ROUTER_ADDRESS"

# RouterGovernance — required for `rmpc get-governance`.
# governance_address = "0xYOUR_GOVERNANCE_ADDRESS"

# TimelockController — required for `rmpc get-timelock`.
# timelock_address = "0xYOUR_TIMELOCK_ADDRESS"
# First block of the log scan (the timelock deployment block). Set it when the RPC provider caps
# the eth_getLogs range. Absent: the scan starts at `earliest`.
# timelock_from_block = 0
# First block of the AgentDeposit log scan for `rmpc status` and `rmpc get-deposit` (the gateway
# deployment block). Set it when the RPC provider caps the eth_getLogs range. Absent: `earliest`.
# gateway_from_block = 0

# ── Agent binding ─────────────────────────────────────────────────────────────
#
# RECOMMENDED. Pin who this agent is bound to on the gateway. When set, every
# deposit and withdraw refuses with ErrAgentBindingMismatch unless the chain
# agrees, so an address that bound this agent before you did cannot receive
# its deposits' shares.
#
# The shareReceiver you authorized (gateway.agents(agent).shareReceiver).
# share_receiver = "0xYOUR_SHARE_RECEIVER"
# The account that revealed the authorization (gateway.agentOwner(agent)).
# agent_owner = "0xYOUR_OWNER_ADDRESS"

# ── Gas / fee caps ─────────────────────────────────────────────────────────────

# Hard ceiling on maxFeePerGas in wei.  Per-chain defaults apply when omitted;
# set explicitly to silence the warn log on unknown chains.
# Base mainnet default: 1_000_000_000 (1 gwei)
# Ethereum mainnet default: 100_000_000_000 (100 gwei)
# max_fee_per_gas_cap = 1_000_000_000

# Hard ceiling on maxPriorityFeePerGas in wei.  No cap by default.
# max_priority_fee_per_gas_cap = 1_000_000_000

# ── State directory ──────────────────────────────────────────────────────────

# Directory for agent lock files and the replay cache.
# Overridden by $RMPC_STATE_DIR at runtime.
state_dir = "/var/lib/rmpc/state"

# ── Signer ────────────────────────────────────────────────────────────────────

[signer]
# Set to true only for non-production environments.  Production (Base mainnet)
# requires a hardware or KMS-backed signer.
allow_software_fallback = false
# Path to the encrypted-at-rest keystore file.
keystore_path = "/var/lib/rmpc/keystore.enc"

# ── Logging ───────────────────────────────────────────────────────────────────

[log]
# Log level: error | warn | info | debug | trace.  Overridden by $RMPC_LOG_LEVEL.
level = "info"
# Directory for rotating diagnostic log and audit log.  Overridden by $RMPC_LOG_DIR.
dir = "/var/log/rmpc"
# Per-file size limit before rotation (MiB).
rotate_size_mb = 10
# Number of rolled log files to retain.
keep_files = 14
