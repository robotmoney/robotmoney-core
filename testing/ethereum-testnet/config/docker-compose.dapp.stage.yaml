# Stage overlay of docker-compose.dapp.yaml (core issue 1549). Use both files:
#
#   docker compose -p robotmoney-dapp -f docker-compose.dapp.yaml -f docker-compose.dapp.stage.yaml up -d --build --wait
#
# The Twin chain runs in the stage chain project (docker-compose.stage-chain.yaml), not on the host, so the
# indexer joins the chain network and dials it by service name (INDEXER_RPC_URL=http://twin-chain:8545, set by the
# stage deploy job). Postgres is reached over the compose network only: no host port.

services:
  postgres:
    ports: !reset []
  explorer-indexer:
    networks:
      - default
      - chain-net

networks:
  chain-net:
    external: true
    name: ${CHAIN_NET_NAME:-robotmoney-chain-net}
